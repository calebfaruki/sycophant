[workspace]
members = [
    "cli",
    "crates/proto-common",
    "crates/shared",
    "crates/toolset-proto",
    "crates/toolset-runtime",
    "crates/toolset-controller",
    "crates/model-provider",
    "crates/prompt-toolset",
    "crates/relay-controller",
    "crates/relay-proto",
    "crates/harness",
    "crates/harness-proto",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
http = "1"
http-body-util = "0.1"
k8s-openapi = { version = "0.27", features = ["v1_32"] }
kube = { version = "3.1", features = ["runtime", "derive"] }
p256 = { version = "0.13", features = ["ecdsa", "jwk", "pem"] }
proto-common = { path = "crates/proto-common" }
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "1", features = ["derive"] }
shared = { path = "crates/shared" }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toolset-proto = { path = "crates/toolset-proto" }
model-provider = { path = "crates/model-provider" }
toolset-runtime = { path = "crates/toolset-runtime" }
toolset-controller = { path = "crates/toolset-controller" }
prompt-toolset = { path = "crates/prompt-toolset" }
relay-controller = { path = "crates/relay-controller" }
relay-proto = { path = "crates/relay-proto" }
harness-proto = { path = "crates/harness-proto" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tonic = "0.13"
tonic-build = "0.13"
tonic-health = "0.13"
tonic-reflection = "0.13"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"
unreachable_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
unused_self = "warn"
unnecessary_wraps = "warn"
