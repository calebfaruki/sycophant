apiVersion: v1
kind: Pod
metadata:
  name: privileged-probe
  namespace: ($target_namespace)
spec:
  containers:
    - name: probe
      image: registry.k8s.io/pause:3.9
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        runAsUser: 0
  terminationGracePeriodSeconds: 0
