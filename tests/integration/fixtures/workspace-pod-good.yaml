apiVersion: v1
kind: Pod
metadata:
  name: workspace-good
  namespace: ($target_namespace)
  labels:
    app.kubernetes.io/part-of: sycophant
    app.kubernetes.io/component: workspace
spec:
  runtimeClassName: gvisor
  # Suppresses kubelet's default kube-apiserver-audience token mount;
  # the projected volume below provides a mainframe.tightbeam audience
  # token instead. Mirrors mainframe-controller::materialize::pod_for.
  automountServiceAccountToken: false
  volumes:
    - name: transponder-auth
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: mainframe.tightbeam.sycophant.md
              expirationSeconds: 3600
  containers:
    - name: workspace
      image: registry.k8s.io/pause:3.9
      volumeMounts:
        - name: transponder-auth
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      resources:
        requests: { cpu: "100m", memory: "64Mi" }
        limits:   { cpu: "100m", memory: "64Mi" }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  terminationGracePeriodSeconds: 0
