apiVersion: v1
kind: Pod
metadata:
  name: ag-foo-probe
  namespace: ($target_namespace)
  labels:
    app.kubernetes.io/part-of: sycophant
    app.kubernetes.io/component: harness
spec:
  # Runs as the agent service account ag-foo and carries the two projected
  # tokens the read contract is probed with: the store audience the init
  # container uses, and the relay audience the serving container uses. The
  # test reads both with `kubectl exec cat`, so every exchange presents this
  # pod's own projected token.
  serviceAccountName: ag-foo
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 0
  volumes:
    - name: objectstore-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: sycophant-objectstore
              expirationSeconds: 600
    - name: relay-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: harness.relay.sycophant.md
              expirationSeconds: 600
  containers:
    - name: probe
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
      volumeMounts:
        - { name: objectstore-token, mountPath: /var/run/secrets/objectstore, readOnly: true }
        - { name: relay-token, mountPath: /var/run/secrets/relay, readOnly: true }
      resources:
        requests: { cpu: "50m", memory: "32Mi" }
        limits:   { cpu: "100m", memory: "64Mi" }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
