apiVersion: v1
kind: Pod
metadata:
  name: transponder-projected-secret
  namespace: ($target_namespace)
  labels:
    app.kubernetes.io/part-of: sycophant
    app.kubernetes.io/component: transponder
spec:
  runtimeClassName: gvisor
  automountServiceAccountToken: false
  volumes:
    - name: transponder-auth
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: transponder.hangar.sycophant.md
              expirationSeconds: 3600
          # Adds a Secret source to the projected volume — workspace VAP
          # must reject (tightened projected-source allow-list permits
          # only serviceAccountToken with non-kube-apiserver audience).
          - secret:
              name: any-secret
              items:
                - key: api-key
                  path: api-key
  containers:
    - name: transponder
      image: registry.k8s.io/pause:3.9
      volumeMounts:
        - name: transponder-auth
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      resources:
        requests: { cpu: "100m", memory: "64Mi" }
        limits:   { cpu: "100m", memory: "64Mi" }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  terminationGracePeriodSeconds: 0
