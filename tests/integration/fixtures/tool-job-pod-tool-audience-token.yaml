apiVersion: v1
kind: Pod
metadata:
  name: tool-job-tool-audience
  namespace: ($target_namespace)
  labels:
    app.kubernetes.io/part-of: sycophant
    app.kubernetes.io/component: capability-job
    sycophant.md/workspace: chainsaw-gvisor
spec:
  # The legitimate shape: a capability-job's projected SA token carries the
  # tool.toolset.sycophant.md audience (shared::podspec::sa_token_volume with
  # TOOL_TOOLSET_AUDIENCE). The audience pin must ADMIT this — proving the
  # rule bans only foreign audiences, not projected tokens as a class.
  automountServiceAccountToken: false
  containers:
    - name: toolset
      image: registry.k8s.io/pause:3.9
      resources:
        requests: { cpu: "50m", memory: "64Mi" }
        limits:   { cpu: "50m", memory: "64Mi" }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: tool-token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
  volumes:
    - name: tool-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: tool.toolset.sycophant.md
              expirationSeconds: 3600
  terminationGracePeriodSeconds: 0
