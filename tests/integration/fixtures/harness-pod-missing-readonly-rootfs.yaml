apiVersion: v1
kind: Pod
metadata:
  name: harness-missing-rofs
  namespace: ($target_namespace)
  labels:
    app.kubernetes.io/part-of: sycophant
    app.kubernetes.io/component: harness
spec:
  runtimeClassName: gvisor
  automountServiceAccountToken: false
  volumes:
    - name: harness-auth
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: harness.toolset.sycophant.md
              expirationSeconds: 3600
  containers:
    - name: harness
      image: registry.k8s.io/pause:3.9
      volumeMounts:
        - name: harness-auth
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      resources:
        requests: { cpu: "100m", memory: "64Mi" }
        limits:   { cpu: "100m", memory: "64Mi" }
      securityContext:
        # readOnlyRootFilesystem intentionally omitted — workspace VAP rejects.
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  terminationGracePeriodSeconds: 0
