apiVersion: v1
kind: Pod
metadata:
  name: transponder-secret-volume
  namespace: ($target_namespace)
  labels:
    app.kubernetes.io/part-of: sycophant
    app.kubernetes.io/component: transponder
spec:
  runtimeClassName: gvisor
  automountServiceAccountToken: false
  volumes:
    - name: transponder-auth
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: transponder.tightbeam.sycophant.md
              expirationSeconds: 3600
    # Adds a direct Secret volume — workspace VAP must reject. Every other
    # field matches transponder-pod-good.yaml so only the new
    # volume-allow-list rule fires.
    - name: leaked-secret
      secret:
        secretName: any-secret
  containers:
    - name: transponder
      image: registry.k8s.io/pause:3.9
      volumeMounts:
        - name: transponder-auth
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      resources:
        requests: { cpu: "100m", memory: "64Mi" }
        limits:   { cpu: "100m", memory: "64Mi" }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  terminationGracePeriodSeconds: 0
