apiVersion: v1
kind: Pod
metadata:
  name: workspace-missing-limits
  namespace: ($target_namespace)
  labels:
    app.kubernetes.io/part-of: sycophant
    app.kubernetes.io/component: workspace
spec:
  runtimeClassName: gvisor
  automountServiceAccountToken: false
  volumes:
    - name: transponder-auth
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: workspace.tightbeam.sycophant.io
              expirationSeconds: 3600
  containers:
    - name: workspace
      image: registry.k8s.io/pause:3.9
      volumeMounts:
        - name: transponder-auth
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      # resources.limits intentionally omitted — workspace VAP rejects.
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  terminationGracePeriodSeconds: 0
