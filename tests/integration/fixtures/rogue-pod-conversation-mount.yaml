apiVersion: v1
kind: Pod
metadata:
  name: rogue-log-mounter
  namespace: ($target_namespace)
  # Deliberately OMITS app.kubernetes.io/component -- proves a pod cannot dodge
  # the conversation-log-mount VAP by leaving off the sycophant labels (the VAP
  # keys on the volume, not the labels). PSA-restricted-compliant below, so the
  # ONLY reason for denial is the conversation-log VAP.
spec:
  automountServiceAccountToken: false
  volumes:
    - name: log
      persistentVolumeClaim:
        claimName: chainsaw-conversation-data
  containers:
    - name: c
      image: registry.k8s.io/pause:3.9
      volumeMounts:
        - name: log
          mountPath: /var/lib/conversations
      resources:
        requests: { cpu: "100m", memory: "64Mi" }
        limits:   { cpu: "100m", memory: "64Mi" }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  terminationGracePeriodSeconds: 0
