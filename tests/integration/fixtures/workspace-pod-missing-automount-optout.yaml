apiVersion: v1
kind: Pod
metadata:
  name: workspace-missing-automount-optout
  namespace: ($target_namespace)
  labels:
    app.kubernetes.io/part-of: sycophant
    app.kubernetes.io/component: workspace
spec:
  runtimeClassName: gvisor
  # automountServiceAccountToken intentionally omitted. Kubelet default
  # is to mount a kube-apiserver-audience token at
  # /var/run/secrets/kubernetes.io/serviceaccount/token. The workspace VAP
  # must reject this pod even though no explicit projected token is declared.
  volumes:
    - name: transponder-auth
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: workspace.tightbeam.sycophant.io
              expirationSeconds: 3600
  containers:
    - name: workspace
      image: registry.k8s.io/pause:3.9
      volumeMounts:
        - name: transponder-auth
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      resources:
        requests: { cpu: "100m", memory: "64Mi" }
        limits:   { cpu: "100m", memory: "64Mi" }
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
  terminationGracePeriodSeconds: 0
