apiVersion: v1
kind: Pod
metadata:
  name: tool-job-foreign-audience
  namespace: ($target_namespace)
  labels:
    app.kubernetes.io/part-of: sycophant
    app.kubernetes.io/component: capability-job
    sycophant.md/workspace: chainsaw-gvisor
spec:
  # A prompt-injected harness authors the tool-Job spec. Here it bakes a
  # projected SA token at a HARNESS audience into the untrusted tool pod —
  # credential movement into the sandbox. The gVisor VAP's capability-job
  # audience pin must reject it: the only legitimate audience is
  # tool.toolset.sycophant.md.
  automountServiceAccountToken: false
  containers:
    - name: toolset
      image: registry.k8s.io/pause:3.9
      resources:
        requests: { cpu: "50m", memory: "64Mi" }
        limits:   { cpu: "50m", memory: "64Mi" }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: forged-token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
  volumes:
    - name: forged-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: harness.toolset.sycophant.md
              expirationSeconds: 3600
  terminationGracePeriodSeconds: 0
