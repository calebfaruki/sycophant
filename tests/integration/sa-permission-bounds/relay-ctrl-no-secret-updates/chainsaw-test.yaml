apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: relay-ctrl-no-secret-updates
spec:
  description: |
    The API server enforces the chart's Secret bound for relay-ctrl. The
    RBAC under test is the CHART's rendered output, never a
    hand-written copy — a copy passes while the chart drifts.

    Probes via REAL kubectl impersonating relay-ctrl:
    - CAN create relay-registered-keys — `create` cannot be name-scoped
      (`resourceNames` is not consulted on create), so the Role grants it
      unscoped and the name-allowlist VAP is what bounds it;
    - CAN patch relay-registered-keys — resourceNames IS honored on patch,
      so the scoping is real and the denies below are name-scoping, not a
      broken RoleBinding;
    - cannot patch a Secret outside that one name;
    - cannot delete any Secret, including the one it may write.

    The relay signs nothing, so no signing-key rule exists to probe. The
    name-allowlist bucket carries the reject probe for that retired name.

    Green-path names are the ones the cluster-relay-secret-name-allowlist
    VAP admits (separate bucket:
    sa-permission-bounds/relay-secret-name-allowlist/).
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-rbac-relay
  steps:
    - name: create-tenant-ns-via-deployer
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create namespace "$TENANT_NS" --as=system:serviceaccount:sycophant-system:tenant-deployer
    - name: install-rendered-relay-ctrl-rbac
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -e
              REPO_ROOT=$(git rev-parse --show-toplevel)
              helm template probe "$REPO_ROOT/charts/sycophant-tenant" \
                -n "$TENANT_NS" -s templates/relay-ctrl-rbac.yaml \
                | kubectl apply -f -
    - name: relay-can-create-and-patch-registered-keys-name-scoped
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -e
              kubectl create secret generic relay-registered-keys \
                --from-literal=k=v -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:relay-ctrl"
              kubectl patch secret relay-registered-keys -n "$TENANT_NS" \
                --type=merge -p='{"data":{"k":"dmFsdWU="}}' \
                --as="system:serviceaccount:${TENANT_NS}:relay-ctrl"
            check:
              ($error == null): true
    - name: relay-cannot-patch-arbitrary-secrets
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create secret generic bystander \
                --from-literal=k=v -n "$TENANT_NS"
              kubectl patch secret bystander -n "$TENANT_NS" \
                --type=merge -p='{"data":{"k":"dmFsdWU="}}' \
                --as="system:serviceaccount:${TENANT_NS}:relay-ctrl"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: relay-cannot-delete-registered-keys
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete secret relay-registered-keys -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:relay-ctrl"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
  # The step-level `finally` above only runs when the run reaches the last
  # step. A failure in any earlier step would otherwise leak the namespace
  # and poison the next run, because the probes create fixed-name Secrets in
  # it. This test-level handler fires on any step failure.
  catch:
    - script:
        env:
          - name: TENANT_NS
            value: ($tenant_ns)
        content: |
          kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
