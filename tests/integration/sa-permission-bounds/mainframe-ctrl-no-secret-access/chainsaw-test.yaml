apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mainframe-ctrl-no-secret-access
spec:
  description: |
    mainframe-ctrl's tenant-scoped Role has NO Secret verbs at all. Workspace
    credentials flow through env-var refs that kubelet resolves directly —
    the controller never holds them in process memory. This is a defense-in-
    depth complement to the workspace VAP's projected-token prohibition.

    Mirrors the chart's Role from charts/sycophant-tenant/templates/
    mainframe-ctrl-rbac.yaml verbatim (Secret rule INTENTIONALLY OMITTED).
    Probes via REAL `kubectl get/create secret` impersonating mainframe-ctrl.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-rbac-mainframe
  steps:
    - name: create-tenant-ns-via-deployer
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create namespace "$TENANT_NS" --as=system:serviceaccount:sycophant-system:tenant-deployer
    - name: install-mainframe-ctrl-rbac
      try:
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: mainframe-ctrl
                namespace: ($tenant_ns)
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: mainframe-ctrl
                namespace: ($tenant_ns)
              rules:
                - apiGroups: [""]
                  resources: ["serviceaccounts", "persistentvolumeclaims", "pods"]
                  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
                - apiGroups: ["networking.k8s.io"]
                  resources: ["networkpolicies"]
                  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: mainframe-ctrl
                namespace: ($tenant_ns)
              subjects:
                - kind: ServiceAccount
                  name: mainframe-ctrl
                  namespace: ($tenant_ns)
              roleRef:
                kind: Role
                name: mainframe-ctrl
                apiGroup: rbac.authorization.k8s.io
    - name: mainframe-cannot-get-secrets
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl get secrets -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:mainframe-ctrl"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: mainframe-cannot-create-secrets
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create secret generic chainsaw-probe \
                --from-literal=k=v -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:mainframe-ctrl"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: mainframe-can-create-pods-counterpart
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<EOF | kubectl create -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:mainframe-ctrl" -f -
              apiVersion: v1
              kind: Pod
              metadata:
                name: chainsaw-probe
              spec:
                containers:
                  - name: probe
                    image: registry.k8s.io/pause:3.9
                    securityContext:
                      allowPrivilegeEscalation: false
                      runAsNonRoot: true
                      runAsUser: 1000
                      capabilities: { drop: ["ALL"] }
                      seccompProfile: { type: RuntimeDefault }
              EOF
            check:
              ($error == null): true
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
