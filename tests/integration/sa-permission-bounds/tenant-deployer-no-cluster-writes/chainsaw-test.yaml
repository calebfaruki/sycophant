apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-deployer-no-cluster-writes
spec:
  description: |
    The tenant-deployer ClusterRole grants no resource writes outside
    tenant namespaces. The per-tenant RoleBinding (generated by Kyverno
    when a tenant-* ns is created) is the only path that grants writes,
    and that's scoped to that single namespace.

    Real API calls — REAL `kubectl create deployment` impersonating the
    deployer in default + kube-system (expect Forbidden), then in the
    tenant ns (expect OK via the generated RoleBinding).
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-rbac-deployer-cluster
  steps:
    - name: cannot-create-deployment-in-default
      try:
        - script:
            content: |
              kubectl create deployment chainsaw-probe \
                --image=registry.k8s.io/pause:3.9 -n default \
                --as=system:serviceaccount:sycophant-system:tenant-deployer
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: cannot-create-deployment-in-kube-system
      try:
        - script:
            content: |
              kubectl create deployment chainsaw-probe \
                --image=registry.k8s.io/pause:3.9 -n kube-system \
                --as=system:serviceaccount:sycophant-system:tenant-deployer
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: create-tenant-ns
      try:
        - apply:
            file: ../../fixtures/tenant-namespace.yaml
            template: true
        - assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: tenant-deployer
                namespace: ($tenant_ns)
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create deployment chainsaw-probe \
                --image=registry.k8s.io/pause:3.9 -n "$TENANT_NS" \
                --as=system:serviceaccount:sycophant-system:tenant-deployer
            check:
              ($error == null): true
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
