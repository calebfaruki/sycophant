apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cross-workspace-secret-denies
spec:
  description: |
    The secret-name allowlist is keyed on the creating identity's workspace, not
    on the referenced name globally. Workspace `other` has approved `other-secret`
    in its own `capability-grants-other`. Workspace `probe`, creating a Job
    under `harness-probe`, references `other-secret`. Because the gate reads
    `capability-grants-probe` -- selected from the unforgeable creator identity
    -- `other-secret` is off probe's allowlist and the Job is denied. Workspace
    W's Job may mount only W's approved names.

    Both allowlists are seeded; the referenced name IS approved somewhere, so a
    gate that checked global approval rather than per-workspace approval would
    admit. That is exactly the case this test reds on. With the gate absent the
    Job admits and this test goes red.

    Live-cluster test: per-workspace keying is only observable through the real
    creator identity.

    Mutation guard: reading the allowlist by referenced name instead of by the
    creator's workspace, or dropping the allowlist check, admits this Job.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: seed-capability-grants
      use:
        template: ../../step-templates/capability-grants.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
            - name: grants
              value:
                approved-secret: tool
    - name: seed-other-workspace-allowlist
      try:
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: capability-grants-other
                namespace: ($tenant_ns)
                labels:
                  app.kubernetes.io/part-of: sycophant
                  sycophant.md/type: capability-grants
              data:
                other-secret: tool
    - name: probe-references-other-workspace-secret
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl create --as="system:serviceaccount:${TENANT_NS}:harness-probe" -n "$TENANT_NS" -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: cross-workspace
              spec:
                template:
                  metadata:
                    labels:
                      sycophant.md/job-kind: tool
                  spec:
                    restartPolicy: Never
                    serviceAccountName: unprivileged-probe
                    volumes:
                      - name: creds
                        secret:
                          secretName: other-secret
                    containers:
                      - name: probe
                        image: registry.k8s.io/pause:3.9
                        volumeMounts:
                          - name: creds
                            mountPath: /etc/creds
                            readOnly: true
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-capability-job-gate')): true
      catch:
        - events:
            namespace: ($tenant_ns)
