apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: off-allowlist-secret-projected-denies
spec:
  description: |
    A Job created under `harness-<ws>` that references, on
    `volumes[].projected.sources[].secret.name`, a Secret name absent from the
    workspace's `capability-grants-<ws>` allowlist is denied. The projected volume
    is a permitted volume kind, so the volume-kind allowlist admits it; the
    secret-name check over the projected secret source is the only reason to deny.
    With that surface unchecked the Job admits and this test goes red.

    Live-cluster test: the gate reads the per-workspace allowlist keyed on the
    creating identity.

    Mutation guard: dropping the projected secret source surface from the
    allowlist check admits this Job.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: seed-capability-grants
      use:
        template: ../../step-templates/capability-grants.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
            - name: grants
              value:
                approved-secret: tool
    - name: harness-projects-off-allowlist-secret
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl create --as="system:serviceaccount:${TENANT_NS}:harness-probe" -n "$TENANT_NS" -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: off-secret-projected
              spec:
                template:
                  metadata:
                    labels:
                      sycophant.md/job-kind: tool
                  spec:
                    restartPolicy: Never
                    serviceAccountName: unprivileged-probe
                    volumes:
                      - name: creds
                        projected:
                          sources:
                            - secret:
                                name: not-approved
                    containers:
                      - name: probe
                        image: registry.k8s.io/pause:3.9
                        volumeMounts:
                          - name: creds
                            mountPath: /etc/creds
                            readOnly: true
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-capability-job-gate')): true
      catch:
        - events:
            namespace: ($tenant_ns)
