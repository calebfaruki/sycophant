apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: off-allowlist-volume-kind-denies
spec:
  description: |
    A Job created under `harness-<ws>` whose pod template declares a volume of a
    kind outside the six-kind safe set (configMap, secret, projected, emptyDir,
    downwardAPI, the workspace persistentVolumeClaim) is denied. The creator
    submits a `csi` volume -- the secrets-store side channel the volume-kind
    allowlist exists to close.

    Well-formed in every other respect, so the only reason to deny is the
    volume-kind allowlist. With that rule removed the Job admits and this test
    goes red.

    Live-cluster test: the gate keys on the creating identity.

    Mutation guard: removing the volume-kind allowlist admits this Job.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-cjg-volkind
  steps:
    - name: create-tenant-ns
      try:
        - apply:
            file: ../../fixtures/tenant-namespace.yaml
            template: true
    - name: seed-harness-identity-and-allowlist
      try:
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: harness-can-create-jobs
                namespace: ($tenant_ns)
              rules:
                - apiGroups: ["batch"]
                  resources: ["jobs"]
                  verbs: ["create"]
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: harness-can-create-jobs
                namespace: ($tenant_ns)
              subjects:
                - kind: ServiceAccount
                  name: harness-research
                  namespace: ($tenant_ns)
              roleRef:
                kind: Role
                name: harness-can-create-jobs
                apiGroup: rbac.authorization.k8s.io
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: capability-grants-research
                namespace: ($tenant_ns)
                labels:
                  app.kubernetes.io/part-of: sycophant
                  sycophant.md/type: capability-grants
              data:
                research-notion-reader: notion
    - name: harness-creates-csi-volume-job
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl create --as="system:serviceaccount:${TENANT_NS}:harness-research" -n "$TENANT_NS" -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: off-volume-kind
              spec:
                template:
                  metadata:
                    labels:
                      sycophant.md/job-kind: tool
                  spec:
                    restartPolicy: Never
                    serviceAccountName: unprivileged-research
                    volumes:
                      - name: side-channel
                        csi:
                          driver: secrets-store.csi.k8s.io
                          readOnly: true
                    containers:
                      - name: probe
                        image: registry.k8s.io/pause:3.9
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-capability-job-gate')): true
      catch:
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
