apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: stripped-envelope-denies
spec:
  description: |
    A Job created under `harness-<ws>` whose pod template still lacks a required
    isolation-envelope element after mutation is denied. The creator submits a
    container that explicitly declares a non-compliant securityContext
    (readOnlyRootFilesystem: false, allowPrivilegeEscalation: true); the gate's
    additive mutate does not sanitize an explicitly hostile value, and the
    validate denies.

    Well-formed in every other respect (valid pinned SA, allowed volume, approved
    secret, valid job-kind), so the only reason to deny is the envelope validate.
    With that rule removed the Job admits and this test goes red.

    Live-cluster test: the gate keys on the creating identity.

    Depends on the mutate being additive rather than overwriting explicit
    container securityContext values -- otherwise "missing after mutation" is
    unreachable at the Job layer.

    Mutation guard: removing the envelope validate admits this Job (error null).
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: seed-capability-grants
      use:
        template: ../../step-templates/capability-grants.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
            - name: grants
              value:
                approved-secret: tool
    - name: harness-creates-non-compliant-job
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl create --as="system:serviceaccount:${TENANT_NS}:harness-probe" -n "$TENANT_NS" -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: stripped-envelope
              spec:
                template:
                  metadata:
                    labels:
                      sycophant.md/job-kind: tool
                  spec:
                    restartPolicy: Never
                    serviceAccountName: unprivileged-probe
                    containers:
                      - name: probe
                        image: registry.k8s.io/pause:3.9
                        securityContext:
                          readOnlyRootFilesystem: false
                          allowPrivilegeEscalation: true
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-capability-job-gate')): true
      catch:
        - events:
            namespace: ($tenant_ns)
