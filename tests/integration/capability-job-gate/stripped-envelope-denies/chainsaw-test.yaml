apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: stripped-envelope-denies
spec:
  description: |
    A Job created under `harness-<ws>` whose pod template still lacks a required
    isolation-envelope element after mutation is denied. The creator submits a
    container that explicitly declares a non-compliant securityContext
    (readOnlyRootFilesystem: false, allowPrivilegeEscalation: true); the gate's
    additive mutate does not sanitize an explicitly hostile value, and the
    validate denies.

    Well-formed in every other respect (valid pinned SA, allowed volume, approved
    secret, valid job-kind), so the only reason to deny is the envelope validate.
    With that rule removed the Job admits and this test goes red.

    Live-cluster test: the gate keys on the creating identity.

    Depends on the mutate being additive rather than overwriting explicit
    container securityContext values -- otherwise "missing after mutation" is
    unreachable at the Job layer.

    Mutation guard: removing the envelope validate admits this Job (error null).
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-cjg-envelope
  steps:
    - name: create-tenant-ns
      try:
        - apply:
            file: ../../fixtures/tenant-namespace.yaml
            template: true
    - name: seed-harness-identity-and-allowlist
      try:
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: harness-can-create-jobs
                namespace: ($tenant_ns)
              rules:
                - apiGroups: ["batch"]
                  resources: ["jobs"]
                  verbs: ["create"]
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: harness-can-create-jobs
                namespace: ($tenant_ns)
              subjects:
                - kind: ServiceAccount
                  name: harness-research
                  namespace: ($tenant_ns)
              roleRef:
                kind: Role
                name: harness-can-create-jobs
                apiGroup: rbac.authorization.k8s.io
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: capability-grants-research
                namespace: ($tenant_ns)
                labels:
                  app.kubernetes.io/part-of: sycophant
                  sycophant.md/type: capability-grants
              data:
                research-notion-reader: notion
    - name: harness-creates-non-compliant-job
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl create --as="system:serviceaccount:${TENANT_NS}:harness-research" -n "$TENANT_NS" -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: stripped-envelope
              spec:
                template:
                  metadata:
                    labels:
                      sycophant.md/job-kind: tool
                  spec:
                    restartPolicy: Never
                    serviceAccountName: unprivileged-research
                    containers:
                      - name: probe
                        image: registry.k8s.io/pause:3.9
                        securityContext:
                          readOnlyRootFilesystem: false
                          allowPrivilegeEscalation: true
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-capability-job-gate')): true
      catch:
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
