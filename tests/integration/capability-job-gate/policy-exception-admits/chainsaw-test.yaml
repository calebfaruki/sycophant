apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: policy-exception-admits
spec:
  description: A gated Job admits only under a PolicyException in sycophant-system, never under one in the tenant namespace.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
    - name: operator_ns
      value: sycophant-system
  steps:
    - name: create-tenant-ns
      try:
        - apply:
            file: ../../fixtures/tenant-namespace.yaml
            template: true
    - name: ensure-operator-ns
      try:
        # Guard, not a chainsaw-owned apply: sycophant-system is a shared
        # operator namespace, so the test must never delete it on cleanup.
        - script:
            content: |
              set -euo pipefail
              kubectl get namespace sycophant-system >/dev/null 2>&1 \
                || kubectl create namespace sycophant-system
    - name: seed-capability-grants
      use:
        template: ../../step-templates/capability-grants.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
            - name: grants
              value:
                approved-secret: tool
    - name: gate-denies-without-exception
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              cat <<MANIFEST | kubectl create --as="system:serviceaccount:${TENANT_NS}:ag-probe" -n "$TENANT_NS" -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: polex-control
              spec:
                template:
                  metadata:
                    labels:
                      sycophant.md/job-kind: tool
                  spec:
                    restartPolicy: Never
                    serviceAccountName: attacker-sa
                    containers:
                      - name: probe
                        image: registry.k8s.io/pause:3.9
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-capability-job-gate')): true
    - name: operator-grants-exception
      try:
        # The honored exception: resident in sycophant-system, selecting one Job
        # by name. Runs before the residence probe so the settle below is proven
        # long enough for an exception to load; the later deny cannot then be a
        # load race.
        - apply:
            template: true
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: PolicyException
              metadata:
                name: allow-capability-job-shape
                namespace: ($operator_ns)
              spec:
                policyRefs:
                  - kind: ValidatingPolicy
                    name: cluster-capability-job-gate
                matchConditions:
                  - name: the-exempted-job
                    expression: "object.metadata.name == 'polex-exempted'"
        - sleep:
            duration: 15s
    - name: gate-admits-with-exception
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              cat <<MANIFEST | kubectl create --as="system:serviceaccount:${TENANT_NS}:ag-probe" -n "$TENANT_NS" -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: polex-exempted
              spec:
                template:
                  metadata:
                    labels:
                      sycophant.md/job-kind: tool
                  spec:
                    restartPolicy: Never
                    serviceAccountName: attacker-sa
                    containers:
                      - name: probe
                        image: registry.k8s.io/pause:3.9
              MANIFEST
            check:
              ($error == null): true
      catch:
        - events:
            namespace: ($tenant_ns)
    - name: tenant-residence-not-honored
      try:
        # Same type, same shape, same settle as the admit leg. Only the residence
        # differs, so the deny is a residence assertion.
        - apply:
            template: true
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: PolicyException
              metadata:
                name: tenant-self-exemption
                namespace: ($tenant_ns)
              spec:
                policyRefs:
                  - kind: ValidatingPolicy
                    name: cluster-capability-job-gate
                matchConditions:
                  - name: the-self-exempted-job
                    expression: "object.metadata.name == 'polex-tenant-residence'"
        - sleep:
            duration: 15s
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              cat <<MANIFEST | kubectl create --as="system:serviceaccount:${TENANT_NS}:ag-probe" -n "$TENANT_NS" -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: polex-tenant-residence
              spec:
                template:
                  metadata:
                    labels:
                      sycophant.md/job-kind: tool
                  spec:
                    restartPolicy: Never
                    serviceAccountName: attacker-sa
                    containers:
                      - name: probe
                        image: registry.k8s.io/pause:3.9
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-capability-job-gate')): true
      finally:
        - script:
            env:
              - name: OPERATOR_NS
                value: ($operator_ns)
            content: |
              set -euo pipefail
              kubectl delete policyexception.policies.kyverno.io allow-capability-job-shape \
                -n "$OPERATOR_NS" --ignore-not-found
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
