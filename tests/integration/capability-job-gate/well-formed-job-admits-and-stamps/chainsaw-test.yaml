apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: well-formed-job-admits-and-stamps
spec:
  description: |
    A well-formed Job created under the `harness-<ws>` identity admits, and the
    gate's mutate stamps the pod template with the isolation envelope, the
    constant component label, and the workspace parsed from the creating identity
    -- overwriting any workspace the creator carried.

    The creator submits a Job whose template omits the envelope, carries
    `app.kubernetes.io/component` unset, and carries a WRONG
    `sycophant.md/workspace: other`. After admission the created Job must show:
      - spec.template.spec.runtimeClassName == gvisor
      - spec.template.spec.automountServiceAccountToken == false
      - a container securityContext with readOnlyRootFilesystem == true
      - labels app.kubernetes.io/component == capability-job
      - labels sycophant.md/workspace == probe (overwritten from `other`)

    Live-cluster test, justified: the mutate keys on the authenticated creator
    identity, which no render can supply. Only a real `kubectl --as
    system:serviceaccount:<ns>:harness-probe` create observes the stamp.

    Mutation guard: without the mutate the runtimeClassName / component /
    readOnlyRootFilesystem assertions go empty; a mutate that trusts the carried
    workspace leaves it `other` and fails the overwrite assertion.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: seed-unprivileged-sa
      try:
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: unprivileged-probe
                namespace: ($tenant_ns)
              automountServiceAccountToken: false
    - name: seed-capability-grants
      use:
        template: ../../step-templates/capability-grants.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
            - name: grants
              value:
                approved-secret: tool
    - name: harness-creates-well-formed-job
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              out=$(mktemp)
              cat <<MANIFEST | kubectl create --as="system:serviceaccount:${TENANT_NS}:harness-probe" -n "$TENANT_NS" -o json -f - > "$out"
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: well-formed
              spec:
                template:
                  metadata:
                    labels:
                      sycophant.md/workspace: other
                      sycophant.md/job-kind: tool
                  spec:
                    restartPolicy: Never
                    serviceAccountName: unprivileged-probe
                    volumes:
                      - name: scratch
                        emptyDir: {}
                    containers:
                      - name: probe
                        image: registry.k8s.io/pause:3.9
                        env:
                          - name: TOKEN
                            valueFrom:
                              secretKeyRef:
                                name: approved-secret
                                key: token
              MANIFEST
              python3 - "$out" <<'PY'
              import sys, json
              job = json.load(open(sys.argv[1]))
              t = job["spec"]["template"]
              spec = t["spec"]
              assert spec.get("runtimeClassName") == "gvisor", \
                  f"envelope missing: runtimeClassName={spec.get('runtimeClassName')!r}"
              assert spec.get("automountServiceAccountToken") is False, \
                  f"envelope missing: automountServiceAccountToken={spec.get('automountServiceAccountToken')!r}"
              c = spec["containers"][0]
              sc = c.get("securityContext") or {}
              assert sc.get("readOnlyRootFilesystem") is True, \
                  f"envelope missing: container readOnlyRootFilesystem={sc.get('readOnlyRootFilesystem')!r}"
              labels = (t.get("metadata") or {}).get("labels") or {}
              assert labels.get("app.kubernetes.io/component") == "capability-job", \
                  f"component not stamped, got {labels.get('app.kubernetes.io/component')!r}"
              assert labels.get("sycophant.md/workspace") == "probe", \
                  f"workspace not overwritten from identity, got {labels.get('sycophant.md/workspace')!r}"
              print("OK")
              PY
            check:
              ($error == null): true
      catch:
        - events:
            namespace: ($tenant_ns)
