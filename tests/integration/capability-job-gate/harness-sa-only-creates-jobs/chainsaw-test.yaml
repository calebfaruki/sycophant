apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: harness-sa-only-creates-jobs
spec:
  description: |
    The per-workspace creator ServiceAccount `harness-<ws>` is the identity the
    gate keys on. It must hold exactly `create` on `batch/jobs` and nothing else:
    no verb on pods, pods/ephemeralcontainers, cronjobs, deployments,
    statefulsets, replicasets, daemonsets, replicationcontrollers, or secrets.
    Absence is the denial for every other resource, so the creator can mint only
    Jobs and only the gate governs their shape.

    Pure chart-render property. `helm template` renders the SA plus the Role bound
    to it; this test finds that Role via its RoleBinding and asserts its rule set
    is exactly one rule -- apiGroups [batch], resources [jobs], verbs [create].

    Mutation guard: adding any verb (get, list, delete), any resource (pods,
    secrets), or a second rule fails the exact-rule-set assertion; widening verbs
    to include `*` fails it; dropping the batch/jobs create rule fails the
    presence assertion.
  steps:
    - name: render-and-assert-harness-role
      try:
        - script:
            content: |
              set -euo pipefail
              REPO_ROOT=$(git rev-parse --show-toplevel)
              tmp=$(mktemp)
              helm template probe "$REPO_ROOT/charts/sycophant-tenant" -n probe-ns \
                --set-string workspaces.research.toolsets[0].name=notion \
                --set-string workspaces.research.toolsets[0].grants.reader.secret=research-notion-reader \
                > "$tmp"
              python3 - "$tmp" <<'PY'
              import sys, yaml
              docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]

              sas = [d for d in docs if d.get("kind") == "ServiceAccount"
                     and d["metadata"]["name"] == "harness-research"]
              assert sas, "ServiceAccount harness-research was not rendered"

              # Find the Role(s) bound to harness-research.
              roles = {d["metadata"]["name"]: d for d in docs if d.get("kind") == "Role"}
              bound = []
              for rb in [d for d in docs if d.get("kind") == "RoleBinding"]:
                  names = {s.get("name") for s in (rb.get("subjects") or [])
                           if s.get("kind") == "ServiceAccount"}
                  if "harness-research" in names:
                      ref = rb.get("roleRef") or {}
                      assert ref.get("kind") == "Role", \
                          f"harness-research must bind a namespaced Role, got {ref.get('kind')!r}"
                      bound.append(ref["name"])
              assert bound, "no RoleBinding grants harness-research any Role"
              assert len(bound) == 1, \
                  f"harness-research must bind exactly one Role, got {bound}"

              rules = roles[bound[0]].get("rules") or []
              assert len(rules) == 1, \
                  f"harness-research Role must hold exactly one rule, got {rules}"
              r = rules[0]
              assert sorted(r.get("apiGroups") or []) == ["batch"], \
                  f"rule apiGroups must be [batch], got {r.get('apiGroups')}"
              assert sorted(r.get("resources") or []) == ["jobs"], \
                  f"rule resources must be [jobs], got {r.get('resources')}"
              assert sorted(r.get("verbs") or []) == ["create"], \
                  f"rule verbs must be exactly [create], got {r.get('verbs')}"
              print("OK")
              PY
