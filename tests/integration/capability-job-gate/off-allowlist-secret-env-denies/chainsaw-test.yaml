apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: off-allowlist-secret-env-denies
spec:
  description: |
    A Job created under `harness-<ws>` that references, on
    `env[].valueFrom.secretKeyRef.name` inside an initContainer, a Secret name
    absent from the workspace's `capability-grants-<ws>` allowlist is denied.
    Placing it in an initContainer also proves the allowlist check spans
    initContainers[], not only containers[]. The off-allowlist name is the only
    secret reference; every other field is well-formed, so the secret-name check
    over the env secretKeyRef surface is the only reason to deny. With that
    surface unchecked the Job admits and this test goes red.

    Live-cluster test: the gate reads the per-workspace allowlist keyed on the
    creating identity.

    Mutation guard: dropping the env secretKeyRef surface, or checking only
    containers[] and not initContainers[], admits this Job.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-cjg-secenv
  steps:
    - name: create-tenant-ns
      try:
        - apply:
            file: ../../fixtures/tenant-namespace.yaml
            template: true
    - name: seed-harness-identity-and-allowlist
      try:
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: harness-can-create-jobs
                namespace: ($tenant_ns)
              rules:
                - apiGroups: ["batch"]
                  resources: ["jobs"]
                  verbs: ["create"]
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: harness-can-create-jobs
                namespace: ($tenant_ns)
              subjects:
                - kind: ServiceAccount
                  name: harness-research
                  namespace: ($tenant_ns)
              roleRef:
                kind: Role
                name: harness-can-create-jobs
                apiGroup: rbac.authorization.k8s.io
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: capability-grants-research
                namespace: ($tenant_ns)
                labels:
                  app.kubernetes.io/part-of: sycophant
                  sycophant.md/type: capability-grants
              data:
                research-notion-reader: notion
    - name: harness-injects-off-allowlist-secret-env
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl create --as="system:serviceaccount:${TENANT_NS}:harness-research" -n "$TENANT_NS" -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: off-secret-env
              spec:
                template:
                  metadata:
                    labels:
                      sycophant.md/job-kind: tool
                  spec:
                    restartPolicy: Never
                    serviceAccountName: unprivileged-research
                    initContainers:
                      - name: seed
                        image: registry.k8s.io/pause:3.9
                        env:
                          - name: TOKEN
                            valueFrom:
                              secretKeyRef:
                                name: not-approved
                                key: token
                    containers:
                      - name: probe
                        image: registry.k8s.io/pause:3.9
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-capability-job-gate')): true
      catch:
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
