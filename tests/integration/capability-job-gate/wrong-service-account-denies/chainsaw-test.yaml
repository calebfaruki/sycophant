apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: wrong-service-account-denies
spec:
  description: |
    A Job created under `harness-<ws>` whose pod template sets
    `serviceAccountName` to any value other than `unprivileged-<ws>` is denied.
    Without the SA pin a subverted creator names a different SA and the created
    pod mounts that SA's token; the gate is the only thing binding the running
    identity to the zero-RBAC pod SA.

    The creator names `attacker-sa`; every other field is well-formed, so the SA
    pin is the only reason to deny. With that rule removed the Job admits and this
    test goes red.

    Live-cluster test: the gate keys on the creating identity.

    Mutation guard: removing the serviceAccountName == unprivileged-research
    validate admits this Job.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-cjg-wrongsa
  steps:
    - name: create-tenant-ns
      try:
        - apply:
            file: ../../fixtures/tenant-namespace.yaml
            template: true
    - name: seed-harness-identity-and-allowlist
      try:
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: harness-can-create-jobs
                namespace: ($tenant_ns)
              rules:
                - apiGroups: ["batch"]
                  resources: ["jobs"]
                  verbs: ["create"]
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: harness-can-create-jobs
                namespace: ($tenant_ns)
              subjects:
                - kind: ServiceAccount
                  name: harness-research
                  namespace: ($tenant_ns)
              roleRef:
                kind: Role
                name: harness-can-create-jobs
                apiGroup: rbac.authorization.k8s.io
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: capability-grants-research
                namespace: ($tenant_ns)
                labels:
                  app.kubernetes.io/part-of: sycophant
                  sycophant.md/type: capability-grants
              data:
                research-notion-reader: notion
    - name: harness-pins-wrong-service-account
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl create --as="system:serviceaccount:${TENANT_NS}:harness-research" -n "$TENANT_NS" -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: wrong-sa
              spec:
                template:
                  metadata:
                    labels:
                      sycophant.md/job-kind: tool
                  spec:
                    restartPolicy: Never
                    serviceAccountName: attacker-sa
                    containers:
                      - name: probe
                        image: registry.k8s.io/pause:3.9
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-capability-job-gate')): true
      catch:
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
