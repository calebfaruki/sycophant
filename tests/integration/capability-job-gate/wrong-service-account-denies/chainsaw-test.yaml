apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: wrong-service-account-denies
spec:
  description: |
    A Job created under `harness-<ws>` whose pod template sets
    `serviceAccountName` to any value other than `unprivileged-<ws>` is denied.
    Without the SA pin a subverted creator names a different SA and the created
    pod mounts that SA's token; the gate is the only thing binding the running
    identity to the zero-RBAC pod SA.

    The creator names `attacker-sa`; every other field is well-formed, so the SA
    pin is the only reason to deny. With that rule removed the Job admits and this
    test goes red.

    Live-cluster test: the gate keys on the creating identity.

    Mutation guard: removing the serviceAccountName == unprivileged-probe
    validate admits this Job.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: seed-capability-grants
      use:
        template: ../../step-templates/capability-grants.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
            - name: grants
              value:
                approved-secret: tool
    - name: harness-pins-wrong-service-account
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl create --as="system:serviceaccount:${TENANT_NS}:harness-probe" -n "$TENANT_NS" -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: wrong-sa
              spec:
                template:
                  metadata:
                    labels:
                      sycophant.md/job-kind: tool
                  spec:
                    restartPolicy: Never
                    serviceAccountName: attacker-sa
                    containers:
                      - name: probe
                        image: registry.k8s.io/pause:3.9
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-capability-job-gate')): true
      catch:
        - events:
            namespace: ($tenant_ns)
