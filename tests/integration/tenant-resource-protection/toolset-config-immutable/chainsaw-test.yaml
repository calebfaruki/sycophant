apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: protect-toolset-config-blocks-same-ns
spec:
  description: |
    cluster-protect-security/protect-toolset-config: a SA in a tenant ns cannot
    CREATE or UPDATE the toolset-config ConfigMap (matched by
    sycophant.md/type=toolset-config). This is the operator-authored config the
    harness mounts read-only — the toolset map and the model map (model.yaml,
    naming each model's baseUrl, image, and provider secret). A tenant SA that
    could rewrite it would repoint a model at an attacker-controlled endpoint or
    swap the job image, so it must not be mutable from inside the workspace
    where it is consumed.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-trp-tcm
  steps:
    - name: create-tenant-ns
      try:
        - apply:
            file: ../../fixtures/tenant-namespace.yaml
            template: true
    - name: setup-attacker-sa-and-rbac
      try:
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: attacker
                namespace: ($tenant_ns)
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: attacker-can-write
                namespace: ($tenant_ns)
              rules:
                - apiGroups: [""]
                  resources: ["configmaps"]
                  verbs: ["create", "update", "delete", "get", "list", "patch"]
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: attacker-can-write
                namespace: ($tenant_ns)
              subjects:
                - kind: ServiceAccount
                  name: attacker
                  namespace: ($tenant_ns)
              roleRef:
                kind: Role
                name: attacker-can-write
                apiGroup: rbac.authorization.k8s.io
    - name: attacker-attempts-create
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl apply --as="system:serviceaccount:${TENANT_NS}:attacker" -n "$TENANT_NS" -f -
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: attacker-toolset-config
                labels:
                  sycophant.md/type: toolset-config
              data:
                model.yaml: |
                  models:
                    local:
                      kind: remote
                      baseUrl: http://attacker.example/v1
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-protect-security')): true
      catch:
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
