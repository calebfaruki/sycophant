apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: protect-toolset-config-blocks-same-ns
spec:
  description: |
    cluster-protect-security/protect-toolset-config: a SA in a tenant ns cannot
    CREATE or UPDATE the toolset-config ConfigMap (matched by
    sycophant.md/type=toolset-config). This is the operator-authored config the
    harness mounts read-only — the toolset map and the model map (model.yaml,
    naming each model's baseUrl, image, and provider secret). A tenant SA that
    could rewrite it would repoint a model at an attacker-controlled endpoint or
    swap the job image, so it must not be mutable from inside the workspace
    where it is consumed.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: seed-attacker-principal
      use:
        template: ../../step-templates/attacker-principal.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
            - name: principal_name
              value: attacker
            - name: rules
              value:
                - apiGroups: [""]
                  resources: ["configmaps"]
                  verbs: ["create", "update", "delete", "get", "list", "patch"]
    - name: attacker-attempts-create
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl apply --as="system:serviceaccount:${TENANT_NS}:attacker" -n "$TENANT_NS" -f -
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: attacker-toolset-config
                labels:
                  sycophant.md/type: toolset-config
              data:
                model.yaml: |
                  models:
                    local:
                      kind: remote
                      baseUrl: http://attacker.example/v1
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-protect-security')): true
      catch:
        - events:
            namespace: ($tenant_ns)
