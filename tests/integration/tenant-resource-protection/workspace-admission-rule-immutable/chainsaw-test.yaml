apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: workspace-admission-rule-immutable
spec:
  description: |
    Kubernetes excludes admissionregistration.k8s.io resources from being
    intercepted by admission rules — neither Kyverno nor an in-tree
    ValidatingAdmissionPolicy can guard the harness pod policy at the
    admission layer (verified empirically). Protection is
    enforced one layer up, at RBAC: no operator-tier identity in the
    chart is granted admissionregistration.k8s.io/validatingadmissionpolicies
    verbs. This test asserts that property holds against every
    operator-tier service account and goes red the day a future PR grants
    one of them VAP edit access.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-vap-rbac
    - name: ws_sa
      value: sa-chainsaw-ws
  steps:
    - name: setup-tenant-ns-and-workspace-sa
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create namespace "$TENANT_NS" --as=system:serviceaccount:sycophant-system:tenant-deployer
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: ($ws_sa)
                namespace: ($tenant_ns)
    - name: tenant-deployer-cannot-delete-harness-vap
      try:
        - script:
            content: |
              kubectl delete validatingadmissionpolicy cluster-gvisor-pod-policy \
                --as=system:serviceaccount:sycophant-system:tenant-deployer
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: tenant-deployer-cannot-patch-harness-vap
      try:
        - script:
            content: |
              kubectl patch validatingadmissionpolicy cluster-gvisor-pod-policy \
                --type=merge -p '{"metadata":{"annotations":{"chainsaw":"probe"}}}' \
                --as=system:serviceaccount:sycophant-system:tenant-deployer
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: mainframe-ctrl-cannot-delete-harness-vap
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete validatingadmissionpolicy cluster-gvisor-pod-policy \
                --as="system:serviceaccount:${TENANT_NS}:mainframe-ctrl"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: hangar-ctrl-cannot-delete-harness-vap
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete validatingadmissionpolicy cluster-gvisor-pod-policy \
                --as="system:serviceaccount:${TENANT_NS}:hangar-ctrl"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: airlock-ctrl-cannot-delete-harness-vap
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete validatingadmissionpolicy cluster-gvisor-pod-policy \
                --as="system:serviceaccount:${TENANT_NS}:airlock-ctrl"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: workspace-sa-cannot-delete-harness-vap
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
              - name: WS_SA
                value: ($ws_sa)
            content: |
              kubectl delete validatingadmissionpolicy cluster-gvisor-pod-policy \
                --as="system:serviceaccount:${TENANT_NS}:${WS_SA}"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
