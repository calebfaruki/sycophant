apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: protect-network-policy-blocks-same-ns
spec:
  description: |
    cluster-protect-security/protect-network-policy: a ServiceAccount
    in a tenant ns cannot create/update/delete a NetworkPolicy in that
    same tenant ns. External callers (cluster-admin, deployer) are
    excluded.

    Setup as cluster-admin: create tenant ns via deployer; create
    `attacker` SA + Role granting NetworkPolicy CRUD; bind it.
    Then impersonate the attacker and attempt the write — must fail
    citing the policy. The cluster-admin RBAC setup itself works
    (cluster-admin is excluded by username precondition).
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-trp-np
  steps:
    - name: create-tenant-ns
      try:
        - apply:
            file: ../../fixtures/tenant-namespace.yaml
            template: true
    - name: setup-attacker-sa-and-rbac
      try:
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: attacker
                namespace: ($tenant_ns)
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: attacker-can-write-netpol
                namespace: ($tenant_ns)
              rules:
                - apiGroups: ["networking.k8s.io"]
                  resources: ["networkpolicies"]
                  verbs: ["create", "update", "delete", "get", "list"]
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: attacker-can-write-netpol
                namespace: ($tenant_ns)
              subjects:
                - kind: ServiceAccount
                  name: attacker
                  namespace: ($tenant_ns)
              roleRef:
                kind: Role
                name: attacker-can-write-netpol
                apiGroup: rbac.authorization.k8s.io
    - name: attacker-attempts-netpol-write
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl apply --as="system:serviceaccount:${TENANT_NS}:attacker" -n "$TENANT_NS" -f -
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: attacker-netpol
              spec:
                podSelector: {}
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-protect-security')): true
      catch:
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
