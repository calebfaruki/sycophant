apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: policy-write-verbs-are-admin-only
spec:
  description: No sycophant role or tenant identity can write Kyverno policies; only the unbound cluster-chart-admin can.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: sycophant-roles-do-not-write-policies
      try:
        - script:
            content: |
              set -euo pipefail
              REPO_ROOT=$(git rev-parse --show-toplevel)
              helm template probe "$REPO_ROOT/charts/sycophant-cluster" \
                -n sycophant-system \
                --api-versions policies.kyverno.io/v1/ValidatingPolicy \
                | python3 -c '
              import sys, yaml

              items = [
                  d for d in yaml.safe_load_all(sys.stdin)
                  if d and d.get("kind") in ("ClusterRole", "Role")
              ]

              WRITE = {"*", "create", "update", "patch", "delete", "deletecollection"}
              KINDS = {
                  "validatingpolicies",
                  "mutatingpolicies",
                  "generatingpolicies",
                  "deletingpolicies",
              }

              offenders = []
              chart_admin_writes = False
              for role in items:
                  name = role["metadata"]["name"]
                  for rule in role.get("rules") or []:
                      groups = rule.get("apiGroups") or []
                      resources = rule.get("resources") or []
                      verbs = set(rule.get("verbs") or [])
                      if not ("*" in groups or "policies.kyverno.io" in groups):
                          continue
                      if not ("*" in resources or KINDS & set(resources)):
                          continue
                      if not (WRITE & verbs):
                          continue
                      if name == "cluster-chart-admin":
                          chart_admin_writes = True
                      else:
                          offenders.append(f"{name}: {sorted(groups)} {sorted(resources)} {sorted(verbs)}")

              if offenders:
                  print("sycophant ClusterRoles other than cluster-chart-admin grant policy writes:")
                  for o in sorted(offenders):
                      print("  " + o)
                  sys.exit(1)

              if not chart_admin_writes:
                  print("cluster-chart-admin must keep the break-glass policy write grant")
                  sys.exit(1)
              '
            check:
              ($error == null): true
    - name: tenant-identities-cannot-write-policies
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              # Authorization is evaluated from the name, so these need not exist.
              for sa in \
                "system:serviceaccount:${TENANT_NS}:ag-probe-unprivileged" \
                "system:serviceaccount:${TENANT_NS}:ag-probe" \
                "system:serviceaccount:${TENANT_NS}:relay-controller" \
                "system:serviceaccount:sycophant-system:provision-probe"; do
                for kind in validatingpolicies mutatingpolicies generatingpolicies deletingpolicies; do
                  for verb in create update patch delete; do
                    ans=$(kubectl auth can-i "$verb" "${kind}.policies.kyverno.io" --as="$sa" 2>/dev/null || true)
                    [ "$ans" = "no" ] \
                      || { echo "$sa can $verb $kind (got '$ans'); the policy machinery is reachable from a tenant"; exit 1; }
                  done
                done
              done
            check:
              ($error == null): true
    - name: break-glass-role-is-unbound
      try:
        - script:
            content: |
              set -euo pipefail
              bound=$(kubectl get clusterrolebindings -o json | python3 -c '
              import json, sys
              print(" ".join(
                  b["metadata"]["name"]
                  for b in json.load(sys.stdin)["items"]
                  if b.get("roleRef", {}).get("name") == "cluster-chart-admin"
              ))
              ')
              [ -z "$bound" ] \
                || { echo "cluster-chart-admin must stay unbound; bound by: $bound"; exit 1; }
            check:
              ($error == null): true
