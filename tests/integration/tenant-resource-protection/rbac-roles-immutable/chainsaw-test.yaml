apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: protect-rbac-roles-blocks-same-ns
spec:
  description: |
    cluster-protect-security/protect-rbac: a SA in a tenant ns
    cannot CRUD Roles/RoleBindings in that ns. External callers
    (deployer, cluster-admin) manage RBAC during install — same-ns
    code cannot self-elevate.

    To exercise the KYVERNO rule (not K8s built-in RBAC escalation
    prevention), the attacker SA must already hold the permission
    being delegated. Setup grants attacker configmaps.get + roles.*;
    attacker then creates a Role granting configmaps.get. K8s
    escalation check passes (attacker holds configmaps.get).
    Kyverno's protect-rbac fires because the create is a Role write
    by a same-ns SA.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-trp-rbac
  steps:
    - name: create-tenant-ns-via-deployer
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create namespace "$TENANT_NS" --as=system:serviceaccount:infra:tenant-deployer
    - name: assert-sycophant-mutate-stamped-labels
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: ($tenant_ns)
                labels:
                  app.kubernetes.io/part-of: sycophant-tenant
    - name: setup-attacker-sa-and-rbac
      try:
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: attacker
                namespace: ($tenant_ns)
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: attacker-can-write
                namespace: ($tenant_ns)
              rules:
                - apiGroups: ["rbac.authorization.k8s.io"]
                  resources: ["roles", "rolebindings"]
                  verbs: ["create", "update", "delete", "get", "list", "patch"]
                - apiGroups: [""]
                  resources: ["configmaps"]
                  verbs: ["get"]
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: attacker-can-write
                namespace: ($tenant_ns)
              subjects:
                - kind: ServiceAccount
                  name: attacker
                  namespace: ($tenant_ns)
              roleRef:
                kind: Role
                name: attacker-can-write
                apiGroup: rbac.authorization.k8s.io
    - name: attacker-attempts-write
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl apply --as="system:serviceaccount:${TENANT_NS}:attacker" -n "$TENANT_NS" -f -
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: attacker-self-elevate
              rules:
                - apiGroups: [""]
                  resources: ["configmaps"]
                  verbs: ["get"]
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-protect-security')): true
      catch:
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
