apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: protect-workspace-sa-blocks-same-ns
spec:
  description: |
    cluster-protect-security/protect-workspace-service-accounts: a
    SA in a tenant ns cannot CRUD workspace SAs (matched by
    sycophant.md/type=workspace-sa label). Workspace SAs are chart-rendered
    and carry the workspace's identity; tenant code minting its own
    workspace-typed SA could impersonate a workspace and escalate.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: seed-attacker-principal
      use:
        template: ../../step-templates/attacker-principal.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
            - name: principal_name
              value: attacker
            - name: rules
              value:
                - apiGroups: [""]
                  resources: ["serviceaccounts"]
                  verbs: ["create", "update", "delete", "get", "list", "patch"]
    - name: attacker-attempts-write
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl apply --as="system:serviceaccount:${TENANT_NS}:attacker" -n "$TENANT_NS" -f -
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: attacker-workspace-sa
                labels:
                  sycophant.md/type: workspace-sa
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-protect-security')): true
      catch:
        - events:
            namespace: ($tenant_ns)
