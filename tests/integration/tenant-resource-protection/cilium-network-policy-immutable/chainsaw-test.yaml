apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: protect-cilium-network-policy-blocks-same-ns
spec:
  description: |
    cluster-protect-security/protect-cilium-network-policy: a SA in
    a tenant ns cannot CRUD a CiliumNetworkPolicy in that same ns.
    Same pattern as network-policy-immutable but targets Cilium's
    richer L7 policy CRD. Test depends on Cilium CRDs being installed
    on the cluster.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-trp-cnp
  steps:
    - name: create-tenant-ns
      try:
        - apply:
            file: ../../fixtures/tenant-namespace.yaml
            template: true
    - name: setup-attacker-sa-and-rbac
      try:
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: attacker
                namespace: ($tenant_ns)
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: attacker-can-write
                namespace: ($tenant_ns)
              rules:
                - apiGroups: ["cilium.io"]
                  resources: ["ciliumnetworkpolicies"]
                  verbs: ["create", "update", "delete", "get", "list", "patch"]
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: attacker-can-write
                namespace: ($tenant_ns)
              subjects:
                - kind: ServiceAccount
                  name: attacker
                  namespace: ($tenant_ns)
              roleRef:
                kind: Role
                name: attacker-can-write
                apiGroup: rbac.authorization.k8s.io
    - name: attacker-attempts-write
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl apply --as="system:serviceaccount:${TENANT_NS}:attacker" -n "$TENANT_NS" -f -
              apiVersion: cilium.io/v2
              kind: CiliumNetworkPolicy
              metadata:
                name: attacker-cnp
              spec:
                endpointSelector: {}
                egress:
                  - toEndpoints:
                      - {}
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-protect-security')): true
      catch:
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
