apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: protect-cilium-network-policy-blocks-same-ns
spec:
  description: |
    cluster-protect-security/protect-cilium-network-policy: a SA in
    a tenant ns cannot CRUD a CiliumNetworkPolicy in that same ns.
    Same pattern as network-policy-immutable but targets Cilium's
    richer L7 policy CRD. Test depends on Cilium CRDs being installed
    on the cluster.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: seed-attacker-principal
      use:
        template: ../../step-templates/attacker-principal.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
            - name: principal_name
              value: attacker
            - name: rules
              value:
                - apiGroups: ["cilium.io"]
                  resources: ["ciliumnetworkpolicies"]
                  verbs: ["create", "update", "delete", "get", "list", "patch"]
    - name: attacker-attempts-write
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl apply --as="system:serviceaccount:${TENANT_NS}:attacker" -n "$TENANT_NS" -f -
              apiVersion: cilium.io/v2
              kind: CiliumNetworkPolicy
              metadata:
                name: attacker-cnp
              spec:
                endpointSelector: {}
                egress:
                  - toEndpoints:
                      - {}
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-protect-security')): true
      catch:
        - events:
            namespace: ($tenant_ns)
