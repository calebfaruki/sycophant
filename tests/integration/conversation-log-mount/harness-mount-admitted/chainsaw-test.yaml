apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: harness-conversation-log-mount-admitted
spec:
  description: |
    Positive case for the conversation-log-mount VAP: a harness pod
    (component=harness) mounting a conversation-data-* PVC is admitted, so
    the guard does not break the legit mount. Admission-only — the PVC need not
    exist; the pod stays Pending (unschedulable without the PVC), which is fine:
    we assert only that admission created it.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
    - name: target_namespace
      value: ($tenant_ns)
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: harness-pod-admitted
      try:
        - apply:
            file: ../../fixtures/harness-conversation-mount.yaml
            template: true
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: harness-log-mounter
                namespace: ($tenant_ns)
      catch:
        - events:
            namespace: ($tenant_ns)
