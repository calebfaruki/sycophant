apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: harness-egress-reaches-warm-service
spec:
  description: |
    For a local model call the harness reaches the warm model ClusterIP Service
    itself, with no per-call job in the path. Its per-workspace egress policy
    (`harness-egress-<ws>`) must therefore open a hole to the warm model pod.
    Today that CNP has egress to this workspace's capability-job pods on 9090
    and to relay-ctrl, but names `component=inference` nowhere, so this is red
    until the local-dial egress is added.

    This bucket asserts the harness egress CNP opens egress to a same-tenant
    `component=inference` endpoint. Name-agnostic on the port literal (the warm
    Service port is derived from the profile `baseUrl`), pinned on the peer the
    harness is allowed to dial. It does NOT assert any egress to an external
    provider from the harness: a local call reaches only the in-cluster warm
    Service, and a remote provider is reached only through the inference-runtime
    job, never the harness.

    Pure chart-render assertion: renders `harness-netpol.yaml` for one workspace
    and checks the rendered CNP structurally, mirroring
    `tool-dispatch-direction/harness-egress-flips-to-tool-pod`.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-inference-egress
  steps:
    - name: render-and-assert-harness-egress-to-warm-service
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              REPO_ROOT=$(git rev-parse --show-toplevel)
              render=$(mktemp)
              helm template "$TENANT_NS" "$REPO_ROOT/charts/sycophant-tenant" \
                --show-only templates/harness-netpol.yaml \
                --set 'workspaces.probe.storage=1Gi' \
                -n "$TENANT_NS" > "$render"

              python3 - "$render" <<'PY'
              import sys, yaml
              docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
              cnp = next(
                  d for d in docs
                  if d.get("kind") == "CiliumNetworkPolicy"
                  and d.get("metadata", {}).get("name") == "harness-egress-probe"
              )
              spec = cnp["spec"]

              COMP = "app.kubernetes.io/component"
              PART = "app.kubernetes.io/part-of"

              reaches_warm = any(
                  (e.get("matchLabels", {}) or {}).get(COMP) == "inference"
                  and (e.get("matchLabels", {}) or {}).get(PART) == "sycophant"
                  for rule in spec.get("egress", []) or []
                  for e in rule.get("toEndpoints", []) or []
              )
              assert reaches_warm, \
                  "the harness egress policy must open a hole to the warm model pod " \
                  "(component=inference); the harness dials it directly for a local call"
              print("OK")
              PY
