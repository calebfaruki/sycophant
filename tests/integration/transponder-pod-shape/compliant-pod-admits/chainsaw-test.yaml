apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: transponder-pod-admits-cleanly
spec:
  description: |
    Happy path. Tenant ns is created by the tenant-deployer SA — real
    production path. Sycophant's mutate stamps PSA labels; sycophant's
    generate produces the per-tenant VAPBinding. THEN a transponder-labeled
    pod with runtimeClassName=gvisor and a hardened security context
    admits cleanly.

    Guards against accidentally tightening PSA/VAP so hard that
    legitimate transponder pods can't run. Fixture asymmetry: the ns is created
    unlabeled and mutate must stamp it; the VAPBinding must be generated
    or the VAP would not fire (silent admit antipattern). Both assertions
    are explicit before the workload submits.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-wps-compliant
    - name: target_namespace
      value: tenant-chainsaw-wps-compliant
  steps:
    - name: create-tenant-ns-via-deployer
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create namespace "$TENANT_NS" --as=system:serviceaccount:infra:tenant-deployer
    - name: assert-sycophant-mutate-stamped-labels
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: ($tenant_ns)
                labels:
                  app.kubernetes.io/part-of: sycophant-tenant
                  pod-security.kubernetes.io/enforce: restricted
    - name: assert-sycophant-generated-vapbinding
      try:
        - assert:
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingAdmissionPolicyBinding
              metadata:
                name: (join('-', [$tenant_ns, 'sycophant-pod-binding']))
    - name: wait-for-vap-cache-refresh
      try:
        - sleep:
            duration: 5s
    - name: apply-transponder-pod
      try:
        - apply:
            file: ../../fixtures/transponder-pod-good.yaml
            template: true
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: transponder-good
                namespace: ($tenant_ns)
              spec:
                runtimeClassName: gvisor
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
            name: transponder-good
            namespace: ($tenant_ns)
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
