apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vap-rejects-transponder-missing-seccomp
spec:
  description: |
    Transponder VAP rule: every container must have
    `securityContext.seccompProfile.type` set to RuntimeDefault or Localhost,
    either per-container or via pod-level fallback.

    PSS-restricted permits Undefined/nil for seccompProfile.type — so PSS is
    NOT a backstop. The chart's transponder template sets pod-level
    seccompProfile.type=RuntimeDefault. This rule blocks manually crafted
    transponder pods that omit seccompProfile or set it to Unconfined.

    Tenant ns is created via the tenant-deployer SA (real production path).
    Sycophant's mutate stamps PSA labels; sycophant's generate produces the
    per-tenant VAPBinding — both verified explicitly before pod submission.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-wps-no-seccomp
    - name: target_namespace
      value: tenant-chainsaw-wps-no-seccomp
  steps:
    - name: create-tenant-ns-via-deployer
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create namespace "$TENANT_NS" --as=system:serviceaccount:infra:tenant-deployer
    - name: assert-sycophant-mutate-stamped-labels
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: ($tenant_ns)
                labels:
                  app.kubernetes.io/part-of: sycophant-tenant
                  pod-security.kubernetes.io/enforce: restricted
    - name: assert-sycophant-generated-vapbinding
      try:
        - assert:
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingAdmissionPolicyBinding
              metadata:
                name: (join('-', [$tenant_ns, 'sycophant-pod-binding']))
    - name: wait-for-vap-cache-refresh
      try:
        - sleep:
            duration: 5s
    - name: apply-transponder-missing-seccomp
      try:
        - create:
            file: ../../fixtures/transponder-pod-missing-seccomp.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'seccompProfile.type')): true
      catch:
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
