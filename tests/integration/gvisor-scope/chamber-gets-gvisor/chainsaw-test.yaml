apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: chamber-pod-gets-gvisor
spec:
  description: |
    Proves the gVisor narrowing kept chambers sandboxed. A chamber pod
    (component=airlock-job) submits with NO runtimeClassName; the
    cluster-runtime-class mutate MUST stamp runtimeClassName=gvisor and the
    VAP MUST admit it. The companion harness test proves the inverse —
    harness/llm-job/channel now admit on the default runtime. Together
    they pin the scope to "chambers only".

    The tenant ns is created and the test applies the perimeter labels; the
    label-triggered generate rule produces the per-tenant VAPBinding before the
    workload submits.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-gvisor-chamber
    - name: target_namespace
      value: tenant-chainsaw-gvisor-chamber
  steps:
    - name: create-tenant-ns
      try:
        - apply:
            file: ../../fixtures/tenant-namespace.yaml
            template: true
    - name: assert-sycophant-generated-vapbinding
      try:
        - assert:
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingAdmissionPolicyBinding
              metadata:
                name: (join('-', [$tenant_ns, 'sycophant-pod-binding']))
    - name: wait-for-vap-cache-refresh
      try:
        - sleep:
            duration: 5s
    - name: apply-chamber-pod
      try:
        - apply:
            file: ../../fixtures/airlock-job-pod-good.yaml
            template: true
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: airlock-job-good
                namespace: ($tenant_ns)
              spec:
                # The mutate stamped gvisor; the VAP admitted it. Chambers
                # stay sandboxed.
                runtimeClassName: gvisor
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
            name: airlock-job-good
            namespace: ($tenant_ns)
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
