apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: arbitrary-sa-cannot-create-llm-job
spec:
  description: |
    A SA that is not hangar-ctrl (and not bound to cluster-admin
    or cluster-chart-admin) cannot create Jobs with the llm-job
    component label. This is the LLM-dispatch invariant: only the
    framework-installed hangar-ctrl can dispatch LLM jobs.

    Counterpart to hangar-ctrl-creates-llm-job (admit).
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-jca-arb-llm
    - name: actor_sa
      value: attacker
    - name: job_component
      value: llm-job
  steps:
    - name: create-tenant-ns
      try:
        - apply:
            file: ../../fixtures/tenant-namespace.yaml
            template: true
    - name: setup-actor-sa-with-job-rbac
      try:
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: ($actor_sa)
                namespace: ($tenant_ns)
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: (join('-', [$actor_sa, 'can-create-jobs']))
                namespace: ($tenant_ns)
              rules:
                - apiGroups: ["batch"]
                  resources: ["jobs"]
                  verbs: ["create", "get", "list", "delete"]
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: (join('-', [$actor_sa, 'can-create-jobs']))
                namespace: ($tenant_ns)
              subjects:
                - kind: ServiceAccount
                  name: ($actor_sa)
                  namespace: ($tenant_ns)
              roleRef:
                kind: Role
                name: (join('-', [$actor_sa, 'can-create-jobs']))
                apiGroup: rbac.authorization.k8s.io
    - name: actor-creates-labeled-job
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
              - name: ACTOR_SA
                value: ($actor_sa)
              - name: JOB_COMPONENT
                value: ($job_component)
            content: |
              cat <<MANIFEST | kubectl apply --as="system:serviceaccount:${TENANT_NS}:${ACTOR_SA}" -n "$TENANT_NS" -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: probe-job
                labels:
                  app.kubernetes.io/component: ${JOB_COMPONENT}
              spec:
                template:
                  spec:
                    restartPolicy: Never
                    containers:
                      - name: probe
                        image: registry.k8s.io/pause:3.9
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'Only the hangar controller can create jobs with')): true
      catch:
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
