apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: prompt-profile-secret-optional
spec:
  description: |
    A prompt profile declares six keys and no more. `secret` is the one of them
    an operator may leave out: a profile whose `baseUrl` names an
    unauthenticated destination has no credential, and requiring one would force
    a meaningless Kubernetes Secret into the tenant namespace to satisfy a
    schema.

    The values schema is the first of the two gates on that shape — the
    controller's own parse is the second. It runs offline at `helm upgrade`,
    before any pod is scheduled, which is where an operator finds out about a
    typo'd profile rather than watching a prompt Job wedge on a volume the
    kubelet can never populate.

    The reject arm is not decoration. `secret` becoming optional must not be
    bought by loosening the profile object: the seventh key is still a hard
    reject, and a schema that accepts everything passes an accept-only suite.
  steps:
    - name: assert-a-profile-with-a-secret-still-renders
      try:
        - script:
            content: |
              REPO_ROOT=$(git rev-parse --show-toplevel)
              out=$(helm template probe "$REPO_ROOT/charts/sycophant-tenant" -n probe-ns \
                --show-only templates/toolset-config.yaml \
                --set-json 'prompt={"profiles":{"deepseek-v4-flash":{"image":"prompt-toolset:local","format":"openai","model":"deepseek/deepseek-v4-flash","baseUrl":"https://openrouter.ai/api/v1","secret":"sycophant-llm-openrouter","egress":[{"domain":"openrouter.ai","port":443}]}}}' 2>&1)
              rc=$?
              [ "$rc" -eq 0 ] \
                || { echo "a profile declaring a secret keeps its current behavior"; printf '%s\n' "$out" >&2; exit 1; }
              printf '%s' "$out" | grep -q 'secret: sycophant-llm-openrouter' \
                || { echo "the declared secret must reach the controller's config"; printf '%s\n' "$out" >&2; exit 1; }
              true
    - name: assert-a-seventh-profile-key-is-still-rejected
      try:
        - script:
            content: |
              REPO_ROOT=$(git rev-parse --show-toplevel)
              reject() {
                label=$1
                values=$2
                needle=$3
                err=$(helm template probe "$REPO_ROOT/charts/sycophant-tenant" -n probe-ns \
                  --set-json "prompt=$values" 2>&1)
                rc=$?
                [ "$rc" -ne 0 ] \
                  || { echo "$label must fail schema validation, got rc=0"; printf '%s\n' "$err" >&2; return 1; }
                printf '%s' "$err" | grep -q -- "$needle" \
                  || { echo "$label must be refused by name; the error never says '$needle'"; printf '%s\n' "$err" >&2; return 1; }
                return 0
              }

              reject "a seventh profile key" \
                '{"profiles":{"local":{"image":"i","format":"openai","model":"m","baseUrl":"http://x","secret":"s","maxTokens":4096}}}' \
                'maxTokens' || exit 1
              reject "a typo on the secret key" \
                '{"profiles":{"local":{"image":"i","format":"openai","model":"m","baseUrl":"http://x","secrets":"s"}}}' \
                'secrets' || exit 1
              reject "a profile with no baseUrl" \
                '{"profiles":{"local":{"image":"i","format":"openai","model":"m","secret":"s"}}}' \
                'baseUrl' || exit 1
              reject "a profile with no image" \
                '{"profiles":{"local":{"format":"openai","model":"m","baseUrl":"http://x"}}}' \
                'image' || exit 1
              true
    - name: assert-a-profile-without-a-secret-renders
      try:
        - script:
            content: |
              REPO_ROOT=$(git rev-parse --show-toplevel)
              out=$(helm template probe "$REPO_ROOT/charts/sycophant-tenant" -n probe-ns \
                --show-only templates/toolset-config.yaml \
                --set-json 'prompt={"profiles":{"local":{"image":"prompt-toolset:local","format":"openai","model":"liquid/lfm2.5-8b-a1b","baseUrl":"http://inference-local:8080/v1"}}}' 2>&1)
              rc=$?
              [ "$rc" -eq 0 ] \
                || { echo "a profile naming an unauthenticated destination declares no secret and must render"; printf '%s\n' "$out" >&2; exit 1; }

              # The controller reads this ConfigMap, so the profile must survive
              # the render, not merely pass the schema.
              printf '%s' "$out" | grep -q 'baseUrl: http://inference-local:8080/v1' \
                || { echo "the rendered prompt config must carry the profile"; printf '%s\n' "$out" >&2; exit 1; }
              printf '%s' "$out" | grep -q 'secret:' \
                && { echo "an omitted secret must stay omitted, never defaulted into a Secret name the controller would mount"; printf '%s\n' "$out" >&2; exit 1; }
              true
