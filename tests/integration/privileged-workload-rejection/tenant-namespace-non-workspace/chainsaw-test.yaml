apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: psa-rejects-privileged-tenant-ns-no-workspace-label
spec:
  description: |
    Load-bearing orthogonality test. The tenant namespace is created via
    the tenant-deployer SA (the real production path), so sycophant's
    mutate rule stamps PSA labels and the generate rule produces the
    per-tenant VAPBinding. THEN a privileged pod with NO workspace label
    is submitted: PSA must reject; the workspace VAP must not fire.

    Fixture asymmetry: PSA labels are NOT in the namespace creation
    arguments. The deployer's `kubectl create namespace` lands an
    unlabeled ns; sycophant's mutate rule is the only thing that can
    stamp the labels. Delete the mutate rule and the label assertion
    fails. Delete the VAPBinding generate rule and the assertion on
    its existence fails. Delete PSA enforcement and the pod admits.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-pwr-non-workspace
    - name: target_namespace
      value: tenant-chainsaw-pwr-non-workspace
  steps:
    - name: create-tenant-ns-via-deployer
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create namespace "$TENANT_NS" --as=system:serviceaccount:infra:tenant-deployer
    - name: assert-sycophant-mutate-stamped-labels
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: ($tenant_ns)
                labels:
                  app.kubernetes.io/part-of: sycophant-tenant
                  pod-security.kubernetes.io/enforce: restricted
    - name: assert-sycophant-generated-vapbinding
      try:
        - assert:
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingAdmissionPolicyBinding
              metadata:
                name: (join('-', [$tenant_ns, 'workspace-pod-binding']))
    - name: apply-privileged-pod-no-workspace-label
      try:
        - apply:
            file: ../../fixtures/privileged-pod.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'violates PodSecurity "restricted')): true
                  (contains($error, 'cluster-workspace-pod-policy')): false
      catch:
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
