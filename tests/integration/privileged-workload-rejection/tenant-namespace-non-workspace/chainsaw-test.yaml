apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: psa-rejects-privileged-tenant-ns-no-workspace-label
spec:
  description: |
    Load-bearing orthogonality test. The tenant namespace is created via
    the tenant-deployer SA (the real production path); the test applies the
    perimeter labels (part-of + PSA) and the label-triggered generate rule
    produces the per-tenant VAPBinding. THEN a privileged pod with NO workspace label
    is submitted: PSA must reject; the workspace VAP must not fire.

    The test applies the perimeter labels itself (there is no auto-labelling
    mutate). Delete the VAPBinding generate rule and the assertion on its
    existence fails; delete PSA enforcement and the privileged pod admits.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-pwr-non-workspace
    - name: target_namespace
      value: tenant-chainsaw-pwr-non-workspace
  steps:
    - name: create-tenant-ns
      try:
        - apply:
            file: ../../fixtures/tenant-namespace.yaml
            template: true
    - name: assert-sycophant-generated-vapbinding
      try:
        - assert:
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingAdmissionPolicyBinding
              metadata:
                name: (join('-', [$tenant_ns, 'sycophant-pod-binding']))
    - name: apply-privileged-pod-no-workspace-label
      try:
        - apply:
            file: ../../fixtures/privileged-pod.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'violates PodSecurity "restricted')): true
                  (contains($error, 'cluster-gvisor-pod-policy')): false
      catch:
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
