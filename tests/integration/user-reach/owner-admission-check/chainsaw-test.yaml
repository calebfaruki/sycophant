apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: owner-admission-check
spec:
  description: >
    The owner recorded in the namespace's sycophant.md/owner annotation is the
    only issuer-prefixed identity that may write tenant-namespace commands.
    A non-owner with ConfigMap create RBAC is denied by the VAP.
  timeouts:
    exec: 120s
    assert: 60s
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns-with-owner
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              . ../../../self-service/lib.sh
              OWNER=$(user operator)
              cat <<EOF | kubectl apply -f -
              apiVersion: v1
              kind: Namespace
              metadata:
                name: $TENANT_NS
                labels:
                  app.kubernetes.io/part-of: sycophant-tenant
                  pod-security.kubernetes.io/enforce: restricted
                  pod-security.kubernetes.io/enforce-version: latest
                  pod-security.kubernetes.io/warn: restricted
                  pod-security.kubernetes.io/audit: restricted
                  sycophant.md/owner: "$(owner_hash "$OWNER")"
                annotations:
                  sycophant.md/owner: "$OWNER"
              EOF
      cleanup:
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: ($tenant_ns)
    - name: grant-owner-and-nonowner-write
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              ISSUER=$(helm get values sycophant -n sycophant-system --all -o json | jq -r .idp.issuer)
              # Owner gets configmap create
              kubectl create role owner-writer -n "$TENANT_NS" --verb=create --resource=configmaps
              kubectl create rolebinding owner-writer -n "$TENANT_NS" --role=owner-writer --user="${ISSUER}#operator"
              # Non-owner also gets configmap create
              kubectl create rolebinding nonowner-writer -n "$TENANT_NS" --role=owner-writer --user="${ISSUER}#mallory"
      cleanup:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl delete rolebinding,role owner-writer nonowner-writer -n "$TENANT_NS" --ignore-not-found
    - name: owner-writes-an-agent-command
      try:
        - script:
            timeout: 30s
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              . ../../../self-service/lib.sh
              labelled_command provision-agent ownertest toolsets=stdlib model=a \
                | kubectl create -n "$TENANT_NS" --as="$(user operator)" -f - >/dev/null
              kubectl delete configmap "provision-agent-$(hex10 ownertest)" -n "$TENANT_NS" --ignore-not-found >/dev/null
              true
    - name: nonowner-denied-agent-and-instructions-commands
      try:
        - script:
            timeout: 30s
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              . ../../../self-service/lib.sh
              labelled_command provision-agent mallorytest toolsets=stdlib model=a \
                | refused "tenant owner" "non-owner mallory's provision-agent command" \
                    kubectl create -n "$TENANT_NS" --as="$(user mallory)" -f -
              labelled_command provision-instructions mallorytest archive=eA== \
                | refused "tenant owner" "non-owner mallory's provision-instructions command" \
                    kubectl create -n "$TENANT_NS" --as="$(user mallory)" -f -
              labelled_command reap-instructions mallorytest \
                | refused "tenant owner" "non-owner mallory's reap-instructions command" \
                    kubectl create -n "$TENANT_NS" --as="$(user mallory)" -f -
              true
