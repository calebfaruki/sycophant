apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: provision-tenant-command-materializes-installer
spec:
  # A real install, so it runs alone.
  concurrent: false
  timeouts:
    assert: 120s
  description: An admitted tenant provision command materializes the installer ServiceAccount, Job, Role, and RoleBindings named from the command uid. The ServiceAccount, Role and both RoleBindings carry cleanup.kyverno.io/ttl 30m, the tenant namespace carries the sycophant.md/tenant-data finalizer, and the Job deletes the command once the install succeeds.
  bindings:
    - name: token
      value: (random('[a-z0-9]{8}'))
  steps:
    - name: preflight-kyverno-ready
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kyverno-background-controller
                namespace: kyverno
              status:
                (readyReplicas > `0`): true
        - assert:
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: GeneratingPolicy
              metadata:
                name: provision-tenant-stack
              status:
                conditionStatus:
                  ready: true
        - assert:
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: GeneratingPolicy
              metadata:
                name: provision-tenant-grant
              status:
                conditionStatus:
                  ready: true
    - name: grant-command-write
      use:
        template: ../../step-templates/command-writer.yaml
        with:
          bindings:
            - name: command_ns
              value: sycophant-system
    - name: write-provision-command-and-assert-installer-set
      try:
        - script:
            timeout: 300s
            env:
              - name: TOKEN
                value: ($token)
            content: |
              . ../../../self-service/lib.sh
              OWNER=$(user operator)
              T=$(tenant_hash "$OWNER" "$TOKEN")
              # With self-service on, a sender other than the operator needs an entitlement record.
              if [ "$(helm get values sycophant -n sycophant-system --all -o json | jq -r '.selfService.enabled')" = true ]; then
                kubectl create configmap "$T" -n sycophant-entitlements --from-literal=owner="$OWNER" >/dev/null
              fi
              UID_=$(tenant_command "$TOKEN" "$OWNER" | kubectl create --as="$OWNER" -f - -o jsonpath='{.metadata.uid}')
              NAME=$(installer_for "$UID_")
              TENANT="tenant-$T"
              for i in $(seq 1 60); do
                kubectl get serviceaccount,job "$NAME" -n sycophant-system >/dev/null 2>&1 \
                  && kubectl get rolebinding "$NAME" -n "$TENANT" >/dev/null 2>&1 \
                  && kubectl get role,rolebinding "$NAME" -n sycophant-system >/dev/null 2>&1 && break
                sleep 2
              done
              for obj in "serviceaccount $NAME -n sycophant-system" "job $NAME -n sycophant-system" \
                  "rolebinding $NAME -n $TENANT" "role $NAME -n sycophant-system" "rolebinding $NAME -n sycophant-system"; do
                ttl=$(kubectl get $obj -o jsonpath='{.metadata.labels.cleanup\.kyverno\.io/ttl}') || { echo "$obj missing"; exit 1; }
                [ "${obj%% *}" = job ] || [ "$ttl" = 30m ] \
                  || { echo "$obj does not carry cleanup.kyverno.io/ttl=30m"; exit 1; }
              done
              kubectl get namespace "$TENANT" -o json \
                | jq -e '(.metadata.finalizers // []) | index("sycophant.md/tenant-data") != null' >/dev/null \
                || { echo "$TENANT does not carry the sycophant.md/tenant-data finalizer"; exit 1; }
              wait_job_succeeded "$NAME"
              kubectl get configmap "provision-tenant-$T" -n sycophant-system >/dev/null 2>&1 \
                && { echo "the provision command survived a successful install"; exit 1; }
              true
      cleanup:
        - script:
            env:
              - name: TOKEN
                value: ($token)
            content: |
              . ../../../self-service/lib.sh
              T=$(tenant_hash "$(user operator)" "$TOKEN")
              NAME=$(kubectl get rolebinding -n "tenant-$T" -l app.kubernetes.io/component=provision-tenant \
                -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              if [ -n "$NAME" ]; then
                kubectl delete serviceaccount,job,role,rolebinding "$NAME" -n sycophant-system --ignore-not-found
              fi
              drop_tenant "$T"
