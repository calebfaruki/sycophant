apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: baseline-dns-allowlist
spec:
  description: |
    The chart ships one fail-closed egress baseline — `capability-job-baseline`
    — selecting every toolset job pod (tool toolsets and per-provider prompt
    toolsets both ride the `app.kubernetes.io/component=capability-job` floor). It
    allows ONLY the universal minimum: kube-dns:53 with an L7 `rules.dns`
    allowlist pinned to the controller's own FQDN, plus :9090 to the controller
    service. A pod with no operator-applied content CNP is therefore denied all
    external egress (fail-closed), regardless of how it was created.

    After the tool-dispatch-direction flip the harness dials the pod, so the pod
    never dials the harness: the `harness-*` DNS pattern and the harness:9090
    egress rule are gone from the floor, while the toolset-ctrl DNS name and
    toolset-ctrl:9090 rule stay (prompt and discovery jobs genuinely dial the
    controller).

    The load-bearing assertion is that the baseline's kube-dns:53 rule carries
    `rules.dns` (it is NOT L4-only). Cilium's documented L4-shadows-L7 merge
    semantics (verified empirically on 1.19.3) mean an L4-only kube-dns rule
    nullifies a sibling policy's L7 DNS allowlist — so if the baseline ever
    regressed to L4-only, the operator-applied content CNPs' DNS allowlists would
    be silently nullified and DNS-tunnel exfil reopened. This bucket catches that.

    Self-applies the baseline template via `helm template --show-only` into a
    chainsaw-managed namespace so it runs standalone (not coupled to
    scripts/e2e.sh having installed the tenant chart). The live DNS-probe is out
    of scope here — it would test Cilium, not sycophant (the e2e covers it).
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-baseline
  steps:
    - name: create-tenant-ns-and-apply-baseline
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -e
              kubectl create namespace "$TENANT_NS" --as=system:serviceaccount:sycophant-system:tenant-deployer
              REPO_ROOT=$(git rev-parse --show-toplevel)
              helm template "$TENANT_NS" "$REPO_ROOT/charts/sycophant-tenant" \
                --show-only templates/capability-job-baseline-netpol.yaml \
                -n "$TENANT_NS" \
                | kubectl apply -f -
    - name: assert-capability-job-baseline-shape
      try:
        - assert:
            resource:
              apiVersion: cilium.io/v2
              kind: CiliumNetworkPolicy
              metadata:
                name: capability-job-baseline
                namespace: ($tenant_ns)
              spec:
                endpointSelector:
                  matchLabels:
                    app.kubernetes.io/component: capability-job
                    app.kubernetes.io/part-of: sycophant
                (egress[?toEndpoints[?matchLabels."k8s-app"=='kube-dns']]):
                  - toPorts:
                      - ports:
                          - port: "53"
                            protocol: UDP
                          - port: "53"
                            protocol: TCP
                        rules:
                          dns:
                            (contains(@[*].matchName, join('.', ['toolset-ctrl', $tenant_ns, 'svc.cluster.local']))): true
                            # After the dispatch-direction flip, capability-job
                            # pods no longer dial the harness, so the harness DNS
                            # pattern is gone from the floor.
                            (contains(@[*].matchPattern, join('.', ['harness-*', $tenant_ns, 'svc.cluster.local']))): false
                (egress[?toEndpoints[?matchLabels."app.kubernetes.io/component"=='toolset-ctrl']]):
                  - toPorts:
                      - ports:
                          - port: "9090"
                            protocol: TCP
                # No harness:9090 egress rule remains on the floor: the pod is a
                # server the harness dials, never a client that dials the harness.
                (length(egress[?toEndpoints[?matchLabels."app.kubernetes.io/component"=='harness']])): 0
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
