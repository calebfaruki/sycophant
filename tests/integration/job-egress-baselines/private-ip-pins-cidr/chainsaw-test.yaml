apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: private-ip-pins-cidr
spec:
  description: |
    The `syco`-authored `llm-job-egress` union CNP pins a private/loopback-IP
    provider (e.g. a host-local Ollama reached via the Docker Desktop gateway) by
    `toCIDR <ip>/32` on the base URL's port — NOT by `toFQDNs`/DNS. A private IP is
    reached directly, so it must be absent from both the kube-dns L7 `rules.dns`
    allowlist and any `toFQDNs` block, and the policy must carry no catch-all.

    The canonical builder logic is unit-tested in `cli/src/cnp.rs`
    (`build_llm_egress_cnp_yaml` + `endpoint_union`); this bucket asserts the
    emitted shape applies to a live cluster and guards the operator-facing security
    property. Mirrors how `scripts/e2e.sh` hand-applies the externally-authored
    union CNP — it is not a chart template, so there is nothing to `helm template`.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-private-ip-egress
  steps:
    - name: create-ns-and-apply-private-ip-union
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -e
              kubectl create namespace "$TENANT_NS" --as=system:serviceaccount:sycophant-system:tenant-deployer
              cat <<EOF | kubectl apply -f -
              apiVersion: cilium.io/v2
              kind: CiliumNetworkPolicy
              metadata:
                name: llm-job-egress
                namespace: $TENANT_NS
                labels:
                  app.kubernetes.io/part-of: sycophant
              spec:
                endpointSelector:
                  matchLabels:
                    app.kubernetes.io/component: llm-job
                egress:
                  - toEndpoints:
                      - matchLabels:
                          io.kubernetes.pod.namespace: kube-system
                          k8s-app: kube-dns
                    toPorts:
                      - ports:
                          - port: "53"
                            protocol: UDP
                          - port: "53"
                            protocol: TCP
                        rules:
                          dns:
                            - matchName: hangar-ctrl.$TENANT_NS.svc.cluster.local
                  - toEndpoints:
                      - matchLabels:
                          app.kubernetes.io/name: hangar-ctrl
                    toPorts:
                      - ports:
                          - port: "9090"
                            protocol: TCP
                  - toCIDR:
                      - 192.168.65.254/32
                    toPorts:
                      - ports:
                          - port: "11434"
                            protocol: TCP
              EOF
    - name: assert-private-ip-pinned-by-cidr-not-fqdn
      try:
        - assert:
            resource:
              apiVersion: cilium.io/v2
              kind: CiliumNetworkPolicy
              metadata:
                name: llm-job-egress
                namespace: ($tenant_ns)
              spec:
                endpointSelector:
                  matchLabels:
                    app.kubernetes.io/component: llm-job
                # ALLOW: the private provider is pinned by toCIDR /32 on its port.
                (egress[?toCIDR] | [0].toCIDR):
                  - 192.168.65.254/32
                (egress[?toCIDR] | [0].toPorts[0].ports[0].port): "11434"
                (egress[?toCIDR] | [0].toPorts[0].ports[0].protocol): TCP
                # DENY: no DNS-based provider hole for a private IP, and no catch-all.
                (length(egress[?toFQDNs])): 0
                (length(egress[?toEntities])): 0
                # DENY: the private IP must not leak into the kube-dns L7 allowlist.
                (contains(egress[?toEndpoints[?matchLabels."k8s-app"=='kube-dns']] | [0].toPorts[0].rules.dns[*].matchName, '192.168.65.254')): false
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
