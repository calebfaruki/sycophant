apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: no-instructions-pv-pvc-or-hostpath
spec:
  description: |
    Instructions content is delivered from object storage: the render carries no
    instructions-* PersistentVolume, no instructions-* PersistentVolumeClaim, and no
    hostPath volume anywhere.
  steps:
    - name: render-and-assert
      try:
        - script:
            content: |
              set -euo pipefail
              REPO_ROOT=$(git rev-parse --show-toplevel)
              render=$(mktemp)
              helm template t "$REPO_ROOT/charts/sycophant-tenant" -n tenant-1 \
                --set-string 'workspaces.research.instructions.prefix=tenant-1/research' \
                > "$render"
              python3 - "$render" <<'PY'
              import sys, yaml
              docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
              def name(d): return (d.get("metadata") or {}).get("name", "")

              pvs = [name(d) for d in docs
                     if d.get("kind") == "PersistentVolume" and name(d).startswith("instructions-")]
              assert not pvs, f"instructions PersistentVolume(s) rendered: {pvs}"

              pvcs = [name(d) for d in docs
                      if d.get("kind") == "PersistentVolumeClaim" and name(d).startswith("instructions-")]
              assert not pvcs, f"instructions PersistentVolumeClaim(s) rendered: {pvcs}"

              # parse volumes, don't substring-match: comments mention "hostPath"
              hp = []
              for d in docs:
                  spec = (((d.get("spec") or {}).get("template") or {}).get("spec")) or {}
                  for v in spec.get("volumes") or []:
                      if "hostPath" in v:
                          hp.append((d.get("kind"), name(d), v.get("name")))
              assert not hp, f"hostPath volume(s) rendered: {hp}"
              PY
