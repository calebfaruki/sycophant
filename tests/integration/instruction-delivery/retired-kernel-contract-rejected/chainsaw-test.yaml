apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: retired-kernel-contract-rejected
spec:
  description: |
    The values schema is closed against the retired PV/hostPath kernel contract:
    harness.kernels.hostPathBase and workspaces.<ws>.kernel.path fail the render,
    while the object-storage kernel.prefix contract renders.
  steps:
    - name: object-storage-key-renders
      try:
        - script:
            content: |
              set -euo pipefail
              REPO_ROOT=$(git rev-parse --show-toplevel)
              helm template t "$REPO_ROOT/charts/sycophant-tenant" -n tenant-1 \
                --set-string 'workspaces.research.kernel.prefix=tenant-1/research' \
                > /dev/null
    - name: hostpathbase-rejected-by-name
      try:
        - script:
            content: |
              set -euo pipefail
              REPO_ROOT=$(git rev-parse --show-toplevel)
              err=$(helm template t "$REPO_ROOT/charts/sycophant-tenant" -n tenant-1 \
                      --set 'harness.kernels.hostPathBase=/var/lib/sycophant/kernels' \
                      2>&1 >/dev/null) && { echo "hostPathBase was accepted"; exit 1; }
              printf '%s\n' "$err" | grep -q "'hostPathBase' not allowed"
    - name: kernel-path-rejected-by-name
      try:
        - script:
            content: |
              set -euo pipefail
              REPO_ROOT=$(git rev-parse --show-toplevel)
              err=$(helm template t "$REPO_ROOT/charts/sycophant-tenant" -n tenant-1 \
                      --set 'workspaces.research.kernel.path=/some/host/dir' \
                      2>&1 >/dev/null) && { echo "kernel.path was accepted"; exit 1; }
              printf '%s\n' "$err" | grep -q "'path' not allowed"
