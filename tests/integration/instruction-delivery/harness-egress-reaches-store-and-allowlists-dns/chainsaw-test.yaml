apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: harness-egress-reaches-store-and-allowlists-dns
spec:
  description: |
    The harness egress CNP carries the object-storage endpoint in both a DNS
    allowlist matchName (host resolves) and an L4 toEndpoints rule to the store
    pod in its namespace on the endpoint port (host is reachable).
  steps:
    - name: render-and-assert
      try:
        - script:
            content: |
              set -euo pipefail
              REPO_ROOT=$(git rev-parse --show-toplevel)
              render=$(mktemp)
              helm template t "$REPO_ROOT/charts/sycophant-tenant" -n tenant-1 \
                --set-string 'workspaces.research.instructions.prefix=tenant-1/research' \
                --set-string 'harness.instructions.endpoint=minio.sycophant-system.svc.cluster.local:9000' \
                > "$render"
              python3 - "$render" <<'PY'
              import sys, yaml
              docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
              HOST, PORT = "minio.sycophant-system.svc.cluster.local", "9000"
              STORE_NS = HOST.split(".")[1]   # chart derives store ns from the endpoint host

              cnps = [d for d in docs if d.get("kind") == "CiliumNetworkPolicy"
                      and (d.get("metadata") or {}).get("name") == "harness-egress-research"]
              assert len(cnps) == 1, f"expected one harness-egress-research CNP, got {len(cnps)}"
              egress = ((cnps[0].get("spec") or {}).get("egress")) or []

              dns = []
              for r in egress:
                  for te in r.get("toEndpoints") or []:
                      if (te.get("matchLabels") or {}).get("k8s-app") == "kube-dns":
                          for tp in r.get("toPorts") or []:
                              dns += [m["matchName"] for m in (tp.get("rules") or {}).get("dns") or [] if m.get("matchName")]
              assert HOST in dns, f"endpoint host not in DNS allowlist matchNames: {dns}"

              def reaches(r):
                  for te in r.get("toEndpoints") or []:
                      ml = te.get("matchLabels") or {}
                      if (ml.get("app.kubernetes.io/component") == "objectstorage"
                              and ml.get("app.kubernetes.io/part-of") == "sycophant"
                              and ml.get("k8s:io.kubernetes.pod.namespace") == STORE_NS):
                          for tp in r.get("toPorts") or []:
                              if any(str(p.get("port")) == PORT for p in tp.get("ports") or []):
                                  return True
                  return False
              assert any(reaches(r) for r in egress), \
                  f"no egress rule reaches the store (component=objectstorage, ns={STORE_NS}, port={PORT})"
              PY
