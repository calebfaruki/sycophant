apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: capability-grants-no-projection-without-grants
spec:
  description: |
    The projection is emitted only for workspaces that declare credential
    grants. The acceptance criterion scopes it to "where a workspace declares
    credential grants"; the downstream gate treats an absent ConfigMap as "no
    approvals". An empty-but-present allowlist for a grantless workspace is a
    different security posture from no allowlist.

    Pure chart-render property. Two workspaces are rendered together: one with a
    grant, one whose only toolset is a bare string (no grants). The set of
    projection objects must be exactly the grant-bearing workspace's -- proving
    both that a grant-bearing workspace projects (red until the template exists)
    and that a grantless workspace does not.

    Mutation guard: dropping the grant-bearing guard so every workspace emits a
    projection makes `capability-grants-plain` appear and fails the exact-set
    assertion; failing to render the grant-bearing workspace's projection fails
    it too.
  steps:
    - name: render-and-assert-only-grant-bearing-projects
      try:
        - script:
            content: |
              set -euo pipefail
              REPO_ROOT=$(git rev-parse --show-toplevel)
              tmp=$(mktemp)
              helm template probe "$REPO_ROOT/charts/sycophant-tenant" -n probe-ns \
                --set-string workspaces.research.toolsets[0].name=notion \
                --set-string workspaces.research.toolsets[0].grants.reader.secret=research-notion-reader \
                --set-string workspaces.plain.toolsets[0]=stdlib \
                > "$tmp"
              python3 - "$tmp" <<'PY'
              import sys, yaml
              docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
              projections = sorted(d["metadata"]["name"] for d in docs
                                   if d.get("kind") == "ConfigMap"
                                   and d["metadata"]["name"].startswith("capability-grants-"))
              assert projections == ["capability-grants-research"], \
                  ("projection set must be exactly the grant-bearing workspace's; "
                   f"got {projections}")
              print("OK")
              PY
