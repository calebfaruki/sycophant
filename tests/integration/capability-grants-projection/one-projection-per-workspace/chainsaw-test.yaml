apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: capability-grants-one-projection-per-workspace
spec:
  description: |
    One projection ConfigMap per workspace, each holding only its own
    workspace's approved Secret names. This is what lets a membership test
    answer "is Secret S approved for workspace W" for exactly that workspace: a
    single merged projection, or one workspace's secrets bleeding into another's
    ConfigMap, would approve a Secret for a workspace the operator never granted
    it to.

    Pure chart-render property. Two workspaces each declare a distinct grant;
    the render must yield two separately named ConfigMaps with disjoint keys.

    Mutation guard: collapsing the per-workspace `range` into a single ConfigMap
    fails the two-object assertion; failing to scope each ConfigMap's data to
    its own workspace fails the disjoint-keys assertion.
  steps:
    - name: render-and-assert-per-workspace-isolation
      try:
        - script:
            content: |
              set -euo pipefail
              REPO_ROOT=$(git rev-parse --show-toplevel)
              tmp=$(mktemp)
              helm template probe "$REPO_ROOT/charts/sycophant-tenant" -n probe-ns \
                --set-string workspaces.research.toolsets[0].name=notion \
                --set-string workspaces.research.toolsets[0].grants.reader.secret=research-only-secret \
                --set-string workspaces.ops.toolsets[0].name=pager \
                --set-string workspaces.ops.toolsets[0].grants.oncall.secret=ops-only-secret \
                > "$tmp"
              python3 - "$tmp" <<'PY'
              import sys, yaml
              docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
              cms = {d["metadata"]["name"]: d for d in docs
                     if d.get("kind") == "ConfigMap"
                     and d["metadata"]["name"].startswith("capability-grants-")}

              research = cms.get("capability-grants-research")
              ops = cms.get("capability-grants-ops")
              assert research is not None, "capability-grants-research not rendered"
              assert ops is not None, "capability-grants-ops not rendered"

              rkeys = set((research.get("data") or {}).keys())
              okeys = set((ops.get("data") or {}).keys())
              assert rkeys == {"research-only-secret"}, \
                  f"research projection must hold only its own secret, got {sorted(rkeys)}"
              assert okeys == {"ops-only-secret"}, \
                  f"ops projection must hold only its own secret, got {sorted(okeys)}"
              print("OK")
              PY
