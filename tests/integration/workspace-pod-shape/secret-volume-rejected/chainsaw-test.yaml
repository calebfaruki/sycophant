apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vap-rejects-workspace-with-secret-volume
spec:
  description: |
    Workspace VAP rule: workspace pod volumes must be one of the four
    types the materializer uses (emptyDir, persistentVolumeClaim,
    hostPath, projected). Default-deny shape — any other volume type
    (secret, configMap, csi, nfs/iscsi/rbd, downwardAPI, ephemeral,
    image) is structurally banned.

    Workspace runtime is adversarial; a mounted Secret is an exfiltration
    vector regardless of who would legitimately mount it. The chart bans
    it structurally so no operator misconfiguration, materializer bug, or
    compromised pod-creating credential can land a Secret on a workspace
    pod.

    This test submits a pod with a direct `volumes[].secret` and asserts
    rejection by the volume-type allow-list rule.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-wps-secret-vol
    - name: target_namespace
      value: tenant-chainsaw-wps-secret-vol
  steps:
    - name: create-tenant-ns-via-deployer
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create namespace "$TENANT_NS" --as=system:serviceaccount:infra:tenant-deployer
    - name: assert-sycophant-mutate-stamped-labels
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: ($tenant_ns)
                labels:
                  app.kubernetes.io/part-of: sycophant-tenant
                  pod-security.kubernetes.io/enforce: restricted
    - name: assert-sycophant-generated-vapbinding
      try:
        - assert:
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingAdmissionPolicyBinding
              metadata:
                name: (join('-', [$tenant_ns, 'workspace-pod-binding']))
    - name: wait-for-vap-cache-refresh
      try:
        - sleep:
            duration: 5s
    - name: apply-workspace-with-secret-volume
      try:
        - create:
            file: ../../fixtures/workspace-pod-with-secret-volume.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'Workspace pod volumes must be')): true
      catch:
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
