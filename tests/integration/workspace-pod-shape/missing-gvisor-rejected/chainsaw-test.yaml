apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vap-rejects-workspace-missing-gvisor
spec:
  description: |
    Workspace VAP rule: pods labeled `part-of=sycophant + component=workspace`
    must declare `runtimeClassName: gvisor`. PSA has no opinion on
    runtimeClassName — only the VAP enforces gvisor.

    Tenant ns is created by the tenant-deployer SA (real production
    path). Sycophant's mutate stamps PSA labels; sycophant's generate
    produces the per-tenant VAPBinding — both verified explicitly
    before pod submission. If the VAPBinding doesn't exist, this test
    must fail at the assertion step rather than silently admitting the
    bad pod.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-wps-no-gvisor
    - name: target_namespace
      value: tenant-chainsaw-wps-no-gvisor
  steps:
    - name: create-tenant-ns-via-deployer
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create namespace "$TENANT_NS" --as=system:serviceaccount:infra:tenant-deployer
    - name: assert-sycophant-mutate-stamped-labels
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: ($tenant_ns)
                labels:
                  app.kubernetes.io/part-of: sycophant-tenant
                  pod-security.kubernetes.io/enforce: restricted
    - name: assert-sycophant-generated-vapbinding
      try:
        - assert:
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingAdmissionPolicyBinding
              metadata:
                name: (join('-', [$tenant_ns, 'workspace-pod-binding']))
    - name: wait-for-vap-cache-refresh
      try:
        - sleep:
            duration: 5s
    - name: apply-workspace-missing-gvisor
      try:
        - create:
            file: ../../fixtures/workspace-pod-missing-gvisor.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'must use runtimeClassName')): true
      catch:
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
