apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vap-rejects-workspace-missing-no-privilege-escalation
spec:
  description: |
    Workspace VAP rule: every container (including initContainers and
    ephemeralContainers) must set `securityContext.allowPrivilegeEscalation: false`.

    PSS-restricted enforces this field via the `pod-security.kubernetes.io/enforce`
    namespace label, but the label is mutable — anyone with `update namespaces`
    could strip it. The VAP binding is regenerated by Kyverno with
    failurePolicy=Fail and is the load-bearing structural defense.

    Tenant ns is created via the tenant-deployer SA (real production
    path). Sycophant's mutate stamps PSA labels; sycophant's generate
    produces the per-tenant VAPBinding — both verified explicitly before
    pod submission.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-wps-no-ape
    - name: target_namespace
      value: tenant-chainsaw-wps-no-ape
  steps:
    - name: create-tenant-ns-via-deployer
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create namespace "$TENANT_NS" --as=system:serviceaccount:infra:tenant-deployer
    - name: assert-sycophant-mutate-stamped-labels
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: ($tenant_ns)
                labels:
                  app.kubernetes.io/part-of: sycophant-tenant
                  pod-security.kubernetes.io/enforce: restricted
    - name: assert-sycophant-generated-vapbinding
      try:
        - assert:
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingAdmissionPolicyBinding
              metadata:
                name: (join('-', [$tenant_ns, 'workspace-pod-binding']))
    - name: wait-for-vap-cache-refresh
      try:
        - sleep:
            duration: 5s
    - name: apply-workspace-missing-no-privilege-escalation
      try:
        - create:
            file: ../../fixtures/workspace-pod-missing-no-privilege-escalation.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'allowPrivilegeEscalation')): true
      catch:
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
