apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: capability-grants-renders-for-every-workspace
spec:
  description: |
    Every workspace renders a capability-grants ConfigMap. A workspace that
    declares no credential grants renders an empty one rather than none.

    The ConfigMap is a gate context source, and Kyverno fails closed when a
    context source is missing: an absent ConfigMap does not read as "no
    approvals", it denies every Job that workspace's harness creates, including
    the ones that name no Secret at all. An empty allowlist is the no-approvals
    state; absence is an outage.

    Pure chart-render property. Two workspaces are rendered together: one with a
    grant, one whose only toolset is a bare string. Both must render, the
    grant-bearing one carrying its Secret name and the grantless one carrying
    nothing.

    Mutation guard: guarding the template on grant-bearing workspaces drops
    `capability-grants-plain` and fails the exact-set assertion; leaking the
    grant-bearing workspace's keys into the grantless ConfigMap fails the empty
    assertion; failing to render the grant-bearing workspace fails both.
  steps:
    - name: render-and-assert-every-workspace-renders
      try:
        - script:
            content: |
              set -euo pipefail
              REPO_ROOT=$(git rev-parse --show-toplevel)
              tmp=$(mktemp)
              helm template probe "$REPO_ROOT/charts/sycophant-tenant" -n probe-ns \
                --set-string workspaces.research.toolsets[0].name=notion \
                --set-string workspaces.research.toolsets[0].grants.reader.secret=research-notion-reader \
                --set-string workspaces.plain.toolsets[0]=stdlib \
                > "$tmp"
              python3 - "$tmp" <<'PY'
              import sys, yaml
              docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]
              cms = {d["metadata"]["name"]: d for d in docs
                     if d.get("kind") == "ConfigMap"
                     and d["metadata"]["name"].startswith("capability-grants-")}
              rendered = sorted(cms)
              assert rendered == ["capability-grants-plain",
                                  "capability-grants-research"], \
                  ("every workspace must render one, grantless included; "
                   f"got {rendered}")

              research = cms["capability-grants-research"].get("data") or {}
              assert research == {"research-notion-reader": "notion"}, \
                  f"the grant-bearing ConfigMap must carry its Secret name; got {research}"

              plain = cms["capability-grants-plain"].get("data") or {}
              assert plain == {}, \
                  f"a grantless workspace approves nothing; got {plain}"
              print("OK")
              PY
