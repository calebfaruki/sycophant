apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vap-rejects-harness-with-secret-volume
spec:
  description: |
    Harness VAP rule: harness pod volumes must be one of the four
    types the chart template emits (emptyDir, persistentVolumeClaim,
    hostPath, projected). Default-deny shape — any other volume type
    (secret, configMap, csi, nfs/iscsi/rbd, downwardAPI, ephemeral,
    image) is structurally banned.

    Harness pod is adversarial; a mounted Secret is an exfiltration
    vector regardless of who would legitimately mount it. The chart bans
    it structurally so no operator misconfiguration, template bug, or
    compromised pod-creating credential can land a Secret on the
    harness pod.

    This test submits a pod with a direct `volumes[].secret` and asserts
    rejection by the volume-type allow-list rule.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
    - name: target_namespace
      value: ($tenant_ns)
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: await-pod-admission-ready
      use:
        template: ../../step-templates/pod-admission-ready.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: apply-harness-with-secret-volume
      try:
        - create:
            file: ../../fixtures/harness-pod-with-secret-volume.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'harness pod volumes must be')): true
      catch:
        - events:
            namespace: ($tenant_ns)
