apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vap-rejects-harness-missing-readonly-rootfs
spec:
  description: |
    Harness VAP rule: every container (including initContainers and
    ephemeralContainers) must set `securityContext.readOnlyRootFilesystem: true`.

    `readOnlyRootFilesystem` has no admission backstop in PSS-restricted —
    only this VAP rule enforces it. A harness pod that omits the field
    (defaulting to a writable rootfs) admits without this rule, allowing
    in-sandbox malicious code to write trojaned binaries or persist state.
    gVisor still bounds the blast radius to the sandbox, but the
    adversarial threat model treats the in-sandbox runtime as
    the thing being defended.

    The tenant ns is created and the test applies the perimeter labels
    (part-of + the four PSA labels); the label-triggered generate rule then
    produces the per-tenant VAPBinding, verified before pod submission.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
    - name: target_namespace
      value: ($tenant_ns)
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: await-pod-admission-ready
      use:
        template: ../../step-templates/pod-admission-ready.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: apply-harness-missing-readonly-rootfs
      try:
        - create:
            file: ../../fixtures/harness-pod-missing-readonly-rootfs.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'readOnlyRootFilesystem')): true
      catch:
        - events:
            namespace: ($tenant_ns)
