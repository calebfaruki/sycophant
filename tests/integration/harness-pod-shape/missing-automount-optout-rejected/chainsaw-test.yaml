apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vap-rejects-harness-missing-automount-optout
spec:
  description: |
    Harness VAP must reject pods that omit automountServiceAccountToken=false.
    Kubelet's default (when the field is absent) is to mount a kube-apiserver-
    audience SA token, which would give the harness a cluster-identity
    bearer credential against any audience-naive verifier in the cluster.
    The VAP's explicit-projected-token rule alone does not cover this path.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
    - name: target_namespace
      value: ($tenant_ns)
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: await-pod-admission-ready
      use:
        template: ../../step-templates/pod-admission-ready.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: apply-violating-harness-pod
      try:
        - apply:
            file: ../../fixtures/harness-pod-missing-automount-optout.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'automountServiceAccountToken must be set to false')): true
      catch:
        - events:
            namespace: ($tenant_ns)
