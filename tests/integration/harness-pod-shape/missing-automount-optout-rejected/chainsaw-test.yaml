apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vap-rejects-harness-missing-automount-optout
spec:
  description: |
    Harness VAP must reject pods that omit automountServiceAccountToken=false.
    Kubelet's default (when the field is absent) is to mount a kube-apiserver-
    audience SA token, which would give the harness a cluster-identity
    bearer credential against any audience-naive verifier in the cluster.
    The VAP's explicit-projected-token rule alone does not cover this path.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-wps-automount
    - name: target_namespace
      value: tenant-chainsaw-wps-automount
  steps:
    - name: create-tenant-ns
      try:
        - apply:
            file: ../../fixtures/tenant-namespace.yaml
            template: true
    - name: assert-sycophant-generated-vapbinding
      try:
        - assert:
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingAdmissionPolicyBinding
              metadata:
                name: (join('-', [$tenant_ns, 'sycophant-pod-binding']))
    - name: wait-for-vap-cache-refresh
      try:
        - sleep:
            duration: 5s
    - name: apply-violating-harness-pod
      try:
        - apply:
            file: ../../fixtures/harness-pod-missing-automount-optout.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'automountServiceAccountToken must be set to false')): true
      catch:
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
