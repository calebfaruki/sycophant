apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vap-rejects-harness-missing-no-privilege-escalation
spec:
  description: |
    Harness VAP rule: every container (including initContainers and
    ephemeralContainers) must set `securityContext.allowPrivilegeEscalation: false`.

    PSS-restricted enforces this field via the `pod-security.kubernetes.io/enforce`
    namespace label, but the label is mutable — anyone with `update namespaces`
    could strip it. The VAP binding is regenerated by Kyverno with
    failurePolicy=Fail and is the load-bearing structural defense.

    The tenant ns is created and the test applies the perimeter labels
    (part-of + the four PSA labels); the label-triggered generate rule then
    produces the per-tenant VAPBinding, verified before pod submission.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
    - name: target_namespace
      value: ($tenant_ns)
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: await-pod-admission-ready
      use:
        template: ../../step-templates/pod-admission-ready.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: apply-harness-missing-no-privilege-escalation
      try:
        - create:
            file: ../../fixtures/harness-pod-missing-no-privilege-escalation.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'allowPrivilegeEscalation')): true
      catch:
        - events:
            namespace: ($tenant_ns)
