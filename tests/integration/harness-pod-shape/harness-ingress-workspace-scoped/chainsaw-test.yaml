apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: harness-ingress-workspace-scoped
spec:
  description: |
    The harness serves one inbound surface: the relay-forward surface
    (HarnessControl) on 9091, which admits relay-ctrl alone — relay forwards
    registered-user requests here. It serves no pod-facing surface; the harness
    dials each capability-job pod on 9090 instead (that egress flip and the
    absence of any 9090 ingress are asserted by harness-egress-flips-to-tool-pod).

    This bucket asserts the surviving relay-forward ingress shape: relay-ctrl
    admitted to 9091, and no other endpoint on that port.

    Structural render assertion (self-applies the template into a chainsaw ns);
    the live L4 drop is Cilium's to enforce, out of scope.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-ingress-wps
  steps:
    - name: create-tenant-ns-and-apply-netpol
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -e
              kubectl create namespace "$TENANT_NS" --as=system:serviceaccount:sycophant-system:tenant-deployer
              REPO_ROOT=$(git rev-parse --show-toplevel)
              helm template "$TENANT_NS" "$REPO_ROOT/charts/sycophant-tenant" \
                --show-only templates/harness-netpol.yaml \
                --set 'workspaces.probe.storage=1Gi' \
                -n "$TENANT_NS" \
                | kubectl apply -f -
    - name: assert-harness-ingress-shape
      try:
        - assert:
            resource:
              apiVersion: cilium.io/v2
              kind: CiliumNetworkPolicy
              metadata:
                name: harness-egress-probe
                namespace: ($tenant_ns)
              spec:
                # Relay-forward surface: relay-ctrl admitted to 9091 only.
                (ingress[?toPorts[?ports[?port=='9091']]]):
                  - fromEndpoints:
                      - matchLabels:
                          app.kubernetes.io/name: relay-ctrl
                          app.kubernetes.io/part-of: sycophant
                # No pod-facing dispatch surface: nothing admitted on 9090.
                (length(ingress[?toPorts[?ports[?port=='9090']]])): 0
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
