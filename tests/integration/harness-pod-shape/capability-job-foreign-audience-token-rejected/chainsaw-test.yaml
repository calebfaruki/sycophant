apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vap-rejects-capability-job-foreign-audience-token
spec:
  description: |
    A prompt-injected harness authors the tool-Job spec, so it can bake a
    projected SA token into the untrusted tool pod. The gVisor VAP's
    capability-job audience pin bounds that: a projected serviceAccountToken
    on a capability-job pod may carry ONLY the tool.toolset.sycophant.md
    audience. Without the pin, a harness- or relay-audience token moves into
    the sandbox, where the capability-job could present it to any in-namespace
    service that accepts that audience and impersonate this workspace's harness.

    Two cases, so a mutant that drops the audience equality OR bans projected
    tokens as a class both red:
      - a token at a HARNESS audience is REJECTED, and
      - a token at the tool audience is ADMITTED (mutate stamps gvisor).

    Self-contained: creates the tenant ns via the tenant-deployer SA and waits
    for the label-triggered VAPBinding before submitting, so the VAP fires (no
    silent-admit antipattern).
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
    - name: target_namespace
      value: ($tenant_ns)
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: await-pod-admission-ready
      use:
        template: ../../step-templates/pod-admission-ready.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: reject-foreign-audience-token
      try:
        - apply:
            file: ../../fixtures/tool-job-pod-foreign-audience-token.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'must carry the tool.toolset.sycophant.md audience')): true
      catch:
        - events:
            namespace: ($tenant_ns)
    - name: admit-tool-audience-token
      try:
        - apply:
            file: ../../fixtures/tool-job-pod-tool-audience-token.yaml
            template: true
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: tool-job-tool-audience
                namespace: ($tenant_ns)
              spec:
                # The runtime-class mutate stamps gvisor on capability-job pods;
                # its presence proves the pod cleared admission, so the audience
                # pin admitted the legitimate tool.toolset token.
                runtimeClassName: gvisor
      catch:
        - events:
            namespace: ($tenant_ns)
