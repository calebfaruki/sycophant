apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vap-rejects-harness-missing-seccomp
spec:
  description: |
    Harness VAP rule: every container must have
    `securityContext.seccompProfile.type` set to RuntimeDefault or Localhost,
    either per-container or via pod-level fallback.

    PSS-restricted permits Undefined/nil for seccompProfile.type — so PSS is
    NOT a backstop. The chart's harness template sets pod-level
    seccompProfile.type=RuntimeDefault. This rule blocks manually crafted
    harness pods that omit seccompProfile or set it to Unconfined.

    The tenant ns is created and the test applies the perimeter labels
    (part-of + the four PSA labels); the label-triggered generate rule then
    produces the per-tenant VAPBinding, verified before pod submission.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
    - name: target_namespace
      value: ($tenant_ns)
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: await-pod-admission-ready
      use:
        template: ../../step-templates/pod-admission-ready.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: apply-harness-missing-seccomp
      try:
        - create:
            file: ../../fixtures/harness-pod-missing-seccomp.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'seccompProfile.type')): true
      catch:
        - events:
            namespace: ($tenant_ns)
