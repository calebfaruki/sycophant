apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vap-rejects-harness-missing-limits
spec:
  description: |
    The harness VAP rejects a pod without resources.limits set.
    Unbounded workloads can starve other tenants; explicit limits make
    cgroup enforcement deterministic.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
    - name: target_namespace
      value: ($tenant_ns)
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: await-pod-admission-ready
      use:
        template: ../../step-templates/pod-admission-ready.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: apply-violating-harness-pod
      try:
        - apply:
            file: ../../fixtures/harness-pod-missing-limits.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'must define resource limits')): true
      catch:
        - events:
            namespace: ($tenant_ns)
