apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: harness-pod-admits-cleanly
spec:
  description: |
    Happy path. Tenant ns is created by the tenant-deployer SA — real
    production path. The test applies the perimeter labels; the label-triggered
    generate produces the per-tenant VAPBinding. THEN a harness-labeled
    pod with a hardened security context and NO runtimeClassName admits
    cleanly on the kubelet-default runtime.

    Guards against accidentally tightening PSA/VAP so hard that legitimate
    harness pods can't run, AND proves the gVisor narrowing: gVisor is
    stamped/required on toolsets (capability-job) only, so the runtime-class
    mutate must NOT stamp the harness and the VAP must NOT require it.
    The test applies the perimeter labels itself (no auto-labelling mutate);
    the VAPBinding must be generated or the VAP would not fire (silent-admit
    antipattern), asserted before the workload submits.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
    - name: target_namespace
      value: ($tenant_ns)
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: await-pod-admission-ready
      use:
        template: ../../step-templates/pod-admission-ready.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: apply-harness-pod
      try:
        - apply:
            file: ../../fixtures/harness-pod-good.yaml
            template: true
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: harness-good
                namespace: ($tenant_ns)
              spec:
                # Admits on the default runtime: the mutate no longer stamps
                # gvisor on the harness and the VAP no longer requires it.
                (runtimeClassName == null): true
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
            name: harness-good
            namespace: ($tenant_ns)
        - events:
            namespace: ($tenant_ns)
