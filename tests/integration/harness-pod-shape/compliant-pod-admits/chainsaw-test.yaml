apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: harness-pod-admits-cleanly
spec:
  description: A hardened harness pod with no runtimeClassName admits in a tenant namespace.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
    - name: target_namespace
      value: ($tenant_ns)
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: await-pod-admission-ready
      use:
        template: ../../step-templates/pod-admission-ready.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: apply-harness-pod
      try:
        - apply:
            file: ../../fixtures/harness-pod-good.yaml
            template: true
        - assert:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: harness-good
                namespace: ($tenant_ns)
      catch:
        - describe:
            apiVersion: v1
            kind: Pod
            name: harness-good
            namespace: ($tenant_ns)
        - events:
            namespace: ($tenant_ns)
