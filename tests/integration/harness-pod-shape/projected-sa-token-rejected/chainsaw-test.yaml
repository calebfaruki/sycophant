apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vap-rejects-harness-projected-token
spec:
  description: |
    HIGHEST BLAST RADIUS. The harness VAP rejects pods declaring a
    projected SA token volume. If the harness could mint kube-apiserver
    bearer tokens, it could read its own SA's RBAC and escalate. This
    rule is the only structural defender.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-wps-proj-tok
    - name: target_namespace
      value: tenant-chainsaw-wps-proj-tok
  steps:
    - name: create-tenant-ns
      try:
        - apply:
            file: ../../fixtures/tenant-namespace.yaml
            template: true
    - name: assert-sycophant-generated-vapbinding
      try:
        - assert:
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingAdmissionPolicyBinding
              metadata:
                name: (join('-', [$tenant_ns, 'sycophant-pod-binding']))
    - name: wait-for-vap-cache-refresh
      try:
        - sleep:
            duration: 5s
    - name: apply-violating-harness-pod
      try:
        - apply:
            file: ../../fixtures/harness-pod-with-projected-token.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'projected volume sources must be')): true
      catch:
        - events:
            namespace: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
