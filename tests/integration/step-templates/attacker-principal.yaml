# Seeds a same-namespace principal an attacker test drives: a ServiceAccount, a
# Role carrying the caller-supplied rules, and a RoleBinding tying them together,
# all named ($principal_name) so the role name is not a varying axis (tests assert
# only the denial, never the role name). A test's seed step calls this with
# use.template and passes tenant_ns, principal_name, and rules via with.bindings.
# The Role's rules body is ($rules), injected from a binding, so the caller supplies
# the resource+verbs to grant.
# Do NOT add spec.bindings defaults for tenant_ns, principal_name, or rules: a
# default here shadows the caller's with.bindings, so the principal would render
# under the default instead of the test's values.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: attacker-principal
spec:
  try:
    - apply:
        template: true
        resource:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: ($principal_name)
            namespace: ($tenant_ns)
    - apply:
        template: true
        resource:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: ($principal_name)
            namespace: ($tenant_ns)
          rules: ($rules)
    - apply:
        template: true
        resource:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: ($principal_name)
            namespace: ($tenant_ns)
          subjects:
            - kind: ServiceAccount
              name: ($principal_name)
              namespace: ($tenant_ns)
          roleRef:
            kind: Role
            name: ($principal_name)
            apiGroup: rbac.authorization.k8s.io
