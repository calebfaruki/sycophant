# Shared tenant-namespace setup + teardown. A test's create-tenant-ns step calls
# this with use.template and passes the name via with.bindings (tenant_ns).
# Do NOT add a spec.bindings default for tenant_ns: a default here shadows the
# caller's with.bindings, so the namespace would be created and torn down under
# the default name instead of the test's.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: tenant
spec:
  try:
    - apply:
        file: ../../fixtures/tenant-namespace.yaml
        template: true
  cleanup:
    - delete:
        ref:
          apiVersion: v1
          kind: Namespace
          name: ($tenant_ns)
