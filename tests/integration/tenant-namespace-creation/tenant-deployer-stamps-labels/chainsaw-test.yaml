apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mutate-stamps-psa-on-tenant-ns
spec:
  description: |
    When system:serviceaccount:infra:tenant-deployer creates a tenant-*
    namespace WITHOUT PSA labels, the Kyverno mutate rule label-tenant-ns
    (in tenant-rolebinding-generator ClusterPolicy) must stamp the
    perimeter label and PSA labels onto it.

    Fixture asymmetry: the create command sends an unlabeled namespace.
    The assertion reads back from the apiserver — only the mutate rule
    can produce the labels we're asserting. Delete the rule, this test
    goes red.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-tnc-deployer
  steps:
    - name: create-tenant-ns-via-deployer
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create namespace "$TENANT_NS" --as=system:serviceaccount:infra:tenant-deployer
    - name: assert-mutate-stamped-labels
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: ($tenant_ns)
                labels:
                  app.kubernetes.io/part-of: sycophant-tenant
                  pod-security.kubernetes.io/enforce: restricted
      catch:
        - describe:
            apiVersion: v1
            kind: Namespace
            name: ($tenant_ns)
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
