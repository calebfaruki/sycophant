apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-tokenreview-crbs-generated
spec:
  description: A tenant-labeled namespace gets the relay tokenreview ClusterRoleBinding, the dispatch tokenreview ClusterRoleBinding for its ServiceAccounts group, and the gVisor VAP binding. The dispatch ClusterRole grants only tokenreviews create.
  bindings:
    - name: tenant_ns
      value: (join('-', ['labeled', random('[a-z0-9]{8}')]))
  steps:
    - name: preflight-kyverno-ready
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kyverno-background-controller
                namespace: kyverno
              status:
                (readyReplicas > `0`): true
        - assert:
            resource:
              apiVersion: policies.kyverno.io/v1
              kind: GeneratingPolicy
              metadata:
                name: tenant-rolebinding-generator
              status:
                conditionStatus:
                  ready: true
    - name: assert-tokenreview-clusterrole-rules
      try:
        - assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: cluster-relay-tokenreview
              (length(rules) == `2`): true
              rules:
                - apiGroups: ["authentication.k8s.io"]
                  resources: ["tokenreviews"]
                  verbs: ["create"]
                  (length(verbs) == `1`): true
                - apiGroups: ["authorization.k8s.io"]
                  resources: ["subjectaccessreviews"]
                  verbs: ["create"]
                  (length(verbs) == `1`): true
    - name: assert-dispatch-tokenreview-clusterrole-rules
      try:
        - assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: cluster-dispatch-tokenreview
              (length(rules) == `1`): true
              rules:
                - apiGroups: ["authentication.k8s.io"]
                  resources: ["tokenreviews"]
                  verbs: ["create"]
                  (length(apiGroups) == `1`): true
                  (length(resources) == `1`): true
                  (length(verbs) == `1`): true
    - name: create-labeled-ns
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl create namespace "$TENANT_NS"
              kubectl label namespace "$TENANT_NS" \
                app.kubernetes.io/part-of=sycophant-tenant \
                pod-security.kubernetes.io/enforce=restricted \
                pod-security.kubernetes.io/enforce-version=latest \
                pod-security.kubernetes.io/warn=restricted \
                pod-security.kubernetes.io/audit=restricted \
                --overwrite
    - name: wait-for-kyverno-generate
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              for i in $(seq 1 240); do
                if kubectl get clusterrolebinding \
                     "${TENANT_NS}-relay-tokenreview" \
                     >/dev/null 2>&1 && \
                   kubectl get validatingadmissionpolicybinding \
                     "${TENANT_NS}-sycophant-pod-binding" >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 0.5
              done
              echo "timed out waiting 120s for Kyverno to generate per-tenant wiring" >&2
              exit 1
    - name: assert-relay-tokenreview-crb
      try:
        - assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: (join('-', [$tenant_ns, 'relay-tokenreview']))
                labels:
                  app.kubernetes.io/component: relay-controller
                ownerReferences:
                  - apiVersion: v1
                    kind: Namespace
                    name: ($tenant_ns)
                    blockOwnerDeletion: false
              subjects:
                - kind: ServiceAccount
                  name: relay-controller
                  namespace: ($tenant_ns)
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: cluster-relay-tokenreview
      catch:
        - describe:
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            name: (join('-', [$tenant_ns, 'relay-tokenreview']))
    - name: assert-dispatch-tokenreview-crb
      try:
        - assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: (join('-', [$tenant_ns, 'dispatch-tokenreview']))
              (length(subjects) == `1`): true
              subjects:
                - kind: Group
                  name: (join(':', ['system', 'serviceaccounts', $tenant_ns]))
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: cluster-dispatch-tokenreview
      catch:
        - describe:
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            name: (join('-', [$tenant_ns, 'dispatch-tokenreview']))
    - name: assert-pod-vap-binding
      try:
        - assert:
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingAdmissionPolicyBinding
              metadata:
                name: (join('-', [$tenant_ns, 'sycophant-pod-binding']))
              spec:
                policyName: cluster-gvisor-pod-policy
                validationActions: [Deny]
                matchResources:
                  namespaceSelector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: In
                        values:
                          - ($tenant_ns)
      catch:
        - describe:
            apiVersion: admissionregistration.k8s.io/v1
            kind: ValidatingAdmissionPolicyBinding
            name: (join('-', [$tenant_ns, 'sycophant-pod-binding']))
    - name: teardown
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=true
              kubectl delete clusterrolebinding \
                "${TENANT_NS}-relay-tokenreview" \
                "${TENANT_NS}-dispatch-tokenreview" \
                --ignore-not-found
              kubectl delete validatingadmissionpolicybinding \
                "${TENANT_NS}-sycophant-pod-binding" --ignore-not-found
  catch:
    - script:
        env:
          - name: TENANT_NS
            value: ($tenant_ns)
        content: |
          set -euo pipefail
          kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=true
          kubectl delete clusterrolebinding \
            "${TENANT_NS}-relay-tokenreview" \
            "${TENANT_NS}-dispatch-tokenreview" \
            --ignore-not-found
          kubectl delete validatingadmissionpolicybinding \
            "${TENANT_NS}-sycophant-pod-binding" --ignore-not-found
