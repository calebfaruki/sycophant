apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-tokenreview-crbs-generated
spec:
  description: |
    A namespace carrying app.kubernetes.io/part-of=sycophant-tenant — with ANY
    name, created by ANY actor — triggers the label-matched generate rules in
    tenant-rolebinding-generator. They must materialize four ClusterRoleBindings
    binding the SHARED tokenreview ClusterRoles to the per-tenant airlock-ctrl,
    hangar-ctrl, mainframe-ctrl, and tightbeam-ctrl ServiceAccounts, plus the per-tenant
    ValidatingAdmissionPolicyBinding scoping cluster-gvisor-pod-policy to the ns.

    The namespace name here is deliberately NOT tenant-* — provisioning keys on
    the label, not the name.

    Each generated CRB carries an ownerReference to the ns with
    blockOwnerDeletion: false — ns deletion cascade-GCs them without wedging
    teardown. We assert apiVersion/kind/name/blockOwnerDeletion (uid is dynamic).

    Generate rules run asynchronously via Kyverno's UpdateRequest reconciler, so
    a polling pre-step waits for the resources before the assertions run.

    The four referenced ClusterRoles are pinned: each must grant exactly one
    rule, exactly authentication.k8s.io/tokenreviews/create. A widening
    regression (extra rule, extra verb, swapped resource) makes the test go red.
  bindings:
    - name: tenant_ns
      value: chainsaw-labeled-no-tenant-prefix
  steps:
    - name: preflight-kyverno-ready
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kyverno-background-controller
                namespace: kyverno
              status:
                (readyReplicas > `0`): true
        - assert:
            resource:
              apiVersion: kyverno.io/v1
              kind: ClusterPolicy
              metadata:
                name: tenant-rolebinding-generator
              status:
                conditions:
                  - type: Ready
                    status: "True"
    - name: assert-tokenreview-clusterrole-rules
      try:
        - assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: cluster-airlock-tokenreview
              (length(rules) == `1`): true
              rules:
                - apiGroups: ["authentication.k8s.io"]
                  resources: ["tokenreviews"]
                  verbs: ["create"]
                  (length(verbs) == `1`): true
        - assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: cluster-hangar-tokenreview
              (length(rules) == `1`): true
              rules:
                - apiGroups: ["authentication.k8s.io"]
                  resources: ["tokenreviews"]
                  verbs: ["create"]
                  (length(verbs) == `1`): true
        - assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: cluster-mainframe-tokenreview
              (length(rules) == `1`): true
              rules:
                - apiGroups: ["authentication.k8s.io"]
                  resources: ["tokenreviews"]
                  verbs: ["create"]
                  (length(verbs) == `1`): true
        - assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: cluster-tightbeam-tokenreview
              (length(rules) == `1`): true
              rules:
                - apiGroups: ["authentication.k8s.io"]
                  resources: ["tokenreviews"]
                  verbs: ["create"]
                  (length(verbs) == `1`): true
    - name: create-labeled-ns
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create namespace "$TENANT_NS"
              kubectl label namespace "$TENANT_NS" \
                app.kubernetes.io/part-of=sycophant-tenant \
                pod-security.kubernetes.io/enforce=restricted \
                pod-security.kubernetes.io/enforce-version=latest \
                pod-security.kubernetes.io/warn=restricted \
                pod-security.kubernetes.io/audit=restricted \
                --overwrite
    - name: wait-for-kyverno-generate
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              for i in $(seq 1 240); do
                if kubectl get clusterrolebinding \
                     "${TENANT_NS}-airlock-tokenreview" \
                     "${TENANT_NS}-hangar-tokenreview" \
                     "${TENANT_NS}-mainframe-tokenreview" \
                     "${TENANT_NS}-tightbeam-tokenreview" \
                     >/dev/null 2>&1 && \
                   kubectl get validatingadmissionpolicybinding \
                     "${TENANT_NS}-sycophant-pod-binding" >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 0.5
              done
              echo "timed out waiting 120s for Kyverno to generate per-tenant wiring" >&2
              exit 1
    - name: assert-airlock-tokenreview-crb
      try:
        - assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: (join('-', [$tenant_ns, 'airlock-tokenreview']))
                labels:
                  app.kubernetes.io/component: airlock-ctrl
                ownerReferences:
                  - apiVersion: v1
                    kind: Namespace
                    name: ($tenant_ns)
                    blockOwnerDeletion: false
              subjects:
                - kind: ServiceAccount
                  name: airlock-ctrl
                  namespace: ($tenant_ns)
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: cluster-airlock-tokenreview
      catch:
        - describe:
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            name: (join('-', [$tenant_ns, 'airlock-tokenreview']))
    - name: assert-hangar-tokenreview-crb
      try:
        - assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: (join('-', [$tenant_ns, 'hangar-tokenreview']))
                labels:
                  app.kubernetes.io/component: hangar-ctrl
                ownerReferences:
                  - apiVersion: v1
                    kind: Namespace
                    name: ($tenant_ns)
                    blockOwnerDeletion: false
              subjects:
                - kind: ServiceAccount
                  name: hangar-ctrl
                  namespace: ($tenant_ns)
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: cluster-hangar-tokenreview
      catch:
        - describe:
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            name: (join('-', [$tenant_ns, 'hangar-tokenreview']))
    - name: assert-mainframe-tokenreview-crb
      try:
        - assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: (join('-', [$tenant_ns, 'mainframe-tokenreview']))
                labels:
                  app.kubernetes.io/component: mainframe-ctrl
                ownerReferences:
                  - apiVersion: v1
                    kind: Namespace
                    name: ($tenant_ns)
                    blockOwnerDeletion: false
              subjects:
                - kind: ServiceAccount
                  name: mainframe-ctrl
                  namespace: ($tenant_ns)
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: cluster-mainframe-tokenreview
      catch:
        - describe:
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            name: (join('-', [$tenant_ns, 'mainframe-tokenreview']))
    - name: assert-tightbeam-tokenreview-crb
      try:
        - assert:
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: (join('-', [$tenant_ns, 'tightbeam-tokenreview']))
                labels:
                  app.kubernetes.io/component: tightbeam-ctrl
                ownerReferences:
                  - apiVersion: v1
                    kind: Namespace
                    name: ($tenant_ns)
                    blockOwnerDeletion: false
              subjects:
                - kind: ServiceAccount
                  name: tightbeam-ctrl
                  namespace: ($tenant_ns)
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: cluster-tightbeam-tokenreview
      catch:
        - describe:
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            name: (join('-', [$tenant_ns, 'tightbeam-tokenreview']))
    - name: assert-pod-vap-binding
      try:
        - assert:
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingAdmissionPolicyBinding
              metadata:
                name: (join('-', [$tenant_ns, 'sycophant-pod-binding']))
              spec:
                policyName: cluster-gvisor-pod-policy
                validationActions: [Deny]
                matchResources:
                  namespaceSelector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: In
                        values:
                          - ($tenant_ns)
      catch:
        - describe:
            apiVersion: admissionregistration.k8s.io/v1
            kind: ValidatingAdmissionPolicyBinding
            name: (join('-', [$tenant_ns, 'sycophant-pod-binding']))
    - name: teardown
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=true
              kubectl delete clusterrolebinding \
                "${TENANT_NS}-airlock-tokenreview" \
                "${TENANT_NS}-hangar-tokenreview" \
                "${TENANT_NS}-mainframe-tokenreview" \
                "${TENANT_NS}-tightbeam-tokenreview" \
                --ignore-not-found
              kubectl delete validatingadmissionpolicybinding \
                "${TENANT_NS}-sycophant-pod-binding" --ignore-not-found
  catch:
    - script:
        env:
          - name: TENANT_NS
            value: ($tenant_ns)
        content: |
          kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=true
          kubectl delete clusterrolebinding \
            "${TENANT_NS}-airlock-tokenreview" \
            "${TENANT_NS}-hangar-tokenreview" \
            "${TENANT_NS}-mainframe-tokenreview" \
            "${TENANT_NS}-tightbeam-tokenreview" \
            --ignore-not-found
          kubectl delete validatingadmissionpolicybinding \
            "${TENANT_NS}-sycophant-pod-binding" --ignore-not-found
