apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cluster-admin-labeled-tenant-ns-admitted
spec:
  description: |
    Pair test for cluster-admin-unlabeled-rejected. When cluster-admin
    creates a tenant-* namespace WITH the perimeter label set,
    tenant-namespace-perimeter-label allows it. Proves the rule is
    real (denies absence of label) and not an over-firing rejector
    (denies everything).

    Note: cluster-admin must also pre-set the PSA labels in this path
    because the deployer-specific mutate rule does NOT fire for
    cluster-admin (different actor). This test asserts the perimeter
    rule alone; PSA stamping is the deployer's concern.
  bindings:
    - name: tenant_ns
      value: tenant-chainsaw-tnc-admin-labeled
  steps:
    - name: admin-creates-labeled-tenant-ns
      try:
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: ($tenant_ns)
                labels:
                  app.kubernetes.io/part-of: sycophant-tenant
                  pod-security.kubernetes.io/enforce: restricted
        - assert:
            resource:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: ($tenant_ns)
                labels:
                  app.kubernetes.io/part-of: sycophant-tenant
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
