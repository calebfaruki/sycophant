apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kernel-per-workspace-renders-from-values
spec:
  description: |
    Kernel delivery is per-workspace, driven by `.Values.workspaces.<ws>.kernel`
    (CLI-populated by `syco tenant up` from each Kernel CR — no chart `lookup`).
    Delivery collapses to a single operator-populated read-only volume: each
    workspace gets exactly one read-only serving PV whose hostPath is its custom
    `kernel.path` override or the convention `<hostPathBase>/<ns>/<ws>`. There is
    no `kind` discriminator and NO workspace renders a writer PV or PVC.

    Mutation guard: dropping the per-workspace `range` from mainframe-ctrl.yaml
    makes a workspace's persona never mount; re-introducing a writer PV/PVC makes
    a workspace render a read-write volume — either fails this test.
  steps:
    - name: per-workspace-render-from-values
      try:
        - script:
            content: |
              set -e
              REPO_ROOT=$(git rev-parse --show-toplevel)
              # Two host-path workspaces: wscustom overrides the source dir with
              # --path; wsconv takes the convention path. No kind is set (there is
              # no kind discriminator any more).
              out=$(helm template probe "$REPO_ROOT/charts/sycophant-tenant" -n probe-ns \
                --set-string workspaces.wscustom.kernel.path=/custom/dir \
                --set-string workspaces.wsconv.storage=1Gi 2>&1)

              # Parse into resources (not grep) so a document-eating template trim
              # bug can't pass by leaving the substrings intact.
              created=$(printf '%s' "$out" | kubectl apply --dry-run=client -f - 2>&1)

              # Each workspace renders its read-only serving PV + PVC.
              printf '%s' "$created" | grep -q 'persistentvolume/kernel-wscustom-probe-ns' \
                || { echo "wscustom serving PV did not parse"; printf '%s\n' "$created" >&2; exit 1; }
              printf '%s' "$created" | grep -q 'persistentvolume/kernel-wsconv-probe-ns' \
                || { echo "wsconv serving PV did not parse"; printf '%s\n' "$created" >&2; exit 1; }

              # wscustom serves from the custom override path, mounted read-only.
              printf '%s' "$out" | grep -q 'path: "/custom/dir"' \
                || { echo "wscustom serving PV missing the custom hostPath"; printf '%s\n' "$out" >&2; exit 1; }
              printf '%s' "$out" | grep -q 'mountPath: "/etc/kernels/probe-ns/wscustom"' \
                || { echo "wscustom not mounted at /etc/kernels/<ns>/<ws>"; printf '%s\n' "$out" >&2; exit 1; }

              # wsconv serves from the convention path.
              printf '%s' "$out" | grep -q 'path: "/var/lib/sycophant/kernels/probe-ns/wsconv"' \
                || { echo "wsconv serving PV missing the convention hostPath"; printf '%s\n' "$out" >&2; exit 1; }

              # NO workspace renders a writer PV or PVC.
              if printf '%s' "$created" | grep -q 'kernel-writer'; then
                echo "a workspace wrongly rendered a writer volume"
                printf '%s\n' "$created" >&2
                exit 1
              fi
              true
