apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-deployer-bad-name-rejected
spec:
  description: |
    The tenant-deployer SA must only be allowed to create namespaces
    whose name matches `^tenant-.+$`. tenant-namespace-naming
    ClusterPolicy's `enforce-tenant-uuid-name` rule denies any other
    name when the requester is the deployer.

    Pair test: tenant-deployer-stamps-labels covers the accept case
    (tenant-* names pass and get mutated). This is the deny case.
  bindings:
    - name: bad_ns
      value: not-a-tenant-ns
  steps:
    - name: deployer-creates-non-tenant-ns
      try:
        - script:
            env:
              - name: BAD_NS
                value: ($bad_ns)
            content: |
              kubectl create namespace "$BAD_NS" --as=system:serviceaccount:infra:tenant-deployer
            check:
              ($error != null): true
              (contains($stderr, 'tenant-deployer may only create namespaces')): true
      finally:
        - script:
            env:
              - name: BAD_NS
                value: ($bad_ns)
            content: |
              kubectl delete namespace "$BAD_NS" --ignore-not-found --wait=false
