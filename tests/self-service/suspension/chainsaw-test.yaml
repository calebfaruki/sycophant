apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: suspension
spec:
  # A real install, so it runs alone.
  concurrent: false
  description: >
    A suspend with a keepalive of 30 days sets the cleanup.kyverno.io/ttl label
    on the tenant namespace to the suspend time plus 30 days, to the second, in
    Kyverno's 2006-01-02T150405Z layout. A suspended tenant refuses every
    in-tenant command. A second suspend scales the tenant back to zero and
    never moves its cleanup label. Its owner cannot lift the suspension, and
    the operator lifts it by removing the label and deleting the suspend
    command, which then survives a Kyverno restart.
  timeouts:
    exec: 120s
  bindings:
    - name: token
      value: (random('[a-z0-9]{8}'))
  steps:
    - name: provision-and-suspend
      try:
        - script:
            timeout: 420s
            env:
              - name: TOKEN
                value: ($token)
            content: |
              . ../lib.sh
              A=$(user "alice-$TOKEN")
              T=$(tenant_hash "$A" "p$TOKEN")
              NS="tenant-$T"
              record "$T" "$A" | kubectl apply -f - >/dev/null
              UID_=$(tenant_command "p$TOKEN" "$A" | as_admin "$A" create -f - -o jsonpath='{.metadata.uid}')
              wait_job_succeeded "$(installer_for "$UID_")"
              wait_owner_grant "$NS" "$A"

              # Keepalive is in days, so Kyverno leaves the tenant alone.
              BEFORE=$(date -u +%s)
              suspend_command keepalive=30 | kubectl create -n "$NS" --as="$A" -f - >/dev/null
              kubectl wait --for=jsonpath='{.metadata.labels.cleanup\.kyverno\.io/ttl}' namespace/"$NS" --timeout=60s >/dev/null \
                || { echo "the suspend command set no cleanup label"; exit 1; }
              AFTER=$(date -u +%s)
              L=$(kubectl get namespace "$NS" -o jsonpath='{.metadata.labels.cleanup\.kyverno\.io/ttl}')
              [[ "$L" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{6}Z$ ]] \
                || { echo "the cleanup label $L is not in the layout 2006-01-02T150405Z"; exit 1; }
              AT=$(jq -rn --arg v "$L" '$v | strptime("%Y-%m-%dT%H%M%SZ") | mktime')
              # The host and the cluster read different clocks.
              SKEW=10
              LOW=$((BEFORE + 30 * 86400 - SKEW))
              HIGH=$((AFTER + 30 * 86400 + SKEW))
              [ "$AT" -ge "$LOW" ] && [ "$AT" -le "$HIGH" ] \
                || { echo "the cleanup label $L ($AT) is not the suspend time plus 30 days ($LOW..$HIGH)"; exit 1; }
      cleanup:
        - script:
            env:
              - name: TOKEN
                value: ($token)
            content: |
              . ../lib.sh
              T=$(tenant_hash "$(user "alice-$TOKEN")" "p$TOKEN")
              drop_tenant "$T"
    - name: a-suspended-tenant-refuses-in-tenant-commands
      try:
        - script:
            env:
              - name: TOKEN
                value: ($token)
            content: |
              . ../lib.sh
              A=$(user "alice-$TOKEN")
              labelled_command provision-agent "a$TOKEN" toolsets=stdlib model=a | refused "an agent command is refused while its tenant is suspended" \
                "the owner's agent command in a suspended tenant" kubectl create -n "tenant-$(tenant_hash "$A" "p$TOKEN")" --as="$A" -f -
    - name: a-second-suspend-scales-to-zero-and-keeps-the-cleanup-label
      try:
        - script:
            timeout: 180s
            env:
              - name: TOKEN
                value: ($token)
            content: |
              . ../lib.sh
              A=$(user "alice-$TOKEN")
              NS="tenant-$(tenant_hash "$A" "p$TOKEN")"
              BEFORE=$(kubectl get namespace "$NS" -o jsonpath='{.metadata.labels.cleanup\.kyverno\.io/ttl}')
              DEPLOY=$(kubectl get deployments -n "$NS" -o name | head -1)
              [ -n "$DEPLOY" ] || { echo "$NS has no Deployment to watch"; exit 1; }
              kubectl scale "$DEPLOY" -n "$NS" --replicas=1 >/dev/null

              suspend_command keepalive=60 | refused "a suspend command is refused while its tenant is suspended" "a second suspend command" \
                kubectl create -n "$NS" --as="$A" -f -

              # The first suspend command is still stored, so Kyverno runs the
              # suspend policies for the refused one: the Deployment returns
              # to zero.
              kubectl wait --for=jsonpath='{.spec.replicas}'=0 "$DEPLOY" -n "$NS" --timeout=60s >/dev/null \
                || { echo "the refused suspend never reached the suspend policy, so it proves nothing about the label"; exit 1; }
              # The label is a separate background request from the scale-down.
              sleep 30
              AFTER=$(kubectl get namespace "$NS" -o jsonpath='{.metadata.labels.cleanup\.kyverno\.io/ttl}')
              [ "$AFTER" = "$BEFORE" ] || { echo "a second suspend moved the cleanup label from $BEFORE to $AFTER"; exit 1; }
    - name: only-the-operator-lifts-a-suspension
      try:
        - script:
            timeout: 300s
            env:
              - name: TOKEN
                value: ($token)
            content: |
              . ../lib.sh
              A=$(user "alice-$TOKEN")
              NS="tenant-$(tenant_hash "$A" "p$TOKEN")"
              # kubectl patch reads the namespace first, so a refused attempt
              # proves nothing about writing it. Ask the server directly.
              for verb in patch update; do
                if as_admin "$A" auth can-i --quiet "$verb" "namespaces/$NS" -n "$NS" 2>/dev/null; then
                  echo "the owner can $verb $NS, so it can remove the cleanup label"
                  exit 1
                fi
              done
              kubectl label namespace "$NS" cleanup.kyverno.io/ttl- >/dev/null
              kubectl delete configmap suspend-tenant -n "$NS" >/dev/null

              # A restart re-runs the suspend policies for every stored command,
              # so a lift that left the command behind is suspended again here.
              kubectl rollout restart deploy/kyverno-background-controller -n kyverno >/dev/null
              kubectl rollout status deploy/kyverno-background-controller -n kyverno --timeout=120s >/dev/null
              for i in $(seq 1 30); do
                [ -z "$(kubectl get namespace "$NS" -o jsonpath='{.metadata.labels.cleanup\.kyverno\.io/ttl}')" ] \
                  || { echo "the lifted tenant was suspended again after a Kyverno restart"; exit 1; }
                sleep 2
              done
              labelled_command provision-agent "a$TOKEN" toolsets=stdlib model=a | kubectl create -n "$NS" --as="$A" -f - >/dev/null
      cleanup:
        - script:
            env:
              - name: TOKEN
                value: ($token)
            content: |
              . ../lib.sh
              kubectl delete configmap "provision-agent-$(hex10 "a$TOKEN")" -n "tenant-$(tenant_hash "$(user "alice-$TOKEN")" "p$TOKEN")" --ignore-not-found
