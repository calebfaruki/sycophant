apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: reap-instruction-files
spec:
  # Takes the object store down, so it runs alone.
  concurrent: false
  description: >
    Kyverno deletes a tenant namespace whose cleanup time has passed. While the
    store is down, the tenant file cleaner runs and the namespace stays,
    Terminating. Once the store is back, the namespace goes, with the tenant's
    instruction folders and its entitlement record, and the folders of a tenant
    whose name merely starts the same way stay.
  timeouts:
    exec: 120s
  bindings:
    - name: token
      value: (random('[a-z0-9]{8}'))
  steps:
    - name: seed-then-expire-the-tenant-with-the-store-down
      try:
        - script:
            timeout: 540s
            env:
              - name: TOKEN
                value: ($token)
            content: |
              . ../lib.sh
              . ./store.sh
              A=$(user "alice-$TOKEN")
              NS="tenant-r$TOKEN"
              record "r$TOKEN" "$A" | kubectl apply -f - >/dev/null
              store_put "$NS" "you are r"
              store_put "$NS-x" "you are r-x"

              kubectl scale deploy/seaweedfs -n sycophant-system --replicas=0 >/dev/null
              for _ in $(seq 1 60); do
                pods=$(kubectl get pods -n sycophant-system -l app.kubernetes.io/component=objectstorage -o name)
                [ -z "$pods" ] && break
                sleep 2
              done
              [ -z "$pods" ] || { echo "the store pod is still running"; exit 1; }

              tenant_ns "$NS" "$A" "2000-01-01T000000Z" | kubectl apply -f - >/dev/null
              kubectl wait --for=jsonpath='{.metadata.deletionTimestamp}' namespace/"$NS" --timeout=180s >/dev/null \
                || { echo "Kyverno never deleted $NS, whose cleanup time has passed"; exit 1; }
              DELETED=$(kubectl get namespace "$NS" -o jsonpath='{.metadata.deletionTimestamp}')
              wait_reaper_runs "$DELETED" '.status.succeeded == 1 or .status.failed >= 1' 1 90 \
                || { echo "no tenant file cleaner run finished while the store was down"; exit 1; }
              [ "$(kubectl get namespace "$NS" -o jsonpath='{.status.phase}')" = Terminating ] \
                || { echo "$NS is gone or not Terminating, though its folders could not be deleted"; exit 1; }
      cleanup:
        - script:
            env:
              - name: TOKEN
                value: ($token)
            content: |
              . ../lib.sh
              . ./store.sh
              kubectl scale deploy/seaweedfs -n sycophant-system --replicas=1 >/dev/null
              kubectl rollout status deploy/seaweedfs -n sycophant-system --timeout=120s >/dev/null
              store_rm "tenant-r$TOKEN" || true
              store_rm "tenant-r$TOKEN-x" || true
              kubectl delete configmap "r$TOKEN" -n sycophant-entitlements --ignore-not-found
              drop_ns "tenant-r$TOKEN"
    - name: the-cleaner-then-deletes-the-tenant-and-only-its-folders
      try:
        - script:
            timeout: 300s
            env:
              - name: TOKEN
                value: ($token)
            content: |
              set -euo pipefail
              . ./store.sh
              NS="tenant-r$TOKEN"
              kubectl scale deploy/seaweedfs -n sycophant-system --replicas=1 >/dev/null
              kubectl rollout status deploy/seaweedfs -n sycophant-system --timeout=120s >/dev/null
              kubectl wait --for=delete namespace/"$NS" --timeout=180s >/dev/null \
                || { echo "$NS survived a cleaner run after the store came back"; exit 1; }
              [ "$(store_status "$NS")" = 404 ] || { echo "$NS's instruction folder survived its cleanup"; exit 1; }
              [ "$(store_status "$NS-x")" = 200 ] || { echo "the cleanup of $NS deleted $NS-x's instruction folder"; exit 1; }
              ! kubectl get configmap "r$TOKEN" -n sycophant-entitlements >/dev/null 2>&1 \
                || { echo "$NS's entitlement record survived its cleanup"; exit 1; }
