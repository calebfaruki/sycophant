# Admitted: agent par dispatches its own sub-agent sub in the dispatch shape.
apiVersion: batch/v1
kind: Job
metadata:
  name: well-formed
  namespace: tenant-offline
spec:
  template:
    metadata:
      labels:
        sycophant.md/job-kind: dispatch
    spec:
      serviceAccountName: ag-sub
      hostname: sub-0a1b2c3d
      subdomain: ag-par-dispatch
      initContainers:
        - name: instructions-sync
          image: sycophant-harness:local
          command: ["/bin/rclone"]
          volumeMounts:
            - name: objectstore-token
              mountPath: /var/run/secrets/objectstore
      containers:
        - name: harness
          image: sycophant-harness:local
          volumeMounts:
            - name: conversation-data
              mountPath: /var/lib/harness
              subPath: sub/0a1b2c3d
            - name: instructions
              mountPath: /etc/instructions/sub
      volumes:
        - name: conversation-data
          persistentVolumeClaim:
            claimName: ag-par-conversation
        - name: instructions
          emptyDir: {}
        - name: objectstore-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: sycophant-objectstore
---
# Denied: the harness container runs an image other than the agent's harness
