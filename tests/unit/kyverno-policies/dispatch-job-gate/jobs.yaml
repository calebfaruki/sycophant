kind: Job
metadata:
  name: secret-env
  namespace: tenant-offline
spec:
  template:
    metadata:
      labels:
        sycophant.md/job-kind: dispatch
    spec:
      serviceAccountName: ag-sub
      hostname: sub-0a1b2c3d
      subdomain: ag-par-dispatch
      containers:
