apiVersion: cli.kyverno.io/v1alpha1
kind: Context
metadata:
  name: context
spec:
  resources:
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: inf-deepseek
        namespace: tenant-offline
        labels:
          sycophant.md/type: model
      data:
        secret: llm-openrouter
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ag-research-toolset-secrets
        namespace: tenant-offline
        labels:
          sycophant.md/type: toolset-secrets
      data:
        approved-secret: tool
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ag-other-toolset-secrets
        namespace: tenant-offline
        labels:
          sycophant.md/type: toolset-secrets
      data:
        other-secret: tool
