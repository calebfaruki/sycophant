apiVersion: batch/v1
kind: Job
metadata:
  name: inference-own-model-secret
  namespace: tenant-offline
spec:
  template:
    metadata:
      labels:
        sycophant.md/job-kind: inference
        sycophant.md/model: deepseek
    spec:
      restartPolicy: Never
      serviceAccountName: ag-research-unprivileged
      volumes:
        - name: credential
          secret:
            secretName: llm-openrouter
      containers:
        - name: runtime
          image: registry.k8s.io/pause:3.9
---
