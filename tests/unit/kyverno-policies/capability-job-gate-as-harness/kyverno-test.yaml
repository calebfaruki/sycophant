apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: capability-job-gate-as-harness
policies:
  - policy.yaml
resources:
  - resource-mounts.yaml
  - jobs.yaml
  - model-secret.yaml
  - extra.yaml
userinfo: user-harness-research.yaml
context: context.yaml
variables: values.yaml
results:
  - policy: cluster-capability-job-gate
    kind: Job
    result: pass
    resources:
      - tenant-offline/own-agent-pvc
      - tenant-offline/inference-own-model-secret
      - tenant-offline/approved-secret-env
  - policy: cluster-capability-job-gate
    kind: Job
    result: fail
    resources:
      - tenant-offline/sibling-agent-pvc
      - tenant-offline/conversation-history-pvc
      - tenant-offline/configmap-volume
      - tenant-offline/configmap-env
      - tenant-offline/configmap-envfrom
      - tenant-offline/inference-other-model-secret
      - tenant-offline/tool-model-secret
      - tenant-offline/off-secret-volume
      - tenant-offline/off-secret-projected
      - tenant-offline/off-secret-env-init
      - tenant-offline/off-secret-envfrom
      - tenant-offline/off-image-pull-secret
      - tenant-offline/cross-agent-secret
      - tenant-offline/csi-volume
      - tenant-offline/wrong-sa
      - tenant-offline/bad-job-kind
      - tenant-offline/hostile-security-context
  - policy: cluster-capability-job-gate-envelope
    isMutatingPolicy: true
    kind: Job
    result: pass
    resources:
      - tenant-offline/minimal-template
      - tenant-offline/hostile-security-context
    patchedResources: patched.yaml
