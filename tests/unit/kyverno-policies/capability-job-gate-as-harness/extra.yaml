apiVersion: batch/v1
kind: Job
metadata:
  name: approved-secret-env
  namespace: tenant-offline
spec:
  template:
    metadata:
      labels:
        sycophant.md/job-kind: tool
    spec:
      restartPolicy: Never
      serviceAccountName: ag-research-unprivileged
      containers:
        - name: runtime
          image: registry.k8s.io/pause:3.9
          env:
            - name: T
              valueFrom:
                secretKeyRef:
                  name: approved-secret
                  key: t
---
apiVersion: batch/v1
kind: Job
metadata:
  name: off-secret-volume
  namespace: tenant-offline
spec:
  template:
    metadata:
      labels:
        sycophant.md/job-kind: tool
    spec:
      restartPolicy: Never
      serviceAccountName: ag-research-unprivileged
      volumes:
        - name: c
          secret:
            secretName: not-approved
      containers:
        - name: runtime
          image: registry.k8s.io/pause:3.9
---
apiVersion: batch/v1
kind: Job
