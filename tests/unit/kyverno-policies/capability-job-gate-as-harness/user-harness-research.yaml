# The gate keys every rule on the authenticated creator. Impersonating
# harness-research is what makes `workspace` resolve to `research`, so the
# approved PVC name the rules derive is `workspace-data-research`.
apiVersion: cli.kyverno.io/v1alpha1
kind: UserInfo
metadata:
  name: harness-research
userInfo:
  username: system:serviceaccount:tenant-offline:harness-research
  groups:
    - system:serviceaccounts
    - system:serviceaccounts:tenant-offline
    - system:authenticated
