apiVersion: batch/v1
kind: Job
metadata:
  name: minimal-template
  namespace: tenant-offline
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/component: capability-job
        sycophant.md/job-kind: tool
        sycophant.md/agent: research
    spec:
      automountServiceAccountToken: false
      containers:
        - image: registry.k8s.io/pause:3.9
          name: runtime
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      restartPolicy: Never
      runtimeClassName: gvisor
      serviceAccountName: ag-research-unprivileged
---
