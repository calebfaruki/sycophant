apiVersion: batch/v1
kind: Job
metadata:
  name: minimal-template
  namespace: tenant-offline
spec:
  template:
    metadata:
      labels:
        sycophant.md/agent: other
        sycophant.md/job-kind: tool
    spec:
      restartPolicy: Never
      serviceAccountName: ag-research-unprivileged
      containers:
        - name: runtime
          image: registry.k8s.io/pause:3.9
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hostile-security-context
  namespace: tenant-offline
spec:
  template:
    metadata:
      labels:
        sycophant.md/job-kind: tool
    spec:
      restartPolicy: Never
      serviceAccountName: ag-research-unprivileged
      containers:
        - name: runtime
          image: registry.k8s.io/pause:3.9
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: true
