apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-namespace-naming
policies:
  - policy.yaml
resources:
  - resource-bad-name.yaml
  - resource-good-name.yaml
userinfo: user-tenant-deployer.yaml
results:
  - policy: tenant-namespace-naming
    rule: enforce-tenant-uuid-name
    kind: Namespace
    resources:
      - not-a-tenant-ns
    result: fail
  - policy: tenant-namespace-naming
    rule: enforce-tenant-uuid-name
    kind: Namespace
    resources:
      - tenant-alice
    result: pass
