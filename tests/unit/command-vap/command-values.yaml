tenant:
  name: acme
  capacity: 2Gi
  keepalive: 30
  owner: "https://sycophant-dex.sycophant-system.svc.cluster.local:5556/dex#operator"
  ownerHash: "027164b38d531173"

inference:
  name: local
  tenant: acme
  format: openai
  model: liquid/lfm2.5-8b-a1b
  server:
    image: llama-server:local
    weights: ghcr.io/example/weights:1
    weightsPath: /weights/model.gguf
    weightsDelivery: copy
    contextBudget: 65536
    slots: 2
    outputCap: 4096
    threads: 4
    temp: 0.6
    memory: 8Gi
    cpu: 4
    singleNodeException: false
    thinking: false

toolset:
  name: hello-world
  tenant: acme
  image: ghcr.io/sycophant-md/hello-world@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  keepalive: true
  deadlineSeconds: 300
  env:
    GIT_TERMINAL_PROMPT: "0"
  tools:
    tool.git-status.description: Show the working tree status in the workspace.
    tool.git-clone.description: Clone a git repository.
    tool.git-clone.arg.url.type: string
    tool.git-clone.arg.url.required: "true"
    tool.git-clone.arg.url.env: URL
    tool.git-clone.arg.url.description: Repository URL.

agent:
  name: hello-world
  tenant: acme
  toolsets: hello-world
  model: deepseek
  storage: 5Gi
  secret.hello-world.demo-ssh-key: /home/agent/.ssh/id_ed25519
  secret.hello-world.demo.dotted: /home/agent/.ssh/id_rsa
  egress.hello-world: git.example.com,github.com

instructions:
  name: hello-world
  tenant: acme
  # Set by sycoadm from the instructions folder: a base64 gzip tar.
  archive: "H4sIAFU932oC/+3NMQrCQAAEwKt9xb0gHEnQ2kLsbExjGTFgI5Ez+b9HGsFeEZxpdtlmt/vdoTtWt0v4nFSs23bJ4j1TqptXX/ZN3TYhpvAF82Pqc7kM/+k0zrHPQ5yuQ7zn8TxUqwAAAAAAAAAAAMDvewIo91QUACgAAA=="

user:
  tenant: acme
  subject: "https://dex.example.com/dex#alice"

channel:
  name: app
  tenant: acme
  loginServer: http://headscale:8080
  image: tailscale/tailscale
  tag: v1.80.0
  pullPolicy: Always
  hostname: relay
  authKeySecret: relay-tsnet-authkey
  storageClass: local-path

headscale:
  enabled: true
  serverUrl: http://localhost:8080
  magicDns: true
  baseDomain: ts.local
  acme:
    enabled: false
    email: ops@example.com
