# Agent provision commands under the one-model, per-toolset Secrets and egress
# shape. Every command names one model unless it tests the missing model, so
# each refusal is about its own rule. Names are provision-agent-<first ten hex
# of sha256(target)>.
# a Secret for a toolset not in 'toolsets'
apiVersion: v1
kind: ConfigMap
metadata:
  name: provision-agent-f0c711d6d4
  annotations:
    sycophant.md/target: unlistedsecret
  namespace: tenant-acme
  labels:
    sycophant.md/command: 'true'
    app.kubernetes.io/part-of: sycophant
data:
  toolsets: 'stdlib'
  model: 'a'
  secret.hello-world.demo-key: '/home/agent/.ssh/id_ed25519'
---
# egress for a toolset not in 'toolsets'
apiVersion: v1
kind: ConfigMap
metadata:
  name: provision-agent-89e8d91f57
  annotations:
    sycophant.md/target: unlistedegress
  namespace: tenant-acme
  labels:
    sycophant.md/command: 'true'
    app.kubernetes.io/part-of: sycophant
data:
  toolsets: 'stdlib'
  model: 'a'
  egress.hello-world: 'github.com'
---
