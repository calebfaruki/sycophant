{{- /* A `server` block makes the model local; without one it is remote. */ -}}
{{- with .Values.inference }}
{{- $data := pick . "format" "model" "baseUrl" "image" "secret" }}
{{- range $k, $v := .server }}{{ $_ := set $data (printf "server.%s" $k) $v }}{{ end }}
{{ include "commands.command" (dict "name" (include "commands.name" (dict "verb" "provision" "kind" "inference" "target" .name)) "target" .name "namespace" (include "commands.tenantNs" .tenant) "data" $data) }}
{{- end }}
