{{- with .Values.user }}
{{- $data := dict "user" .subject }}
{{- with .workspaces }}{{ $_ := set $data "workspaces" (join "," .) }}{{ end }}
{{- range $channel, $handle := .handles }}
{{- $_ := set $data (printf "handle.%s" $channel) $handle }}
{{- end }}
{{ include "commands.command" (dict "name" (include "commands.name" (dict "verb" "provision" "kind" "user" "target" .subject)) "target" .subject "namespace" (include "commands.tenantNs" .tenant) "data" $data) }}
{{- end }}
