{{- /* Without a keepalive the tenant scales to zero and stays. */ -}}
{{- with .Values.tenant }}
{{- $data := dict }}
{{- if hasKey . "keepalive" }}{{ $_ := set $data "keepalive" .keepalive }}{{ end }}
{{ include "commands.command" (dict "name" "suspend-tenant" "namespace" (include "commands.tenantNs" (.hash | default .name)) "data" $data) }}
{{- end }}
