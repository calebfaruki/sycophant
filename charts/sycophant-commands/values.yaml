# Set one kind's block. Each template renders only when its block is set.
#
# Names: a per-target command is <verb>-<kind>-<10hex>, the first ten
# hex of sha256(target), with the full target in its sycophant.md/target
# annotation. A tenant is tenant-<10hex>, the first ten hex of
# sha256(owner + "\n" + chosen name). A kind's `tenant` names the namespace
# tenant-<tenant>: sycoadm resolves the chosen name to its 10hex.

# tenant:
#   name: acme              # the chosen name, free text; rides in sycophant.md/target
#   owner: ""               # set by sycoadm: the login's identity
#   ownerHash: ""           # set by sycoadm
#   hash: ""                # set by sycoadm for an existing tenant
#   capacity: 2Gi           # provision: the tenant's memory quota
#   keepalive: 30           # suspend: days kept before reap (0, 30, 60, 90); unset keeps it

# inference:
#   name: deepseek
#   tenant: acme
#   format: openai          # anthropic, openai, gemini
#   model: deepseek-v4-flash
#   baseUrl: https://api.deepseek.com   # remote only
#   image: ghcr.io/sycophant-md/openai-job@sha256:...   # remote only
#   secret: deepseek-key                # remote only
#   server: {}              # local only: image, weights, weightsPath, weightsDelivery,
#                           # contextBudget, slots, outputCap, threads, temp, memory,
#                           # cpu, singleNodeException, chatTemplate, thinking

# toolset:
#   name: hello-world
#   tenant: acme
#   image: ghcr.io/sycophant-md/toolset-hello-world@sha256:...
#   keepalive: false
#   deadlineSeconds: 300
#   env: {}                 # NAME: value
#   tools: {}               # the image's md.sycophant.tools label, tool.* keys as is

# agent:
#   name: hello-world
#   tenant: acme
#   toolsets: ""            # comma list
#   model: ""               # exactly one model
#   storage: 5Gi
#   archives: 10            # archives kept on compact
#   secret.<toolset>.<Secret name>: <path>
#   egress.<toolset>: ""    # comma list of exact domains

# instructions:
#   name: hello-world       # the agent
#   tenant: acme
#   folder: hello-world     # read by sycoadm only, never rendered:
#                           # the instructions folder, relative to this file
#   archive: ""             # set by sycoadm only, from the folder: a base64 gzip tar

# user:
#   tenant: acme
#   subject: "https://dex.example.com/dex#alice"
#   agents: []               # the subject's granted agent names
#   handles: {}              # <channel>: that platform's user ID, e.g. slack: U0123ABCDEF

# channel:
#   name: tailnet
#   tenant: acme
#   loginServer: http://headscale:8080
#   image: tailscale/tailscale
#   tag: stable
#   pullPolicy: IfNotPresent
#   hostname: relay
#   authKeySecret: relay-tsnet-authkey
#   storageClass: ""
#   NOTE: headscale itself is now in the tenant chart (headscale.* values in
#   the tenant values file), not the channel chart.
