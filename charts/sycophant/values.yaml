# Tightbeam controller -- LLM communications.
# Manages Model CRDs, creates ephemeral LLM Jobs.
controller:
  image: ghcr.io/calebfaruki/tightbeam-controller
  tag: "latest"
  pullPolicy: Always
  llmJobImage: ghcr.io/calebfaruki/tightbeam-llm-job:latest

# Airlock controller -- tool execution.
# Watches Chamber CRDs, discovers tools from OCI image labels.
airlock:
  image: ghcr.io/calebfaruki/airlock-controller
  tag: "latest"
  pullPolicy: Always

# Transponder -- agent runtime (pure router).
# Routes between tightbeam (LLM), airlock (tools), and the
# in-pod mainframe-runtime (local MCP). Stateless.
transponder:
  image: ghcr.io/calebfaruki/sycophant-transponder
  tag: "latest"
  pullPolicy: Always

# Mainframe controller -- watches Mainframe CRDs.
# v0 ships only `kind: HostPath`, where the workspace pod mounts the host
# filesystem directly at /etc/mainframe. The controller's reconciliation is
# a no-op for HostPath; the binary stays deployed as scaffolding for future
# non-HostPath source kinds (per ADR 010, those ship in separate-repo
# adapters with their own controllers).
mainframe:
  image: ghcr.io/calebfaruki/mainframe-controller
  tag: latest
  pullPolicy: Always
  # Periodic reconcile cadence in seconds. Each tick re-reconciles every
  # known Mainframe; v0 reconciliation is a no-op.
  refreshIntervalSeconds: 60

# Workspaces -- one entry per agent workspace.
# Each workspace becomes a pod with transponder + mainframe-runtime
# containers, a PVC for working files, and a NetworkPolicy
# restricting egress to tightbeam and airlock controllers only.
#
# Schema:
#   <name>:
#     image: <mainframe-runtime image>  (required)
#     tag: <image tag>                  (required)
#     pullPolicy: <IfNotPresent|Always|Never>  (default: IfNotPresent)
#     chambers:                         (optional, list of chamber names)
#       - <chamber-name>
#     instructions:                     (optional, absolute host filesystem path)
#       # Source for the agent's principal-authored content (AGENTS.md,
#       # skills, sub-agent definitions, knowledge). The chart renders a
#       # Mainframe CR with `spec.source.kind: HostPath` and the workspace
#       # pod mounts this directory read-only at /etc/mainframe via a
#       # `hostPath` volume. The path must be a directory on the host
#       # node where the workspace pod runs.
#
# Example:
#   workspaces:
#     research:
#       image: ghcr.io/myorg/mainframe-runtime
#       tag: "1.0"
#       instructions: /Users/me/sycophant/workspaces/research
#     coding:
#       image: ghcr.io/myorg/mainframe-runtime
#       tag: "1.0"
#       instructions: /Users/me/sycophant/workspaces/coding
#       chambers:
#         - git-ops
workspaces: {}

# Chambers -- execution environments for tool Jobs.
# Each chamber defines credentials and network egress allowed for Jobs
# that run inside it. The workspace PVC is mounted RW at /workspace
# (convention, not configurable). A matching CiliumNetworkPolicy is
# rendered for each chamber.
#
# Schema:
#   <name>:
#     image: <OCI image with dev.airlock.tools label>  (optional)
#     keepalive: <bool>                  (default: false)
#     credentials:                       (optional, list)
#       - secret: <secret name>          (required)
#         env: <env var name>            (set env from secret key)
#         file: <file path>             (mount secret key as file)
#     egress:                            (optional, list)
#       - host: <hostname>              (required)
#         port: <port>                  (required)
#
# Example:
#   chambers:
#     git-ops:
#       image: ghcr.io/calebfaruki/airlock-git:latest
#       credentials:
#         - secret: git-ssh-key
#           file: /root/.ssh/id_ed25519
#       egress:
#         - host: github.com
#           port: 22
chambers: {}

# Providers -- LLM provider connections (format, baseUrl, secret).
# A Provider holds the stable parts of an LLM connection;
# Model resources reference a provider by name.
#
# Schema:
#   <name>:
#     format: <anthropic|openai|gemini>   (required)
#     baseUrl: <API endpoint URL>         (optional; format-canonical default)
#     secret:                             (required)
#       name: <secret name>               (required)
#       key: <secret key>                 (optional, defaults to "api-key")
#
# Example:
#   providers:
#     anthropic:
#       format: anthropic
#       baseUrl: https://api.anthropic.com/v1
#       secret:
#         name: sycophant-llm-anthropic
#         key: api-key
providers: {}

# Models -- LLM model registrations.
# A Model binds a registered name (used in resolution) to a model
# identifier on a specific Provider, with optional pass-through
# params merged into the provider request body.
#
# Schema:
#   <name>:
#     providerRef:                        (required)
#       name: <provider name>             (required, must match providers.<name>)
#     model: <model identifier>           (required)
#     params:                             (optional, opaque pass-through)
#       <provider-specific keys per the provider's API docs>
#
# Example:
#   models:
#     default:
#       providerRef:
#         name: anthropic
#       model: claude-sonnet-4-20250514
#       params:
#         output_config: { effort: high }
models: {}

# Channels -- messaging platform connections.
# Each channel defines a platform type, secret reference, and image.
# The controller creates a channel Job with the bot token mounted by kubelet.
#
# Schema:
#   <name>:
#     type: <discord|slack|telegram>      (required)
#     secretName: <secret name>           (required)
#     image: <channel job image>          (required)
#
# Example:
#   channels:
#     discord-bot:
#       type: discord
#       secretName: discord-bot-token
#       image: ghcr.io/calebfaruki/tightbeam-channel-discord:latest
channels: {}

# Headscale -- self-hosted Tailscale-compatible control plane.
#
# Phase 1 prototype: opt-in for local-machine self-host scenarios. Hobbyists
# and Mac-mini-style operators flip enabled=true to get tailnet-based ingress
# for Tightbeam. DevOps deployments leave it disabled and bring their own
# ingress (proper K8s Ingress, cert-manager, OIDC, etc.).
#
# When enabled, the operator must:
#   1. Own a domain (set headscale.serverUrl to https://<that domain>)
#   2. Port-forward router :443 to the K8s NodePort/LB targeting headscale's
#      :8080 (Phase 1 uses ClusterIP; expose via port-forward for laptop
#      bootstrap, NodePort/Ingress in a future phase)
#   3. After install, mint pre-auth keys via kubectl exec:
#        kubectl exec deploy/headscale -- headscale users create <user>
#        kubectl exec deploy/headscale -- headscale preauthkeys create -u <user> -e 24h
#
# Schema:
#   enabled:    bool                      (default: false)
#   image:      string                    (default: headscale/headscale)
#   tag:        string                    (default: 0.28.0)
#   pullPolicy: Always|IfNotPresent|Never (default: IfNotPresent)
#   serverUrl:  string                    (required when enabled, e.g.
#                                          https://hs.example.com)
#   magicDns:   bool                      (default: true; gives tailnet
#                                          members short hostnames)
#   baseDomain: string                    (default: ts.local)
headscale:
  enabled: false
  image: headscale/headscale
  tag: "0.28.0"
  pullPolicy: IfNotPresent
  serverUrl: ""
  magicDns: true
  baseDomain: ts.local
  # ACME (Let's Encrypt) for the headscale HTTPS endpoint. Required when
  # mobile clients (Phase 2 Flutter app) need to register from cellular —
  # the phone's Tailscale Android needs an HTTPS control plane URL.
  #
  # When acme.enabled=true, the chart switches headscale's API listener
  # from :8080 to :443 (HTTPS) and adds a :80 listener for the HTTP-01
  # challenge. Operator must port-forward router :443 → Service :443 AND
  # :80 → Service :80, with DNS pointing the serverUrl hostname at the
  # Mac mini's public IP.
  #
  # When acme.enabled=false (default), headscale serves plain HTTP on
  # :8080 — fine for laptop bootstrap via port-forward, insufficient for
  # phones on cellular.
  acme:
    enabled: false
    # Email registered with Let's Encrypt for cert lifecycle notifications.
    email: ""

# tsnet bridge -- Tailscale sidecar that joins headscale and forwards
# tailnet TCP traffic to the in-cluster Tightbeam Service.
#
# Opt-in, paired with headscale.enabled=true. Tailnet membership gates
# reachability; the controller's JWT verifier (Phase 2) gates operations.
# The signing key the controller uses is auto-generated in its log PVC —
# no Secret to wire here for auth, only the headscale pre-auth key.
#
# When enabled, the operator must:
#   1. Mint a headscale pre-auth key for the bridge node
#   2. Create the authKeySecret Secret with key `authkey` containing it
#   3. Mint enrollment codes per device via:
#        kubectl exec deploy/tightbeam-controller -- \
#          tightbeam-controller mint-enrollment <workspace> <device-name>
#      (Phase 2 — see docs/flutter-app.md)
#
# Schema:
#   enabled:           bool                      (default: false)
#   image:             string                    (default: tailscale/tailscale)
#   tag:               string                    (default: stable)
#   pullPolicy:        Always|IfNotPresent|Never (default: IfNotPresent)
#   loginServer:       string                    (required when enabled, e.g.
#                                                  https://hs.example.com)
#   hostname:          string                    (default: tightbeam; tailnet
#                                                  members reach Tightbeam at
#                                                  this hostname via MagicDNS)
#   authKeySecret:     string                    (default: tightbeam-tsnet-authkey)
tsnetBridge:
  enabled: false
  image: tailscale/tailscale
  tag: stable
  pullPolicy: IfNotPresent
  loginServer: ""
  hostname: tightbeam
  authKeySecret: tightbeam-tsnet-authkey
