{{- range $name, $ws := .Values.workspaces }}
{{- if $ws.instructions }}
---
apiVersion: sycophant.md/v1
kind: Mainframe
metadata:
  name: {{ $name }}
  labels:
    {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 4 }}
    app.kubernetes.io/component: mainframe
spec:
  source:
    kind: HostPath
    hostPath:
      path: {{ $ws.instructions | quote }}
{{- end }}
{{- end }}
