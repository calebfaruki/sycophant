{{- if .Values.tsnetBridge.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: tightbeam-tsnet-bridge-serve
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tightbeam-tsnet-bridge
    app.kubernetes.io/name: tightbeam-tsnet-bridge
data:
  # Tailscale serve config: forward tailnet TCP :9090 → in-cluster Tightbeam.
  # No TLS termination; gRPC HTTP/2 cleartext rides the tailnet's WireGuard
  # E2E encryption. JWT authz is enforced by Tightbeam at the gRPC layer
  # (signing key auto-generated in the controller's log PVC).
  serve.json: |
    {
      "TCP": {
        "9090": {
          "HTTPS": false,
          "TCPForward": "tightbeam-controller.{{ .Release.Namespace }}.svc:9090"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tightbeam-tsnet-bridge
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tightbeam-tsnet-bridge
    app.kubernetes.io/name: tightbeam-tsnet-bridge
spec:
  replicas: 1
  # State persisted in a Kube Secret (TS_KUBE_SECRET); rolling updates
  # would briefly desync the tailnet node identity. Recreate is simpler.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tightbeam-tsnet-bridge
      app.kubernetes.io/part-of: sycophant
  template:
    metadata:
      labels:
        {{- include "sycophant.labels" . | nindent 8 }}
        app.kubernetes.io/component: tightbeam-tsnet-bridge
        app.kubernetes.io/name: tightbeam-tsnet-bridge
      annotations:
        # Roll the pod when bridge values change (loginServer, hostname,
        # secret refs). Matches the ctrl.yaml/headscale.yaml pattern.
        sycophant.io/tsnet-bridge-checksum: {{ .Values.tsnetBridge | toYaml | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-tightbeam-tsnet-bridge
      containers:
        - name: tailscale
          image: "{{ .Values.tsnetBridge.image }}:{{ .Values.tsnetBridge.tag }}"
          imagePullPolicy: {{ .Values.tsnetBridge.pullPolicy | default "IfNotPresent" }}
          # Userspace networking mode: WireGuard runs in gVisor netstack
          # rather than via a kernel TUN device. No CAP_NET_ADMIN needed,
          # which lets the pod run non-root and drop all capabilities.
          env:
            - name: TS_USERSPACE
              value: "true"
            - name: TS_HOSTNAME
              value: {{ .Values.tsnetBridge.hostname | quote }}
            - name: TS_EXTRA_ARGS
              value: {{ printf "--login-server=%s" (required "tsnetBridge.loginServer is required when tsnetBridge.enabled=true" .Values.tsnetBridge.loginServer) | quote }}
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tsnetBridge.authKeySecret }}
                  key: authkey
            - name: TS_KUBE_SECRET
              # Persisted node state Secret. Lets the bridge keep its tailnet
              # identity across pod restarts.
              value: tightbeam-tsnet-bridge-state
            - name: TS_SERVE_CONFIG
              value: /etc/tsnet/serve.json
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # No containerPort: the bridge listens on its tailnet interface,
          # not on a port reachable from the cluster pod network.
          volumeMounts:
            - name: serve-config
              mountPath: /etc/tsnet
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: serve-config
          configMap:
            name: tightbeam-tsnet-bridge-serve
        - name: tmp
          emptyDir: {}
---
# Minimal RBAC so the bridge container can read/write its TS_KUBE_SECRET
# (state persistence across restarts).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-tightbeam-tsnet-bridge
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tightbeam-tsnet-bridge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-tightbeam-tsnet-bridge
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tightbeam-tsnet-bridge
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [tightbeam-tsnet-bridge-state]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-tightbeam-tsnet-bridge
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tightbeam-tsnet-bridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-tightbeam-tsnet-bridge
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-tightbeam-tsnet-bridge
{{- end }}
