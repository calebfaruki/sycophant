apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: caddy
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: sycophant
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy
        app.kubernetes.io/component: ingress
        app.kubernetes.io/part-of: sycophant
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.pullPolicy | default "IfNotPresent" }}
          command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
          env:
            - { name: XDG_DATA_HOME, value: /data }
            - { name: XDG_CONFIG_HOME, value: /config }
          ports:
            - { name: https, containerPort: 8443 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /config }
            - { name: caddyfile, mountPath: /etc/caddy, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: caddy-data }
        - name: config
          emptyDir: {}
        - name: caddyfile
          configMap: { name: caddy-config }
