apiVersion: v2
name: sycophant-gvisor
description: |
  gVisor RuntimeClass for sycophant capability-job (and channel) pods. Install once per
  cluster. Pairs with operator-managed runsc binary install on each node
  (k3d ad-hoc today; see `install_gvisor` in cli/src/commands/setup.rs, run
  by `sycoadm setup`, for the reference recipe).

  Capability-job (and channel) pods get `runtimeClassName: gvisor` stamped on
  them at admission by the cluster-runtime-class Kyverno MutatingPolicy
  (`charts/sycophant-cluster/templates/runtime-class-kpol.yaml`).
  The harness and relay components run on the
  kubelet-default runtime.
version: 0.1.0
appVersion: "0.1.0"
