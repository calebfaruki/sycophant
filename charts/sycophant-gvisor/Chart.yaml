apiVersion: v2
name: sycophant-gvisor
description: |
  gVisor RuntimeClass for sycophant transponder and job pods. Install
  once per cluster. Pairs with operator-managed runsc binary install
  on each node (k3d ad-hoc today; see scripts/e2e.sh:install_gvisor for
  the reference recipe).

  The four adversarial pods (transponder, llm-job, airlock-job,
  channel-job) get `runtimeClassName: gvisor` stamped on them at
  admission by the cluster-runtime-class Kyverno mutate ClusterPolicy
  (`charts/sycophant-cluster/templates/runtime-class-cpol.yaml`).
version: 0.1.0
appVersion: "0.5.0"
