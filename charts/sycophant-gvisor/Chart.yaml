apiVersion: v2
name: sycophant-gvisor
description: |
  gVisor RuntimeClass for sycophant workspace pods. Install once per
  cluster. Pairs with operator-managed runsc binary install on each
  node (k3d ad-hoc today; see scripts/e2e.sh:install_gvisor for the
  reference recipe).

  Workspace pods reference this RuntimeClass via the
  sycophant-tenant chart's `runtime.className` value (defaults to
  `gvisor`).
version: 0.1.0
appVersion: "0.5.0"
