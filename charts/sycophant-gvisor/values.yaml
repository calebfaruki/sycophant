# sycophant-gvisor — install once per cluster.
#
# No values required. The chart ships a single RuntimeClass named
# `gvisor` with handler `runsc`. The name is referenced from the
# sycophant-tenant chart's `runtime.className` default and from the
# sycophant-cluster's Sandbox ValidatingAdmissionPolicy — both are
# unparameterized, so this chart's RuntimeClass name is also fixed.
