apiVersion: v2
name: sycophant-quickstart
description: |
  Sycophant cluster-scoped install bundle. Contains the kyverno-crds sibling
  chart (CRDs that survive Kyverno uninstall), gVisor RuntimeClass, and the
  sycophant-cluster chart. Prerequisites the operator must install themselves:
  Cilium 1.19.x in kube-system, and Kyverno 3.5.x in a dedicated `kyverno`
  namespace labelled `pod-security.kubernetes.io/enforce=restricted`.

  Hobbyist one-command install: run `syco install` from the repo root, which
  installs Cilium + Kyverno + this chart in the right namespaces.
type: application
version: 0.1.0
appVersion: "0.5.0"
dependencies:
  - name: sycophant-gvisor
    version: "0.1.0"
    repository: "file://../sycophant-gvisor"
  - name: sycophant-cluster
    version: "0.1.0"
    repository: "file://../sycophant-cluster"
