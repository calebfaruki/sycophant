apiVersion: v2
name: sycophant-quickstart
description: |
  Sycophant cluster-scoped install bundle: the gVisor RuntimeClass and the
  sycophant-cluster chart. Prerequisites the operator must install themselves:
  Cilium 1.19.x in kube-system, the kyverno-crds chart, and Kyverno 3.9.x in a
  dedicated `kyverno` namespace labelled
  `pod-security.kubernetes.io/enforce=restricted`.
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: sycophant-gvisor
    version: "0.1.0"
    repository: "file://../sycophant-gvisor"
  - name: sycophant-cluster
    version: "0.1.0"
    repository: "file://../sycophant-cluster"
