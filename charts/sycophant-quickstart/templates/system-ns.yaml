{{/*
`sycophant-system` holds the tenant-deployer ServiceAccount (no pods).
PSA labels lock the namespace to `restricted` so any future pod admitted
here must satisfy the restricted profile.
*/}}
apiVersion: v1
kind: Namespace
metadata:
  name: sycophant-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
