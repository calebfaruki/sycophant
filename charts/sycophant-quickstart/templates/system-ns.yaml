{{/*
`sycophant-system` holds the tenant-deployer ServiceAccount and the shared
SeaweedFS object store (a running Deployment). PSA labels lock the namespace to
`restricted`, so any pod admitted here must satisfy the restricted profile;
the SeaweedFS spec does.
*/}}
apiVersion: v1
kind: Namespace
metadata:
  name: sycophant-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
