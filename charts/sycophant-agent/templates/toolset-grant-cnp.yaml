{{/*
Per-grant egress policy for tool-job pods, authored from the same agent
provision command keys that carry the grant. One CiliumNetworkPolicy per
(agent, toolset, grant) triple whose grant declares `egress`. A grant that
declares only a secret opens nothing and renders no policy: the credential and
the network hole are separable, and a local-use credential such as an ssh key
needs no destination.

The endpointSelector is COMPOUND over the agent, toolset, and grant labels
together, so a grant name reused under a different (agent, toolset) pair
cannot cross-wire egress. The harness stamps all three at Job construction, so
this policy applies from the pod's first instant.

The policy pins the grant's one domain, both as an L7 `rules.dns` matchName on
:53 and as a `toFQDNs` egress on 443. The :53 rule MUST stay L7 (never L4-only)
to avoid the L4-shadows-L7 hazard documented in harness-cnp.yaml. Wildcards do
not carry forward: one domain, `matchName` only, no `matchPattern` sibling.

Egress is authored by the operator through the agent provision command.
Nothing creates, patches, or deletes network policy at runtime.
*/}}
{{- $agent := .Values.name }}
{{- range $toolset, $byGrant := include "sycophant.commandGrants" .Values.command | fromYaml }}
{{- range $grant, $spec := $byGrant }}
{{- if $spec.egress }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ag-{{ $agent }}-grant-{{ $toolset }}-{{ $grant }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    sycophant.md/type: toolset-grant-egress
    sycophant.md/agent: {{ $agent | quote }}
    sycophant.md/toolset: {{ $toolset | quote }}
    sycophant.md/grant: {{ $grant | quote }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: sycophant
      sycophant.md/agent: {{ $agent | quote }}
      sycophant.md/toolset: {{ $toolset | quote }}
      sycophant.md/grant: {{ $grant | quote }}
  egress:
    # DNS: resolve only this grant's one domain. L7 on :53 (never L4-only) so it
    # never shadows a sibling policy's L7 DNS allowlist.
    {{- include "sycophant.dnsEgress" . | nindent 4 }}
          rules:
            dns:
              - matchName: {{ $spec.egress | quote }}
    - toFQDNs:
        - matchName: {{ $spec.egress | quote }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
{{- end }}
{{- end }}
