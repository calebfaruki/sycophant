{{/*
Per-agent materialization for the agent its provision command
installs. The workspace PVC is mounted by harness-spawned tool jobs (RW).
The harness owns a SEPARATE conversation-history PVC (tool jobs never mount
it, so the untrusted runtime can't forge history). Instructions content (AGENTS.md,
agents, skills) is synced at pod start by an init container from this
agent's object-storage folder into an emptyDir the serving container
mounts read-only and reads in-process — no separate instructions-serving pod,
no PV/hostPath. The init container presents the pod's own projected
service-account token to the store, which scopes the read to the folder named
by the token's subject. The token is mounted into the init container ONLY; the
serving container holds no token for the store.

The harness runs on the kubelet-default runtime. The Kyverno mutate
stamps runtimeClassName=gvisor on capability-job pods only, so it is
intentionally not set here.

Audience strings on the projected tokens are duplicated from
`crates/shared/src/auth.rs` (HARNESS_RELAY_AUDIENCE). Drift surfaces at
first harness boot when audience verification fails.
*/}}
{{- $name := .Values.name }}
{{- $m := .Values.command }}
{{- $secrets := dict }}
{{- range $k, $v := $m }}{{ if hasPrefix "secret." $k }}{{ $_ := set $secrets $k $v }}{{ end }}{{ end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ag-{{ $name }}-data
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Survive `helm uninstall` — irreplaceable user data (agent workspace files).
    helm.sh/resource-policy: keep
  labels:
    {{- include "sycophant.agentLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/agent: {{ $name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if $.Values.storageClass }}
  storageClassName: {{ $.Values.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $m.storage | default "1Gi" | quote }}
---
# Conversation history, owned solely by the harness. Separate from
# the workspace data claim on purpose: tool jobs mount that claim RW, and the
# untrusted runtime must not be able to forge/overwrite conversation log.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ag-{{ $name }}-conversation
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Survive `helm uninstall` — irreplaceable conversation history.
    helm.sh/resource-policy: keep
  labels:
    {{- include "sycophant.agentLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/agent: {{ $name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if $.Values.storageClass }}
  storageClassName: {{ $.Values.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: "1Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ag-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.agentLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/agent: {{ $name }}
spec:
  replicas: 1
  # RWO PVC consumed by tool jobs co-located with this harness;
  # rolling updates would briefly race two harnesses. Recreate
  # keeps the contract simple.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      sycophant.md/agent: {{ $name }}
      app.kubernetes.io/component: harness
      app.kubernetes.io/part-of: sycophant
  template:
    metadata:
      labels:
        {{- include "sycophant.agentLabels" (dict "context" $ "name" $name) | nindent 8 }}
        sycophant.md/agent: {{ $name }}
    spec:
      serviceAccountName: ag-{{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      tolerations:
        - key: sycophant.md/workload
          operator: Equal
          value: agent
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Sync this agent's instructions folder from object storage into the
      # instructions emptyDir the serving container mounts read-only. Runs on every
      # pod start against a fresh emptyDir, so the tree is re-fetched each boot.
      # The folder is keyed by this pod's token subject,
      # system:serviceaccount:<namespace>:ag-<name>, and the store grants that
      # token read on that folder only. The token is mounted HERE ONLY; the
      # serving container holds no token for the store. securityContext matches
      # the serving container (the cluster-wide initContainer gate enforces these
      # anyway).
      initContainers:
        - name: instructions-sync
          image: "{{ $.Values.harness.instructions.syncImage }}"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # The pod VAP requires every container in a harness pod (init included)
          # to set cpu + memory limits. The sync of the instruction tree is
          # light, so fixed modest limits suffice.
          resources:
            limits:
              cpu: "250m"
              memory: "128Mi"
          command: ["/bin/sh", "-c"]
          args:
            - >
              rclone sync "os:{{ $.Values.harness.instructions.bucket }}/system:serviceaccount:{{ $.Release.Namespace }}:ag-{{ $name }}/" "/etc/instructions/{{ $name }}"
          env:
            # readOnlyRootFilesystem: rclone's cache (under HOME) and its config
            # path both point at the writable scratch emptyDir below.
            - { name: HOME,          value: /tmp }
            - { name: RCLONE_CONFIG,  value: /tmp/rclone.conf }
            # The `os` remote is defined by env alone, not by the config file:
            # an S3 backend against the SeaweedFS S3 gateway, provider Other,
            # taking its credential from the AWS env vars below.
            - { name: RCLONE_CONFIG_OS_TYPE,     value: s3 }
            - { name: RCLONE_CONFIG_OS_PROVIDER, value: Other }
            - { name: RCLONE_CONFIG_OS_ENV_AUTH, value: "true" }
            - { name: RCLONE_CONFIG_OS_ENDPOINT, value: "http://{{ $.Values.harness.instructions.endpoint }}" }
            # The read grant is scoped to this folder, not the bucket, so skip
            # rclone's bucket existence/create check: it would HeadBucket and 403.
            - { name: RCLONE_CONFIG_OS_NO_CHECK_BUCKET, value: "true" }
            # Web identity: the pod's projected token is exchanged through the
            # store's STS for a short-lived read-only credential. No static keys
            # are set; they would take precedence over web identity.
            - { name: AWS_WEB_IDENTITY_TOKEN_FILE, value: /var/run/secrets/objectstore/token }
            - { name: AWS_ROLE_ARN,                value: "arn:aws:iam::role/agent-instructions-read" }
            - { name: AWS_ENDPOINT_URL_STS,        value: "http://{{ $.Values.harness.instructions.endpoint }}" }
            - { name: AWS_REGION,                  value: us-east-1 }
          volumeMounts:
            - { name: instructions-{{ $name }},      mountPath: {{ printf "/etc/instructions/%s" $name | quote }} }
            - { name: instructions-sync-scratch,     mountPath: /tmp }
            - { name: objectstore-token,             mountPath: /var/run/secrets/objectstore, readOnly: true }
      containers:
        - name: harness
          image: "{{ $.Values.harness.image }}:{{ $.Values.harness.tag }}"
          imagePullPolicy: {{ $.Values.harness.pullPolicy | default "IfNotPresent" }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
          env:
            - { name: RELAY_GATEWAY_ADDR,      value: "http://relay-controller:9090" }
            # This harness serves only its own agent's instructions, read
            # in-process from the read-only volume mounted below at
            # INSTRUCTIONS_ROOT/AGENT_NAME (must match the instructions mountPath).
            - { name: AGENT_NAME, value: {{ $name | quote }} }
            - { name: INSTRUCTIONS_ROOT,    value: "/etc/instructions" }
            # The harness creates tool jobs via the kube API and dials each tool
            # pod at its per-pod record under the headless Service below. It
            # serves no pod-facing surface, so a popped tool pod can open no
            # socket back. The toolset map is watched in this namespace.
            - { name: TOOLSET_NAMESPACE,        value: {{ $.Release.Namespace | quote }} }
            # The one model key this harness names. Its config is its own
            # watched `inf-<key>` ConfigMap; a turn naming any other key is
            # refused.
            - { name: MODEL, value: {{ $m.model | default "" | quote }} }
            # The toolsets this harness lists and the Secrets each of them
            # gets. Each toolset's tools are its own watched `ts-<name>`
            # ConfigMap; a toolset outside this list is never listed, and this
            # harness sees no sibling's Secrets.
            - { name: TOOLSETS, value: {{ $m.toolsets | default "" | quote }} }
            - { name: TOOLSET_SECRETS, value: {{ toJson $secrets | quote }} }
            - { name: TOOLSET_SCHEDULING_FILE,  value: "/etc/sycophant/scheduling/scheduling.yaml" }
            # The per-agent headless Service that publishes each tool pod's
            # per-pod record. Stamped as the pod subdomain and the middle DNS
            # label the harness dials.
            - { name: CAPABILITY_SERVICE_NAME,  value: "ag-{{ $name }}-capability" }
          ports:
            - { name: healthz, containerPort: 8080 }
            # Relay-facing forward surface (HarnessControl): relay-controller only.
            - { name: relay-fwd, containerPort: 9091 }
          readinessProbe:
            httpGet: { path: /healthz, port: healthz }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: healthz }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - { name: harness-relay-auth,     mountPath: /var/run/secrets/harness/relay,   readOnly: true }
            - { name: conversation-data,          mountPath: /var/lib/harness }
            # Read-only instructions volume. The harness reads AGENTS.md / agents /
            # skills from INSTRUCTIONS_ROOT/AGENT_NAME. It is an emptyDir the init
            # container populated from object storage — no hostPath, no PV — so
            # the pod-hardening-vap hostPath ban holds and the serving container
            # mounts no token for the store.
            - { name: instructions-{{ $name }}, mountPath: {{ printf "/etc/instructions/%s" $name | quote }}, readOnly: true }
            - name: scheduling
              mountPath: /etc/sycophant/scheduling
              readOnly: true
            {{- include "sycophant.projectedKubeApiToken.mount" $ | nindent 12 }}
      volumes:
        - name: harness-relay-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: harness.relay.sycophant.md
                  expirationSeconds: 3600
        - name: conversation-data
          persistentVolumeClaim:
            claimName: ag-{{ $name }}-conversation
        # Instructions content lands here from the init-container object-storage sync.
        # emptyDir (not a PV/hostPath): a fresh, empty tree each pod start that
        # the sync fills and the serving container reads read-only.
        - name: instructions-{{ $name }}
          emptyDir: {}
        # Writable scratch for the sync client's config/tmp under
        # readOnlyRootFilesystem. Never mounted by the serving container.
        - name: instructions-sync-scratch
          emptyDir: {}
        # The pod's own token for the store, audience sycophant-objectstore,
        # mounted by the init container only.
        - name: objectstore-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: sycophant-objectstore
                  expirationSeconds: 600
        - name: scheduling
          configMap:
            name: toolset-scheduling
        {{- include "sycophant.projectedKubeApiToken.volume" $ | nindent 8 }}
---
# Per-agent Service for the relay gateway to forward external
# WatchTools/CallTool requests to. Selector targets the per-agent
# harness Deployment by the agent label.
apiVersion: v1
kind: Service
metadata:
  name: ag-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.agentLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/agent: {{ $name }}
spec:
  type: ClusterIP
  selector:
    sycophant.md/agent: {{ $name }}
    app.kubernetes.io/component: harness
    app.kubernetes.io/part-of: sycophant
  ports:
    - { name: relay-fwd, port: 9091, targetPort: relay-fwd }
---
# Per-agent headless Service publishing one per-pod DNS record per
# capability-job pod: `<pod-hostname>.<this-service>.<ns>.svc.cluster.local`,
# where the pod's hostname is its call id. clusterIP: None makes it headless, so
# the harness dials each pod directly rather than a load-balanced VIP. The
# selector matches this agent's capability-job pods; the harness stamps the
# hostname and subdomain on each Job so the record resolves once the pod is Ready.
apiVersion: v1
kind: Service
metadata:
  name: ag-{{ $name }}-capability
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.agentLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/agent: {{ $name }}
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/component: capability-job
    app.kubernetes.io/part-of: sycophant
    sycophant.md/agent: {{ $name }}
  ports:
    - { name: tool-job, port: 9090, targetPort: tool-job }
