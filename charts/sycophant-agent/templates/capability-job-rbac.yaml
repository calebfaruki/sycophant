{{/*
Per-agent create/run split for the identity-keyed capability-job gate.

`ag-<agent>` is the creator identity the gate keys on: it may only `create`
Jobs in its own namespace and holds no other verb on any resource. `create` on
Jobs is safe only because the gate pins the resulting pod to the zero-RBAC
`ag-<agent>-unprivileged` ServiceAccount and forces the isolation envelope on the same
admission event.

`ag-<agent>-unprivileged` is the pinned pod identity: no Role, no RoleBinding, and no
automounted token, so a subverted tool inherits neither a verb nor a bearer
token.

`ag-<agent>` is the sole Job creator: the harness creates every capability
Job in its own namespace via the kube API.
*/}}
{{- $name := .Values.name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ag-{{ $name }}-unprivileged
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    sycophant.md/type: agent-sa
    sycophant.md/agent: {{ $name }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ag-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    sycophant.md/type: agent-sa
    sycophant.md/agent: {{ $name }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ag-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    sycophant.md/agent: {{ $name }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
  # Watch the per-toolset `ts-<name>` ConfigMaps and merge them into the
  # live toolset table. Read-only: the harness never writes a toolset. RBAC
  # cannot scope a watch to a label, so list/watch covers this namespace's
  # ConfigMaps; the harness reads no Secrets and holds no configmaps write.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ag-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    sycophant.md/agent: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: ag-{{ $name }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: ag-{{ $name }}
  apiGroup: rbac.authorization.k8s.io
