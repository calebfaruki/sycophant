{{/*
Per-agent render of the Secrets an agent's toolsets get, for the
identity-keyed admission gate to read as its secret-name allowlist. One
ConfigMap per agent; its `data` keys are the Secret names and each value names
the owning toolset. No secret material, mount path, or egress domain appears:
the keys are names, and membership answers "is Secret S approved for agent A"
without parsing any YAML string value.

Rendered from the same operator-authored `secret.*` keys the harness
`TOOLSET_SECRETS` env carries, so the admission view cannot drift from them.

Every agent gets one, with empty `data` when its toolsets get no Secret. The
ConfigMap is a gate context source, and Kyverno fails closed when a context
source is missing: an absent ConfigMap denies every capability Job the
agent's harness creates, not just the ones naming a Secret. An empty
allowlist is the "no approvals" state; absence is an outage.
*/}}
{{- $name := .Values.name }}
{{- $m := .Values.command }}
{{- $seen := dict }}
{{- range $toolset, $byName := include "sycophant.commandSecrets" $m | fromYaml }}
{{- range $secret, $_ := $byName }}
{{- $_ := set $seen $secret $toolset }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ag-{{ $name }}-toolset-secrets
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    sycophant.md/agent: {{ $name }}
    sycophant.md/type: toolset-secrets
{{- if $seen }}
data:
  {{- range $secret, $owner := $seen }}
  {{ $secret }}: {{ $owner | quote }}
  {{- end }}
{{- else }}
data: {}
{{- end }}
