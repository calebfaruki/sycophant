# sycophant-objectstore — shared object store, install once per cluster.
#
# The pod runs SeaweedFS (master, volume, filer, and s3 gateway in one process)
# with a mounted IAM config and a mounted admin identity. The store keeps a
# hardened pod spec, the admin-Secret-lives-only-here posture, and the
# harness-only ingress lock on the s3 port.
#
# The store always trusts the cluster apiserver as a token issuer: an agent
# pod presents its own service-account token through STS and gets a short-lived
# read-only credential for its own instructions folder. Only the instructions
# jobs reach the filer, which writes those folders. Egress is default-deny:
# cluster DNS plus the apiserver (for the cluster issuer's key set), and
# nothing else.

# SeaweedFS server image (Alpine, multi-arch), pinned by index digest.
image: chrislusf/seaweedfs@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
pullPolicy: IfNotPresent

storage:
  # Backing disk for the instruction bucket, filer metadata, and volume data.
  size: 1Gi
