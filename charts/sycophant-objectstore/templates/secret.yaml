# Root credential. Generated once into this (system) namespace and never copied
# to a tenant. On re-render an existing value is preserved via lookup, so a
# helm upgrade does not rotate the password out from under the running store.
{{- $rootUser := "sycophant-objectstore-root" -}}
{{- $rootPassword := randAlphaNum 40 -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "minio-root") -}}
{{- if $existing }}
{{-   $rootUser = index $existing.data "MINIO_ROOT_USER" | b64dec -}}
{{-   $rootPassword = index $existing.data "MINIO_ROOT_PASSWORD" | b64dec -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: minio-root
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: objectstorage
    app.kubernetes.io/part-of: sycophant
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  MINIO_ROOT_USER: {{ $rootUser | b64enc | quote }}
  MINIO_ROOT_PASSWORD: {{ $rootPassword | b64enc | quote }}
