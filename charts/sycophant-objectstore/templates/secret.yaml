# Admin static identity. Generated once into this (system) namespace and never
# copied to a tenant. On re-render an existing value is preserved via lookup, so
# a helm upgrade does not rotate the admin key out from under the running store.
# Passed to SeaweedFS as -s3.config; it carries the admin secret key, so it
# lives in a Secret, not in the IAM ConfigMap.
{{- $accessKey := "sycophant-objectstore-admin" -}}
{{- $secretKey := randAlphaNum 40 -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "seaweedfs-admin") -}}
{{- if $existing }}
{{-   $accessKey = index $existing.data "access-key" | b64dec -}}
{{-   $secretKey = index $existing.data "secret-key" | b64dec -}}
{{- end }}
{{- $config := dict "identities" (list (dict
      "name" "admin"
      "credentials" (list (dict "accessKey" $accessKey "secretKey" $secretKey))
      "actions" (list "Admin" "Read" "Write"))) }}
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-admin
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: objectstorage
    app.kubernetes.io/part-of: sycophant
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  access-key: {{ $accessKey | b64enc | quote }}
  secret-key: {{ $secretKey | b64enc | quote }}
  s3config.json: {{ $config | toJson | b64enc | quote }}
