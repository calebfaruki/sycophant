# Store-side network lock: the structural boundary for the shared object store.
# Default-deny in both directions; only the flows the store needs are open.
#
# Ingress: harness pods, in ANY tenant namespace, on the s3 port (8333). The
# namespace-Exists matchExpressions is Cilium's construct for "from all
# namespaces" — without it a CNP fromEndpoints matches only this (system)
# namespace, where no harness runs. Selecting the harness by component label
# reaches its pod identity after socket-LB rewrites the ClusterIP, the same
# reason the egress rules use toEndpoints not toFQDNs for in-cluster peers.
#
# The filer port (8888) admits only the jobs that write or delete instruction
# folders, because the filer has no auth. Their selectors carry no namespace
# label, so they match only this namespace. The master
# (9333) and volume (8080) ports have no rule and are denied.
#
# Egress: the store reaches the apiserver on 6443 for the cluster issuer's key
# set, and the L7 DNS rule admits resolution of exactly
# kubernetes.default.svc.cluster.local. An L4-only :53 rule would shadow that L7
# scope (the L4-shadows-L7 hazard this codebase pins in harness-cnp.yaml and
# inference-egress-cnp.yaml). Every other destination stays denied.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: objectstore
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: objectstorage
    app.kubernetes.io/part-of: sycophant
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: objectstorage
      app.kubernetes.io/part-of: sycophant
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: harness
            app.kubernetes.io/part-of: sycophant
          matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: "8333"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: provision-instructions
            app.kubernetes.io/part-of: sycophant
        - matchLabels:
            app.kubernetes.io/component: uninstall-instructions
            app.kubernetes.io/part-of: sycophant
        - matchLabels:
            app.kubernetes.io/component: reap-tenant-files
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: kubernetes.default.svc.cluster.local
    # The cluster issuer's key set, served by the apiserver.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
