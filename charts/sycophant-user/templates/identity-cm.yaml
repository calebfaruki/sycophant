{{- /*
One identity ConfigMap per subject, named user-<hash10> — the same name as the
provision-identity RoleBinding (kinds differ, so the two coexist). The relay
watches these by label and answers ListAgents and handle resolution from
them; the data rides the command verbatim, so the operator re-runs the user
provision command to change it.
*/ -}}
{{- $hash := include "sycophant-user.hash" . }}
{{- if $hash }}
{{- $data := pick .Values.command "agents" }}
{{- range $k, $v := .Values.command }}
{{- if hasPrefix "handle." $k }}{{ $_ := set $data $k $v }}{{ end }}
{{- end }}
{{- /* `user` on the wire is the subject; the ConfigMap data key is `subject`. */ -}}
{{- $_ := set $data "subject" .Values.command.user }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-{{ $hash }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    sycophant.md/type: relay-identity
data:
  {{- range $k, $v := $data }}
  {{ $k | quote }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
