{{- range $name, $spec := .Values.clients }}
---
apiVersion: sycophant.md/v1
kind: Client
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
spec:
  # Bare-string list of Workspace names this client is authorized to
  # act on. Per-request workspace assertion in the signed-request
  # envelope is gated against this list at verify time.
  workspaces:
    {{- range $spec.workspaces }}
    - {{ . | quote }}
    {{- end }}
{{- end }}
