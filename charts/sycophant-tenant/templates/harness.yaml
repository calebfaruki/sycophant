{{/*
Per-workspace materialization: emit one ServiceAccount + PersistentVolumeClaim
+ Deployment per entry under `.Values.workspaces`. The workspace PVC is
mounted by harness-spawned tool jobs (RW). The harness owns a
SEPARATE conversation-history PVC (tool jobs never mount it, so the
untrusted runtime can't forge history). Kernel content (AGENTS.md,
agents, skills) is synced at pod start by an init container from this
workspace's object-storage prefix into an emptyDir the serving container
mounts read-only and reads in-process — no separate kernel-serving pod,
no PV/hostPath. The sync credential is read-only and prefix-scoped and is
mounted into the init container ONLY; the serving container is secret-free.

The harness runs on the kubelet-default runtime. The Kyverno mutate
stamps runtimeClassName=gvisor on capability-job pods only, so it is
intentionally not set here.

Audience strings on the projected tokens are duplicated from
`crates/shared/src/auth.rs` (HARNESS_RELAY_AUDIENCE). Drift surfaces at
first harness boot when audience verification fails.
*/}}
{{- range $name, $ws := .Values.workspaces }}
{{- $kernel := $ws.kernel | default dict }}
{{- $prefix := $kernel.prefix | default (printf "%s/%s" $.Release.Namespace $name) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/type: workspace-sa
    sycophant.md/workspace: {{ $name }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace-data-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Survive `helm uninstall` — irreplaceable user data (agent workspace files).
    helm.sh/resource-policy: keep
  labels:
    {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/workspace: {{ $name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if $.Values.storageClass }}
  storageClassName: {{ $.Values.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $ws.storage | default "1Gi" | quote }}
---
# Conversation history, owned solely by the harness. Separate from
# workspace-data on purpose: tool jobs mount workspace-data RW, and the
# untrusted runtime must not be able to forge/overwrite conversation log.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: conversation-data-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Survive `helm uninstall` — irreplaceable conversation history.
    helm.sh/resource-policy: keep
  labels:
    {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/workspace: {{ $name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if $.Values.storageClass }}
  storageClassName: {{ $.Values.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $ws.conversationStorage | default "1Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/workspace: {{ $name }}
spec:
  replicas: 1
  # RWO PVC consumed by tool jobs co-located with this harness;
  # rolling updates would briefly race two harnesses. Recreate
  # keeps the contract simple.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      sycophant.md/workspace: {{ $name }}
      app.kubernetes.io/component: harness
      app.kubernetes.io/part-of: sycophant
  template:
    metadata:
      annotations:
        # Roll the harness on toolset or scheduling config changes (it creates
        # tool jobs from these). Each checksum hashes this workspace's slice
        # alone, so a sibling's change never rolls this harness. The capability
        # manifest needs no checksum here: its ConfigMap is content-addressed
        # (name carries the manifest hash), so a manifest change swaps the mounted
        # ConfigMap name below and rolls the pod on its own.
        checksum/toolsets: {{ include (print $.Template.BasePath "/toolset-config.yaml") $ | sha256sum }}
        checksum/scheduling: {{ include (print $.Template.BasePath "/scheduling-cm.yaml") $ | sha256sum }}
      labels:
        {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 8 }}
        sycophant.md/workspace: {{ $name }}
    spec:
      serviceAccountName: harness-{{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      tolerations:
        - key: sycophant.md/workload
          operator: Equal
          value: workspace
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Sync this workspace's instruction prefix from object storage into the
      # kernel emptyDir the serving container mounts read-only. Runs on every
      # pod start against a fresh emptyDir, so the tree is re-fetched each boot.
      # The read-only, prefix-scoped credential is mounted HERE ONLY; the
      # serving container stays secret-free. securityContext matches the serving
      # container (the cluster-wide initContainer gate enforces these anyway).
      initContainers:
        - name: kernel-sync
          image: "{{ $.Values.harness.kernels.syncImage }}"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # The pod VAP requires every container in a harness pod (init included)
          # to set cpu + memory limits. mc mirror of the instruction tree is
          # light, so fixed modest limits suffice.
          resources:
            limits:
              cpu: "250m"
              memory: "128Mi"
          command: ["/bin/sh", "-c"]
          args:
            - >
              mc alias set os "http://{{ $.Values.harness.kernels.endpoint }}" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" &&
              mc mirror --overwrite "os/{{ $.Values.harness.kernels.bucket }}/{{ $prefix }}" "/etc/kernels/{{ $name }}"
          env:
            # mc writes its config and scratch under HOME; readOnlyRootFilesystem
            # forces both onto the writable scratch emptyDir below.
            - { name: HOME,          value: /tmp }
            - { name: MC_CONFIG_DIR, value: /tmp/.mc }
            # The read-only, prefix-scoped sync credential, mounted init-only.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.harness.kernels.credentialName | quote }}
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.harness.kernels.credentialName | quote }}
                  key: secret-key
          volumeMounts:
            - { name: kernel-{{ $name }},      mountPath: {{ printf "/etc/kernels/%s" $name | quote }} }
            - { name: kernel-sync-scratch,     mountPath: /tmp }
      containers:
        - name: harness
          image: "{{ $.Values.harness.image }}:{{ $.Values.harness.tag }}"
          imagePullPolicy: {{ $.Values.harness.pullPolicy | default "IfNotPresent" }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            limits:
              cpu: {{ (or $ws.harness dict).cpu | default "500m" | quote }}
              memory: {{ (or $ws.harness dict).memory | default "256Mi" | quote }}
          env:
            - { name: RELAY_GATEWAY_ADDR,      value: "http://relay-ctrl:9090" }
            # This harness serves only its own workspace's kernel, read
            # in-process from the read-only volume mounted below at
            # KERNEL_ROOT/WORKSPACE_NAME (must match the kernel mountPath).
            - { name: WORKSPACE_NAME, value: {{ $name | quote }} }
            - { name: KERNEL_ROOT,    value: "/etc/kernels" }
            # The harness now creates tool jobs via the kube API from the
            # toolset + scheduling config, and dials each tool pod directly at
            # its per-pod record under the headless Service below. It serves no
            # pod-facing surface, so a popped tool pod can open no socket back.
            - { name: TOOLSET_NAMESPACE,        value: {{ $.Release.Namespace | quote }} }
            - { name: TOOLSET_CONFIG_FILE,      value: "/etc/sycophant/toolset-config/toolsets.yaml" }
            # The harness owns model selection: it resolves the agent
            # definition's model to a config in this catalog and dials the model
            # itself. The catalog rides the toolset-config ConfigMap already
            # mounted below.
            - { name: HARNESS_MODEL_CONFIG_FILE, value: "/etc/sycophant/toolset-config/model.yaml" }
            # This workspace's tool catalog: each bound toolset's tools with
            # their argument schemas and resolved grants (Secret name, mount
            # path, egress), read from this workspace's own manifest ConfigMap.
            # Credential detail rides no controller link, and this harness sees
            # no sibling's grants.
            - { name: CAPABILITY_MANIFEST_FILE, value: "/etc/sycophant/capability-manifest/manifest.yaml" }
            - { name: TOOLSET_SCHEDULING_FILE,  value: "/etc/sycophant/scheduling/scheduling.yaml" }
            # The per-workspace headless Service that publishes each tool pod's
            # per-pod record. Stamped as the pod subdomain and the middle DNS
            # label the harness dials.
            - { name: CAPABILITY_SERVICE_NAME,  value: "capability-{{ $name }}" }
          ports:
            - { name: healthz, containerPort: 8080 }
            # Relay-facing forward surface (HarnessControl): relay-ctrl only.
            - { name: relay-fwd, containerPort: 9091 }
          readinessProbe:
            httpGet: { path: /healthz, port: healthz }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: healthz }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - { name: harness-relay-auth,     mountPath: /var/run/secrets/harness/relay,   readOnly: true }
            - { name: conversation-data,          mountPath: /var/lib/harness }
            # Read-only kernel volume. The harness reads AGENTS.md / agents /
            # skills from KERNEL_ROOT/WORKSPACE_NAME. It is an emptyDir the init
            # container populated from object storage — no hostPath, no PV — so
            # the gvisor-pod-vap hostPath ban holds and the serving container
            # mounts no credential.
            - { name: kernel-{{ $name }}, mountPath: {{ printf "/etc/kernels/%s" $name | quote }}, readOnly: true }
            - name: toolset-config
              mountPath: /etc/sycophant/toolset-config
              readOnly: true
            - name: capability-manifest
              mountPath: /etc/sycophant/capability-manifest
              readOnly: true
            - name: scheduling
              mountPath: /etc/sycophant/scheduling
              readOnly: true
            {{- include "sycophant.projectedKubeApiToken.mount" $ | nindent 12 }}
      volumes:
        - name: harness-relay-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: harness.relay.sycophant.md
                  expirationSeconds: 3600
        - name: conversation-data
          persistentVolumeClaim:
            claimName: conversation-data-{{ $name }}
        # Kernel content lands here from the init-container object-storage sync.
        # emptyDir (not a PV/hostPath): a fresh, empty tree each pod start that
        # the sync fills and the serving container reads read-only.
        - name: kernel-{{ $name }}
          emptyDir: {}
        # Writable scratch for the sync client's config/tmp under
        # readOnlyRootFilesystem. Never mounted by the serving container.
        - name: kernel-sync-scratch
          emptyDir: {}
        - name: toolset-config
          configMap:
            name: toolset-config
        - name: capability-manifest
          configMap:
            name: {{ include "sycophant.capabilityManifestConfigMapName" (dict "name" $name "workspace" $ws "context" $) }}
        - name: scheduling
          configMap:
            name: toolset-scheduling
        {{- include "sycophant.projectedKubeApiToken.volume" $ | nindent 8 }}
---
# Per-workspace Service for the relay gateway to forward external
# WatchTools/CallTool requests to. Selector targets the per-workspace
# harness Deployment by the workspace label.
apiVersion: v1
kind: Service
metadata:
  name: harness-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/workspace: {{ $name }}
spec:
  type: ClusterIP
  selector:
    sycophant.md/workspace: {{ $name }}
    app.kubernetes.io/component: harness
    app.kubernetes.io/part-of: sycophant
  ports:
    - { name: relay-fwd, port: 9091, targetPort: relay-fwd }
---
# Per-workspace headless Service publishing one per-pod DNS record per
# capability-job pod: `<pod-hostname>.<this-service>.<ns>.svc.cluster.local`,
# where the pod's hostname is its call id. clusterIP: None makes it headless, so
# the harness dials each pod directly rather than a load-balanced VIP. The
# selector matches this workspace's capability-job pods; the harness stamps the
# hostname and subdomain on each Job so the record resolves once the pod is Ready.
apiVersion: v1
kind: Service
metadata:
  name: capability-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/workspace: {{ $name }}
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/component: capability-job
    app.kubernetes.io/part-of: sycophant
    sycophant.md/workspace: {{ $name }}
  ports:
    - { name: tool-job, port: 9090, targetPort: tool-job }
{{- end }}
