{{/*
Per-workspace materialization: emit one ServiceAccount + PersistentVolumeClaim
+ Deployment per entry under `.Values.workspaces`. The workspace PVC is
mounted by toolset-spawned tool jobs (RW). The harness owns a
SEPARATE conversation-history PVC (tool jobs never mount it, so the
untrusted runtime can't forge history). Kernel content (AGENTS.md,
agents, skills) is delivered on a per-workspace read-only PVC the
harness mounts and reads in-process — no separate kernel-serving pod.

The harness runs on the kubelet-default runtime. The Kyverno mutate
stamps runtimeClassName=gvisor on tool-job pods only, so it is
intentionally not set here.

Audience strings on the projected tokens are duplicated from
`crates/shared/src/auth.rs` (HARNESS_TOOLSET_AUDIENCE +
HARNESS_RELAY_AUDIENCE). Drift surfaces at first harness boot when
audience verification fails.
*/}}
{{- $ns := lookup "v1" "Namespace" "" .Release.Namespace }}
{{- range $name, $ws := .Values.workspaces }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/type: workspace-sa
    sycophant.md/workspace: {{ $name }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-workspace-data
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Survive `helm uninstall` — irreplaceable user data (agent workspace files).
    helm.sh/resource-policy: keep
  labels:
    {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/workspace: {{ $name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if $.Values.storageClass }}
  storageClassName: {{ $.Values.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $ws.storage | default "1Gi" | quote }}
---
# Conversation history, owned solely by the harness. Separate from
# workspace-data on purpose: tool jobs mount workspace-data RW, and the
# untrusted runtime must not be able to forge/overwrite conversation log.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-conversation-data
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Survive `helm uninstall` — irreplaceable conversation history.
    helm.sh/resource-policy: keep
  labels:
    {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/workspace: {{ $name }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if $.Values.storageClass }}
  storageClassName: {{ $.Values.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $ws.conversationStorage | default "1Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/workspace: {{ $name }}
spec:
  replicas: 1
  # RWO PVC consumed by tool jobs co-located with this harness;
  # rolling updates would briefly race two harnesses. Recreate
  # keeps the contract simple.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      sycophant.md/workspace: {{ $name }}
      app.kubernetes.io/component: harness
      app.kubernetes.io/part-of: sycophant
  template:
    metadata:
      labels:
        {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 8 }}
        sycophant.md/workspace: {{ $name }}
    spec:
      serviceAccountName: sa-{{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      tolerations:
        - key: sycophant.md/workload
          operator: Equal
          value: workspace
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: harness
          image: "{{ $.Values.harness.image }}:{{ $.Values.harness.tag }}"
          imagePullPolicy: {{ $.Values.harness.pullPolicy | default "IfNotPresent" }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            limits:
              cpu: {{ (or $ws.harness dict).cpu | default "500m" | quote }}
              memory: {{ (or $ws.harness dict).memory | default "256Mi" | quote }}
          env:
            - { name: TOOLSET_CONTROLLER_ADDR, value: "http://toolset-ctrl:9090" }
            - { name: RELAY_GATEWAY_ADDR,      value: "http://relay-ctrl:9090" }
            # This harness serves only its own workspace's kernel, read
            # in-process from the read-only volume mounted below at
            # KERNEL_ROOT/WORKSPACE_NAME (must match the kernel mountPath).
            - { name: WORKSPACE_NAME, value: {{ $name | quote }} }
            - { name: KERNEL_ROOT,    value: "/etc/kernels" }
          ports:
            - { name: healthz, containerPort: 8080 }
            - { name: grpc, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /healthz, port: healthz }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: healthz }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - { name: harness-toolset-auth,   mountPath: /var/run/secrets/harness/toolset, readOnly: true }
            - { name: harness-relay-auth,     mountPath: /var/run/secrets/harness/relay,   readOnly: true }
            - { name: conversation-data,          mountPath: /var/lib/harness }
            # Read-only kernel volume. The harness reads AGENTS.md / agents /
            # skills from KERNEL_ROOT/WORKSPACE_NAME. hostPath lives on the PV
            # below (never on the pod), so the gvisor-pod-vap hostPath ban holds.
            - { name: kernel-{{ $name }}, mountPath: {{ printf "/etc/kernels/%s" $name | quote }}, readOnly: true }
      volumes:
        - name: harness-toolset-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: harness.toolset.sycophant.md
                  expirationSeconds: 3600
        - name: harness-relay-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: harness.relay.sycophant.md
                  expirationSeconds: 3600
        - name: conversation-data
          persistentVolumeClaim:
            claimName: {{ $name }}-conversation-data
        - name: kernel-{{ $name }}
          persistentVolumeClaim:
            claimName: {{ printf "kernel-%s" $name }}
            readOnly: true
---
# Per-workspace Service for the relay gateway to forward external
# WatchTools/CallTool requests to. Selector targets the per-workspace
# harness Deployment by the workspace label.
apiVersion: v1
kind: Service
metadata:
  name: harness-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/workspace: {{ $name }}
spec:
  type: ClusterIP
  selector:
    sycophant.md/workspace: {{ $name }}
    app.kubernetes.io/component: harness
    app.kubernetes.io/part-of: sycophant
  ports:
    - { name: grpc, port: 9090, targetPort: grpc }
{{- /*
  Per-workspace kernel storage: one cluster-scoped read-only hostPath PV + a
  namespaced read-only PVC, mounted onto this workspace's harness pod above.
  hostPath is <hostPathBase>/<ns>/<workspace> by default, or the workspace's
  custom `kernel.path`. PSA `restricted` forbids pod hostPath volumes but allows
  PVCs and never inspects the cluster-scoped PV where the hostPath lives. A
  Namespace ownerReference GCs each PV on `kubectl delete ns` (uid via lookup;
  omitted until the namespace exists). No `resource-policy: keep` — kernel
  content is reproducible.
*/}}
{{- $kernel := $ws.kernel | default dict }}
{{- $path := $kernel.path | default (printf "%s/%s/%s" $.Values.harness.kernels.hostPathBase $.Release.Namespace $name) }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ printf "kernel-%s-%s" $name $.Release.Namespace }}
  {{- if $ns }}
  ownerReferences:
    - apiVersion: v1
      kind: Namespace
      name: {{ $.Release.Namespace }}
      uid: {{ $ns.metadata.uid }}
      blockOwnerDeletion: false
  {{- end }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    app.kubernetes.io/component: kernel
    sycophant.md/workspace: {{ $name }}
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadOnlyMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: {{ $path | quote }}
    type: DirectoryOrCreate
  claimRef:
    namespace: {{ $.Release.Namespace }}
    name: {{ printf "kernel-%s" $name }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "kernel-%s" $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    app.kubernetes.io/component: kernel
    sycophant.md/workspace: {{ $name }}
spec:
  accessModes: ["ReadOnlyMany"]
  storageClassName: ""
  volumeName: {{ printf "kernel-%s-%s" $name $.Release.Namespace }}
  resources:
    requests:
      storage: 1Gi
{{- end }}
