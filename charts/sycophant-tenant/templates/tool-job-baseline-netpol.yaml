{{/*
Fail-closed egress baseline for every tool-job pod. Selects all
tool-job pods and allows ONLY the universal minimum: kube-dns:53 with an L7
DNS allowlist pinned to the toolset-ctrl FQDN, plus toolset-ctrl:9090 for tool
dispatch. A tool job with no per-toolset CNP is therefore denied all external
egress (fail-closed), regardless of how its toolset entry was authored.

Per-profile CNPs (`toolset-<profile-key>`, rendered by prompt-egress-netpol.yaml)
and per-grant CNPs (`toolset-grant-<workspace>-<toolset>-<grant>`, rendered by
toolset-grant-netpol.yaml) ADD their declared domains on top of this floor.
Cilium unions same-PortProtocol L7 DNS rules across policies, so every one of
them MUST carry `rules.dns` on :53 (never an L4-only kube-dns rule) to avoid the
L4-shadows-L7 hazard documented in harness-netpol.yaml.
*/}}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tool-job-baseline
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: tool-job
      app.kubernetes.io/part-of: sycophant
  egress:
    {{- include "sycophant.toolJobDnsFloor" . | nindent 4 }}
