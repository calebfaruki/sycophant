{{/*
Per-toolset egress policy for tool-job pods.

One CiliumNetworkPolicy per toolset entry (or prompt profile) that declares
`egress`, selecting tool-job pods by the `sycophant.md/toolset` label the
controller stamps with the toolset name for a tool toolset and the call's
`model` value for a prompt profile. Both sources -- the toolsets map and the
prompt section -- render the same policy shape.

Composes additively on top of the fail-closed tool-job-baseline floor (DNS to
the toolset-ctrl FQDN + toolset-ctrl:9090). A tool job whose entry declares no
egress gets no policy here and stays denied all external egress.

Each domain carries BOTH an L7 `rules.dns` entry on :53 and its own `toFQDNs`
rule on the declared port. Cilium unions same-PortProtocol L7 DNS rules across
policies, so the :53 rule MUST stay L7 (never L4-only) or it shadows the
baseline's pinned allowlist -- the hazard documented in
tool-job-baseline-netpol.yaml. There is no catch-all `matchPattern: "*"`: that
would reopen DNS-tunnel exfil.

Egress is authored by the operator through chart values and applied from
outside the tenant. Neither the controller nor the tenant authors it.
*/}}
{{- $egress := dict }}
{{- range $toolset, $entry := .Values.toolsets }}
{{- if $entry.egress }}
{{- $_ := set $egress $toolset $entry.egress }}
{{- end }}
{{- end }}
{{- range $key, $profile := (default dict (default dict .Values.prompt).profiles) }}
{{- if $profile.egress }}
{{- $_ := set $egress $key $profile.egress }}
{{- end }}
{{- end }}
{{- range $key, $rules := $egress }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: toolset-{{ $key }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    sycophant.md/type: toolset-egress
    sycophant.md/toolset: {{ $key | quote }}
spec:
  endpointSelector:
    matchLabels:
      sycophant.md/toolset: {{ $key | quote }}
      app.kubernetes.io/part-of: sycophant
  egress:
    # DNS: resolve only this entry's declared domains. Co-scoped L7 so it
    # unions with the baseline's pinned matchName rule instead of shadowing it.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              {{- range $rule := $rules }}
              - matchName: {{ $rule.domain | quote }}
              - matchPattern: {{ printf "*.%s" $rule.domain | quote }}
              {{- end }}
  {{- range $rule := $rules }}
    - toFQDNs:
        - matchName: {{ $rule.domain | quote }}
        - matchPattern: {{ printf "*.%s" $rule.domain | quote }}
      toPorts:
        - ports:
            - port: {{ $rule.port | quote }}
              protocol: TCP
  {{- end }}
{{- end }}
