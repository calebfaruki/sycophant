{{/*
Per-profile egress policy for worker (tool-job) pods.

One CiliumNetworkPolicy per profile that declares `egress`, selecting worker
pods by the `sycophant.md/toolset` label the controller stamps with the
resolved PROFILE KEY (the toolset name for a static toolset, the call's
`model` value for the parameterized prompt toolset).

Composes additively on top of the fail-closed tool-job-baseline floor (DNS to
the toolset-ctrl FQDN + toolset-ctrl:9090). A worker whose profile declares no
egress gets no policy here and stays denied all external egress.

Each domain carries BOTH an L7 `rules.dns` entry on :53 and its own `toFQDNs`
rule on the declared port. Cilium unions same-PortProtocol L7 DNS rules across
policies, so the :53 rule MUST stay L7 (never L4-only) or it shadows the
baseline's pinned allowlist -- the hazard documented in
tool-job-baseline-netpol.yaml. There is no catch-all `matchPattern: "*"`: that
would reopen DNS-tunnel exfil.

Egress is authored by the operator through chart values and applied from
outside the tenant. Neither the controller nor the tenant authors it.
*/}}
{{- range $toolset, $entry := .Values.toolsets }}
{{- range $key, $profile := (default dict $entry.profiles) }}
{{- if $profile.egress }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: toolset-{{ $key }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    sycophant.md/type: toolset-egress
    sycophant.md/toolset: {{ $key | quote }}
spec:
  endpointSelector:
    matchLabels:
      sycophant.md/toolset: {{ $key | quote }}
      app.kubernetes.io/part-of: sycophant
  egress:
    # DNS: resolve only this profile's declared domains. Co-scoped L7 so it
    # unions with the baseline's pinned matchName rule instead of shadowing it.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              {{- range $rule := $profile.egress }}
              - matchName: {{ $rule.domain | quote }}
              - matchPattern: {{ printf "*.%s" $rule.domain | quote }}
              {{- end }}
  {{- range $rule := $profile.egress }}
    - toFQDNs:
        - matchName: {{ $rule.domain | quote }}
        - matchPattern: {{ printf "*.%s" $rule.domain | quote }}
      toPorts:
        - ports:
            - port: {{ $rule.port | quote }}
              protocol: TCP
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
