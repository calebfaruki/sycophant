---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-controller
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay-controller
    app.kubernetes.io/name: relay-controller
spec:
  replicas: 1
  # Recreate (not RollingUpdate): the gateway holds the live channel and
  # turn-state maps in memory. RollingUpdate would briefly run two
  # gateways, splitting a conversation's subscribers across them.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: relay-controller
      app.kubernetes.io/part-of: sycophant
  template:
    metadata:
      labels:
        {{- include "sycophant.labels" . | nindent 8 }}
        app.kubernetes.io/component: relay-controller
        app.kubernetes.io/name: relay-controller
    spec:
      serviceAccountName: relay-controller
      automountServiceAccountToken: false
      tolerations:
        - key: sycophant.md/workload
          operator: Equal
          value: relay
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ctrl
          image: "{{ .Values.relay.image }}:{{ .Values.relay.tag }}"
          imagePullPolicy: {{ .Values.relay.pullPolicy | default "IfNotPresent" }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            # Namespace the gateway reads the relay-identity ConfigMaps and
            # submits its authorization reviews in.
            - name: RELAY_NAMESPACE
              value: "{{ .Release.Namespace }}"
            - name: IDP_ISSUER
              value: "{{ .Values.idp.issuer }}"
            - name: IDP_AUDIENCE
              value: "{{ .Values.idp.audience }}"
            - name: IDP_CERTIFICATE_AUTHORITY
              value: {{ .Values.idp.certificateAuthority | quote }}
            - name: HEARTBEAT_INTERVAL_SECS
              value: "{{ .Values.relay.heartbeatIntervalSecs }}"
          ports:
            # Internal listener (9090): K8s ServiceAccount tokens via
            # TokenReview. Reachable from in-cluster pods only via the
            # CiliumNetworkPolicy below (harness Subscribe; later DeliverOutbound).
            - name: grpc-internal
              containerPort: 9090
            # App listener (9091): person tokens, authenticated by
            # TokenReview and authorized per request by
            # SubjectAccessReview. Admitted only from the tailnet channel
            # pod by relay-ingress.
            - name: grpc-app
              containerPort: 9091
            # Channel listener (9092): channel ServiceAccount tokens only,
            # authenticated by an audience-pinned TokenReview and authorized
            # by SubjectAccessReview. Admitted only from channel-class:
            # principal pods by relay-ingress.
            - name: grpc-channel
              containerPort: 9092
          # Startup blocks on the identity watcher's initial sync. A
          # generous startupProbe avoids liveness flapping during that
          # window.
          startupProbe:
            grpc:
              port: 9090
            periodSeconds: 5
            failureThreshold: 18
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            # Outbound to the per-agent harness: forward external
            # WatchTools / CallTool. Token audience is relay.harness.
            - name: relay-harness-auth
              mountPath: /var/run/secrets/relay/harness
              readOnly: true
            {{- include "sycophant.projectedKubeApiToken.mount" . | nindent 12 }}
      volumes:
        - name: relay-harness-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: relay.harness.sycophant.md
                  expirationSeconds: 3600
        {{- include "sycophant.projectedKubeApiToken.volume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: relay-controller
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay-controller
spec:
  type: ClusterIP
  ports:
    # Harness link. In-cluster callers only, per relay-ingress.
    - name: grpc
      port: 9090
      targetPort: grpc-internal
    # App port. Reachable only from the tailnet channel pod, per relay-ingress.
    - name: grpc-app
      port: 9091
      targetPort: grpc-app
    # Channel port. Reachable only from channel-class: principal pods,
    # per relay-ingress.
    - name: grpc-channel
      port: 9092
      targetPort: grpc-channel
  selector:
    app.kubernetes.io/name: relay-controller
    app.kubernetes.io/part-of: sycophant
