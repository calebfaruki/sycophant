---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-ctrl
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay-ctrl
    app.kubernetes.io/name: relay-ctrl
spec:
  replicas: 1
  # Recreate (not RollingUpdate): the gateway holds the live channel and
  # turn-state maps in memory. RollingUpdate would briefly run two
  # gateways, splitting a conversation's subscribers across them.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: relay-ctrl
      app.kubernetes.io/part-of: sycophant
  template:
    metadata:
      annotations:
        # Roll the pod when the bindings change so the credential menu the
        # gateway serves never goes stale — same contract as toolset-ctrl.
        checksum/bindings: {{ include (print $.Template.BasePath "/toolset-bindings.yaml") . | sha256sum }}
      labels:
        {{- include "sycophant.labels" . | nindent 8 }}
        app.kubernetes.io/component: relay-ctrl
        app.kubernetes.io/name: relay-ctrl
    spec:
      serviceAccountName: relay-ctrl
      automountServiceAccountToken: false
      tolerations:
        - key: sycophant.md/workload
          operator: Equal
          value: relay
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ctrl
          image: "{{ .Values.relay.image }}:{{ .Values.relay.tag }}"
          imagePullPolicy: {{ .Values.relay.pullPolicy | default "IfNotPresent" }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            # Namespace the gateway reads its relay-grants ConfigMap and
            # registered-keys Secret from.
            - name: RELAY_NAMESPACE
              value: "{{ .Release.Namespace }}"
            - name: TOOLSET_BINDINGS_FILE
              value: "/etc/sycophant/toolset-bindings/bindings.yaml"
          ports:
            # Internal listener (9090): K8s ServiceAccount tokens via
            # TokenReview. Reachable from in-cluster pods only via the
            # NetworkPolicy below (harness Subscribe; later DeliverOutbound).
            - name: grpc-internal
              containerPort: 9090
            # App listener (9091): client-signed envelope verified by the
            # in-process tower middleware. Bound on the pod network and
            # admitted only from the app adapter pod by relay-ingress.
            - name: grpc-app
              containerPort: 9091
            # Adapter listener (9092): the same client-signed envelope on
            # its own socket, admitted only from adapter-class: principal
            # pods by relay-ingress.
            - name: grpc-adapter
              containerPort: 9092
          # Startup blocks on the grants watcher's initial sync (up to 10s)
          # and the registered-key rebuild. A generous startupProbe avoids
          # liveness flapping during that window.
          startupProbe:
            grpc:
              port: 9090
            periodSeconds: 5
            failureThreshold: 18
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            # Outbound to the per-workspace harness: forward external
            # WatchTools / CallTool. Token audience is relay.harness.
            - name: relay-harness-auth
              mountPath: /var/run/secrets/relay/harness
              readOnly: true
            # The workspace toolset bindings, for the grant menu
            # (ListGrants). Names only — grants' Secrets stay unmounted.
            - name: toolset-bindings
              mountPath: /etc/sycophant/toolset-bindings
              readOnly: true
            {{- include "sycophant.projectedKubeApiToken.mount" . | nindent 12 }}
      volumes:
        - name: relay-harness-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: relay.harness.sycophant.md
                  expirationSeconds: 3600
        - name: toolset-bindings
          configMap:
            name: toolset-bindings
        {{- include "sycophant.projectedKubeApiToken.volume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: relay-ctrl
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay-ctrl
spec:
  type: ClusterIP
  ports:
    # Harness link. In-cluster callers only, per relay-ingress.
    - name: grpc
      port: 9090
      targetPort: grpc-internal
    # App port. Reachable only from the app adapter pod, per relay-ingress.
    - name: grpc-app
      port: 9091
      targetPort: grpc-app
    # Adapter port. Reachable only from adapter-class: principal pods,
    # per relay-ingress.
    - name: grpc-adapter
      port: 9092
      targetPort: grpc-adapter
  selector:
    app.kubernetes.io/name: relay-ctrl
    app.kubernetes.io/part-of: sycophant
