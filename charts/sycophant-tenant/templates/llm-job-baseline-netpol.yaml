{{/*
Fail-closed egress baseline for every llm-job pod. Selects all llm-job pods and
allows ONLY the universal minimum: kube-dns:53 with an L7 DNS allowlist pinned to
the hangar-ctrl FQDN, plus hangar-ctrl:9090. An llm-job with no provider
union CNP is therefore denied all external egress (fail-closed) — non-functional
but safe (it cannot reach any LLM provider until the operator configures one).

The `llm-job-egress` union CNP (authored externally by `syco provider set` /
`syco model set`) ADDS the configured provider hosts (kube-dns L7 + toFQDNs:443)
on top of this floor. Cilium unions same-PortProtocol L7 DNS rules across
policies, so both this baseline and the union CNP MUST carry `rules.dns` on :53
(never an L4-only kube-dns rule) to avoid the L4-shadows-L7 hazard documented in
transponder-netpol.yaml.
*/}}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: llm-job-baseline
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: llm-job
      app.kubernetes.io/part-of: sycophant
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: "hangar-ctrl.{{ .Release.Namespace }}.svc.cluster.local"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: hangar-ctrl
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
