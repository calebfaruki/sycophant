{{- if .Values.users }}
# The tenant's namespace-scoped user identities. Binds each operator-supplied
# issuer-prefixed identity to the minimal tenant-user ClusterRole in this
# tenant namespace only, so a user's authority is the union of their
# per-namespace bindings and nothing wider. Static YAML gated on the users
# list: a tenant with no bound identities renders no binding and admits no
# user. Each subject is a User named <issuer>#<sub> exactly as the apiserver
# presents it, never a Group; the roleRef is tenant-user, never
# tenant-operator or tenant-deployer.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-user
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tenant-user
subjects:
  {{- range .Values.users }}
  - kind: User
    name: {{ . | quote }}
    apiGroup: rbac.authorization.k8s.io
  {{- end }}
roleRef:
  kind: ClusterRole
  name: tenant-user
  apiGroup: rbac.authorization.k8s.io
{{- end }}
