apiVersion: v1
kind: ServiceAccount
metadata:
  name: tightbeam-ctrl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tightbeam-ctrl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tightbeam-ctrl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tightbeam-ctrl
rules:
  # Enrollment CRs: watch + list (enrollment_watcher mints one-time codes
  # onto status); get (redeem path); status patch (record redemption).
  - apiGroups: ["sycophant.md"]
    resources: ["enrollments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sycophant.md"]
    resources: ["enrollments/status"]
    verbs: ["patch"]
  # Signing-key bootstrap. Gateway mints the Ed25519 seed and stores it in
  # `tightbeam-signing-key` Secret on first start; reads it on restart.
  # No update/patch — a compromised gateway cannot rotate the key. The
  # secret-name-allowlist VAP pins which Secret names this SA may create.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tightbeam-ctrl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tightbeam-ctrl
subjects:
  - kind: ServiceAccount
    name: tightbeam-ctrl
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: tightbeam-ctrl
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.tsnetBridge.enabled }}
---
# tsnet-bridge sidecar RBAC. The sidecar container shares the gateway
# Pod's ServiceAccount (a Pod has exactly one SA); this Role grants the
# SA access to its state Secret (TS_KUBE_SECRET persists the tailnet node
# identity across restarts).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tightbeam-tsnet-bridge
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tightbeam-tsnet-bridge
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [tightbeam-tsnet-bridge-state]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tightbeam-tsnet-bridge
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tightbeam-tsnet-bridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tightbeam-tsnet-bridge
subjects:
  - kind: ServiceAccount
    name: tightbeam-ctrl
{{- end }}
