---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: airlock-ctrl-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: airlock-ctrl
      app.kubernetes.io/part-of: sycophant
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: harness
            app.kubernetes.io/part-of: sycophant
        - matchLabels:
            app.kubernetes.io/component: airlock-job
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
