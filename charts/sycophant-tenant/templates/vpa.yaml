{{- if .Values.vpa.enabled }}
# Vertical Pod Autoscaler for the three tenant singletons. VPA is
# optional operational infrastructure — operators who
# skip it pay for unused reserved capacity; nothing breaks.
#
# Requires VPA 1.2+ (InPlaceOrRecreate update mode) and Kubernetes 1.35+
# (in-place pod resize GA). With `resizePolicy: NotRequired` set on each
# controller's container, an in-place memory or CPU adjustment preserves
# streaming connections (transponder Subscribe, channel ChannelStream)
# instead of recreating the pod.
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: hangar-ctrl
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: hangar-ctrl
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hangar-ctrl
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
      - containerName: '*'
        minAllowed:
          cpu: {{ .Values.hangarCtrl.vpa.minAllowed.cpu | quote }}
          memory: {{ .Values.hangarCtrl.vpa.minAllowed.memory | quote }}
        maxAllowed:
          cpu: {{ .Values.hangarCtrl.vpa.maxAllowed.cpu | quote }}
          memory: {{ .Values.hangarCtrl.vpa.maxAllowed.memory | quote }}
---
apiVersion: autoscaling.k8s.io/v1
