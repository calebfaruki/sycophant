---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airlock-ctrl
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: airlock-ctrl
    app.kubernetes.io/name: airlock-ctrl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: airlock-ctrl
      app.kubernetes.io/part-of: sycophant
  template:
    metadata:
      annotations:
        # Roll airlock-ctrl on bindings or scheduling changes.
        checksum/bindings: {{ include (print $.Template.BasePath "/airlock-bindings.yaml") . | sha256sum }}
        checksum/scheduling: {{ include (print $.Template.BasePath "/scheduling-cm.yaml") . | sha256sum }}
      labels:
        {{- include "sycophant.labels" . | nindent 8 }}
        app.kubernetes.io/component: airlock-ctrl
        app.kubernetes.io/name: airlock-ctrl
    spec:
      serviceAccountName: airlock-ctrl
      tolerations:
        - key: sycophant.io/workload
          operator: Equal
          value: airlock
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: ctrl
          image: "{{ .Values.airlock.image }}:{{ .Values.airlock.tag }}"
          imagePullPolicy: {{ .Values.airlock.pullPolicy | default "IfNotPresent" }}
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          args:
            - "--port"
            - "9090"
            - "--namespace"
            - "{{ .Release.Namespace }}"
            - "--controller-addr"
            # Bare service name -- K8s search-list expands to the FQDN
            # within the same namespace. The chamber CNP's DNS
            # allowlist matchName uses the full FQDN (operates on the
            # post-expansion query bytes). Cilium reject responses are
            # NXDOMAIN (set cluster-wide via dnsProxy.dnsRejectResponseCode)
            # so musl getaddrinfo iterates the search list cleanly.
            - "http://airlock-ctrl:9090"
            - "--bindings-file"
            - "/etc/sycophant/airlock-bindings/bindings.yaml"
            - "--scheduling-file"
            - "/etc/sycophant/scheduling/scheduling.yaml"
          ports:
            - name: grpc
              containerPort: 9090
          volumeMounts:
            - name: airlock-bindings
              mountPath: /etc/sycophant/airlock-bindings
              readOnly: true
            - name: scheduling
              mountPath: /etc/sycophant/scheduling
              readOnly: true
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: scheduling
          configMap:
            name: airlock-scheduling
        - name: airlock-bindings
          configMap:
            name: airlock-bindings
---
apiVersion: v1
kind: Service
metadata:
  name: airlock-ctrl
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: airlock-ctrl
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
  selector:
    app.kubernetes.io/name: airlock-ctrl
    app.kubernetes.io/part-of: sycophant
