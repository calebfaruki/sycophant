{{/*
Emit one Chamber CR per entry under `.Values.chambers`. Airlock-controller
reconciles each into the per-tenant chamber surface; the per-chamber
CiliumNetworkPolicy is rendered alongside in airlock-chamber-netpol.yaml.

The `stdlib` chamber is shipped with the chart's default values so every
vanilla workspace gets bash/read_file/write_file/list_directory without
operator action. Operators add tenant-specific chambers (e.g. `git`,
`notion-cli-ro`) by appending entries under `.Values.chambers`.
*/}}
{{- range $name, $spec := .Values.chambers }}
---
apiVersion: sycophant.md/v1
kind: Chamber
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    sycophant.md/chamber: {{ $name }}
spec:
  {{- with $spec.image }}
  image: {{ . | quote }}
  {{- end }}
  {{- if $spec.credentials }}
  credentials:
    {{- range $spec.credentials }}
    - secret: {{ .secret | quote }}
      {{- with .env }}
      env: {{ . | quote }}
      {{- end }}
      {{- with .file }}
      file: {{ . | quote }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- if $spec.egress }}
  egress:
    {{- range $spec.egress }}
    - domain: {{ .domain | quote }}
      port: {{ .port }}
    {{- end }}
  {{- end }}
  keepalive: {{ $spec.keepalive | default false }}
{{- end }}
