{{/*
Toolset config: the operator-authored, flat toolset map the tools controller
loads once at startup from a mounted file.

Each entry carries `image` (which tool job pod to spawn), `keepalive` (Job
restart policy + idle-reap), and `env` (each key forwarded verbatim into the
tool job as an environment variable). An entry owns no credential and no
network hole: both come from the binding workspace's grant menu, rendered into
toolset-bindings.yaml.

The prompt section rides the same ConfigMap as a second key. The controller
reads it directly: the prompt toolset is not an entry of the toolsets map and
is bound by no workspace.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: toolset-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    sycophant.md/type: toolset-config
data:
  toolsets.yaml: |
    {{- .Values.toolsets | default dict | toYaml | nindent 4 }}
  prompt.yaml: |
    {{- .Values.prompt | default dict | toYaml | nindent 4 }}
