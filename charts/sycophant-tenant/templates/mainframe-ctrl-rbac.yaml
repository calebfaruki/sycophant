apiVersion: v1
kind: ServiceAccount
metadata:
  name: mainframe-ctrl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: mainframe-ctrl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mainframe-ctrl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: mainframe-ctrl
rules:
  - apiGroups: ["sycophant.md"]
    resources: ["kernels"]
    verbs: ["get", "list", "watch"]
  # The controller creates the one-shot S3 sync Job for `kind: S3` kernels.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
  # Secret access intentionally absent. The S3 sync Job carries the bucket
  # credentials itself via `secretKeyRef`; the controller process only
  # authors the Job spec and never reads the Secret. Keeping this Role
  # Secret-free means the chart can be installed by a narrow ServiceAccount
  # in SaaS contexts.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mainframe-ctrl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: mainframe-ctrl
subjects:
  - kind: ServiceAccount
    name: mainframe-ctrl
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: mainframe-ctrl
  apiGroup: rbac.authorization.k8s.io
