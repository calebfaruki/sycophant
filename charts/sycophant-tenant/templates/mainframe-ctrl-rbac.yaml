apiVersion: v1
kind: ServiceAccount
metadata:
  name: mainframe-ctrl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: mainframe-ctrl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mainframe-ctrl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: mainframe-ctrl
rules:
  - apiGroups: ["sycophant.md"]
    resources: ["sources"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sycophant.md"]
    resources: ["sources/status"]
    verbs: ["patch"]
  # Secret access intentionally absent. The S3 sync runs in the workspace
  # pod's init container, which mounts the S3 credentials Secret directly
  # via kubelet (no API call, no RBAC needed). HostPath mode needs no
  # Secret access either. The controller is a no-op for both kinds (see
  # watcher.rs reconcile_one()). Keeping this Role Secret-free means the
  # chart can be installed by a narrow ServiceAccount in SaaS contexts.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mainframe-ctrl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: mainframe-ctrl
subjects:
  - kind: ServiceAccount
    name: mainframe-ctrl
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: mainframe-ctrl
  apiGroup: rbac.authorization.k8s.io
