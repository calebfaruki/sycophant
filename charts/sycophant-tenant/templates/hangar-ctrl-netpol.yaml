---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hangar-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: hangar-ctrl
      app.kubernetes.io/part-of: sycophant
  ingress:
    # Internal listener (9090) — in-cluster workloads only. The external
    # listener (9091) binds 127.0.0.1 inside the Pod; the tsnet-bridge
    # sidecar reaches it via loopback, so no ingress rule is needed.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: transponder
            app.kubernetes.io/part-of: sycophant
        - matchLabels:
            app.kubernetes.io/component: llm-job
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hangar-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: hangar-ctrl
      app.kubernetes.io/part-of: sycophant
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
