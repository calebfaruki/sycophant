apiVersion: v1
kind: ServiceAccount
metadata:
  name: relay-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: relay-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay-controller
rules:
  # The relay-identity ConfigMaps: read-only. RBAC is the first lock on the
  # identity table; the Kyverno rule is the second. A relay that could write
  # the table it reads could mint itself a binding into any agent.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Warning Events naming rejected identity ConfigMaps. ConfigMaps have no
  # status subresource, so `kubectl describe configmap` is the operator's
  # only surface for a row the relay refused.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: relay-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay-controller
subjects:
  - kind: ServiceAccount
    name: relay-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: relay-controller
  apiGroup: rbac.authorization.k8s.io
