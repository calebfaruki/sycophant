apiVersion: v1
kind: ServiceAccount
metadata:
  name: relay-ctrl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay-ctrl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: relay-ctrl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay-ctrl
rules:
  # The grants ConfigMap: read-only. RBAC is the first lock on the
  # authorization table; the Kyverno rule is the second. A relay that could
  # write the table it reads could mint itself a row into any workspace.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Warning Events naming rejected grant rows. ConfigMaps have no status
  # subresource, so `kubectl describe configmap grants` is the operator's
  # only surface for a row the relay refused.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  # `create` cannot be name-scoped: `resourceNames` is not consulted on
  # create, because the name is not known at authorization time. The
  # secret-name-allowlist VAP is what pins which Secret names this SA may
  # create. The relay needs it for the first-ever redemption, which finds no
  # registered-keys Secret and creates one.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Registered device keys. Every read and write the relay makes is scoped to
  # this one name, so no other Secret in the namespace is reachable.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["relay-registered-keys"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: relay-ctrl
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay-ctrl
subjects:
  - kind: ServiceAccount
    name: relay-ctrl
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: relay-ctrl
  apiGroup: rbac.authorization.k8s.io
{{- range $channel, $entry := .Values.channels }}
{{- if eq $entry.kind "app" }}
---
# Tailnet node state for the app adapter. The adapter keeps its tailnet
# identity across restarts in this Secret (TS_KUBE_SECRET); losing it forces
# re-registration with headscale. Bound to the adapter's own
# ServiceAccount, never the relay's — a relay holding `patch` on Secrets
# could rotate its own signing key.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adapter-{{ $channel }}-state
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    app.kubernetes.io/component: adapter
    sycophant.md/channel: {{ $channel | quote }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [adapter-{{ $channel }}-state]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: adapter-{{ $channel }}-state
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    app.kubernetes.io/component: adapter
    sycophant.md/channel: {{ $channel | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: adapter-{{ $channel }}-state
subjects:
  - kind: ServiceAccount
    name: adapter-{{ $channel }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
