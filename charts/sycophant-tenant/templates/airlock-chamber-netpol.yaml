{{- range $name, $spec := .Values.chambers }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: airlock-chamber-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    sycophant.md/chamber: {{ $name }}
spec:
  endpointSelector:
    matchLabels:
      sycophant.md/chamber: {{ $name }}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          # Threat-model-aware DNS allowlist. The chamber runtime is
          # adversarial -- LLM-driven code under prompt-injection /
          # tool-injection / misalignment risk. A wildcard
          # `matchPattern: "*"` here would let a compromised chamber
          # exfiltrate secrets via DNS tunneling
          # (`<base64-secret>.evil.com`) regardless of the L4
          # toFQDNs allowlist, since the query itself reaches the
          # attacker's nameserver.
          #
          # Egress is declared at the DOMAIN level: the trust unit
          # is whoever controls the zone's apex. Declaring
          # `domain: notion.com` trusts notion.com AND `*.notion.com`
          # because they're all under the same principal's
          # nameservers. Enumerating individual subdomains adds
          # friction without security gain (an attacker can't host
          # on `evil.notion.com` -- they don't control the zone).
          #
          # Cilium matchPattern wildcards bind to a single label, so
          # `*.notion.com` covers `api.notion.com` and
          # `auth.notion.com` but NOT `foo.api.notion.com`. That's
          # a feature, not a limitation: chambers wanting deeper
          # subtree trust must declare explicitly.
          #
          # In-cluster DNS uses an explicit matchName for the
          # airlock-ctrl service (the only in-cluster dep --
          # chamber phones home for tool dispatch results).
          rules:
            dns:
              - matchName: "airlock-ctrl.{{ $.Release.Namespace }}.svc.cluster.local"
              {{- range $spec.egress }}
              {{- if ne .domain "localhost" }}
              - matchName: {{ .domain | quote }}
              - matchPattern: "*.{{ .domain }}"
              {{- end }}
              {{- end }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: airlock-ctrl
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    {{- if $spec.egress }}
    {{- range $spec.egress }}
    {{- if eq .domain "localhost" }}
    - toEntities:
        - localhost
      toPorts:
        - ports:
            - port: {{ .port | quote }}
              protocol: TCP
    {{- else }}
    - toFQDNs:
        - matchName: {{ .domain | quote }}
        - matchPattern: "*.{{ .domain }}"
      toPorts:
        - ports:
            - port: {{ .port | quote }}
              protocol: TCP
    {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
