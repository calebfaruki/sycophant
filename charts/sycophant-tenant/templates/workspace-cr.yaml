{{/*
Emit one Workspace CR per entry under `.Values.workspaces`. The
mainframe-controller reconciles each into the per-workspace transponder
Pod + ServiceAccount + PVC. All tool execution (stdlib + tenant tools)
runs through airlock-spawned chamber pods.

When the operator omits `chambers`, the chart binds the default
`stdlib` chamber so vanilla workspaces get bash/read_file/write_file/
list_directory without operator action. To unbind, the operator must
declare an explicit (possibly empty) chambers list.

`kernels: [<name>]` is auto-populated so future multi-kernel workspaces
have a stable field to add references to; the reconciler does not yet
consume it.
*/}}
{{- range $name, $ws := .Values.workspaces }}
---
apiVersion: sycophant.md/v1
kind: Workspace
metadata:
  name: {{ $name }}
  labels:
    {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 4 }}
spec:
  {{- with $ws.transponder }}
  transponder:
    {{- with .cpu }}
    cpu: {{ . | quote }}
    {{- end }}
    {{- with .memory }}
    memory: {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- with $ws.storage }}
  storage: {{ . | quote }}
  {{- end }}
  {{- if $ws.kernel }}
  kernel:
    kind: {{ $ws.kernel.kind }}
    {{- if eq $ws.kernel.kind "HostPath" }}
    hostPath:
      path: {{ $ws.kernel.hostPath.path | quote }}
    {{- else if eq $ws.kernel.kind "S3" }}
    s3:
      endpoint: {{ $ws.kernel.s3.endpoint | quote }}
      bucket: {{ $ws.kernel.s3.bucket | quote }}
      prefix: {{ $ws.kernel.s3.prefix | quote }}
      region: {{ $ws.kernel.s3.region | default "us-east-1" | quote }}
      forcePathStyle: {{ $ws.kernel.s3.forcePathStyle | default true }}
      credentials:
        name: {{ $ws.kernel.s3.credentials.name | quote }}
        {{- with $ws.kernel.s3.credentials.accessKeyIdKey }}
        accessKeyIdKey: {{ . | quote }}
        {{- end }}
        {{- with $ws.kernel.s3.credentials.secretAccessKeyKey }}
        secretAccessKeyKey: {{ . | quote }}
        {{- end }}
    {{- end }}
  kernels:
    - {{ $name | quote }}
  {{- end }}
  chambers:
    {{- if hasKey $ws "chambers" }}
    {{- range $ws.chambers }}
    - {{ . | quote }}
    {{- end }}
    {{- else }}
    - "stdlib"
    {{- end }}
{{- end }}
