{{/*
Emit one Workspace CR per entry under `.Values.workspaces`. The
mainframe-controller reconciles each into a Sandbox + ServiceAccount +
PVC + NetworkPolicy with an ownerRef back to the Workspace
(crates/mainframe-controller/src/materialize.rs).

`kernels: [<name>]` is auto-populated to the workspace's own name so
the reconciler treats inline `mainframe` content and external-by-name
kernel references uniformly.
*/}}
{{- range $name, $ws := .Values.workspaces }}
---
apiVersion: sycophant.md/v1
kind: Workspace
metadata:
  name: {{ $name }}
  labels:
    {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 4 }}
spec:
  image: {{ $ws.image | quote }}
  tag: {{ $ws.tag | quote }}
  {{- with $ws.pullPolicy }}
  pullPolicy: {{ . | quote }}
  {{- end }}
  {{- with $ws.cpu }}
  cpu: {{ . | quote }}
  {{- end }}
  {{- with $ws.memory }}
  memory: {{ . | quote }}
  {{- end }}
  {{- with $ws.storage }}
  storage: {{ . | quote }}
  {{- end }}
  {{- if $ws.mainframe }}
  mainframe:
    kind: {{ $ws.mainframe.kind }}
    {{- if eq $ws.mainframe.kind "HostPath" }}
    hostPath:
      path: {{ $ws.mainframe.hostPath.path | quote }}
    {{- else if eq $ws.mainframe.kind "S3" }}
    s3:
      endpoint: {{ $ws.mainframe.s3.endpoint | quote }}
      bucket: {{ $ws.mainframe.s3.bucket | quote }}
      prefix: {{ $ws.mainframe.s3.prefix | quote }}
      region: {{ $ws.mainframe.s3.region | default "us-east-1" | quote }}
      forcePathStyle: {{ $ws.mainframe.s3.forcePathStyle | default true }}
      credentials:
        name: {{ $ws.mainframe.s3.credentials.name | quote }}
        {{- with $ws.mainframe.s3.credentials.accessKeyIdKey }}
        accessKeyIdKey: {{ . | quote }}
        {{- end }}
        {{- with $ws.mainframe.s3.credentials.secretAccessKeyKey }}
        secretAccessKeyKey: {{ . | quote }}
        {{- end }}
    {{- end }}
  kernels:
    - {{ $name | quote }}
  {{- end }}
  {{- with $ws.chambers }}
  chambers:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
{{- end }}
