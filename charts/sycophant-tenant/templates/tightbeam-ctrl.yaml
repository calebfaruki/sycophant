---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tightbeam-ctrl
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tightbeam-ctrl
    app.kubernetes.io/name: tightbeam-ctrl
spec:
  replicas: 1
  # Recreate (not RollingUpdate): the controller bootstraps its signing
  # key in tightbeam-signing-key Secret and writes to a ReadWriteOnce log
  # PVC. RollingUpdate would briefly run two controllers racing both.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tightbeam-ctrl
      app.kubernetes.io/part-of: sycophant
  template:
    metadata:
      labels:
        {{- include "sycophant.labels" . | nindent 8 }}
        app.kubernetes.io/component: tightbeam-ctrl
        app.kubernetes.io/name: tightbeam-ctrl
    spec:
      serviceAccountName: tightbeam-ctrl
      tolerations:
        - key: sycophant.md/workload
          operator: Equal
          value: tightbeam
          effect: NoSchedule
      {{- if .Values.controllers.adversarialAntiAffinity.enabled }}
      # Hard anti-affinity vs gVisor-wrapped adversarial pods (gvisor
      # escape stays node-local; controllers stay off those nodes).
      # Toggle off in single-node dev via
      # .Values.controllers.adversarialAntiAffinity.enabled=false.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values: [transponder, mainframe-task, airlock-job, llm-job, channel-job]
              topologyKey: kubernetes.io/hostname
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: ctrl
          image: "{{ .Values.controller.image }}:{{ .Values.controller.tag }}"
          imagePullPolicy: {{ .Values.controller.pullPolicy | default "IfNotPresent" }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: TIGHTBEAM_NAMESPACE
              value: "{{ .Release.Namespace }}"
            - name: TIGHTBEAM_CONTROLLER_ADDR
              value: "http://tightbeam-ctrl:9090"
            - name: TIGHTBEAM_LLM_JOB_IMAGE
              value: "{{ .Values.controller.llmJobImage }}"
            - name: TIGHTBEAM_SCHEDULING_FILE
              value: "/etc/sycophant/scheduling/scheduling.yaml"
            # Conversation log destination. Two backends supported:
            #   LocalFs (default) -- per-event JSON files on the log PVC
            #   S3                -- per-event objects in an S3-compatible
            #                        bucket (Versitygw locally, Hetzner Object
            #                        Storage in production)
            - name: TIGHTBEAM_CONVERSATION_SINK_KIND
              value: {{ .Values.tightbeam.conversations.kind | default "LocalFs" | quote }}
            {{- if eq (.Values.tightbeam.conversations.kind | default "LocalFs") "S3" }}
            - name: TIGHTBEAM_CONVERSATION_SINK_S3_ENDPOINT
              value: {{ .Values.tightbeam.conversations.s3.endpoint | quote }}
            - name: TIGHTBEAM_CONVERSATION_SINK_S3_BUCKET
              value: {{ .Values.tightbeam.conversations.s3.bucket | quote }}
            - name: TIGHTBEAM_CONVERSATION_SINK_S3_PREFIX
              value: {{ .Values.tightbeam.conversations.s3.prefix | quote }}
            - name: TIGHTBEAM_CONVERSATION_SINK_S3_REGION
              value: {{ .Values.tightbeam.conversations.s3.region | default "us-east-1" | quote }}
            - name: TIGHTBEAM_CONVERSATION_SINK_S3_FORCE_PATH_STYLE
              value: {{ .Values.tightbeam.conversations.s3.forcePathStyle | default true | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tightbeam.conversations.s3.credentials.name | quote }}
                  key: {{ .Values.tightbeam.conversations.s3.credentials.accessKeyIdKey | default "access-key-id" | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tightbeam.conversations.s3.credentials.name | quote }}
                  key: {{ .Values.tightbeam.conversations.s3.credentials.secretAccessKeyKey | default "secret-access-key" | quote }}
            {{- end }}
            # Per-tenant Ed25519 signing key lives in the
            # `tightbeam-signing-key` Secret. The controller creates the
            # Secret on first start (32 random bytes) and reads it on every
            # restart. Client enrollment is operator-driven: apply a Client
            # CR and the controller mints status.enrollmentCode.
          ports:
            # Internal listener (9090): K8s ServiceAccount tokens via
            # TokenReview. Reachable from in-cluster pods only via the
            # NetworkPolicy below.
            - name: grpc-internal
              containerPort: 9090
            # External listener (9091): signed-request envelope verified
            # by the in-process tower middleware. Bound 127.0.0.1 inside
            # the Pod; the tsnet-bridge sidecar (defined below, gated by
            # .Values.tsnetBridge.enabled) forwards from the tailnet via
            # loopback.
            - name: grpc-external
              containerPort: 9091
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: logs
              mountPath: /var/log/tightbeam
            - name: scheduling
              mountPath: /etc/sycophant/scheduling
              readOnly: true
        {{- if .Values.tsnetBridge.enabled }}
        # tsnet-bridge sidecar: bridges the tailnet to the controller's
        # external listener on 127.0.0.1:9091. Colocated in the same Pod
        # so the bridge reaches the external listener over loopback —
        # closed off from the cluster pod network entirely.
        - name: tsnet-bridge
          image: "{{ .Values.tsnetBridge.image }}:{{ .Values.tsnetBridge.tag }}"
          imagePullPolicy: {{ .Values.tsnetBridge.pullPolicy | default "IfNotPresent" }}
          env:
            # Userspace networking: WireGuard runs in gVisor netstack
            # rather than via a kernel TUN device. No CAP_NET_ADMIN
            # needed, lets the sidecar run non-root.
            - name: TS_USERSPACE
              value: "true"
            - name: TS_HOSTNAME
              value: {{ .Values.tsnetBridge.hostname | quote }}
            - name: TS_EXTRA_ARGS
              value: {{ printf "--login-server=%s" (required "tsnetBridge.loginServer is required when tsnetBridge.enabled=true" .Values.tsnetBridge.loginServer) | quote }}
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tsnetBridge.authKeySecret }}
                  key: authkey
            - name: TS_KUBE_SECRET
              # Persisted node state Secret; lets the sidecar keep its
              # tailnet identity across pod restarts.
              value: tightbeam-tsnet-bridge-state
            - name: TS_SERVE_CONFIG
              value: /etc/tsnet/serve.json
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tsnet-serve-config
              mountPath: /etc/tsnet
              readOnly: true
            - name: tsnet-tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: scheduling
          configMap:
            name: tightbeam-scheduling
        - name: logs
          persistentVolumeClaim:
            claimName: tightbeam-ctrl-logs
        {{- if .Values.tsnetBridge.enabled }}
        - name: tsnet-serve-config
          configMap:
            name: tightbeam-tsnet-bridge-serve
        - name: tsnet-tmp
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: tightbeam-ctrl
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tightbeam-ctrl
spec:
  type: ClusterIP
  ports:
    # Internal-only Service port — published for in-cluster callers
    # (LLM Job, channel adapters, syco-cli pods). The external listener
    # is NOT exposed via Service: it binds 127.0.0.1 in the Pod and is
    # only reachable through the tsnet-bridge sidecar.
    - name: grpc
      port: 9090
      targetPort: grpc-internal
  selector:
    app.kubernetes.io/name: tightbeam-ctrl
    app.kubernetes.io/part-of: sycophant
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tightbeam-ctrl-logs
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tightbeam-ctrl
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
{{- if .Values.tsnetBridge.enabled }}
---
# tsnet-bridge sidecar serve config. Consumed by the tailscale
# container in the same Pod (defined above). Forwards tailnet TCP :9090
# → controller's external listener on loopback :9091. The tailnet IS
# the trust boundary at the network layer; signed-request verification
# (signature_layer.rs middleware) is the trust boundary at the
# application layer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tightbeam-tsnet-bridge-serve
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tightbeam-tsnet-bridge
data:
  serve.json: |
    {
      "TCP": {
        "9090": {
          "HTTPS": false,
          "TCPForward": "127.0.0.1:9091"
        }
      }
    }
{{- end }}
