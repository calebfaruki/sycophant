---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tightbeam-ctrl
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tightbeam-ctrl
    app.kubernetes.io/name: tightbeam-ctrl
spec:
  replicas: 1
  # Recreate (not RollingUpdate): the gateway bootstraps its per-tenant
  # signing key into the tightbeam-signing-key Secret on first start.
  # RollingUpdate would briefly run two gateways racing the bootstrap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tightbeam-ctrl
      app.kubernetes.io/part-of: sycophant
  template:
    metadata:
      labels:
        {{- include "sycophant.labels" . | nindent 8 }}
        app.kubernetes.io/component: tightbeam-ctrl
        app.kubernetes.io/name: tightbeam-ctrl
    spec:
      serviceAccountName: tightbeam-ctrl
      automountServiceAccountToken: false
      tolerations:
        - key: sycophant.md/workload
          operator: Equal
          value: tightbeam
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ctrl
          image: "{{ .Values.tightbeam.image }}:{{ .Values.tightbeam.tag }}"
          imagePullPolicy: {{ .Values.tightbeam.pullPolicy | default "IfNotPresent" }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: TIGHTBEAM_NAMESPACE
              value: "{{ .Release.Namespace }}"
            # Per-tenant Ed25519 signing key lives in the
            # `tightbeam-signing-key` Secret. The gateway creates it on
            # first start (32 random bytes) and reads it on every restart.
            # No update/patch RBAC — a compromised gateway cannot rotate it.
          ports:
            # Internal listener (9090): K8s ServiceAccount tokens via
            # TokenReview. Reachable from in-cluster pods only via the
            # NetworkPolicy below (transponder Subscribe; later DeliverOutbound).
            - name: grpc-internal
              containerPort: 9090
            # External listener (9091): client-signed envelope verified by
            # the in-process tower middleware. Bound 127.0.0.1 inside the
            # Pod; the tsnet-bridge sidecar (below, gated by
            # .Values.tsnetBridge.enabled) forwards from the tailnet via
            # loopback. Never exposed on the pod network.
            - name: grpc-external
              containerPort: 9091
          # Startup can block up to ~60s on first install while the
          # signing-key bootstrap waits for RBAC propagation (the gateway
          # exits if it exceeds its budget). A generous startupProbe avoids
          # liveness flapping during that window.
          startupProbe:
            grpc:
              port: 9090
            periodSeconds: 5
            failureThreshold: 18
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            # Outbound to hangar: forward conversation/history RPCs.
            - name: tightbeam-hangar-auth
              mountPath: /var/run/secrets/tightbeam/hangar
              readOnly: true
            # Outbound to the per-workspace transponder: forward external
            # WatchTools / CallTool. Token audience is hangar.transponder
            # (the dialer code is lifted from the pre-split controller).
            - name: hangar-transponder-auth
              mountPath: /var/run/secrets/hangar/transponder
              readOnly: true
            {{- include "sycophant.projectedKubeApiToken.mount" . | nindent 12 }}
        {{- if .Values.tsnetBridge.enabled }}
        # tsnet-bridge sidecar: bridges the tailnet to the gateway's
        # external listener on 127.0.0.1:9091. Colocated in the same Pod
        # so the bridge reaches the external listener over loopback —
        # closed off from the cluster pod network entirely.
        - name: tsnet-bridge
          image: "{{ .Values.tsnetBridge.image }}:{{ .Values.tsnetBridge.tag }}"
          imagePullPolicy: {{ .Values.tsnetBridge.pullPolicy | default "IfNotPresent" }}
          env:
            # Userspace networking: WireGuard runs in gVisor netstack
            # rather than via a kernel TUN device. No CAP_NET_ADMIN
            # needed, lets the sidecar run non-root.
            - name: TS_USERSPACE
              value: "true"
            - name: TS_HOSTNAME
              value: {{ .Values.tsnetBridge.hostname | quote }}
            - name: TS_EXTRA_ARGS
              value: {{ printf "--login-server=%s" (required "tsnetBridge.loginServer is required when tsnetBridge.enabled=true" .Values.tsnetBridge.loginServer) | quote }}
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tsnetBridge.authKeySecret }}
                  key: authkey
            - name: TS_KUBE_SECRET
              # Persisted node state Secret; lets the sidecar keep its
              # tailnet identity across pod restarts.
              value: tightbeam-tsnet-bridge-state
            - name: TS_SERVE_CONFIG
              value: /etc/tsnet/serve.json
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tsnet-serve-config
              mountPath: /etc/tsnet
              readOnly: true
            - name: tsnet-tmp
              mountPath: /tmp
            {{- include "sycophant.projectedKubeApiToken.mount" . | nindent 12 }}
        {{- end }}
      volumes:
        - name: tightbeam-hangar-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: tightbeam.hangar.sycophant.md
                  expirationSeconds: 3600
        - name: hangar-transponder-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: hangar.transponder.sycophant.md
                  expirationSeconds: 3600
        {{- include "sycophant.projectedKubeApiToken.volume" . | nindent 8 }}
        {{- if .Values.tsnetBridge.enabled }}
        - name: tsnet-serve-config
          configMap:
            name: tightbeam-tsnet-bridge-serve
        - name: tsnet-tmp
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: tightbeam-ctrl
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tightbeam-ctrl
spec:
  type: ClusterIP
  ports:
    # Internal-only Service port — published for in-cluster callers
    # (the per-workspace transponder Subscribe stream; later DeliverOutbound).
    # The external listener is NOT exposed via Service: it binds 127.0.0.1
    # in the Pod and is only reachable through the tsnet-bridge sidecar.
    - name: grpc
      port: 9090
      targetPort: grpc-internal
  selector:
    app.kubernetes.io/name: tightbeam-ctrl
    app.kubernetes.io/part-of: sycophant
{{- if .Values.tsnetBridge.enabled }}
---
# tsnet-bridge sidecar serve config. Consumed by the tailscale container
# in the same Pod (defined above). Forwards tailnet TCP :9090 → gateway's
# external listener on loopback :9091. The tailnet IS the trust boundary
# at the network layer; client-signed-envelope verification
# (signature_layer.rs middleware) is the trust boundary at the
# application layer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tightbeam-tsnet-bridge-serve
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tightbeam-tsnet-bridge
data:
  serve.json: |
    {
      "TCP": {
        "9090": {
          "HTTPS": false,
          "TCPForward": "127.0.0.1:9091"
        }
      }
    }
{{- end }}
