---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: relay-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: relay-controller
      app.kubernetes.io/part-of: sycophant
  # One object carries every relay ingress rule. Any ingress policy
  # selecting a pod flips that pod to default-deny for ingress, so a
  # missing or mistyped rule inside this object fails CLOSED. Only
  # whole-object absence fails open, and that same absence drops the
  # harness link, which is loud and immediate.
  ingress:
    # Harness link (9090) — in-cluster workloads only. The harness dials
    # Subscribe and DeliverOutbound.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: harness
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Principal port (9092) — principal-class channel pods that hold their own
    # signing identity. Key equals value throughout: an empty or under-specified
    # Cilium endpoint selector matches every endpoint, which is fail-open.
    # Never keyed on sycophant.md/channel, which is an instance name.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: channel
            sycophant.md/channel-class: principal
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9092"
              protocol: TCP
    # App port (9091) — the transport-class channel pipe, and nothing else.
    # A bare component match would admit every channel pod, principal ones
    # included.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: channel
            sycophant.md/channel-class: transport
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: relay-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: relay-controller
      app.kubernetes.io/part-of: sycophant
  egress:
    # kube-apiserver: TokenReview on every caller, the relay-identity
    # ConfigMap watch, per-request access reviews, and Warning Events on bad
    # identity ConfigMaps.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    {{- include "sycophant.dnsEgress" . | nindent 4 }}
    # Per-agent harness relay-forward surface (9091): the gateway
    # forwards external WatchTools / CallTool calls into the agent's
    # harness. This is the harness's relay-only port, split off the pod-facing
    # dispatch port (9090). The per-agent ag-<agent>-egress CNP
    # authorises the reverse (harness ingress admitting relay-controller to 9091).
    # Agent scoping is enforced at the application layer (the per-request
    # SubjectAccessReview + channel binding) and by the harness's
    # per-agent ingress.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: harness
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
