{{/*
Toolset bindings for toolset-ctrl: which toolsets each workspace may call, and
the grants a call may select from. Namespace-wide, because toolset-ctrl
serves every workspace.

A harness mounts `toolset-bindings-<workspace>` instead, which carries only its
own entry. Both render through `sycophant.workspaceBindings`, so the two views
cannot drift.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: toolset-bindings
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    sycophant.md/type: toolset-bindings
data:
  bindings.yaml: |
    {{- range $name, $ws := .Values.workspaces }}
    {{- include "sycophant.workspaceBindings" (dict "name" $name "workspace" $ws) | nindent 4 }}
    {{- end }}
