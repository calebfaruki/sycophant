{{- $hasApp := false }}
{{- range $channel, $entry := .Values.channels }}
{{- if eq $entry.kind "app" }}
{{- $hasApp = true }}
{{- end }}
{{- end }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: relay-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: relay-ctrl
      app.kubernetes.io/part-of: sycophant
  # One object carries every relay ingress rule. Any ingress policy
  # selecting a pod flips that pod to default-deny for ingress, so a
  # missing or mistyped rule inside this object fails CLOSED. Only
  # whole-object absence fails open, and that same absence drops the
  # harness link, which is loud and immediate.
  ingress:
    # Harness link (9090) — in-cluster workloads only. The harness dials
    # Subscribe and DeliverOutbound.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: harness
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Adapter port (9092) — platform adapters that hold their own signing
    # identity. Key equals value throughout: an empty or under-specified
    # Cilium endpoint selector matches every endpoint, which is fail-open.
    # Never keyed on sycophant.md/channel, which is an instance name.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: adapter
            sycophant.md/adapter-class: principal
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9092"
              protocol: TCP
{{- if $hasApp }}
    # App port (9091) — the transport-class adapter pipe, and nothing else.
    # A bare component match would admit every adapter, platform adapters
    # included.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: adapter
            sycophant.md/adapter-class: transport
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
{{- end }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: relay-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: relay-ctrl
      app.kubernetes.io/part-of: sycophant
  egress:
    # kube-apiserver: TokenReview (internal-caller auth), the grants
    # ConfigMap watch, Warning Events on bad rows, and the
    # registered-keys Secret.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # toolset-ctrl: forward conversation / history RPCs to the toolset
    # controller (which still owns the conversation log this stage).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: toolset-ctrl
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Per-workspace harness gRPC: the gateway forwards external
    # WatchTools / CallTool calls into the workspace's harness. The
    # harness-egress CNP authorises the reverse (harness ingress
    # allowing relay-ctrl). Workspace scoping is enforced at the
    # application layer (caller's signed envelope + channel binding).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: harness
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP