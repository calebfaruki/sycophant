{{/*
Per-workspace render of a workspace's approved capability grants, for the
identity-keyed admission gate to read as its secret-name allowlist. One
ConfigMap per workspace that declares grants; its `data` keys are the approved
Secret names and each value names the owning toolset. No secret material, mount
path, or egress domain appears: the keys are names, and membership answers "is
Secret S approved for workspace W" without parsing any YAML string value.

Rendered from the same operator-authored grant values `toolset-bindings-ns-cm.yaml`
reads, so the admission view cannot drift from the grants.

Every workspace gets one, with empty `data` when it declares no grants. The
ConfigMap is a gate context source, and Kyverno fails closed when a context
source is missing: an absent ConfigMap denies every Job the workspace's harness
creates, not just the ones naming a Secret. An empty allowlist is the "no
approvals" state; absence is an outage.
*/}}
{{- range $name, $ws := .Values.workspaces }}
{{- $seen := dict }}
{{- range $toolset := (default list $ws.toolsets) }}
{{- if not (kindIs "string" $toolset) }}
{{- range $grant, $spec := $toolset.grants }}
{{- $_ := set $seen $spec.secret $toolset.name }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: capability-grants-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    sycophant.md/workspace: {{ $name }}
    sycophant.md/type: capability-grants
{{- if $seen }}
data:
  {{- range $secret, $owner := $seen }}
  {{ $secret }}: {{ $owner | quote }}
  {{- end }}
{{- else }}
data: {}
{{- end }}
{{- end }}
