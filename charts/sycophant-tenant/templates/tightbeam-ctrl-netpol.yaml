---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tightbeam-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: tightbeam-ctrl
      app.kubernetes.io/part-of: sycophant
  ingress:
    # Internal listener (9090) — in-cluster workloads only. The external
    # listener (9091) binds 127.0.0.1 inside the Pod; the tsnet-bridge
    # sidecar reaches it via loopback, so no ingress rule is needed.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/component: transponder
            app.kubernetes.io/part-of: sycophant
        - matchLabels:
            app.kubernetes.io/component: llm-job
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tightbeam-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: tightbeam-ctrl
      app.kubernetes.io/part-of: sycophant
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Per-workspace transponder gRPC: tightbeam-ctrl forwards external
    # WatchTools / CallTool calls into the workspace's transponder. The
    # transponder-egress CNP authorises the reverse direction (transponder
    # ingress allowing tightbeam-ctrl). Workspace scoping is enforced at
    # the application layer (caller's signed envelope + channel binding).
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: transponder
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    {{- if .Values.tsnetBridge.enabled }}
    # tsnet-bridge sidecar egress (rules apply to the whole Pod —
    # CiliumNetworkPolicy is per-Pod, not per-container).
    {{- if .Values.headscale.enabled }}
    # In-cluster headscale control plane registration.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: headscale
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    {{- end }}
    # Public internet for external headscale (when not bundled) AND for
    # Tailscale DERP relay fallback when direct NAT punching fails.
    #   - 443/TCP: headscale HTTPS + DERP HTTPS
    #   - 41641/UDP: WireGuard direct/DERP fallback default port
    #   - 3478/UDP: STUN
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "41641"
              protocol: UDP
            - port: "3478"
              protocol: UDP
    {{- end }}
