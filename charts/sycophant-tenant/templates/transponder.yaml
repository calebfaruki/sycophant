{{/*
Per-workspace materialization: emit one ServiceAccount + PersistentVolumeClaim
+ Deployment per entry under `.Values.workspaces`. The workspace PVC is
mounted by airlock-spawned chamber jobs (RW). The transponder is a pure
gRPC router and mounts nothing operator-facing — kernel content is owned
by mainframe-ctrl and served via the GetAgent RPC.

runtimeClassName is stamped by the cluster-runtime-class Kyverno mutate
on every `part-of=sycophant` pod -- not set here.

Audience strings on the projected tokens are duplicated from
`crates/shared/src/auth.rs` (TRANSPONDER_TIGHTBEAM_AUDIENCE +
TRANSPONDER_AIRLOCK_AUDIENCE + TRANSPONDER_MAINFRAME_AUDIENCE). Drift
surfaces at first transponder boot when audience verification fails.
*/}}
{{- range $name, $ws := .Values.workspaces }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/type: workspace-sa
    sycophant.md/workspace: {{ $name }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-workspace-data
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/workspace: {{ $name }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $ws.storage | default "1Gi" | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 4 }}
    sycophant.md/workspace: {{ $name }}
spec:
  replicas: 1
  # RWO PVC consumed by chamber jobs co-located with this transponder;
  # rolling updates would briefly race two transponders. Recreate
  # keeps the contract simple.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      sycophant.md/workspace: {{ $name }}
      app.kubernetes.io/component: transponder
      app.kubernetes.io/part-of: sycophant
  template:
    metadata:
      labels:
        {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 8 }}
        sycophant.md/workspace: {{ $name }}
    spec:
      serviceAccountName: sa-{{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      tolerations:
        - key: sycophant.md/workload
          operator: Equal
          value: workspace
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: transponder
          image: "{{ $.Values.transponder.image }}:{{ $.Values.transponder.tag }}"
          imagePullPolicy: {{ $.Values.transponder.pullPolicy | default "IfNotPresent" }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            limits:
              cpu: {{ (or $ws.transponder dict).cpu | default "500m" | quote }}
              memory: {{ (or $ws.transponder dict).memory | default "256Mi" | quote }}
          env:
            - { name: TIGHTBEAM_CONTROLLER_ADDR,  value: "http://tightbeam-ctrl:9090" }
            - { name: AIRLOCK_CONTROLLER_ADDR,    value: "http://airlock-ctrl:9090" }
            - { name: MAINFRAME_CONTROLLER_ADDR,  value: "http://mainframe-ctrl:9090" }
          ports:
            - { name: healthz, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: healthz }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: healthz }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - { name: transponder-auth,           mountPath: /var/run/secrets/transponder/tightbeam, readOnly: true }
            - { name: transponder-airlock-auth,   mountPath: /var/run/secrets/transponder/airlock,   readOnly: true }
            - { name: transponder-mainframe-auth, mountPath: /var/run/secrets/transponder/mainframe, readOnly: true }
      volumes:
        - name: transponder-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: transponder.tightbeam.sycophant.md
                  expirationSeconds: 3600
        - name: transponder-airlock-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: transponder.airlock.sycophant.md
                  expirationSeconds: 3600
        - name: transponder-mainframe-auth
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: transponder.mainframe.sycophant.md
                  expirationSeconds: 3600
{{- end }}
