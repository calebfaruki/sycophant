{{- /* Kernel delivery is per-workspace: one cluster-scoped read-only hostPath PV
       + namespaced PVC per entry in `.Values.workspaces`, mounted at
       /etc/kernels/<ns>/<workspace>. No Helm `lookup` for delivery, so `helm
       template | kubectl apply` and `helm install` render identically. The only
       lookup is the Namespace uid for each PV's GC ownerReference — hygiene, not
       delivery, so its absence under `helm template` never strips a kernel. */}}
{{- $ns := lookup "v1" "Namespace" "" .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainframe-ctrl
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: mainframe-ctrl
    app.kubernetes.io/name: mainframe-ctrl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mainframe-ctrl
      app.kubernetes.io/part-of: sycophant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "sycophant.labels" . | nindent 8 }}
        app.kubernetes.io/component: mainframe-ctrl
        app.kubernetes.io/name: mainframe-ctrl
    spec:
      serviceAccountName: mainframe-ctrl
      automountServiceAccountToken: false
      tolerations:
        - key: sycophant.md/workload
          operator: Equal
          value: mainframe
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ctrl
          image: "{{ .Values.mainframe.image }}:{{ .Values.mainframe.tag }}"
          imagePullPolicy: {{ .Values.mainframe.pullPolicy | default "IfNotPresent" }}
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          args:
            - "--port"
            - "9090"
            - "--namespace"
            - "{{ .Release.Namespace }}"
            - "--kernels-root"
            - {{ printf "/etc/kernels/%s" .Release.Namespace | quote }}
          ports:
            - name: grpc
              containerPort: 9090
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            {{- include "sycophant.projectedKubeApiToken.mount" . | nindent 12 }}
            # One read-only mount per workspace at /etc/kernels/<ns>/<workspace>;
            # persona-file edits within it are live (the controller reads at RPC time).
            {{- range $name, $ws := .Values.workspaces }}
            - { name: {{ printf "kernel-%s" $name }}, mountPath: {{ printf "/etc/kernels/%s/%s" $.Release.Namespace $name | quote }}, readOnly: true }
            {{- end }}
      volumes:
        {{- include "sycophant.projectedKubeApiToken.volume" . | nindent 8 }}
        # Each hostPath lives in a cluster-scoped PV below (PSA does not inspect it);
        # the pod mounts the PVCs, which `restricted` allows.
        {{- range $name, $ws := .Values.workspaces }}
        - name: {{ printf "kernel-%s" $name }}
          persistentVolumeClaim:
            claimName: {{ printf "kernel-%s" $name }}
            readOnly: true
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: mainframe-ctrl
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: mainframe-ctrl
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
  selector:
    app.kubernetes.io/name: mainframe-ctrl
    app.kubernetes.io/part-of: sycophant
{{- /*
  Per-workspace kernel storage. For each workspace: one cluster-scoped read-only
  hostPath PV + namespaced PVC. hostPath is <hostPathBase>/<ns>/<workspace> by
  default, or the workspace's custom `kernel.path`. PSA `restricted` forbids pod
  hostPath volumes but allows PVCs and never inspects the cluster-scoped PV where
  the hostPath lives. A Namespace ownerReference GCs each PV on `kubectl delete
  ns` (uid via lookup; omitted until the namespace exists). No
  `resource-policy: keep` — persona content is reproducible.
*/}}
{{- range $name, $ws := .Values.workspaces }}
{{- $kernel := $ws.kernel | default dict }}
{{- $path := $kernel.path | default (printf "%s/%s/%s" $.Values.mainframe.kernels.hostPathBase $.Release.Namespace $name) }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ printf "kernel-%s-%s" $name $.Release.Namespace }}
  {{- if $ns }}
  ownerReferences:
    - apiVersion: v1
      kind: Namespace
      name: {{ $.Release.Namespace }}
      uid: {{ $ns.metadata.uid }}
      blockOwnerDeletion: false
  {{- end }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    app.kubernetes.io/component: kernel
    sycophant.md/workspace: {{ $name }}
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadOnlyMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: {{ $path | quote }}
    type: DirectoryOrCreate
  claimRef:
    namespace: {{ $.Release.Namespace }}
    name: {{ printf "kernel-%s" $name }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "kernel-%s" $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    app.kubernetes.io/component: kernel
    sycophant.md/workspace: {{ $name }}
spec:
  accessModes: ["ReadOnlyMany"]
  storageClassName: ""
  volumeName: {{ printf "kernel-%s-%s" $name $.Release.Namespace }}
  resources:
    requests:
      storage: 1Gi
{{- end }}
