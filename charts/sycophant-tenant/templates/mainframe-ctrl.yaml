---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainframe-ctrl
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: mainframe-ctrl
    app.kubernetes.io/name: mainframe-ctrl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mainframe-ctrl
      app.kubernetes.io/part-of: sycophant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "sycophant.labels" . | nindent 8 }}
        app.kubernetes.io/component: mainframe-ctrl
        app.kubernetes.io/name: mainframe-ctrl
    spec:
      serviceAccountName: mainframe-ctrl
      automountServiceAccountToken: false
      tolerations:
        - key: sycophant.md/workload
          operator: Equal
          value: mainframe
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ctrl
          image: "{{ .Values.mainframe.image }}:{{ .Values.mainframe.tag }}"
          imagePullPolicy: {{ .Values.mainframe.pullPolicy | default "IfNotPresent" }}
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          args:
            - "--port"
            - "9090"
            - "--namespace"
            - "{{ .Release.Namespace }}"
            - "--refresh-interval-seconds"
            - "{{ .Values.mainframe.refreshIntervalSeconds | default 60 }}"
          ports:
            - name: grpc
              containerPort: 9090
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            {{- include "sycophant.projectedKubeApiToken.mount" . | nindent 12 }}
      volumes:
        {{- include "sycophant.projectedKubeApiToken.volume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mainframe-ctrl
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: mainframe-ctrl
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
  selector:
    app.kubernetes.io/name: mainframe-ctrl
    app.kubernetes.io/part-of: sycophant
