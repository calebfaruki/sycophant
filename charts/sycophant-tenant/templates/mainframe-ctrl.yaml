---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mainframe-ctrl
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: mainframe-ctrl
    app.kubernetes.io/name: mainframe-ctrl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mainframe-ctrl
      app.kubernetes.io/part-of: sycophant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "sycophant.labels" . | nindent 8 }}
        app.kubernetes.io/component: mainframe-ctrl
        app.kubernetes.io/name: mainframe-ctrl
    spec:
      serviceAccountName: mainframe-ctrl
      tolerations:
        - key: sycophant.io/workload
          operator: Equal
          value: mainframe
          effect: NoSchedule
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: tightbeam-ctrl
                  app.kubernetes.io/instance: {{ .Release.Name }}
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: ctrl
          image: "{{ .Values.mainframe.image }}:{{ .Values.mainframe.tag }}"
          imagePullPolicy: {{ .Values.mainframe.pullPolicy | default "IfNotPresent" }}
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          args:
            - "--port"
            - "9090"
            - "--namespace"
            - "{{ .Release.Namespace }}"
            - "--refresh-interval-seconds"
            - "{{ .Values.mainframe.refreshIntervalSeconds | default 60 }}"
          env:
            # MaterializationContext inputs (see crates/mainframe-controller/
            # src/materialize.rs). The controller reads these at startup
            # to build the per-tenant Sandbox spec when reconciling
            # Workspace CRs.
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: TRANSPONDER_IMAGE
              value: {{ .Values.transponder.image | quote }}
            - name: TRANSPONDER_TAG
              value: {{ .Values.transponder.tag | quote }}
            - name: TRANSPONDER_PULL_POLICY
              value: {{ .Values.transponder.pullPolicy | default "IfNotPresent" | quote }}
          ports:
            - name: grpc
              containerPort: 9090
          readinessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mainframe-ctrl
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: mainframe-ctrl
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
  selector:
    app.kubernetes.io/name: mainframe-ctrl
    app.kubernetes.io/part-of: sycophant
