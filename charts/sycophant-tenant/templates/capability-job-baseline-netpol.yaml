{{/*
Fail-closed egress baseline for every capability-job pod. Selects all
capability-job pods and allows ONLY the universal minimum: kube-dns:53 with an L7
DNS allowlist pinned to the toolset-ctrl FQDN and the harness FQDN pattern,
plus :9090 to toolset-ctrl and to the workspace harness for tool dispatch. A
capability job with no per-toolset CNP is therefore denied all external egress
(fail-closed), regardless of how its toolset entry was authored.

Per-model CNPs (`inference-egress-<model-key>`, rendered by inference-egress-netpol.yaml)
and per-grant CNPs (`toolset-grant-<workspace>-<toolset>-<grant>`, rendered by
toolset-grant-netpol.yaml) ADD their declared domains on top of this floor.
Cilium unions same-PortProtocol L7 DNS rules across policies, so every one of
them MUST carry `rules.dns` on :53 (never an L4-only kube-dns rule) to avoid the
L4-shadows-L7 hazard documented in harness-netpol.yaml.
*/}}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: capability-job-baseline
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: capability-job
      app.kubernetes.io/part-of: sycophant
  egress:
    {{- include "sycophant.capabilityJobDnsFloor" . | nindent 4 }}
