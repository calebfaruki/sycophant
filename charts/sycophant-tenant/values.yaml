
# Tenant namespace ownership. When true (self-host), the chart creates the
# tenant namespace and stamps the perimeter + Pod Security labels on it. Set
# false when the namespace is pre-created and labelled by the provisioner (the
# constrained SaaS deployer path), so the chart installs into the existing ns.
namespace:
  create: true

# PVC storage class for all tenant PVCs (per-workspace data, hangar-ctrl
# logs, headscale data). Empty/absent uses the cluster's default
# StorageClass. Set this on clusters that have no default StorageClass
# (otherwise PVCs hang Pending and nothing starts).
storageClass: ""

# Container images. Pre-1.0: defaults are LOCAL builds (tag: local,
# pullPolicy: Never). No images are published yet — build them and load
# them onto your nodes (e.g. `k3d image import`), or override these to
# your own registry refs to pull instead.

# Hangar controller -- LLM communications.
# Manages Model CRDs, creates ephemeral LLM Jobs.
controller:
  image: hangar-controller
  tag: local
  pullPolicy: Never
  llmJobImage: hangar-llm-job:local

# Relay controller -- internet-facing client gateway.
# Verifies client-signed requests, mints/redeems enrollment, relays
# inbound user messages to the per-workspace harness.
relay:
  image: relay-controller
  tag: local
  pullPolicy: Never

# Airlock controller -- tool execution.
# Watches Chamber CRDs, discovers tools from OCI image labels.
airlock:
  image: airlock-controller
  tag: local
  pullPolicy: Never

# Harness -- agent runtime (pure router).
# Routes between hangar (LLM) and airlock (all tools — stdlib bundled
# into the base airlock-chamber image, tenant-defined chambers per
# Chamber CR). Stateless.
harness:
  image: sycophant-harness
  tag: local
  pullPolicy: Never
  kernels:
    # Node-side root for kernel content. A workspace's persona lives at
    # <hostPathBase>/<namespace>/<workspace> by default, delivered via one
    # per-workspace read-only hostPath PV the harness mounts (no lookup).
    # `syco tenant up` overrides this with the CLI's bind-mounted kernels dir;
    # GitOps operators set their own node path. A workspace's `kernel.path`
    # (see workspaces below) overrides this base for that one workspace.
    hostPathBase: /var/lib/sycophant/kernels

# install-wait: post-install/post-upgrade helm hook that waits for the
# controller Deployments to become Available. Alpine + kubectl helper
# (needs `sh` for the hook's `command: [sh, -c]`).
installWait:
  image: sycophant-kubectl
  tag: local
  pullPolicy: Never

# workspace-init: per-workspace one-shot Job that seeds the workspace PVC
# (git init + baseline). Runs the airlock-runtime entrypoint baked into
# airlock-git.
workspaceInit:
  image: airlock-git
  tag: local
  pullPolicy: Never

# Vertical Pod Autoscaler. Optional operational infrastructure.
# When `enabled: true` the chart ships three
# VerticalPodAutoscaler CRs targeting the singletons, with per-singleton
# min/max bounds. Requires VPA 1.2+ and Kubernetes 1.35+ (in-place
# pod resize GA). Off by default — operators who skip it pay for
# unused reserved capacity; nothing breaks.
vpa:
  enabled: false
hangarCtrl:
  vpa:
    minAllowed: { cpu: "100m", memory: "256Mi" }
    maxAllowed: { cpu: "500m", memory: "1Gi" }
airlockCtrl:
  vpa:
    minAllowed: { cpu: "50m", memory: "128Mi" }
    maxAllowed: { cpu: "1000m", memory: "2Gi" }

# Chambers (tool environments) are content, not chart config: apply them
# with `syco chamber set <name> --image <ref> [--egress d:p] [--keepalive]`
# (or kubectl apply a Chamber CR). The airlock-controller authors each
# chamber's egress CiliumNetworkPolicy on reconcile. They live outside the
# tenant chart so platform upgrades never prune them. Workspaces still
# reference chambers by name under `workspaces.<name>.chambers` below.

# Workspaces -- one entry per agent workspace.
# Each workspace materializes a harness Pod (always-on, single
# container) and binds the chambers listed under `chambers:`. All tool
# execution (stdlib via the default `airlock-chamber` base image,
# tenant-defined tools per Chamber CR) runs in airlock-spawned chamber
# pods. The shared workspace PVC mounts RW into the chamber pods that
# need filesystem access.
#
# Schema (validated by values.schema.json):
#   <name>:
#     harness:                      (optional resource bounds)
#       cpu: <K8s CPU quantity>
#       memory: <K8s memory quantity>
#     storage: <K8s storage quantity>   (default: 1Gi)
#     chambers:                         (optional, list of chamber names
#                                        referencing the root `chambers:` map above)
#       - <chamber-name>                  (must match a key under root `chambers:`)
#     kernel:                           (CLI-populated by `syco tenant up`; not
#                                        hand-edited)
#       path: <absolute host dir>         (optional; overrides the convention
#                                          <hostPathBase>/<ns>/<workspace>)
#
# A workspace's kernel (persona content source) is NOT chart config: author it
# with `syco tenant kernel set <name> [--path <dir>]` (or apply a Kernel CR) so
# platform upgrades never prune it. The chart reads the applied Kernel CRs to
# wire delivery on the next `syco tenant up`.
#
# Example:
#   workspaces:
#     research:
#       harness:
#         cpu: "500m"      # framework default; override only if needed
#         memory: "256Mi"  # framework default; harness is a pure gRPC router
#       chambers:
#         - git-ops
workspaces: {}

# Enrollments (external devices authorized via the signed-request envelope)
# are content, not chart config: apply them with `syco enrollment set <name>
# --workspace <ws>` (or kubectl apply an Enrollment CR). They live outside the
# tenant chart so platform upgrades never prune them or their enrollment.

# Headscale -- self-hosted Tailscale-compatible control plane.
#
# Phase 1 prototype: opt-in for local-machine self-host scenarios. Hobbyists
# and Mac-mini-style operators flip enabled=true to get tailnet-based ingress
# for Hangar. DevOps deployments leave it disabled and bring their own
# ingress (proper K8s Ingress, cert-manager, OIDC, etc.).
#
# When enabled, the operator must:
#   1. Own a domain (set headscale.serverUrl to https://<that domain>)
#   2. Port-forward router :443 to the K8s NodePort/LB targeting headscale's
#      :8080 (Phase 1 uses ClusterIP; expose via port-forward for laptop
#      bootstrap, NodePort/Ingress in a future phase)
#   3. After install, mint pre-auth keys via kubectl exec:
#        kubectl exec deploy/headscale -- headscale users create <user>
#        kubectl exec deploy/headscale -- headscale preauthkeys create -u <user> -e 24h
#
# Schema:
#   enabled:    bool                      (default: false)
#   image:      string                    (default: headscale/headscale)
#   tag:        string                    (default: 0.28.0)
#   pullPolicy: Always|IfNotPresent|Never (default: IfNotPresent)
#   serverUrl:  string                    (required when enabled, e.g.
#                                          https://hs.example.com)
#   magicDns:   bool                      (default: true; gives tailnet
#                                          members short hostnames)
#   baseDomain: string                    (default: ts.local)
headscale:
  enabled: false
  image: headscale/headscale
  tag: "0.28.0"
  pullPolicy: IfNotPresent
  serverUrl: ""
  magicDns: true
  baseDomain: ts.local
  # ACME (Let's Encrypt) for the headscale HTTPS endpoint. Required when
  # mobile clients (Phase 2 Flutter app) need to register from cellular —
  # the phone's Tailscale Android needs an HTTPS control plane URL.
  #
  # When acme.enabled=true, the chart switches headscale's API listener
  # from :8080 to :443 (HTTPS) and adds a :80 listener for the HTTP-01
  # challenge. Operator must port-forward router :443 → Service :443 AND
  # :80 → Service :80, with DNS pointing the serverUrl hostname at the
  # Mac mini's public IP.
  #
  # When acme.enabled=false (default), headscale serves plain HTTP on
  # :8080 — fine for laptop bootstrap via port-forward, insufficient for
  # phones on cellular.
  acme:
    enabled: false
    # Email registered with Let's Encrypt for cert lifecycle notifications.
    email: ""

# tsnet bridge -- Tailscale sidecar (colocated in the relay-ctrl
# Pod) that joins headscale and forwards tailnet TCP traffic to the
# gateway's external listener over loopback (127.0.0.1:9091 inside
# the Pod).
#
# Opt-in, paired with headscale.enabled=true. Tailnet membership gates
# network reachability; the controller's signed-request middleware
# gates operations on the external listener (each request carries an
# ECDSA-P256 signed envelope verified against the caller's Client CR).
# The per-tenant signing key used to mint enrollment codes is
# bootstrapped by the relay-controller on startup into the
# `relay-signing-key` Secret.
#
# When enabled, the operator must:
#   1. Mint a headscale pre-auth key for the bridge node
#   2. Create the authKeySecret Secret with key `authkey` containing it
#   3. Authorize each device with `syco enrollment set <name> --workspace <ws>`
#      (Enrollment CRs are content-tier, applied via the CLI). The controller
#      mints a one-time code onto status.enrollmentCode; operator reads it via:
#        kubectl get enr <name> -n <ns> \
#          -o jsonpath='{.status.enrollmentCode}'
#      and delivers it to the device (see docs/flutter-app.md).
#
# Schema:
#   enabled:           bool                      (default: false)
#   image:             string                    (default: tailscale/tailscale)
#   tag:               string                    (default: stable)
#   pullPolicy:        Always|IfNotPresent|Never (default: IfNotPresent)
#   loginServer:       string                    (required when enabled, e.g.
#                                                  https://hs.example.com)
#   hostname:          string                    (default: relay; tailnet
#                                                  members reach the gateway at
#                                                  this hostname via MagicDNS)
#   authKeySecret:     string                    (default: relay-tsnet-authkey)
tsnetBridge:
  enabled: false
  image: tailscale/tailscale
  tag: stable
  pullPolicy: IfNotPresent
  loginServer: ""
  hostname: relay
  authKeySecret: relay-tsnet-authkey
