
# Cross-controller scheduling toggle. When `enabled: true` (default),
# tightbeam-ctrl + airlock-ctrl + mainframe-ctrl carry a hard
# podAntiAffinity vs `app.kubernetes.io/component in {transponder,
# airlock-job, llm-job, channel-job}`. A gVisor escape
# stays node-local; keeping the trusted controllers off those nodes
# contains the blast radius. Single-node dev (k3d on M2) must override
# to `false`, otherwise the controllers stay Pending once any workspace
# pod schedules on the only node.
controllers:
  adversarialAntiAffinity:
    enabled: true

# Tightbeam controller -- LLM communications.
# Manages Model CRDs, creates ephemeral LLM Jobs.
controller:
  image: ghcr.io/calebfaruki/tightbeam-controller
  tag: "latest"
  pullPolicy: Always
  llmJobImage: ghcr.io/calebfaruki/tightbeam-llm-job:latest

# Airlock controller -- tool execution.
# Watches Chamber CRDs, discovers tools from OCI image labels.
airlock:
  image: ghcr.io/calebfaruki/airlock-controller
  tag: "latest"
  pullPolicy: Always

# Transponder -- agent runtime (pure router).
# Routes between tightbeam (LLM) and airlock (all tools — stdlib bundled
# into the base airlock-chamber image, tenant-defined chambers per
# Chamber CR). Stateless.
transponder:
  image: ghcr.io/calebfaruki/sycophant-transponder
  tag: "latest"
  pullPolicy: Always

# Mainframe controller -- watches Workspace + Kernel CRs and reconciles
# the per-workspace transponder pod + PVC + SA. Future memory state
# owner (per ADR 018 decision 12; separate ADR). No tool-routing gRPC
# service — all tool execution flows through airlock.
mainframe:
  image: ghcr.io/calebfaruki/mainframe-controller
  tag: latest
  pullPolicy: Always
  # Periodic reconcile cadence in seconds. Each tick re-reconciles every
  # known Mainframe; v0 reconciliation is a no-op.
  refreshIntervalSeconds: 60

# Vertical Pod Autoscaler. Optional operational infrastructure
# (ADR 018 decision 7). When `enabled: true` the chart ships three
# VerticalPodAutoscaler CRs targeting the singletons, with per-singleton
# min/max bounds. Requires VPA 1.2+ and Kubernetes 1.35+ (in-place
# pod resize GA). Off by default — operators who skip it pay for
# unused reserved capacity; nothing breaks.
vpa:
  enabled: false
tightbeamCtrl:
  vpa:
    minAllowed: { cpu: "100m", memory: "256Mi" }
    maxAllowed: { cpu: "500m", memory: "1Gi" }
airlockCtrl:
  vpa:
    minAllowed: { cpu: "50m", memory: "128Mi" }
    maxAllowed: { cpu: "1000m", memory: "2Gi" }
mainframeCtrl:
  vpa:
    minAllowed: { cpu: "100m", memory: "256Mi" }
    maxAllowed: { cpu: "500m", memory: "512Mi" }

# Chambers -- global per-tenant map of chamber name → spec.
# Each entry materializes a Chamber CR + CiliumNetworkPolicy keyed on
# the chamber name; the policy's L7 DNS allowlist + toFQDNs rules come
# from `egress`. Workspaces reference chambers by name (see
# `workspaces.<name>.chambers` below) — the spec lives here, not inline
# under the workspace.
#
# Schema:
#   <name>:
#     image: <OCI image ref>            (optional; sets the Chamber CR's image)
#     egress:                           (optional; consumed by the chamber CNP)
#       - domain: <FQDN>                (required)
#         port:   <TCP port>            (required, string or integer)
#     credentials:                      (optional; mirrors Chamber CR shape)
#       - <see Chamber CR>
#     keepalive: <bool>                 (optional; default false)
#
# `stdlib` is the framework-default chamber. It bundles the four
# built-in tools (bash, read_file, write_file, list_directory) into a
# single pod kept alive for the workspace's lifetime. Operators
# extending `FROM airlock-chamber` for additional tools should add
# their image under a new chamber key here; see
# examples/chambers/stdlib/README.md for the inheritance contract.
chambers:
  stdlib:
    image: ghcr.io/calebfaruki/airlock-chamber:latest
    keepalive: true
#
# Workspaces -- one entry per agent workspace.
# Each workspace materializes a transponder Pod (always-on, single
# container) and binds the chambers listed under `chambers:`. All tool
# execution (stdlib via the default `airlock-chamber` base image,
# tenant-defined tools per Chamber CR) runs in airlock-spawned chamber
# pods. The shared workspace PVC mounts RW into the chamber pods that
# need filesystem access.
#
# Schema (Workspace CRD, post-ADR 018):
#   <name>:
#     transponder:                      (optional resource bounds)
#       cpu: <K8s CPU quantity>
#       memory: <K8s memory quantity>
#     storage: <K8s storage quantity>   (default: 1Gi)
#     chambers:                         (optional, list of chamber names
#                                        referencing the root `chambers:` map above)
#       - <chamber-name>                  (must match a key under root `chambers:`)
#     kernel:                           (optional)
#       kind: HostPath | S3            (required)
#       hostPath:                       (required when kind == HostPath)
#         path: <absolute host path>   (mounted at /etc/kernel)
#       s3:                             (required when kind == S3)
#         endpoint: <S3 endpoint URL>
#         bucket: <bucket name>
#         prefix: <key prefix>
#         region: <S3 region>
#         forcePathStyle: <bool>       (true for self-hosted gateways)
#         credentials:
#           name: <K8s Secret name>     (required)
#           accessKeyIdKey: <key>       (default: access-key-id)
#           secretAccessKeyKey: <key>   (default: secret-access-key)
#
# Example (HostPath):
#   workspaces:
#     research:
#       transponder:
#         cpu: "500m"      # framework default; override only if needed
#         memory: "256Mi"  # framework default; transponder is a pure gRPC router
#       kernel:
#         kind: HostPath
#         hostPath:
#           path: /Users/me/sycophant/workspaces/research
#       chambers:
#         - git-ops
#
# Example (S3):
#   workspaces:
#     research:
#       transponder:
#         cpu: "1"
#         memory: "512Mi"  # bump for heavier conversation throughput
#       kernel:
#         kind: S3
#         s3:
#           endpoint: http://versitygw:7070
#           bucket: sycophant-tenants
#           prefix: tenant-abc/mainframe/
#           region: us-east-1
#           forcePathStyle: true
#           credentials:
#             name: tenant-s3-credentials
workspaces: {}

# Tightbeam conversation log destination.
#
# Schema:
#   conversations:
#     kind: LocalFs | S3                  (default: LocalFs)
#     s3:                                 (required when kind == S3)
#       endpoint: <S3 endpoint URL>
#       bucket: <bucket name>
#       prefix: <key prefix, e.g. "tenant-abc/tightbeam/">
#       region: <S3 region>
#       forcePathStyle: <bool>           (true for self-hosted gateways)
#       credentials:
#         name: <K8s Secret name>
#         accessKeyIdKey: <key>          (default: access-key-id)
#         secretAccessKeyKey: <key>      (default: secret-access-key)
#
# LocalFs writes per-event JSON files to /var/log/tightbeam/<workspace>/<conv-id>/
# inside the controller's log PVC. Suitable for self-host installs where
# external object storage isn't worth provisioning.
#
# S3 writes per-event objects under the configured bucket+prefix. SaaS
# installs use this so the Rails app can read conversations directly from
# the same bucket as a tenant.
tightbeam:
  conversations:
    kind: LocalFs

# Clients -- external devices (Flutter app, future external channel
# adapters) authorized to call the controller's external listener via
# the signed-request envelope.
#
# Lifecycle: apply a Client CR; the controller mints a one-time
# enrollment code onto status.enrollmentCode. Operator hands the code
# to the device; the device generates a P-256 keypair, sends the
# public half via RedeemEnrollment, and the controller records it on
# status.publicKey (clearing the code). Subsequent signed requests are
# verified against the registered key.
#
# Schema:
#   <name>:
#     workspaces: [<workspace>, ...]   (required, the workspaces this
#                                       client may act on; per-request
#                                       workspace assertion is gated
#                                       against this list)
#
# Example:
#   clients:
#     calebs-iphone:
#       workspaces:
#         - hello-world
#         - agents-md
clients: {}

# Headscale -- self-hosted Tailscale-compatible control plane.
#
# Phase 1 prototype: opt-in for local-machine self-host scenarios. Hobbyists
# and Mac-mini-style operators flip enabled=true to get tailnet-based ingress
# for Tightbeam. DevOps deployments leave it disabled and bring their own
# ingress (proper K8s Ingress, cert-manager, OIDC, etc.).
#
# When enabled, the operator must:
#   1. Own a domain (set headscale.serverUrl to https://<that domain>)
#   2. Port-forward router :443 to the K8s NodePort/LB targeting headscale's
#      :8080 (Phase 1 uses ClusterIP; expose via port-forward for laptop
#      bootstrap, NodePort/Ingress in a future phase)
#   3. After install, mint pre-auth keys via kubectl exec:
#        kubectl exec deploy/headscale -- headscale users create <user>
#        kubectl exec deploy/headscale -- headscale preauthkeys create -u <user> -e 24h
#
# Schema:
#   enabled:    bool                      (default: false)
#   image:      string                    (default: headscale/headscale)
#   tag:        string                    (default: 0.28.0)
#   pullPolicy: Always|IfNotPresent|Never (default: IfNotPresent)
#   serverUrl:  string                    (required when enabled, e.g.
#                                          https://hs.example.com)
#   magicDns:   bool                      (default: true; gives tailnet
#                                          members short hostnames)
#   baseDomain: string                    (default: ts.local)
headscale:
  enabled: false
  image: headscale/headscale
  tag: "0.28.0"
  pullPolicy: IfNotPresent
  serverUrl: ""
  magicDns: true
  baseDomain: ts.local
  # ACME (Let's Encrypt) for the headscale HTTPS endpoint. Required when
  # mobile clients (Phase 2 Flutter app) need to register from cellular —
  # the phone's Tailscale Android needs an HTTPS control plane URL.
  #
  # When acme.enabled=true, the chart switches headscale's API listener
  # from :8080 to :443 (HTTPS) and adds a :80 listener for the HTTP-01
  # challenge. Operator must port-forward router :443 → Service :443 AND
  # :80 → Service :80, with DNS pointing the serverUrl hostname at the
  # Mac mini's public IP.
  #
  # When acme.enabled=false (default), headscale serves plain HTTP on
  # :8080 — fine for laptop bootstrap via port-forward, insufficient for
  # phones on cellular.
  acme:
    enabled: false
    # Email registered with Let's Encrypt for cert lifecycle notifications.
    email: ""

# tsnet bridge -- Tailscale sidecar (colocated in the tightbeam-ctrl
# Pod) that joins headscale and forwards tailnet TCP traffic to the
# controller's external listener over loopback (127.0.0.1:9091 inside
# the Pod).
#
# Opt-in, paired with headscale.enabled=true. Tailnet membership gates
# network reachability; the controller's signed-request middleware
# gates operations on the external listener (each request carries an
# ECDSA-P256 signed envelope verified against the caller's Client CR).
# The per-tenant signing key used to mint enrollment codes is
# bootstrapped by the tightbeam-controller on startup into the
# `tightbeam-signing-key` Secret.
#
# When enabled, the operator must:
#   1. Mint a headscale pre-auth key for the bridge node
#   2. Create the authKeySecret Secret with key `authkey` containing it
#   3. Authorize each device by adding a Client CR under .Values.clients
#      below. The controller mints a one-time code onto
#      status.enrollmentCode; operator reads it via:
#        kubectl get tbcl <name> -n <ns> \
#          -o jsonpath='{.status.enrollmentCode}'
#      and delivers it to the device (see docs/flutter-app.md).
#
# Schema:
#   enabled:           bool                      (default: false)
#   image:             string                    (default: tailscale/tailscale)
#   tag:               string                    (default: stable)
#   pullPolicy:        Always|IfNotPresent|Never (default: IfNotPresent)
#   loginServer:       string                    (required when enabled, e.g.
#                                                  https://hs.example.com)
#   hostname:          string                    (default: tightbeam; tailnet
#                                                  members reach Tightbeam at
#                                                  this hostname via MagicDNS)
#   authKeySecret:     string                    (default: tightbeam-tsnet-authkey)
tsnetBridge:
  enabled: false
  image: tailscale/tailscale
  tag: stable
  pullPolicy: IfNotPresent
  loginServer: ""
  hostname: tightbeam
  authKeySecret: tightbeam-tsnet-authkey
