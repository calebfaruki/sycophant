
# Tenant namespace ownership. When true (self-host), the chart creates the
# tenant namespace and stamps the perimeter + Pod Security labels on it. Set
# false when the namespace is pre-created and labelled by the provisioner (the
# constrained SaaS deployer path), so the chart installs into the existing ns.
namespace:
  create: true

# PVC storage class for all tenant PVCs (per-workspace data, conversation
# history, headscale data). Empty/absent uses the cluster's default
# StorageClass. Set this on clusters that have no default StorageClass
# (otherwise PVCs hang Pending and nothing starts).
storageClass: ""

# Container images. Pre-1.0: defaults are LOCAL builds (tag: local,
# pullPolicy: Never). No images are published yet — build them and load
# them onto your nodes (e.g. `k3d image import`), or override these to
# your own registry refs to pull instead.

# Toolset controller -- tool execution + LLM communications.
# Reads the `toolsets` map below, discovers tools from OCI image labels,
# and creates ephemeral tool jobs (the prompt job included).
toolset:
  image: toolset-controller
  tag: local
  pullPolicy: Never

# Relay controller -- the client-facing gateway.
# Watches the grants ConfigMap, verifies client-signed requests against the
# grant row that signed them, and relays inbound user messages to the
# per-workspace harness.
relay:
  image: relay-controller
  tag: local
  pullPolicy: Never

# Harness -- agent runtime (pure router).
# Routes tool and LLM calls through the toolset controller (stdlib
# bundled into the base toolset image, tenant-defined toolsets per
# `toolsets` entry). Stateless.
harness:
  image: sycophant-harness
  tag: local
  pullPolicy: Never
  kernels:
    # Node-side root for kernel content. A workspace's persona lives at
    # <hostPathBase>/<namespace>/<workspace> by default, delivered via one
    # per-workspace read-only hostPath PV the harness mounts (no lookup).
    # `syco tenant up` overrides this with the CLI's bind-mounted kernels dir;
    # GitOps operators set their own node path. A workspace's `kernel.path`
    # (see workspaces below) overrides this base for that one workspace.
    hostPathBase: /var/lib/sycophant/kernels

# install-wait: post-install/post-upgrade helm hook that waits for the
# controller Deployments to become Available. Alpine + kubectl helper
# (needs `sh` for the hook's `command: [sh, -c]`).
installWait:
  image: sycophant-kubectl
  tag: local
  pullPolicy: Never

# workspace-init: per-workspace one-shot Job that seeds the workspace PVC
# (git init + baseline). Runs the toolset-runtime entrypoint baked into
# toolset-git.
workspaceInit:
  image: toolset-git
  tag: local
  pullPolicy: Never

# Vertical Pod Autoscaler. Optional operational infrastructure.
# When `enabled: true` the chart ships VerticalPodAutoscaler CRs
# targeting the singletons, with per-singleton min/max bounds. Requires
# VPA 1.2+ and Kubernetes 1.35+ (in-place pod resize GA). Off by
# default — operators who skip it pay for unused reserved capacity;
# nothing breaks.
vpa:
  enabled: false
toolsetCtrl:
  vpa:
    minAllowed: { cpu: "100m", memory: "256Mi" }
    maxAllowed: { cpu: "1000m", memory: "2Gi" }

# Toolsets -- one entry per tool environment. Rendered into the
# `toolset-config` ConfigMap the tools controller loads once at startup.
#
# An entry is flat. `image` and `keepalive` are read by the controller:
# `image` selects the tool job's pod, `keepalive` sets the Job restart policy and
# idle-reap so an expensive, frequently-called toolset skips cold-start.
# Neither is forwarded to the tool job as an env var.
#
# An entry is runtime shape only: it owns no credential and no network hole.
# Those come from the binding workspace's grant menu under `workspaces` below,
# so one generic toolset definition serves every workspace. `env` forwards each
# key into the tool job as an env var, the key verbatim as the name and its
# scalar as the value. The turn server is not here: it lives in the `prompt`
# section below.
#
# Schema:
#   <toolset-name>:
#     image: <image ref>
#     keepalive: <bool>               (default: false)
#     env:
#       <KEY>: <scalar>               (forwarded verbatim as an env var)
#
# Example:
#   toolsets:
#     stdlib:
#       image: toolset-git:local
#     notion:
#       image: toolset-notion:local
#       keepalive: true
#       env:
#         NOTION_API_VERSION: "2022-06-28"
toolsets: {}

# Prompt configuration -- the turn server.
#
# The prompt toolset is hardcoded: the controller reads this section directly
# and never looks it up by name. It is NOT an entry of `toolsets:` above and it
# appears in no workspace's toolset bindings.
#
# A profile key IS the turn's `model` value. The workspace's AGENTS.md
# frontmatter (`model: <key>`) names it per turn; see docs/harness.md. A turn
# naming a key that is absent here is refused; there is no default profile and
# no default model.
#
# The provider secret and the provider egress live here and only here: the
# prompt Job receives both, the harness receives neither.
#
# Schema (validated by values.schema.json):
#   profiles:
#     <model-name>:
#       image: <prompt image ref>
#       format: anthropic | openai | gemini
#       model: <provider's own model id>
#       baseUrl: <provider API base URL>
#       secret: <k8s secret name, mounted read-only in the prompt Job>
#       egress:
#         - { domain: <domain>, port: <port> }
#
# Example:
#   prompt:
#     profiles:
#       deepseek-v4-flash:
#         image: prompt-toolset:local
#         format: openai
#         model: deepseek/deepseek-v4-flash
#         baseUrl: https://openrouter.ai/api/v1
#         secret: openrouter-key
#         egress:
#           - { domain: openrouter.ai, port: 443 }
prompt:
  profiles: {}

# Workspaces -- one entry per agent workspace.
# Each workspace materializes a harness Pod (always-on, single
# container) and binds the toolsets listed under `toolsets:`. All tool
# execution (stdlib via the default base toolset image, tenant-defined
# tools per `toolsets` entry) runs in toolset-spawned tool-job
# pods. The shared workspace PVC mounts RW into the tool-job pods that
# need filesystem access.
#
# Schema (validated by values.schema.json):
#   <name>:
#     harness:                      (optional resource bounds)
#       cpu: <K8s CPU quantity>
#       memory: <K8s memory quantity>
#     storage: <K8s storage quantity>   (default: 1Gi)
#     toolsets:                         (optional, list of bindings; each item
#                                        references a `toolsets` entry by name)
#       - <toolset-name>                  (bare form: no credential, baseline
#                                          egress)
#       - name: <toolset-name>            (grant-bearing form)
#         grants:
#           <grant-name>:                 (RFC 1123 label)
#             secret: <k8s secret name>   (required; its data key must equal the
#                                          Secret's own name)
#             path: <absolute path>       (optional; default
#                                          /run/secrets/grant/credential)
#             egress: <domain>            (optional; one domain, opened by a
#                                          per-grant CiliumNetworkPolicy)
#     kernel:                           (CLI-populated by `syco tenant up`; not
#                                        hand-edited)
#       path: <absolute host dir>         (optional; overrides the convention
#                                          <hostPathBase>/<ns>/<workspace>)
#
# A workspace's kernel is its persona content (AGENTS.md, agents/*.md,
# skills/*.md), authored on the host, not in this file. Set the source directory
# with `syco tenant kernel set <name> [--path <dir>]`, which writes
# `workspaces.<name>.kernel.path` here. The chart mounts that host directory
# read-only into the harness as a per-workspace PV/PVC pair; omit `kernel.path`
# and it serves the convention path
# <harness.kernels.hostPathBase>/<namespace>/<workspace>.
#
# Example:
#   workspaces:
#     research:
#       harness:
#         cpu: "500m"      # framework default; override only if needed
#         memory: "256Mi"  # framework default; harness is a pure gRPC router
#       toolsets:
#         - git-ops
#         - name: notion
#           grants:
#             reader:
#               secret: research-notion-reader
#               egress: notion.com
workspaces: {}

# Headscale -- self-hosted Tailscale-compatible control plane.
#
# Phase 1 prototype: opt-in for local-machine self-host scenarios. Hobbyists
# and Mac-mini-style operators flip enabled=true to get tailnet-based ingress
# for the relay gateway. DevOps deployments leave it disabled and bring their own
# ingress (proper K8s Ingress, cert-manager, OIDC, etc.).
#
# When enabled, the operator must:
#   1. Own a domain (set headscale.serverUrl to https://<that domain>)
#   2. Port-forward router :443 to the K8s NodePort/LB targeting headscale's
#      :8080 (Phase 1 uses ClusterIP; expose via port-forward for laptop
#      bootstrap, NodePort/Ingress in a future phase)
#   3. After install, mint pre-auth keys via kubectl exec:
#        kubectl exec deploy/headscale -- headscale users create <user>
#        kubectl exec deploy/headscale -- headscale preauthkeys create -u <user> -e 24h
#
# Schema:
#   enabled:    bool                      (default: false)
#   image:      string                    (default: headscale/headscale)
#   tag:        string                    (default: 0.28.0)
#   pullPolicy: Always|IfNotPresent|Never (default: IfNotPresent)
#   serverUrl:  string                    (required when enabled, e.g.
#                                          https://hs.example.com)
#   magicDns:   bool                      (default: true; gives tailnet
#                                          members short hostnames)
#   baseDomain: string                    (default: ts.local)
headscale:
  enabled: false
  image: headscale/headscale
  tag: "0.28.0"
  pullPolicy: IfNotPresent
  serverUrl: ""
  magicDns: true
  baseDomain: ts.local
  # ACME (Let's Encrypt) for the headscale HTTPS endpoint. Required when
  # mobile clients (Phase 2 Flutter app) need to register from cellular —
  # the phone's Tailscale Android needs an HTTPS control plane URL.
  #
  # When acme.enabled=true, the chart switches headscale's API listener
  # from :8080 to :443 (HTTPS) and adds a :80 listener for the HTTP-01
  # challenge. Operator must port-forward router :443 → Service :443 AND
  # :80 → Service :80, with DNS pointing the serverUrl hostname at the
  # Mac mini's public IP.
  #
  # When acme.enabled=false (default), headscale serves plain HTTP on
  # :8080 — fine for laptop bootstrap via port-forward, insufficient for
  # phones on cellular.
  acme:
    enabled: false
    # Email registered with Let's Encrypt for cert lifecycle notifications.
    email: ""

# Channels -- the connectors a tenant serves.
#
# A map. The key is the instance name and becomes the pod's
# `sycophant.md/channel` label; presence in the map is the enable signal, so
# there is no `enabled` bool. Deleting an entry deletes the adapter pod and
# its egress policy, and nothing else: grant rows and registered keys are
# never chart-owned.
#
# Each entry carries a `kind`. Phase 1 supports only `kind: app`, and an
# unrecognized kind fails the render.
#
# `kind: app` renders the tailnet terminus for the custom app. It is
# transport only: it holds no signing identity, mounts no PVC, and forwards
# tailnet TCP :9090 to the relay's app port. Pair it with headscale.enabled,
# or point loginServer at an external control plane.
#
# When an app channel is configured, the operator must:
#   1. Mint a headscale pre-auth key for the adapter node
#   2. Create the authKeySecret Secret with key `authkey` containing it
#   3. Write a grant row into the `grants` ConfigMap carrying the
#      operator-invented code as the row's identity, and hand that code to
#      the device out of band (see docs/relay.md).
#
# Entry schema:
#   kind:          app                       (required)
#   image:         string                    (default: tailscale/tailscale)
#   tag:           string                    (default: stable)
#   pullPolicy:    Always|IfNotPresent|Never (default: IfNotPresent)
#   loginServer:   string                    (required, e.g.
#                                              https://hs.example.com)
#   hostname:      string                    (default: relay; tailnet members
#                                              reach the relay at this
#                                              hostname via MagicDNS)
#   authKeySecret: string                    (default: relay-tsnet-authkey)
#
# Example:
#   channels:
#     app:
#       kind: app
#       loginServer: https://hs.example.com
#
# The shipped default renders no adapter and no relay port reachable from
# outside the namespace: pure dial-out, sealed.
channels: {}
