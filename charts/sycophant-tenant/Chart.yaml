apiVersion: v2
name: sycophant-tenant
description: |
  Per-tenant sycophant install. Run once per tenant in the tenant's
  namespace, by the tenant-deployer SA (or any external SA the
  operator chooses). Requires `sycophant-cluster` to have been
  installed once on the cluster first.

  Renders the per-tenant relay controller, per-workspace harness Pods,
  per-model inference Pods, per-grant CNPs, and all related per-tenant
  configuration. Harness Pods, PVCs, SAs, and their capability ConfigMaps
  are rendered by helm from `.Values.workspaces`. Each harness syncs its
  own instructions from object storage into an emptyDir at pod start and
  reads them in-process. No cluster-scoped resources.
version: 0.1.0
appVersion: "0.1.0"
