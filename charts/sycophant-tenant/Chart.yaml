apiVersion: v2
name: sycophant-tenant
description: |
  Per-tenant sycophant install. Run once per tenant in the tenant's
  namespace, by the tenant-deployer SA (or any external SA the
  operator chooses). Requires `sycophant-cluster` to have been
  installed once on the cluster first.

  Renders the per-tenant controllers (toolset, relay),
  per-toolset CNPs, and all related per-tenant configuration.
  Per-workspace harness Pods, PVCs, SAs, and read-only kernel PVs are
  rendered by helm from `.Values.workspaces`. The harness reads its own
  kernel in-process. No cluster-scoped resources.
version: 0.1.0
appVersion: "0.1.0"
