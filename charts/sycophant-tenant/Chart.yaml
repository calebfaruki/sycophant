apiVersion: v2
name: sycophant-tenant
description: |
  Per-tenant sycophant install. Run once per tenant in the tenant's
  namespace, by the tenant-deployer SA (or any external SA the
  operator chooses). Requires `sycophant-cluster` to have been
  installed once on the cluster first.

  Renders the per-tenant controllers (hangar, airlock, mainframe),
  per-chamber CNPs, and all related per-tenant configuration.
  Per-workspace harness Pods, PVCs, and SAs are rendered by helm
  from `.Values.workspaces`. mainframe-controller reconciles Kernel CRs
  only. No cluster-scoped resources.
version: 0.1.0
appVersion: "0.1.0"
