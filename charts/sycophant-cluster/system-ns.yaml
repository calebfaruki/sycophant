# The operator-owned system namespace: holds the tenant-deployer ServiceAccount
# and the shared SeaweedFS object store (a running Deployment, installed by the
# sycophant-objectstore chart). PSA-restricted, so any pod admitted here must
# satisfy the restricted profile; the SeaweedFS spec does. Applied out-of-band
# (embedded by `syco setup`, applied by scripts/e2e.sh) rather than as a chart
# template, because helm can't manage its own release namespace and
# --create-namespace would land it bare.
apiVersion: v1
kind: Namespace
metadata:
  name: sycophant-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
