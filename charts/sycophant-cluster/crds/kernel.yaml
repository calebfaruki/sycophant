apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kernels.sycophant.md
spec:
  group: sycophant.md
  names:
    categories: []
    kind: Kernel
    plural: kernels
    shortNames:
    - mfk
    singular: kernel
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for KernelSpec via `CustomResource`
        properties:
          spec:
            properties:
              hostPath:
                description: |-
                  Local-filesystem source: a directory on the host node mounted into the
                  transponder pod. Used by self-host operators editing files in place.
                nullable: true
                properties:
                  path:
                    pattern: ^/.+
                    type: string
                required:
                - path
                type: object
              kind:
                enum:
                - HostPath
                - S3
                type: string
              s3:
                description: |-
                  S3-compatible source. `force_path_style` is required for self-hosted
                  gateways (Versitygw, MinIO, Garage) whose virtual-host-style URLs require
                  per-bucket DNS that local dev doesn't have.

                  `credentials` is `None` when the consumer wires AWS creds via env vars
                  (`AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY`) instead of a K8s Secret
                  reference. Mainframe Kernels always set it; Tightbeam never does.
                nullable: true
                properties:
                  bucket:
                    type: string
                  credentials:
                    description: |-
                      Reference to a Kubernetes Secret holding S3 credentials. Default keys are
                      `access-key-id` and `secret-access-key` when not specified.
                    nullable: true
                    properties:
                      accessKeyIdKey:
                        nullable: true
                        type: string
                      name:
                        type: string
                      secretAccessKeyKey:
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                  endpoint:
                    type: string
                  forcePathStyle:
                    type: boolean
                  prefix:
                    type: string
                  region:
                    type: string
                required:
                - bucket
                - endpoint
                - forcePathStyle
                - prefix
                - region
                type: object
            required:
            - kind
            type: object
          status:
            nullable: true
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        title: Kernel
        type: object
    served: true
    storage: true
    subresources:
      status: {}
