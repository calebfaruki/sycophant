apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workspaces.sycophant.md
spec:
  group: sycophant.md
  names:
    categories: []
    kind: Workspace
    plural: workspaces
    shortNames:
    - mfw
    singular: workspace
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for WorkspaceSpec via `CustomResource`
        properties:
          spec:
            properties:
              chambers:
                items:
                  type: string
                type: array
              kernel:
                description: |-
                  Inline kernel content carried on the Workspace.spec. Mirrors
                  `.Values.workspaces[*].kernel` so the chart can render Workspace
                  CRs from existing values without reshaping operator input.
                  mainframe-controller materializes a Kernel CR from this block
                  when present.
                nullable: true
                properties:
                  hostPath:
                    description: |-
                      Local-filesystem source: a directory on the host node mounted into the
                      workspace pod. Used by self-host operators editing files in place.
                    nullable: true
                    properties:
                      path:
                        type: string
                    required:
                    - path
                    type: object
                  kind:
                    type: string
                  s3:
                    description: |-
                      S3-compatible source. `force_path_style` is required for self-hosted
                      gateways (Versitygw, MinIO, Garage) whose virtual-host-style URLs require
                      per-bucket DNS that local dev doesn't have.

                      `credentials` is `None` when the consumer wires AWS creds via env vars
                      (`AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY`) instead of a K8s Secret
                      reference. Mainframe Kernels always set it; Tightbeam never does.
                    nullable: true
                    properties:
                      bucket:
                        type: string
                      credentials:
                        description: |-
                          Reference to a Kubernetes Secret holding S3 credentials. Default keys are
                          `access-key-id` and `secret-access-key` when not specified.
                        nullable: true
                        properties:
                          accessKeyIdKey:
                            nullable: true
                            type: string
                          name:
                            type: string
                          secretAccessKeyKey:
                            nullable: true
                            type: string
                        required:
                        - name
                        type: object
                      endpoint:
                        type: string
                      forcePathStyle:
                        type: boolean
                      prefix:
                        type: string
                      region:
                        type: string
                    required:
                    - bucket
                    - endpoint
                    - forcePathStyle
                    - prefix
                    - region
                    type: object
                required:
                - kind
                type: object
              kernels:
                description: |-
                  Bare-string references to existing Kernel CRs in the same
                  namespace. The workspace mounts each referenced kernel under
                  `/etc/kernel/`.
                items:
                  type: string
                type: array
              storage:
                description: Workspace PVC size. Default 1Gi when absent.
                nullable: true
                type: string
              task:
                description: |-
                  mainframe-task pod's CPU/memory bounds. The task pod is the
                  on-demand filesystem-touching executor spawned by mainframe-ctrl;
                  shares the workspace's PVC.
                nullable: true
                properties:
                  cpu:
                    nullable: true
                    type: string
                  memory:
                    nullable: true
                    type: string
                type: object
              transponder:
                description: |-
                  Transponder pod's CPU/memory bounds. The transponder is the
                  always-on per-workspace runtime pod (single container).
                nullable: true
                properties:
                  cpu:
                    nullable: true
                    type: string
                  memory:
                    nullable: true
                    type: string
                type: object
            type: object
          status:
            nullable: true
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        title: Workspace
        type: object
    served: true
    storage: true
    subresources:
      status: {}
