apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: chambers.sycophant.md
spec:
  group: sycophant.md
  names:
    categories: []
    kind: Chamber
    plural: chambers
    shortNames:
      - ach
    singular: chamber
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .spec.keepalive
      name: Keepalive
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ChamberSpec via `CustomResource`
        properties:
          spec:
            properties:
              credentials:
                items:
                  properties:
                    env:
                      nullable: true
                      type: string
                    file:
                      nullable: true
                      type: string
                    secret:
                      type: string
                  required:
                  - secret
                  type: object
                type: array
              egress:
                items:
                  properties:
                    domain:
                      description: 'Trust principal: the registrable domain (e.g. notion.com, github.com) whose zone the chamber is allowed to reach. The chart trusts the apex AND its single-label subdomain space (*.notion.com), so a `domain: notion.com` declaration covers api.notion.com, auth.notion.com, etc. The same principal controls the whole subtree; enumerating individual subdomains adds friction without security gain.'
                      type: string
                    port:
                      format: uint16
                      maximum: 65535.0
                      minimum: 0.0
                      type: integer
                  required:
                  - domain
                  - port
                  type: object
                type: array
              image:
                nullable: true
                type: string
              keepalive:
                default: false
                type: boolean
            type: object
        required:
        - spec
        title: ChamberValidated
        type: object
        x-kubernetes-validations:
        - rule: '!has(self.spec.credentials) || self.spec.credentials.all(c, (has(c.env) && !has(c.file)) || (!has(c.env) && has(c.file)))'
    served: true
    storage: true
    subresources: {}
