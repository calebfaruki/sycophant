{{- if include "sycophant.selfService" . }}
# A tenant owner may create Secrets in its tenant. A Secret of this type would
# have the token controller mint a non-expiring login for one of the tenant's
# ServiceAccounts, so no caller may create one in a tenant namespace, cluster
# admin included.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-no-service-account-token
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: sycophant-tenant
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  validations:
    - expression: >-
        object.?type.orValue('') != 'kubernetes.io/service-account-token'
      message: "a tenant namespace refuses Secrets of type kubernetes.io/service-account-token"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-no-service-account-token-binding
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  policyName: tenant-no-service-account-token
  validationActions: [Deny]
{{- end }}
