# Shared across all sycophant tenants. The tightbeam controller in each
# tenant namespace authenticates workspace SA tokens via TokenReview, a
# cluster-scoped API. The `tenant-rolebinding-generator.yaml` Kyverno
# policy creates a per-tenant ClusterRoleBinding pointing each tenant's
# tightbeam-ctrl SA at this ClusterRole when the tenant namespace appears.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sycophant-tightbeam-tokenreview
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: tightbeam-ctrl
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
