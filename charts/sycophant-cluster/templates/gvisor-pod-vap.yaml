# Broad pod validator: gates every Pod labeled
# `app.kubernetes.io/part-of=sycophant` under one security envelope.
# Component-gated CEL branches express harness-only, tool-job-only,
# and headscale-only rules inside the same policy. runtimeClassName=gvisor
# is stamped by the cluster-runtime-class mutate ClusterPolicy before this
# validator fires. The per-tenant ValidatingAdmissionPolicyBinding is
# generated by Kyverno (tenant-rolebinding-generator.yaml) for any namespace
# carrying the `app.kubernetes.io/part-of=sycophant-tenant` label.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cluster-gvisor-pod-policy
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: only-sycophant-pods
      expression: >-
        has(object.metadata.labels) &&
        'app.kubernetes.io/part-of' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/part-of'] == 'sycophant' &&
        'app.kubernetes.io/component' in object.metadata.labels
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
    - name: component
      expression: object.metadata.labels['app.kubernetes.io/component']
  validations:
    # ---- Universal rules (every Sycophant pod) ----

    # Toolset pods (tool-job) must run under gvisor -- they execute
    # LLM-selected tool code, the load-bearing case for the syscall
    # sandbox. The cluster-runtime-class mutate stamps it on tool-job;
    # this rule validates the result. The harness, llm-job, channel,
    # controllers, and edge pods run on the kubelet-default runtime --
    # their containment is the universal VAP envelope below plus
    # per-component Cilium egress allowlists (project_gvisor_litmus.md).
    - expression: >-
        variables.component != 'tool-job' ||
        (has(object.spec.runtimeClassName) &&
         object.spec.runtimeClassName == 'gvisor')
      message: "toolset pods (tool-job) must use runtimeClassName: gvisor"

    - expression: >-
        !has(object.spec.hostNetwork) ||
        object.spec.hostNetwork == false
      message: "hostNetwork is prohibited"

    - expression: >-
        variables.allContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.privileged) ||
          c.securityContext.privileged == false
        )
      message: "Privileged containers are prohibited"

    - expression: >-
        variables.allContainers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.capabilities) &&
          has(c.securityContext.capabilities.drop) &&
          'ALL' in c.securityContext.capabilities.drop
        )
      message: "All containers must drop ALL capabilities"

    # seccompProfile.type=RuntimeDefault or Localhost at pod-or-container.
    - expression: >-
        variables.allContainers.all(c,
          (has(c.securityContext) &&
           has(c.securityContext.seccompProfile) &&
           has(c.securityContext.seccompProfile.type) &&
           (c.securityContext.seccompProfile.type == 'RuntimeDefault' ||
            c.securityContext.seccompProfile.type == 'Localhost')) ||
          ((!has(c.securityContext) ||
            !has(c.securityContext.seccompProfile) ||
            !has(c.securityContext.seccompProfile.type)) &&
           has(object.spec.securityContext) &&
           has(object.spec.securityContext.seccompProfile) &&
           has(object.spec.securityContext.seccompProfile.type) &&
           (object.spec.securityContext.seccompProfile.type == 'RuntimeDefault' ||
            object.spec.securityContext.seccompProfile.type == 'Localhost'))
        )
      message: "seccompProfile.type must be RuntimeDefault or Localhost at pod or container level"

    - expression: >-
        variables.allContainers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.readOnlyRootFilesystem) &&
          c.securityContext.readOnlyRootFilesystem == true
        )
      message: "All containers must set readOnlyRootFilesystem: true"

    - expression: >-
        variables.allContainers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.allowPrivilegeEscalation) &&
          c.securityContext.allowPrivilegeEscalation == false
        )
      message: "All containers must set allowPrivilegeEscalation: false"

    - expression: >-
        variables.allContainers.all(c,
          (has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot == true) ||
          ((!has(c.securityContext) || !has(c.securityContext.runAsNonRoot)) &&
           has(object.spec.securityContext) &&
           has(object.spec.securityContext.runAsNonRoot) &&
           object.spec.securityContext.runAsNonRoot == true)
        )
      message: "runAsNonRoot must be true at pod or container level"

    - expression: >-
        (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
        (!has(object.spec.hostIPC) || object.spec.hostIPC == false)
      message: "hostPID and hostIPC are prohibited"

    - expression: >-
        variables.allContainers.all(c,
          !has(c.ports) ||
          c.ports.all(p, !has(p.hostPort))
        )
      message: "hostPort is prohibited"

    - expression: >-
        !has(object.spec.securityContext) ||
        !has(object.spec.securityContext.sysctls) ||
        size(object.spec.securityContext.sysctls) == 0
      message: "Custom sysctls are prohibited"

    - expression: >-
        variables.allContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.procMount) ||
          c.securityContext.procMount == 'Default'
        )
      message: "procMount must be Default"

    # Kubelet defaults to mounting a kube-apiserver-audience token when the
    # field is omitted. The unified pattern is `automountServiceAccountToken: false`
    # plus an explicit projected token (helper `sycophant.projectedKubeApiToken`
    # for controllers; custom audiences for spawned jobs).
    - expression: >-
        has(object.spec.automountServiceAccountToken) &&
        object.spec.automountServiceAccountToken == false
      message: "automountServiceAccountToken must be set to false; pods must use explicit projected tokens"

    # Capability adds are forbidden, with one named exception:
    # headscale + NET_BIND_SERVICE when ACME is on.
    - expression: >-
        variables.allContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.capabilities) ||
          !has(c.securityContext.capabilities.add) ||
          size(c.securityContext.capabilities.add) == 0 ||
          (variables.component == 'headscale' &&
           c.securityContext.capabilities.add.all(cap, cap == 'NET_BIND_SERVICE'))
        )
      message: "Adding capabilities is prohibited (except NET_BIND_SERVICE on headscale)"

    # hostPath volumes are prohibited for ALL sycophant pods. Local kernels are
    # delivered via a PVC bound to a cluster-scoped PV (the hostPath lives on the
    # PV, never on a pod), so no pod needs a hostPath exception.
    - expression: >-
        !has(object.spec.volumes) ||
        object.spec.volumes.all(v, !has(v.hostPath))
      message: "hostPath volumes are prohibited"

    # ---- Component-gated rules ----

    # tool-job carries workspace identity via the sycophant.md/workspace
    # label (anchors the mutual podAffinity that keeps the toolset job on
    # the same node as the workspace's harness for RWO PVC mount).
    - expression: >-
        variables.component != 'tool-job' ||
        (has(object.metadata.labels) &&
         'sycophant.md/workspace' in object.metadata.labels &&
         object.metadata.labels['sycophant.md/workspace'] != '')
      message: "tool-job pods must carry the sycophant.md/workspace label"

    # ---- Harness-only rules ----
    # Harness runs the adversarial LLM-driven agent loop. The rules
    # below tighten the volume and resource surface beyond the universal
    # envelope.

    # Resource limits (cpu + memory) mandatory.
    - expression: >-
        variables.component != 'harness' ||
        variables.allContainers.all(c,
          has(c.resources) &&
          has(c.resources.limits) &&
          has(c.resources.limits.memory) &&
          has(c.resources.limits.cpu)
        )
      message: "harness pods: all containers must define resource limits (cpu and memory)"

    # Every projected source must be a non-kube-apiserver-audience SA token.
    # The harness's projected tokens are bound to custom audiences
    # (`harness.hangar.sycophant.md`, `harness.toolset.sycophant.md`).
    # Controllers project the kube-apiserver default audience by omitting
    # `audience:` -- this rule excludes them.
    - expression: >-
        variables.component != 'harness' ||
        !has(object.spec.volumes) ||
        object.spec.volumes.all(v,
          !has(v.projected) ||
          !has(v.projected.sources) ||
          v.projected.sources.all(s,
            has(s.serviceAccountToken) &&
            has(s.serviceAccountToken.audience) &&
            s.serviceAccountToken.audience != '' &&
            s.serviceAccountToken.audience != 'kubernetes.default.svc' &&
            s.serviceAccountToken.audience != 'https://kubernetes.default.svc.cluster.local'
          )
        )
      message: "harness pods: projected volume sources must be serviceAccountToken with a non-kube-apiserver audience"

    # Harness volume type allowlist: only the four types the
    # materializer/chart uses. Default-deny: future K8s volume types
    # don't auto-admit, and existing leak vectors (secret, configMap,
    # csi, nfs/iscsi/rbd, downwardAPI, ephemeral, image) are
    # structurally banned. The harness is adversarial; any volume
    # that could expose Secret bytes is an exfil vector regardless of
    # who would legitimately mount it.
    - expression: >-
        variables.component != 'harness' ||
        !has(object.spec.volumes) ||
        object.spec.volumes.all(v,
          has(v.emptyDir) ||
          has(v.persistentVolumeClaim) ||
          has(v.projected)
        )
      message: "harness pod volumes must be emptyDir, persistentVolumeClaim, or projected"
