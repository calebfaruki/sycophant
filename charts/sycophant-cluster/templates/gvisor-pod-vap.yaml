# gVisor-pod validator. Covers the three spawned-pod types that must
# run under gVisor (or operator-opted Kata): airlock-job, llm-job,
# channel-job. Each runs adversarial or semi-adversarial code; the
# runtimeClassName constraint plus the shared security envelope is the
# load-bearing structural defense. The per-tenant
# ValidatingAdmissionPolicyBinding is generated by Kyverno
# (tenant-rolebinding-generator.yaml rule #5) when each tenant ns appears.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cluster-gvisor-pod-policy
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: only-gvisor-pods
      expression: >-
        has(object.metadata.labels) &&
        'app.kubernetes.io/part-of' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/part-of'] == 'sycophant' &&
        'app.kubernetes.io/component' in object.metadata.labels &&
        (object.metadata.labels['app.kubernetes.io/component'] == 'airlock-job' ||
         object.metadata.labels['app.kubernetes.io/component'] == 'llm-job' ||
         object.metadata.labels['app.kubernetes.io/component'] == 'channel-job')
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
    - name: component
      expression: object.metadata.labels['app.kubernetes.io/component']
  validations:
    # runc is forbidden. The spawning controllers set runtimeClassName
    # explicitly; this rule blocks any pod that drops to cluster default
    # or names a non-{gvisor, kata} class.
    - expression: >-
        has(object.spec.runtimeClassName) &&
        (object.spec.runtimeClassName == 'gvisor' ||
         object.spec.runtimeClassName == 'kata')
      message: "runtimeClassName must be 'gvisor' or 'kata'; runc is forbidden"
    - expression: >-
        !has(object.spec.hostNetwork) ||
        object.spec.hostNetwork == false
      message: "hostNetwork is prohibited"
    - expression: >-
        variables.allContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.privileged) ||
          c.securityContext.privileged == false
        )
      message: "Privileged containers are prohibited"
    - expression: >-
        variables.allContainers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.capabilities) &&
          has(c.securityContext.capabilities.drop) &&
          'ALL' in c.securityContext.capabilities.drop
        )
      message: "All containers must drop ALL capabilities"
    - expression: >-
        variables.allContainers.all(c,
          (has(c.securityContext) &&
           has(c.securityContext.seccompProfile) &&
           has(c.securityContext.seccompProfile.type) &&
           (c.securityContext.seccompProfile.type == 'RuntimeDefault' ||
            c.securityContext.seccompProfile.type == 'Localhost')) ||
          ((!has(c.securityContext) ||
            !has(c.securityContext.seccompProfile) ||
            !has(c.securityContext.seccompProfile.type)) &&
           has(object.spec.securityContext) &&
           has(object.spec.securityContext.seccompProfile) &&
           has(object.spec.securityContext.seccompProfile.type) &&
           (object.spec.securityContext.seccompProfile.type == 'RuntimeDefault' ||
            object.spec.securityContext.seccompProfile.type == 'Localhost'))
        )
      message: "seccompProfile.type must be RuntimeDefault or Localhost at pod or container level"
    - expression: >-
        variables.allContainers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.readOnlyRootFilesystem) &&
          c.securityContext.readOnlyRootFilesystem == true
        )
      message: "All containers must set readOnlyRootFilesystem: true"
    - expression: >-
        variables.allContainers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.allowPrivilegeEscalation) &&
          c.securityContext.allowPrivilegeEscalation == false
        )
      message: "All containers must set allowPrivilegeEscalation: false"
    - expression: >-
        variables.allContainers.all(c,
          (has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot == true) ||
          ((!has(c.securityContext) || !has(c.securityContext.runAsNonRoot)) &&
           has(object.spec.securityContext) &&
           has(object.spec.securityContext.runAsNonRoot) &&
           object.spec.securityContext.runAsNonRoot == true)
        )
      message: "runAsNonRoot must be true at pod or container level"
    - expression: >-
        variables.allContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.capabilities) ||
          !has(c.securityContext.capabilities.add) ||
          size(c.securityContext.capabilities.add) == 0
        )
      message: "Adding capabilities is prohibited"
    - expression: >-
        (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
        (!has(object.spec.hostIPC) || object.spec.hostIPC == false)
      message: "hostPID and hostIPC are prohibited"
    - expression: >-
        variables.allContainers.all(c,
          !has(c.ports) ||
          c.ports.all(p, !has(p.hostPort))
        )
      message: "hostPort is prohibited"
    - expression: >-
        !has(object.spec.securityContext) ||
        !has(object.spec.securityContext.sysctls) ||
        size(object.spec.securityContext.sysctls) == 0
      message: "Custom sysctls are prohibited"
    - expression: >-
        variables.allContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.procMount) ||
          c.securityContext.procMount == 'Default'
        )
      message: "procMount must be Default"
    - expression: >-
        has(object.spec.automountServiceAccountToken) &&
        object.spec.automountServiceAccountToken == false
      message: "automountServiceAccountToken must be set to false; pods must use audience-bound projected SA tokens, not the default kube-apiserver token"
    # airlock-job carries workspace identity via the sycophant.md/workspace
    # label (used by mutual podAffinity for workspace-PVC mount correctness).
    # llm-job and channel-job don't — they're per-conversation/per-channel,
    # not per-workspace.
    - expression: >-
        variables.component != 'airlock-job' ||
        (has(object.metadata.labels) &&
         'sycophant.md/workspace' in object.metadata.labels &&
         object.metadata.labels['sycophant.md/workspace'] != '')
      message: "airlock-job pods must carry the sycophant.md/workspace label"
    # hostPath is forbidden on every gVisor-pod component. The transponder
    # pod permits a 'kernel' hostPath; the gVisor-pod set does not.
    - expression: >-
        !has(object.spec.volumes) ||
        object.spec.volumes.all(v, !has(v.hostPath))
      message: "hostPath volumes are prohibited on gVisor-pod components"
