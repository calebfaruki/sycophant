{{- if include "sycophant.renderKyverno" . }}
# A Namespace carrying `app.kubernetes.io/part-of=sycophant-tenant` is a
# sycophant tenant. The label is the single trigger; the namespace name is
# irrelevant. The label is applied by whoever creates the namespace — the
# `sycophant-tenant` chart (self-host) or the provisioner's own
# `create namespace` call (SaaS deployer). There is no auto-labelling mutate.
#
# When a namespace gains the label, Kyverno generates the cluster-scoped
# wiring the creating credential is deliberately not permitted to make itself
# (a stolen install/deployer kubeconfig must not be able to mint cluster RBAC):
#
#  1. A per-tenant RoleBinding for tenant-deployer → ClusterRole/tenant-operator,
#     scoping the in-tenant CRUD verbs to this namespace only.
#  2. Two per-tenant ClusterRoleBindings binding the SHARED tokenreview
#     ClusterRoles to this tenant's controller ServiceAccounts.
#  3. A per-tenant ValidatingAdmissionPolicyBinding scoping the shared
#     cluster-gvisor-pod-policy VAP to this tenant ns.
#
# Generate rules are materialized asynchronously by Kyverno's UpdateRequest
# reconciler after admission returns — consumers must tolerate a short
# reconciliation window. `background: false` controls whether Kyverno scans
# existing resources on policy install; it does NOT make generate synchronous.
#
# SA names inside the tenant ns are static (`toolset-ctrl`,
# `relay-ctrl`) — no helm release-name prefix — so operators pick any
# release name. (See `sycophant-tenant` chart.)
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: tenant-rolebinding-generator
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  background: false
  rules:

    # 1. Per-tenant RoleBinding granting the deployer the tenant-operator
    #    ClusterRole's verbs scoped to this ns only.
    - name: generate-deployer-rolebinding
      match:
        any:
          - resources:
              kinds: ["Namespace"]
              selector:
                matchLabels:
                  app.kubernetes.io/part-of: sycophant-tenant
      generate:
        synchronize: true
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        name: {{ .Values.deployer.serviceAccount.name | quote }}
        namespace: "{{`{{ request.object.metadata.name }}`}}"
        data:
          metadata:
            labels:
              {{- include "sycophant.labels" . | nindent 14 }}
              app.kubernetes.io/component: tenant-deployer
          subjects:
            - kind: ServiceAccount
              name: {{ .Values.deployer.serviceAccount.name | quote }}
              namespace: "sycophant-system"
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: tenant-operator

    # 2. ClusterRoleBinding: toolset-tokenreview → per-tenant toolset SA
    - name: generate-toolset-tokenreview-crb
      match:
        any:
          - resources:
              kinds: ["Namespace"]
              selector:
                matchLabels:
                  app.kubernetes.io/part-of: sycophant-tenant
      generate:
        synchronize: true
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        name: "{{`{{ request.object.metadata.name }}`}}-toolset-tokenreview"
        data:
          metadata:
            ownerReferences:
              - apiVersion: v1
                kind: Namespace
                name: "{{`{{ request.object.metadata.name }}`}}"
                uid: "{{`{{ request.object.metadata.uid }}`}}"
                blockOwnerDeletion: false
            labels:
              {{- include "sycophant.labels" . | nindent 14 }}
              app.kubernetes.io/component: toolset-ctrl
          subjects:
            - kind: ServiceAccount
              # SA name in the tenant ns is `toolset-ctrl` (static, no
              # release-name prefix). The `sycophant-tenant` chart owns
              # this SA name; operators pick any release name they like.
              name: toolset-ctrl
              namespace: "{{`{{ request.object.metadata.name }}`}}"
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cluster-toolset-tokenreview

    # 2c. ClusterRoleBinding: relay-tokenreview → per-tenant gateway SA
    - name: generate-relay-tokenreview-crb
      match:
        any:
          - resources:
              kinds: ["Namespace"]
              selector:
                matchLabels:
                  app.kubernetes.io/part-of: sycophant-tenant
      generate:
        synchronize: true
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        name: "{{`{{ request.object.metadata.name }}`}}-relay-tokenreview"
        data:
          metadata:
            ownerReferences:
              - apiVersion: v1
                kind: Namespace
                name: "{{`{{ request.object.metadata.name }}`}}"
                uid: "{{`{{ request.object.metadata.uid }}`}}"
                blockOwnerDeletion: false
            labels:
              {{- include "sycophant.labels" . | nindent 14 }}
              app.kubernetes.io/component: relay-ctrl
          subjects:
            - kind: ServiceAccount
              name: relay-ctrl
              namespace: "{{`{{ request.object.metadata.name }}`}}"
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cluster-relay-tokenreview

    # 3. ValidatingAdmissionPolicyBinding scoping the broad pod VAP to
    #    this ns. The VAP gates every Pod labeled `part-of=sycophant`
    #    under one envelope (universal rules + component-gated branches
    #    for harness, tool-job, headscale). Per-tenant binding
    #    so admission resolves namespace-locally.
    - name: generate-sycophant-pod-vap-binding
      match:
        any:
          - resources:
              kinds: ["Namespace"]
              selector:
                matchLabels:
                  app.kubernetes.io/part-of: sycophant-tenant
      generate:
        synchronize: true
        apiVersion: admissionregistration.k8s.io/v1
        kind: ValidatingAdmissionPolicyBinding
        name: "{{`{{ request.object.metadata.name }}`}}-sycophant-pod-binding"
        data:
          metadata:
            ownerReferences:
              - apiVersion: v1
                kind: Namespace
                name: "{{`{{ request.object.metadata.name }}`}}"
                uid: "{{`{{ request.object.metadata.uid }}`}}"
                blockOwnerDeletion: false
            labels:
              {{- include "sycophant.labels" . | nindent 14 }}
          spec:
            policyName: cluster-gvisor-pod-policy
            validationActions: [Deny]
            matchResources:
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: In
                    values:
                      - "{{`{{ request.object.metadata.name }}`}}"
{{- end }}
