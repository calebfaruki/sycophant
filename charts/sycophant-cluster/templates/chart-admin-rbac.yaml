# Shared escape-hatch ClusterRole. Stable name; install once at cluster
# bring-up. Other Kyverno policy rules in `kyverno-cpol.yaml` exempt
# holders of this ClusterRole from various tenant-namespace
# restrictions, so it remains as a documented bypass for cluster
# operators who need to break-glass into a tenant ns.
#
# Not bound to anyone by default — operators bind it manually when
# they need to use it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-chart-admin
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["*"]
  - apiGroups: ["kyverno.io"]
    resources: ["clusterpolicies"]
    verbs: ["*"]
  # VAP verbs are the legitimate edit path for the workspace admission
  # rule; chainsaw asserts only this ClusterRole + cluster-admin hold
  # them.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["*"]
