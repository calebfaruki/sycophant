# Shared escape-hatch ClusterRole. Stable name; install once at cluster
# bring-up. The tenant-namespace restrictions in `protect-security-kpol.yaml` select
# tenant-scoped callers only: a ServiceAccount inside the namespace, or an
# issuer-prefixed identity the cluster's IdP minted. A holder of this
# ClusterRole breaks glass into a tenant ns by being neither, and these verbs
# are what let it edit the policy machinery itself.
#
# That makes the break-glass credential the cluster kubeconfig, not an IdP
# login. Binding this role to a Dex identity grants the verbs but not the
# reach: the policy still selects that caller and denies the write.
#
# Not bound to anyone by default — operators bind it manually when
# they need to use it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-chart-admin
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["*"]
  # The security policies this chart installs. Named by kind rather than by a
  # wildcard so the grant stays as narrow as the set actually shipped; adding a
  # policy of a new kind means adding it here.
  - apiGroups: ["policies.kyverno.io"]
    resources:
      - "validatingpolicies"
      - "mutatingpolicies"
      - "generatingpolicies"
      - "deletingpolicies"
    verbs: ["*"]
  # VAP verbs are the legitimate edit path for the agent admission
  # rule; chainsaw asserts only this ClusterRole + cluster-admin hold
  # them.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["*"]
