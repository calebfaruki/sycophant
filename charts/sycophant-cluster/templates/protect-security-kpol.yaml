{{- if include "sycophant.renderKyverno" . }}
# Scoped to namespaces labelled part-of=sycophant-tenant.
#
# The boundary is structural: no tenant ServiceAccount can update the
# namespace label, and a caller inside the tenant namespace cannot mutate
# its own protected resources. External callers live in other namespaces
# and pass by exclusion, so there is no installer allowlist to maintain.
#
# CEL policies have no named rules, so each per-resource protection is
# one validation: every expression passes unless the request is that
# protection's own shape, which keeps one message per protected
# resource. The kind gate lives in the expression rather than a
# policy-level objectSelector because the network and RBAC protections
# cover every object of their kind while the ConfigMap and
# ServiceAccount ones cover only a labelled subset.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: cluster-protect-security
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: sycophant-tenant
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["networkpolicies"]
      - apiGroups: ["cilium.io"]
        apiVersions: ["v2"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["ciliumnetworkpolicies"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["roles", "rolebindings"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["configmaps", "serviceaccounts"]
  # Applies to callers a tenant can reach: a ServiceAccount in the request
  # namespace, or an IdP user. Everyone else (the chart installer, Kyverno, the
  # operator's own kubeconfig) falls through unmatched and is admitted.
  matchConditions:
    - name: caller-is-scoped-to-this-tenant
      expression: >-
        (request.userInfo.username.startsWith("system:serviceaccount:")
          && parseServiceAccount(request.userInfo.username).Namespace == request.namespace)
          || request.userInfo.username.startsWith("{{ include "sycophant.idpUserPrefix" . }}")
  variables:
    # DELETE carries the resource in oldObject (object is empty, not null);
    # every other operation carries it in object.
    - name: res
      expression: "request.operation == \"DELETE\" ? oldObject : object"
    - name: kind
      expression: "request.kind.kind"
    - name: group
      expression: "request.kind.group"
    - name: typeLabel
      expression: >-
        variables.res.metadata.?labels["sycophant.md/type"].orValue("")
  validations:
    - expression: >-
        !(variables.group == "networking.k8s.io" && variables.kind == "NetworkPolicy")
      message: >-
        NetworkPolicy in a sycophant tenant namespace cannot be
        modified by workloads inside the namespace. External callers
        (the provision installer, the operator) are permitted.
    - expression: >-
        !(variables.group == "cilium.io" && variables.kind == "CiliumNetworkPolicy")
      message: >-
        CiliumNetworkPolicy in a sycophant tenant namespace cannot be
        modified by workloads inside the namespace. External callers
        (the provision installer, the operator) are permitted.
    # NOTE: The agent ValidatingAdmissionPolicy cannot be guarded at
    # the admission layer — neither Kyverno nor an in-tree VAP will
    # enforce rules whose target is in the admissionregistration.k8s.io
    # API group. Protection is RBAC-absence, pinned by the provision-write
    # check in tests/unit/provision-installer.
    - expression: >-
        !(variables.group == "rbac.authorization.k8s.io"
          && variables.kind in ["Role", "RoleBinding"])
      message: >-
        RBAC resources in a sycophant tenant namespace cannot be
        modified by workloads inside the namespace. External callers
        (the provision installer, the operator) are permitted to manage
        RBAC during tenant install/upgrade lifecycle.
    # The relay-toolset-grants ConfigMap is the grant names the gateway serves
    # on ListGrants. The relay is the internet-facing pod and is denied too: a
    # relay that could write the names it offers could advertise a grant the
    # manifest never bound.
    - expression: >-
        !(variables.kind == "ConfigMap" && variables.typeLabel == "relay-toolset-grants")
      message: >-
        The relay-toolset-grants ConfigMap in a sycophant tenant namespace
        cannot be modified by workloads inside the namespace.
    - expression: >-
        !(variables.kind == "ConfigMap" && variables.typeLabel == "capability-grants")
      message: >-
        The capability-grants ConfigMap in a sycophant tenant namespace
        cannot be modified by workloads inside the namespace.
    # Agent ServiceAccounts come from the provision installer, which lives
    # outside the tenant namespace; this blocks minting them from inside it.
    - expression: >-
        !(variables.kind == "ServiceAccount" && variables.typeLabel == "agent-sa")
      message: >-
        Agent ServiceAccounts in a sycophant tenant namespace
        cannot be modified by workloads inside the namespace.
    # Each per-model ConfigMap names the model's endpoint, job image and
    # provider Secret. A writer that could rewrite it could repoint a model at
    # an attacker endpoint or hand an inference Job a different Secret.
    - expression: >-
        !(variables.kind == "ConfigMap" && variables.typeLabel == "model")
      message: >-
        Model ConfigMaps in a sycophant tenant namespace cannot be modified by
        callers inside the namespace.
    # Each per-toolset ConfigMap names the tool's container image, which the
    # harness watches and runs. A namespace writer that could rewrite it could
    # repoint a toolset at a malicious image and get code execution in the
    # tenant. The harness SA holds only list/watch; this denies the rest.
    - expression: >-
        !(variables.kind == "ConfigMap" && variables.typeLabel == "toolset")
      message: >-
        Toolset ConfigMaps in a sycophant tenant namespace cannot be
        modified by callers inside the namespace.
    # A relay-identity ConfigMap is one person's agent list and handle
    # bindings — the data the relay answers ListAgents and handle
    # resolution from. The operator (or the provision installer outside the
    # namespace) is its only writer; the relay is denied too, or a
    # compromised relay could rewrite any person's reach.
    - expression: >-
        !(variables.kind == "ConfigMap" && variables.typeLabel == "relay-identity")
      message: >-
        Identity ConfigMaps in a sycophant tenant namespace cannot be
        modified by workloads inside the namespace.
{{- end }}
