# Apiserver identity trust. Renders a Kubernetes
# StructuredAuthenticationConfiguration from the operator's idp block: the
# issuer, its audience, and the claim mapping. The legacy per-flag apiserver
# auth path needs a restart to change; the structured config hot-reloads. It
# always renders off the idp contract; the bundled Dex is the default issuer
# that keeps a bare install valid.
#
# The document is wrapped in a ConfigMap because AuthenticationConfiguration
# is an apiserver config FILE, not a cluster API object; the ConfigMap is the
# smallest applyable carrier. Pointing the apiserver at it via
# `--authentication-config` is the operator's job.
#
# Config-only issuer swap: this carries only issuer URLs and claim names, never
# key material. The apiserver fetches the issuer's public keys from its
# Discovery endpoint (`.well-known/openid-configuration`) at runtime. The IdP
# signing key is the IdP's and never lands here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sycophant-apiserver-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
data:
  auth-config.yaml: |
    apiVersion: apiserver.config.k8s.io/v1beta1
    kind: AuthenticationConfiguration
    jwt:
      - issuer:
          url: {{ .Values.idp.issuer | quote }}
          audiences:
            - {{ .Values.idp.audience | quote }}
          {{- with .Values.idp.certificateAuthority }}
          # PEM CA the apiserver trusts when fetching this issuer's JWKS over
          # TLS. Present only for a self-hosted issuer whose cert does not chain
          # to a public root; a publicly-trusted issuer uses the system trust
          # store.
          certificateAuthority: |
            {{- nindent 12 . }}
          {{- end }}
        claimMappings:
          username:
            # Identity is the stable OIDC subject, never an operator-chosen
            # claim: only `sub` is guaranteed unique and never reassigned.
            # Prefixed with the issuer so the subject namespace is the issuer's
            # own. No groups, uid, or extra is mapped: authorization is per
            # identity on the prefixed sub alone, so mapping any other claim
            # only widens the identity surface for no gain.
            claim: sub
            prefix: {{ printf "%s#" .Values.idp.issuer | quote }}
        # The issuer prefix is the primary bar against system: impersonation: a
        # prefixed <issuer>#system:masters matches neither the bootstrap
        # binding nor the privileged-group authorizer, both exact-string. This
        # rule rejects a raw system: sub before the prefix as fail-closed
        # defense in depth. It runs on the raw claim; a post-prefix user rule
        # would see the already-prefixed name and never fire.
        claimValidationRules:
          - expression: '!claims.sub.startsWith("system:")'
            message: 'sub must not use the reserved system: prefix'
