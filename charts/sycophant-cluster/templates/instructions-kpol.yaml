{{- /*
The instructions lifecycle: one agent's instructions folder in the store,
replaced from a provision command's archive or removed by a reap command. The
jobs run no helm: they write the store's filer, then restart the agent so
its init container syncs the new folder.

The archive is listed before anything else and refused, with no store call,
when the listing warns (BusyBox tar strips a leading '/' or '../' with a
notice and goes on), or names a link or anything but a file or directory.

A file whose line 1 is exactly `---` (after one leading BOM, with one trailing
CR dropped from each line) opens frontmatter, closed by the next `---` line.
A file whose frontmatter never closes or is not valid YAML is refused, again
with no store call. The harness strips only frontmatter that closes, so it
never serves a file this check would refuse. No `((` may appear here: the
policy reads it as CEL.
*/}}
{{- define "sycophant.instructionsFolder" -}}
FOLDER="http://seaweedfs.sycophant-system.svc:8888/buckets/sycophant-instructions/system:serviceaccount:$TENANT:ag-$TARGET/"
{{- end -}}

{{- define "sycophant.instructionsRestart" -}}
DEPLOY="$(kubectl get deployment "ag-$TARGET" -n "$TENANT" --ignore-not-found -o name)"
if [ -n "$DEPLOY" ]; then
  kubectl rollout restart "deployment/ag-$TARGET" -n "$TENANT"
fi
kubectl delete configmap "$COMMAND" -n "$TENANT"
{{- end -}}

{{- define "sycophant.instructionsInstallScript" -}}
set -eu
{{ include "sycophant.commandFetch" . }}
{{ include "sycophant.commandTarget" . }}
{{ include "sycophant.instructionsFolder" . }}
printf '%s' "$CM" | jq -r '.data.archive // empty' | base64 -d > /tmp/archive.tgz || refuse "the archive is not base64; nothing was changed"
if ! tar -tvzf /tmp/archive.tgz > /tmp/list 2> /tmp/list.err || [ -s /tmp/list.err ] || grep -q ' -> ' /tmp/list || grep -qv '^[-d]' /tmp/list; then
  cat /tmp/list.err /tmp/list >&2
  refuse "the archive is unreadable or holds a link, a special file or a path outside its folder; nothing was changed"
fi
rm -rf /tmp/files
mkdir /tmp/files
tar -xzf /tmp/archive.tgz -C /tmp/files
[ -z "$(find /tmp/files -name '*[!A-Za-z0-9._-]*')" ] || refuse "an archive name holds a character outside A-Z a-z 0-9 . _ -; nothing was changed"
find /tmp/files -type f | while IFS= read -r f; do
  rc=0
  LC_ALL=C awk '
    NR == 1 && substr($0, 1, 3) == "\357\273\277" { $0 = substr($0, 4) }
    { sub(/\r$/, "") }
    NR == 1 { if ($0 != "---") exit 3; open = 1; next }
    $0 == "---" { closed = 1; exit }
    { print }
    END { if (!open) exit 3; if (!closed) exit 2 }
  ' "$f" > /tmp/frontmatter || rc=$?
  if [ "$rc" = 3 ]; then
    continue
  fi
  [ "$rc" = 0 ] || refuse "${f#/tmp/files/}: frontmatter never closes; nothing was changed"
  yq eval '.' - < /tmp/frontmatter > /dev/null || refuse "${f#/tmp/files/}: frontmatter is not valid YAML; nothing was changed"
done
curl -fsS -X DELETE "${FOLDER}?recursive=true"
cd /tmp/files
find . -type f | while IFS= read -r f; do
  curl -fsS -X PUT -T "$f" "$FOLDER${f#./}"
done
{{ include "sycophant.instructionsRestart" . }}
{{- end -}}

{{- define "sycophant.instructionsUninstallScript" -}}
set -eu
{{ include "sycophant.commandFetch" . }}
{{ include "sycophant.commandTarget" . }}
{{ include "sycophant.instructionsFolder" . }}
curl -fsS -X DELETE "${FOLDER}?recursive=true"
{{ include "sycophant.instructionsRestart" . }}
{{- end -}}

{{- if include "sycophant.renderKyverno" . }}
---
{{ include "sycophant.provisionInstaller" (dict "ctx" $ "kind" "instructions" "role" "instructions-job" "script" (include "sycophant.instructionsInstallScript" $)) }}
---
{{ include "sycophant.provisionUninstaller" (dict "ctx" $ "kind" "instructions" "role" "instructions-job" "script" (include "sycophant.instructionsUninstallScript" $)) }}
---
{{ include "sycophant.provisionReap" (dict "ctx" $ "kind" "instructions") }}
{{- end }}
