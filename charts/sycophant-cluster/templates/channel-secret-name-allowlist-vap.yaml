# Bounds which Secrets the channel pods may create in a tenant namespace.
#
# One tailnet channel per tenant, so the identity Secret is a single fixed
# name, not per-SA. The relay-controller is not matched: it holds no Secrets
# at all, and RBAC is its only lock.
#
# The channel Role grants `secrets: create` with no name constraint, because
# K8s RBAC `resourceNames` is not honored on `create`. This policy bounds the
# blast radius of a compromised channel pod.
#
# Engine choice: pure yes/no on request shape → VAP, not Kyverno.
#
# Threat model: operator-tier defense-in-depth. The agent cannot reach
# these SAs; this rule defends against CVE-influenced Secret creation from
# the pods themselves.

apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cluster-channel-secret-name-allowlist
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  matchConditions:
    - name: only-channel-sa
      expression: >-
        has(request.userInfo.username) &&
        request.userInfo.username.startsWith('system:serviceaccount:') &&
        request.userInfo.username.split(':').size() == 4 &&
        request.userInfo.username.split(':')[3].startsWith('ch-')
  variables:
    - name: saNamespace
      expression: request.userInfo.username.split(':')[2]
  validations:
    # Stops a channel SA from another namespace planting this tenant's
    # identity Secret.
    - expression: variables.saNamespace == request.namespace
      message: "a channel ServiceAccount may only create the tailnet-identity Secret in its own namespace"
    - expression: >-
        !(has(object.metadata.generateName) && object.metadata.generateName != '') &&
        has(object.metadata.name) &&
        object.metadata.name == 'tailnet-identity'
      message: "a channel ServiceAccount may only create the tailnet-identity Secret"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cluster-channel-secret-name-allowlist-binding
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  policyName: cluster-channel-secret-name-allowlist
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: sycophant-tenant
