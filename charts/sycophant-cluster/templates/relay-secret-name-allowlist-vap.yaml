# Bounds which Secrets the relay and the channel adapters may create in a
# tenant namespace.
#
# relay-ctrl SA: `relay-registered-keys` (one registered device public key
# per grant row) and nothing else.
# An adapter SA: its own `<sa-name>-state` Secret and nothing else — that is
# the tailnet node identity the app adapter keeps across restarts.
#
# Both are scoped to the requester's own namespace. A tenant lives entirely
# inside its namespace and an adapter never speaks for another tenant's
# channel, so a same-named SA next door gets nothing here.
#
# The RBAC at `charts/sycophant-tenant/templates/relay-ctrl-rbac.yaml` grants
# `secrets: create` with no name constraint, because K8s RBAC
# `resourceNames` is documented as not honored on the `create` verb. This
# admission policy is the structural backstop: it bounds the blast radius of
# a compromised relay or adapter.
#
# Engine choice: pure yes/no on request shape → VAP, not Kyverno.
#
# Threat model: operator-tier defense-in-depth. The workspace cannot reach
# these SAs; this rule defends against CVE-influenced Secret creation from
# the pods themselves.
#
# If any Secret is ever renamed, three things must move together: the RBAC
# `resourceNames` clause, this allow-list, and the chainsaw fixture at
# `tests/integration/sa-permission-bounds/relay-secret-name-allowlist/`.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cluster-relay-secret-name-allowlist
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  matchConditions:
    - name: only-relay-or-adapter-sa
      expression: >-
        has(request.userInfo.username) &&
        request.userInfo.username.startsWith('system:serviceaccount:') &&
        request.userInfo.username.split(':').size() == 4 &&
        (request.userInfo.username.split(':')[3] == 'relay-ctrl' ||
         request.userInfo.username.split(':')[3].startsWith('adapter-'))
  variables:
    - name: saNamespace
      expression: request.userInfo.username.split(':')[2]
    - name: saName
      expression: request.userInfo.username.split(':')[3]
  validations:
    # The requesting ServiceAccount must live in the namespace it is writing
    # into. A tenant lives entirely inside its own namespace, and an adapter
    # never speaks for another tenant's channel — so a same-named adapter SA
    # from a neighbouring namespace must not be able to plant this tenant's
    # state Secret.
    - expression: variables.saNamespace == request.namespace
      message: "relay-ctrl may only create Secrets in its own namespace; a ServiceAccount from another namespace may not create Secrets here"
    - expression: >-
        !(has(object.metadata.generateName) && object.metadata.generateName != '') &&
        has(object.metadata.name) &&
        ((variables.saName == 'relay-ctrl' &&
          object.metadata.name == 'relay-registered-keys') ||
         (variables.saName.startsWith('adapter-') &&
          object.metadata.name == variables.saName + '-state'))
      message: "relay-ctrl may only create Secrets named relay-registered-keys; an adapter ServiceAccount may only create its own <name>-state Secret"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cluster-relay-secret-name-allowlist-binding
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  policyName: cluster-relay-secret-name-allowlist
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: sycophant-tenant
