# relay-ctrl SA may only create two Secrets in any tenant namespace:
# `relay-signing-key` (Ed25519 signing seed) and
# `relay-tsnet-bridge-state` (tailnet node identity). The RBAC at
# `charts/sycophant-tenant/templates/relay-ctrl-rbac.yaml` grants
# `secrets: create` to this SA with no name constraint, because K8s
# RBAC `resourceNames` is documented as not honored on the `create`
# verb. This admission policy is the structural backstop: it bounds
# the blast radius of a compromised `relay-controller`.
#
# Engine choice: pure yes/no on request shape → VAP, not
# Kyverno.
#
# Threat model: operator-tier defense-in-depth. The workspace cannot
# reach this SA; this rule defends against CVE-influenced Secret
# creation from the gateway itself.
#
# If either Secret is ever renamed, three things must move together:
# the RBAC `resourceNames` clause, this allow-list, and the chainsaw
# fixture at
# `tests/integration/sa-permission-bounds/relay-secret-name-allowlist/`.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cluster-relay-secret-name-allowlist
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  matchConditions:
    - name: only-relay-ctrl-sa
      expression: >-
        has(request.userInfo.username) &&
        request.userInfo.username.startsWith('system:serviceaccount:') &&
        request.userInfo.username.endsWith(':relay-ctrl')
  validations:
    - expression: >-
        !(has(object.metadata.generateName) && object.metadata.generateName != '') &&
        has(object.metadata.name) &&
        (object.metadata.name == 'relay-signing-key' ||
         object.metadata.name == 'relay-tsnet-bridge-state')
      message: "relay-ctrl may only create Secrets named relay-signing-key or relay-tsnet-bridge-state"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cluster-relay-secret-name-allowlist-binding
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  policyName: cluster-relay-secret-name-allowlist
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: sycophant-tenant
