# Shared across all sycophant tenants. The relay controller in each tenant
# namespace authenticates caller SA tokens via TokenReview, a cluster-scoped
# API. The `tenant-rolebinding-generator.yaml` Kyverno policy creates a
# per-tenant ClusterRoleBinding pointing each tenant's relay SA at this
# ClusterRole for any namespace carrying the
# `app.kubernetes.io/part-of=sycophant-tenant` label.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-relay-tokenreview
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay-ctrl
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
