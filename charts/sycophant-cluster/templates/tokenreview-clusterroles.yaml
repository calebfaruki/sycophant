# Shared across all sycophant tenants. The relay controller in each tenant
# namespace authenticates caller tokens via TokenReview and authorizes every
# resolved subject via SubjectAccessReview, both cluster-scoped APIs.
# The `tenant-bindings-kpol.yaml` Kyverno policy creates a per-tenant
# ClusterRoleBinding pointing each tenant's relay SA at this ClusterRole for
# any namespace carrying the `app.kubernetes.io/part-of=sycophant-tenant`
# label.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-relay-tokenreview
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay-controller
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
# A dispatch checks the token of each harness that attaches to it with
# TokenReview. `tenant-bindings-kpol.yaml` binds each tenant's ServiceAccounts
# group to this ClusterRole. It grants TokenReview alone.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-dispatch-tokenreview
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: harness
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
