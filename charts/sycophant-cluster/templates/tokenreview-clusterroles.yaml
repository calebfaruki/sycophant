# Shared across all sycophant tenants. The airlock and hangar
# controllers in each tenant namespace authenticate caller SA tokens via
# TokenReview, a cluster-scoped API. The
# `tenant-rolebinding-generator.yaml` Kyverno policy creates a per-tenant
# ClusterRoleBinding pointing each tenant's controller SAs at the matching
# ClusterRole for any namespace carrying the
# `app.kubernetes.io/part-of=sycophant-tenant` label.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-airlock-tokenreview
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: airlock-ctrl
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-hangar-tokenreview
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: hangar-ctrl
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-mainframe-tokenreview
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: mainframe-ctrl
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-relay-tokenreview
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay-ctrl
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
