{{- if .Capabilities.APIVersions.Has "kyverno.io/v1/ClusterPolicy" }}
# Shared across all sycophant tenants. Stable name; install once at
# cluster bring-up. Match rules scope to any namespace carrying the
# `app.kubernetes.io/part-of=sycophant-tenant` label (applied by Kyverno
# at tenant-ns creation via `tenant-namespace-naming.yaml`).
#
# Trust thesis: the security boundary is structural — the namespace
# label is set at admission and cannot be changed by tenant code (no
# tenant SA has `update namespaces` perms). For per-resource
# protections, the rules use a precondition that matches "requesting
# SA's namespace == target resource's namespace." A workload INSIDE
# the tenant ns cannot mutate its own protected resources; external
# callers (chart deployers, cluster admins, kyverno controllers) live
# in other namespaces and are allowed by structural exclusion. No
# enumerated installer trust list — adding new install paths
# (additional deployers, CI bots, Argo) requires zero policy edits.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sycophant-protect-security
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: protect-network-policy
      match:
        any:
          - resources:
              kinds:
                - NetworkPolicy
              namespaceSelector:
                matchLabels:
                  app.kubernetes.io/part-of: sycophant-tenant
              operations:
                - CREATE
                - UPDATE
                - DELETE
      # mainframe-controller materializes per-workspace NetworkPolicies
      # from Workspace CRs and must be exempt from the protection that
      # bars tenant-namespace workloads from writing them. The SA name
      # is chart-installed and not under tenant control, so this
      # exemption does not widen tenant code's authority.
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: mainframe-ctrl
                namespace: "*"
      {{- include "sycophant.kyvernoSameNamespacePrecondition" . | nindent 6 }}
      validate:
        message: >-
          NetworkPolicy in a sycophant tenant namespace cannot be
          modified by workloads inside the namespace. External callers
          (chart deployers, cluster admins) and the chart-installed
          mainframe-controller SA are permitted.
        deny: {}
    - name: protect-cilium-network-policy
      match:
        any:
          - resources:
              kinds:
                - CiliumNetworkPolicy
              namespaceSelector:
                matchLabels:
                  app.kubernetes.io/part-of: sycophant-tenant
              operations:
                - CREATE
                - UPDATE
                - DELETE
      # See protect-network-policy: same exemption rationale extended
      # defensively to CiliumNetworkPolicies in case future workspace
      # materialization adopts the richer L7 policy type.
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: mainframe-ctrl
                namespace: "*"
      {{- include "sycophant.kyvernoSameNamespacePrecondition" . | nindent 6 }}
      validate:
        message: >-
          CiliumNetworkPolicy in a sycophant tenant namespace cannot be
          modified by workloads inside the namespace. External callers
          (chart deployers, cluster admins) and the chart-installed
          mainframe-controller SA are permitted.
        deny: {}
    - name: protect-self
      match:
        any:
          - resources:
              kinds:
                - ClusterPolicy
              names:
                - sycophant-protect-security
              operations:
                - UPDATE
                - DELETE
      exclude:
        any:
          - clusterRoles:
              - sycophant-chart-admin
              - cluster-admin
      validate:
        message: >-
          ClusterPolicy sycophant-protect-security is self-protected.
          Only cluster admins or sycophant-chart-admin holders can
          modify it.
        deny: {}
    - name: protect-rbac
      match:
        any:
          - resources:
              kinds:
                - Role
                - RoleBinding
              namespaceSelector:
                matchLabels:
                  app.kubernetes.io/part-of: sycophant-tenant
              operations:
                - CREATE
                - UPDATE
                - DELETE
      {{- include "sycophant.kyvernoSameNamespacePrecondition" . | nindent 6 }}
      validate:
        message: >-
          RBAC resources in a sycophant tenant namespace cannot be
          modified by workloads inside the namespace. External callers
          (chart deployers, cluster admins) are permitted to manage
          RBAC during tenant install/upgrade lifecycle.
        deny: {}
    - name: protect-airlock-bindings
      match:
        any:
          - resources:
              kinds:
                - ConfigMap
              namespaceSelector:
                matchLabels:
                  app.kubernetes.io/part-of: sycophant-tenant
              operations:
                - CREATE
                - UPDATE
                - DELETE
              selector:
                matchLabels:
                  sycophant.io/type: airlock-bindings
      {{- include "sycophant.kyvernoSameNamespacePrecondition" . | nindent 6 }}
      validate:
        message: >-
          The airlock-bindings ConfigMap in a sycophant tenant namespace
          cannot be modified by workloads inside the namespace.
        deny: {}
    - name: protect-workspace-service-accounts
      match:
        any:
          - resources:
              kinds:
                - ServiceAccount
              namespaceSelector:
                matchLabels:
                  app.kubernetes.io/part-of: sycophant-tenant
              operations:
                - CREATE
                - UPDATE
                - DELETE
              selector:
                matchLabels:
                  sycophant.io/type: workspace-sa
      # mainframe-controller materializes per-workspace ServiceAccounts
      # from Workspace CRs and must be exempt from the protection. SA
      # name is chart-installed; tenant code cannot impersonate it.
      exclude:
        any:
          - subjects:
              - kind: ServiceAccount
                name: mainframe-ctrl
                namespace: "*"
      {{- include "sycophant.kyvernoSameNamespacePrecondition" . | nindent 6 }}
      validate:
        message: >-
          Workspace ServiceAccounts in a sycophant tenant namespace
          cannot be modified by workloads inside the namespace. The
          chart-installed mainframe-controller SA is permitted.
        deny: {}
    - name: restrict-tightbeam-job-labels
      # Only a per-tenant tightbeam controller SA may create Jobs with
      # llm-job/channel-job labels. Subject pattern matches the SA the
      # framework chart creates: `<release>-tightbeam-ctrl` in
      # `tenant-*` namespace.
      match:
        any:
          - resources:
              kinds:
                - Job
              namespaceSelector:
                matchLabels:
                  app.kubernetes.io/part-of: sycophant-tenant
              operations:
                - CREATE
              selector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - llm-job
                      - channel-job
      exclude:
        any:
          - clusterRoles:
              - sycophant-chart-admin
              - cluster-admin
          - subjects:
              - kind: ServiceAccount
                name: "tightbeam-ctrl"
                namespace: "*"
      validate:
        message: >-
          Only the tightbeam controller can create jobs with
          llm-job or channel-job component labels in a sycophant tenant
          namespace.
        deny: {}
    - name: restrict-airlock-job-labels
      match:
        any:
          - resources:
              kinds:
                - Job
              namespaceSelector:
                matchLabels:
                  app.kubernetes.io/part-of: sycophant-tenant
              operations:
                - CREATE
              selector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - airlock-job
      exclude:
        any:
          - clusterRoles:
              - sycophant-chart-admin
              - cluster-admin
          - subjects:
              - kind: ServiceAccount
                name: "airlock-ctrl"
                namespace: "*"
      validate:
        message: >-
          Only the airlock controller can create jobs with airlock-job
          component labels in a sycophant tenant namespace.
        deny: {}
    - name: protect-prompt-configmaps
      match:
        any:
          - resources:
              kinds:
                - ConfigMap
              namespaceSelector:
                matchLabels:
                  app.kubernetes.io/part-of: sycophant-tenant
              operations:
                - CREATE
                - UPDATE
                - DELETE
              selector:
                matchLabels:
                  sycophant.io/type: prompt
      {{- include "sycophant.kyvernoSameNamespacePrecondition" . | nindent 6 }}
      validate:
        message: >-
          Prompt ConfigMaps in a sycophant tenant namespace cannot be
          modified by workloads inside the namespace.
        deny: {}
{{- end }}
