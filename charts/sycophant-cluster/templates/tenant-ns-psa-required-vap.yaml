# A namespace carrying app.kubernetes.io/part-of=sycophant-tenant switches on all
# per-tenant policy wiring (RBAC generate, tokenreview CRBs, the pod VAP binding).
# Since the auto-labelling mutate was removed, labeling is the namespace creator's
# job — and a creator that adds only the part-of label would get a fully-wired tenant
# namespace with NO Pod Security enforcement. This VAP fails that case closed: a
# tenant-labeled namespace must also enforce the restricted Pod Security Standard.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cluster-tenant-ns-psa-required
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: is-sycophant-tenant
      expression: >-
        has(object.metadata.labels) &&
        'app.kubernetes.io/part-of' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/part-of'] == 'sycophant-tenant'
  validations:
    - expression: >-
        has(object.metadata.labels) &&
        'pod-security.kubernetes.io/enforce' in object.metadata.labels &&
        object.metadata.labels['pod-security.kubernetes.io/enforce'] == 'restricted'
      message: "a sycophant-tenant namespace must set pod-security.kubernetes.io/enforce=restricted"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cluster-tenant-ns-psa-required-binding
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  policyName: cluster-tenant-ns-psa-required
  validationActions: [Deny]
