{{- if include "sycophant.selfService" . }}
# A tenant admin's only ConfigMap in sycophant-system is a labelled tenant
# command. The operator keeps its own grants there.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: tenant-admins-system-configmaps
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: sycophant-system
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["configmaps"]
  matchConditions:
    - name: sender-is-a-tenant-admin-not-the-operator
      expression: >-
        has(request.userInfo.groups) &&
        '{{ include "sycophant.tenantAdminGroup" . }}' in request.userInfo.groups &&
        request.userInfo.?username.orValue('') != '{{ .Values.selfService.operator }}'
  validations:
    - expression: >-
        has(object.metadata.name) &&
        object.metadata.name.startsWith('{{ include "sycophant.provisionCommandName" . }}-') &&
        object.metadata.?labels['{{ include "sycophant.commandLabel" . }}'].orValue('') == 'true'
      message: "a tenant admin may create only a labelled provision-tenant- command in sycophant-system"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: tenant-admins-system-configmaps-binding
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  policyName: tenant-admins-system-configmaps
  validationActions: [Deny]
{{- end }}
