# Kyverno needs RBAC verbs on every resource kind a generate rule
# produces. Two aggregation labels attach this role to both Kyverno
# controllers:
#   - admission-controller: validates the generate rule on policy
#     admission (needs `get` to check sync state)
#   - background-controller: executes the generate (needs CRUD)
# Kyverno re-aggregates on every restart, so adding labels is the only
# wiring needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:sycophant:provision
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  # Verbs Kyverno needs on the GENERATED resource (RoleBinding) itself.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["*"]

  # K8s anti-privilege-escalation: when Kyverno generates a RoleBinding
  # to provision-write, Kyverno itself must hold every verb it grants,
  # cluster-wide. The rules below mirror provision-write; Kyverno does not
  # use them directly.
  - apiGroups: [""]
    resources:
      - "configmaps"
      - "services"
      - "persistentvolumeclaims"
      - "serviceaccounts"
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

  # Mirrors provision-write's write-only-secrets rule. Kyverno's
  # background-controller must hold AT LEAST the verbs it grants via
  # generate-rules; tightening Kyverno to write-only too means a Kyverno
  # compromise also can't read existing tenant Secrets.
  - apiGroups: [""]
    resources:
      - "secrets"
    verbs: ["create", "update", "patch", "delete"]

  # Mirrors provision-write's pinned Secret `get` and its events rule. Kyverno
  # binds provision-write via the generated provision-tenant RoleBinding, so
  # anti-escalation requires it to hold these too: the generated bind is
  # rejected for any pinned `get` name the mirror omits, so this list must
  # match provision-write's pinned names exactly.
  - apiGroups: [""]
    resources:
      - "secrets"
    resourceNames: ["tailnet-identity"]
    verbs: ["get"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    verbs: ["*"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

  # Cluster-scoped resources Kyverno generates per-tenant when a
  # tenant-* namespace is created. These are the load-bearing additions
  # for the multi-tenant trust model: the provision installer never writes
  # ClusterRoleBindings or VAP Bindings; Kyverno reconciles them from
  # the generate policy.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicybindings"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

  # Kyverno watches tenant namespaces (part-of=sycophant-tenant) to drive
  # the generate rules. `create` lets the
  # background-controller materialize the tenant Namespace from the
  # provision command; `update`/`patch` let the suspend reactor stamp the
  # reap-after annotation on that namespace. No tenant-reachable
  # ServiceAccount holds these.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # ResourceQuota the provision generate policy sizes from the provision
  # command's capacity and nests in the new tenant Namespace, with the
  # LimitRange that defaults container memory under it.
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

  # K8s RBAC anti-escalation: Kyverno cannot grant permissions it does
  # not itself hold. When the generate rule creates a ClusterRoleBinding
  # pointing at `cluster-relay-tokenreview`, Kyverno must hold the verbs
  # that ClusterRole grants; the bind is rejected for any verb the mirror
  # omits.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
# The reap-tenant DeletingPolicy runs in the cleanup controller, whose own
# ClusterRole grants only get/list/watch on namespaces. Without delete on each
# kind it reaps, every deletion fails.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:sycophant:reap
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    rbac.kyverno.io/aggregate-to-cleanup-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["namespaces", "serviceaccounts"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings", "roles"]
    verbs: ["get", "list", "watch", "delete"]
