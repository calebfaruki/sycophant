{{- if include "sycophant.renderKyverno" . }}
# A Namespace carrying `app.kubernetes.io/part-of=sycophant-tenant` is a
# sycophant tenant. The label is the single trigger; the namespace name is
# irrelevant. The `provision-tenant-base` reactor applies it when it generates
# the namespace.
#
# When a namespace gains the label, Kyverno generates the wiring the creating
# credential is deliberately not permitted to make itself (a stolen installer
# credential must not be able to mint RBAC or bind itself to a write role):
#
#  1. A per-tenant ClusterRoleBinding binding the SHARED relay tokenreview
#     ClusterRole to this tenant's relay ServiceAccount.
#  2. A per-tenant ClusterRoleBinding binding the SHARED dispatch tokenreview
#     ClusterRole to this tenant's ServiceAccounts group.
#  3. A per-tenant ValidatingAdmissionPolicyBinding scoping the shared
#     cluster-gvisor-pod-policy VAP to this tenant ns.
#
# Generated resources are materialized asynchronously after admission returns —
# consumers must tolerate a short reconciliation window.
# `evaluation.background.enabled` is absent here because a GeneratingPolicy has
# no such knob; `generateExisting` is the field that would scan existing
# namespaces on policy install, and it stays off.
#
# The reactor's background controller creates the namespace, and Kyverno skips
# its own background requests unless `skipBackgroundRequests` is off, so it is
# off here or a tenant from a provision command gets none of its bindings. The
# background controller labels no namespace but the reactor's; the suspend reactor's
# reap-after stamp re-fires this policy onto the same bindings.
#
# The generated bindings carry no `namespace`, which is how a template declares
# a cluster-scoped resource.
#
# The relay SA name inside the tenant ns is static (`relay-controller`) — no helm
# release-name prefix — so operators pick any release name. (See
# `sycophant-tenant` chart.)
#
# The name predates the provision-<kind> scheme and stays: the earlier release
# ran this policy with synchronize on, and Kyverno deletes a synchronized
# policy's generated objects when the policy is deleted. A rename would delete
# the old policy on `helm upgrade` and take every existing tenant's relay
# ClusterRoleBinding and pod VAP binding with it. Updating it in place to
# synchronize off keeps them.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: tenant-rolebinding-generator
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  evaluation:
    generateExisting:
      enabled: false
    synchronize:
      enabled: false
    skipBackgroundRequests: false
  matchConstraints:
    objectSelector:
      matchLabels:
        app.kubernetes.io/part-of: sycophant-tenant
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  variables:
    - name: tenant
      expression: "object.metadata.name"
    - name: tenantUid
      expression: "object.metadata.uid"
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: (( variables.tenant ))-relay-tokenreview
            ownerReferences:
              - apiVersion: v1
                kind: Namespace
                name: (( variables.tenant ))
                uid: (( variables.tenantUid ))
                blockOwnerDeletion: false
            labels:
              {{- include "sycophant.labels" . | nindent 14 }}
              app.kubernetes.io/component: relay-controller
          subjects:
            - kind: ServiceAccount
              name: relay-controller
              namespace: (( variables.tenant ))
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cluster-relay-tokenreview
          ---
          # Every ServiceAccount in the tenant may create TokenReviews, so a
          # dispatch can check the harness that attaches to it.
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: (( variables.tenant ))-dispatch-tokenreview
            ownerReferences:
              - apiVersion: v1
                kind: Namespace
                name: (( variables.tenant ))
                uid: (( variables.tenantUid ))
                blockOwnerDeletion: false
            labels:
              {{- include "sycophant.labels" . | nindent 14 }}
              app.kubernetes.io/component: harness
          subjects:
            - kind: Group
              apiGroup: rbac.authorization.k8s.io
              name: system:serviceaccounts:(( variables.tenant ))
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cluster-dispatch-tokenreview
          ---
          # ValidatingAdmissionPolicyBinding scoping the broad pod VAP to
          # this ns. The VAP gates every Pod labeled `part-of=sycophant`
          # under one envelope (universal rules + component-gated branches
          # for harness, capability-job, headscale). Per-tenant binding
          # so admission resolves namespace-locally.
          apiVersion: admissionregistration.k8s.io/v1
          kind: ValidatingAdmissionPolicyBinding
          metadata:
            name: (( variables.tenant ))-sycophant-pod-binding
            ownerReferences:
              - apiVersion: v1
                kind: Namespace
                name: (( variables.tenant ))
                uid: (( variables.tenantUid ))
                blockOwnerDeletion: false
            labels:
              {{- include "sycophant.labels" . | nindent 14 }}
          spec:
            policyName: cluster-gvisor-pod-policy
            validationActions: [Deny]
            matchResources:
              namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: In
                    values:
                      - (( variables.tenant ))
{{- end }}
