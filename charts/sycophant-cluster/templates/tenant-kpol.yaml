{{- /*
The tenant lifecycle: provision (Namespace, quota, installer and its grant),
suspend, and the reap.
*/}}
{{- /*
Fires only on suspend commands inside a tenant namespace. Without the
namespace bound a suspend command in sycophant-system would scale the system
Deployments to zero.
*/}}
{{- define "sycophant.suspendCommandMatch" -}}
matchConstraints:
  namespaceSelector:
    matchLabels:
      app.kubernetes.io/part-of: sycophant-tenant
  objectSelector:
    matchLabels:
      {{ include "sycophant.commandLabel" . }}: "true"
      app.kubernetes.io/part-of: sycophant
  resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["configmaps"]
      resourceNames: ["{{ include "sycophant.suspendCommandName" . }}"]
{{- end -}}
{{- if include "sycophant.renderKyverno" . }}
# Provision reactor. Fires on tenant provision commands in sycophant-system. It
# materializes the tenant Namespace, a nested ResourceQuota sized from the
# provision command's capacity, and a LimitRange, under Kyverno's own
# ServiceAccount rights, and generates nothing else. The quota rejects a container that sets no
# memory, so the LimitRange gives one a 64Mi request and a 256Mi limit. The generated Namespace carries the part-of=sycophant-tenant
# label, which chains into the relay tokenreview and pod-VAP bindings the
# tenant-rolebinding-generator policy produces, and the restricted Pod Security
# labels the tenant-namespace-psa-required VAP demands.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: provision-tenant-base
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  evaluation:
    generateExisting:
      enabled: false
    synchronize:
      enabled: false
  {{- include "sycophant.provisionCommandSystemMatchConstraints" . | nindent 2 }}
  variables:
    - name: tenant
      expression: '"{{ include "sycophant.tenantNsPrefix" . }}" + object.data["tenant"]'
    - name: capacity
      expression: 'object.data["capacity"]'
    - name: owner
      expression: 'object.data["owner"]'
    - name: ownerHash
      expression: 'object.data["owner-hash"]'
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: (( variables.tenant ))
            annotations:
              sycophant.md/owner: (( variables.owner ))
            labels:
              {{- include "sycophant.baseLabels" . | nindent 14 }}
              app.kubernetes.io/part-of: sycophant-tenant
              pod-security.kubernetes.io/enforce: restricted
              pod-security.kubernetes.io/warn: restricted
              pod-security.kubernetes.io/audit: restricted
              sycophant.md/owner: (( variables.ownerHash ))
          ---
          apiVersion: v1
          kind: ResourceQuota
          metadata:
            name: (( variables.tenant ))-capacity
            namespace: (( variables.tenant ))
            labels:
              {{- include "sycophant.labels" . | nindent 14 }}
          spec:
            hard:
              requests.memory: (( variables.capacity ))
              limits.memory: (( variables.capacity ))
          ---
          apiVersion: v1
          kind: LimitRange
          metadata:
            name: (( variables.tenant ))-memory-default
            namespace: (( variables.tenant ))
            labels:
              {{- include "sycophant.labels" . | nindent 14 }}
          spec:
            limits:
              - type: Container
                defaultRequest:
                  memory: 64Mi
                default:
                  memory: 256Mi
---
{{ include "sycophant.provisionInstaller" (dict "ctx" $ "kind" "tenant") }}
---
# Delete reactor. Each object dies on its own reap-after annotation.
# TODO: with the setting off, a tenant's instruction folders survive the reap and a
# new tenant with the same name reads them. With it on, reap-tenant-files deletes
# them first.
apiVersion: policies.kyverno.io/v1
kind: DeletingPolicy
metadata:
  name: reap-tenant
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.reap.schedule | quote }}
  matchConstraints:
    resourceRules:
      {{- if not (include "sycophant.selfService" .) }}
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
      {{- end }}
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["serviceaccounts"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["roles"]
  variables:
    # The reap-after annotation the suspend reactor stamps on the namespace (now
    # plus keepalive) and the provision generator stamps on the installer's
    # objects. Only an object carrying it is a candidate.
    - name: reapAfter
      expression: >-
        object.metadata.?annotations["{{ include "sycophant.reapAfterAnnotation" . }}"].orValue("")
  conditions:
    # One objectSelector cannot select the namespace by part-of and the installer
    # objects by component at once, so the label gate branches on kind here.
    - name: selector-matches-by-kind
      expression: >-
        object.kind == "Namespace"
          ? object.metadata.?labels["app.kubernetes.io/part-of"].orValue("") == "sycophant-tenant"
          : object.metadata.?labels["app.kubernetes.io/component"].orValue("") == "provision-tenant"
    - name: reap-after-ttl-has-passed
      expression: >-
        variables.reapAfter != "" && timestamp(variables.reapAfter) < time.now()
---
# Suspend scales the tenant namespace's Deployments to zero. A second policy
# stamps reap-after on the namespace. Two policies because a CEL mutating
# policy resolves one set of targets. Gates are target match conditions,
# because as trigger conditions they would move the policy into Kyverno's
# per-policy webhook and admit the suspend command twice. Targets resolve off
# the trigger's own namespace, which bounds a suspend command to its tenant.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: suspend-tenant
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  evaluation:
    mutateExisting:
      enabled: true
    # Defaults true, which suppresses mutateExisting entirely.
    skipBackgroundRequests: false
  {{- include "sycophant.suspendCommandMatch" . | nindent 2 }}
  targetMatchConstraints:
    expression: >-
      resource.list("apps/v1", "deployments", object.metadata.namespace)
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{ spec: Object.spec{ replicas: 0 } }
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: reap-tenant-ttl
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  evaluation:
    mutateExisting:
      enabled: true
    # See above.
    skipBackgroundRequests: false
  {{- include "sycophant.suspendCommandMatch" . | nindent 2 }}
  variables:
    # Keepalive is in days; the annotation is an absolute RFC3339 instant.
    - name: reapAfter
      expression: >-
        string(time.now() + duration(string(int(request.object.data["keepalive"]) * 24) + "h"))
  targetMatchConstraints:
    expression: >-
      resource.get("v1", "namespaces", "", object.metadata.namespace)
  targetMatchConditions:
    - name: keepalive-is-set
      expression: >-
        request.object.?data["keepalive"].orValue("") != ""
    {{- if include "sycophant.selfService" . }}
    - name: reap-after-is-set-once
      expression: >-
        object.metadata.?annotations["{{ include "sycophant.reapAfterAnnotation" . }}"].orValue("") == ""
    {{- end }}
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{
              annotations: {"{{ include "sycophant.reapAfterAnnotation" . }}": variables.reapAfter}
            }
          }
{{- end }}
