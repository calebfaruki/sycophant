{{ include "sycophant.commandVap" (dict "ctx" . "name" "command-reap-channel" "prefix" true
  "command" "reap-channel" "noun" "reap-channel" "action" "remove a channel"
  "keys" (list)
  "targetRule" `variables.target.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') &&
size(variables.target) <= 50`
  "targetHelp" "a reap-channel command's sycophant.md/target must be a DNS-safe name of at most 50 characters" ) }}
