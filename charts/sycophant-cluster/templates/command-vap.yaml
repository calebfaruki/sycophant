{{- /* An absent keepalive suspends with no reap; a typo'd one is refused rather than suspending forever. */}}
{{ include "sycophant.commandVap" (dict "ctx" . "name" "command-suspend-tenant"
  "command" (include "sycophant.suspendCommandName" .) "noun" "suspend" "action" "suspend a tenant"
  "keys" (list "keepalive")
  "shape" `
- expression: >-
    !has(object.data) || !('keepalive' in object.data) ||
    object.data['keepalive'] in ['0', '30', '60', '90']
  message: "a suspend command's 'keepalive', when set, must be one of 0, 30, 60, 90"` ) }}
