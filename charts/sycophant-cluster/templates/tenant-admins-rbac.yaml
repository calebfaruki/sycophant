{{- if include "sycophant.selfService" . }}
# Every issuer login may create ConfigMaps in sycophant-system and nothing else.
# Admission narrows this to labelled tenant commands. No update or delete, so a
# tenant admin cannot replace or remove another tenant's command.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-admins
  namespace: sycophant-system
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-admins
  namespace: sycophant-system
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ include "sycophant.tenantAdminGroup" . | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-admins
{{- end }}
