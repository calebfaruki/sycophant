{{- if .Capabilities.APIVersions.Has "kyverno.io/v1/ClusterPolicy" }}
# Stamps runtimeClassName=gvisor on chamber pods (airlock-job) only.
# Chambers execute LLM-selected, operator-supplied tool code -- the
# load-bearing case for the syscall sandbox. The transponder, llm-job,
# and channel pods run trusted first-party Rust and stay on the
# kubelet-default runtime; their containment is the broad VAP envelope
# (drop-ALL + ROFS + automountSA=false + seccomp + runAsNonRoot) plus
# per-component Cilium egress allowlists and single-audience tokens.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cluster-runtime-class
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  background: false
  rules:
    - name: stamp-gvisor-on-chambers
      match:
        any:
          - resources:
              kinds: ["Pod"]
              selector:
                matchExpressions:
                  - key: app.kubernetes.io/part-of
                    operator: In
                    values: [sycophant]
                  - key: app.kubernetes.io/component
                    operator: In
                    values: [airlock-job]
      mutate:
        patchStrategicMerge:
          spec:
            runtimeClassName: gvisor
{{- end }}
