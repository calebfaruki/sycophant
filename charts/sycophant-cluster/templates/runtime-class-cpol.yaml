{{- if .Capabilities.APIVersions.Has "kyverno.io/v1/ClusterPolicy" }}
# Stamps runtimeClassName=gvisor on the four adversarial pod components
# (transponder, llm-job, airlock-job, channel-job). Per the security
# thesis (project_security_thesis.md) these are the pods that execute
# LLM-driven code -- the load-bearing case for gVisor. Controllers run
# trusted Rust and stay on the kubelet-default runtime; their attack
# surface is covered by the broad VAP's drop-ALL + ROFS + automountSA
# envelope plus narrow signed-envelope auth.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cluster-runtime-class
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  background: false
  rules:
    - name: stamp-gvisor-on-adversarial-pods
      match:
        any:
          - resources:
              kinds: ["Pod"]
              selector:
                matchExpressions:
                  - key: app.kubernetes.io/part-of
                    operator: In
                    values: [sycophant]
                  - key: app.kubernetes.io/component
                    operator: In
                    values: [transponder, llm-job, airlock-job, channel-job]
      mutate:
        patchStrategicMerge:
          spec:
            runtimeClassName: gvisor
{{- end }}
