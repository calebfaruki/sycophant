{{- if include "sycophant.renderKyverno" . }}
# Stamps runtimeClassName=gvisor on worker pods (tool-job) only.
# These pods execute LLM-selected, operator-supplied tool code -- the
# load-bearing case for the syscall sandbox. The harness, toolset
# controller, and relay pods run trusted first-party Rust and stay on
# the kubelet-default runtime; their containment is the broad VAP
# envelope (drop-ALL + ROFS + automountSA=false + seccomp + runAsNonRoot)
# plus per-component Cilium egress allowlists and single-audience tokens.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cluster-runtime-class
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  background: false
  rules:
    - name: stamp-gvisor-on-workers
      match:
        any:
          - resources:
              kinds: ["Pod"]
              selector:
                matchExpressions:
                  - key: app.kubernetes.io/part-of
                    operator: In
                    values: [sycophant]
                  - key: app.kubernetes.io/component
                    operator: In
                    values: [tool-job]
      mutate:
        patchStrategicMerge:
          spec:
            runtimeClassName: gvisor
{{- end }}
