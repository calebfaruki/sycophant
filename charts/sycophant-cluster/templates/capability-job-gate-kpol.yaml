{{- if include "sycophant.renderKyverno" . }}
# Identity-keyed admission gate on Job CREATE. Keys on the creator's
# authenticated username (system:serviceaccount:<ns>:ag-<agent>). On
# that event it mutates the Job's pod template into the hardened isolation
# envelope, stamps the security labels from the identity, and validates the
# result -- denying the Job on a missing envelope element, an off-allowlist
# volume kind, an off-allowlist Secret name, a wrong pinned ServiceAccount, or a
# bad job-kind.
#
# The mutate is additive: every envelope field is written through an optional so
# it lands only where the creator left it absent. An explicitly hostile value is
# therefore NOT sanitized -- it survives into the validate below and is denied
# there. The identity labels are the deliberate exception: they are authored
# from the unforgeable creating identity and overwrite any carried value.
#
# Mutating and validating are separate objects because CEL policies are typed by
# action. The apiserver runs every mutating webhook before any validating one,
# so the validate still sees the mutated template.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: cluster-capability-job-gate-envelope
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: sycophant-tenant
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["jobs"]
  {{- include "sycophant.capabilityJobGateIdentity" . | nindent 2 }}
  mutations:
    # Everything an apply configuration can express. Each envelope field is an
    # optional that resolves to none when the creator already set it, so the
    # merge adds and never overwrites. The identity labels are plain values
    # because overwriting is the point: a map merges by key, so the creator's
    # other labels survive and these two are authored here.
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              template: Object.spec.template{
                metadata: Object.spec.template.metadata{
                  labels: {
                    "app.kubernetes.io/component": "capability-job",
                    "sycophant.md/agent": variables.agent
                  }
                },
                spec: Object.spec.template.spec{
                  ?runtimeClassName: has(variables.pod.runtimeClassName)
                    ? optional.none() : optional.of("gvisor"),
                  ?automountServiceAccountToken: has(variables.pod.automountServiceAccountToken)
                    ? optional.none() : optional.of(false),
                  containers: variables.containers.map(c,
                    Object.spec.template.spec.containers{
                      name: c.name,
                      securityContext: Object.spec.template.spec.containers.securityContext{
                        ?readOnlyRootFilesystem: has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem)
                          ? optional.none() : optional.of(true),
                        ?allowPrivilegeEscalation: has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation)
                          ? optional.none() : optional.of(false),
                        ?runAsNonRoot: has(c.securityContext) && has(c.securityContext.runAsNonRoot)
                          ? optional.none() : optional.of(true),
                        seccompProfile: Object.spec.template.spec.containers.securityContext.seccompProfile{
                          ?type: has(c.securityContext) && has(c.securityContext.seccompProfile) && has(c.securityContext.seccompProfile.type)
                            ? optional.none() : optional.of("RuntimeDefault")
                        }
                      }
                    }),
                  ?initContainers: size(variables.initContainers) == 0 ? optional.none() : optional.of(
                    variables.initContainers.map(c,
                      Object.spec.template.spec.initContainers{
                        name: c.name,
                        securityContext: Object.spec.template.spec.initContainers.securityContext{
                          ?readOnlyRootFilesystem: has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem)
                            ? optional.none() : optional.of(true),
                          ?allowPrivilegeEscalation: has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation)
                            ? optional.none() : optional.of(false),
                          ?runAsNonRoot: has(c.securityContext) && has(c.securityContext.runAsNonRoot)
                            ? optional.none() : optional.of(true),
                          seccompProfile: Object.spec.template.spec.initContainers.securityContext.seccompProfile{
                            ?type: has(c.securityContext) && has(c.securityContext.seccompProfile) && has(c.securityContext.seccompProfile.type)
                              ? optional.none() : optional.of("RuntimeDefault")
                          }
                        }
                      }))
                }
              }
            }
          }
    # `capabilities.drop` is an atomic list, which an apply configuration may
    # not write at all, so the dropped capability set is a patch instead. It
    # runs after the apply configuration above and reads the object that one
    # produced, which is why `securityContext` can be assumed present. Still
    # additive: a container that already names a drop set keeps it and answers
    # to the validate.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          lists.range(size(object.spec.template.spec.containers))
            .filter(i, !has(object.spec.template.spec.containers[i].securityContext.capabilities)
              || !has(object.spec.template.spec.containers[i].securityContext.capabilities.drop))
            .map(i, has(object.spec.template.spec.containers[i].securityContext.capabilities)
              ? JSONPatch{
                  op: "add",
                  path: "/spec/template/spec/containers/" + string(i) + "/securityContext/capabilities/drop",
                  value: ["ALL"]
                }
              : JSONPatch{
                  op: "add",
                  path: "/spec/template/spec/containers/" + string(i) + "/securityContext/capabilities",
                  value: {"drop": ["ALL"]}
                })
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          lists.range(size(object.spec.?template.spec.initContainers.orValue([])))
            .filter(i, !has(object.spec.template.spec.initContainers[i].securityContext.capabilities)
              || !has(object.spec.template.spec.initContainers[i].securityContext.capabilities.drop))
            .map(i, has(object.spec.template.spec.initContainers[i].securityContext.capabilities)
              ? JSONPatch{
                  op: "add",
                  path: "/spec/template/spec/initContainers/" + string(i) + "/securityContext/capabilities/drop",
                  value: ["ALL"]
                }
              : JSONPatch{
                  op: "add",
                  path: "/spec/template/spec/initContainers/" + string(i) + "/securityContext/capabilities",
                  value: {"drop": ["ALL"]}
                })
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: cluster-capability-job-gate
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: sycophant-tenant
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["jobs"]
  {{- include "sycophant.capabilityJobGateIdentity" . | nindent 2 }}
    - name: volumes
      expression: "variables.pod.?volumes.orValue([])"
    # Resolved only when a Secret is actually referenced: every use below sits
    # behind a short-circuit, so a Job naming no Secret needs no grants object
    # and an agent without one is not denied for that alone.
    - name: grants
      expression: >-
        resource.get("v1", "configmaps", request.namespace,
          "ag-" + variables.agent + "-capability-grants").?data.orValue({})
    # An inference Job may also reference the one Secret named by the `secret`
    # key of its own model's ConfigMap, `inf-<key>`, where `<key>` is the
    # Job's model label. Only that model's install writes the ConfigMap.
    - name: modelSecret
      expression: >-
        object.spec.template.metadata.?labels["sycophant.md/job-kind"].orValue("") == "inference"
          && object.spec.template.metadata.?labels["sycophant.md/model"].orValue("") != ""
          ? resource.get("v1", "configmaps", request.namespace,
              "inf-" + object.spec.template.metadata.labels["sycophant.md/model"]).?data.secret.orValue("")
          : ""
    - name: allowed
      expression: >-
        variables.grants.map(k, k)
          + (variables.modelSecret == "" ? [] : [variables.modelSecret])
  validations:
    - expression: >-
        variables.pod.?runtimeClassName.orValue("") == "gvisor"
          && variables.pod.?automountServiceAccountToken.orValue(true) == false
          && variables.allContainers.all(c,
               has(c.securityContext)
                 && c.securityContext.?readOnlyRootFilesystem.orValue(false) == true
                 && c.securityContext.?allowPrivilegeEscalation.orValue(true) == false
                 && c.securityContext.?runAsNonRoot.orValue(false) == true
                 && has(c.securityContext.capabilities)
                 && "ALL" in c.securityContext.capabilities.?drop.orValue([])
                 && c.securityContext.?seccompProfile.type.orValue("") == "RuntimeDefault")
      message: >-
        capability-job pod template is missing a required isolation-envelope
        element: it must set runtimeClassName gvisor, automountServiceAccountToken
        false, and every container must set readOnlyRootFilesystem true,
        allowPrivilegeEscalation false, runAsNonRoot true, drop ALL capabilities,
        and seccompProfile type RuntimeDefault.
    - expression: >-
        variables.volumes.all(v,
          v.filter(k, k != "name").all(k,
            k in ["configMap", "secret", "projected", "emptyDir", "downwardAPI", "persistentVolumeClaim"]))
      message: >-
        capability-job pod volumes must be one of configMap, secret, projected,
        emptyDir, downwardAPI, or persistentVolumeClaim.
    # The agent's data PVC is the only claim a tool job mounts, and its name
    # is fixed by the chart as `ag-<agent>-data`. Deriving the
    # approved name from the creating identity rather than reading it from a
    # ConfigMap leaves no name to drift and no context source to go missing.
    # Naming the claim outright is what keeps `ag-<agent>-conversation`
    # out: the harness's conversation history must never be reachable from the
    # untrusted runtime, which could otherwise forge it.
    - expression: >-
        variables.volumes.all(v,
          !has(v.persistentVolumeClaim)
            || v.persistentVolumeClaim.claimName == "ag-" + variables.agent + "-data")
      message: >-
        capability-job may mount only its own agent's data PVC; every
        persistentVolumeClaim.claimName must be ag-<agent>-data.
    # The harness mounts no ConfigMap into a tool job, so the approved set is
    # empty and every reference is denied. Covers the same sites the Secret
    # allowlist covers, because each is a way to read a ConfigMap's contents:
    # volumes, projected sources, and env/envFrom on both container lists.
    - expression: >-
        variables.volumes.all(v, !has(v.configMap))
          && variables.volumes.all(v,
               !has(v.projected) || v.projected.?sources.orValue([]).all(s, !has(s.configMap)))
          && variables.allContainers.all(c,
               c.?env.orValue([]).all(e, !has(e.valueFrom) || !has(e.valueFrom.configMapKeyRef)))
          && variables.allContainers.all(c,
               c.?envFrom.orValue([]).all(f, !has(f.configMapRef)))
      message: >-
        capability-job must not reference a ConfigMap: none is approved for a
        tool job, so any reference names data the job has no business reading.
    - expression: >-
        variables.pod.?serviceAccountName.orValue("") == "ag-" + variables.agent + "-unprivileged"
      message: >-
        capability-job pod template must set serviceAccountName to the agent's
        unprivileged pod ServiceAccount.
    - expression: >-
        object.spec.template.metadata.?labels["sycophant.md/job-kind"].orValue("")
          in ["", "tool", "inference"]
      message: >-
        sycophant.md/job-kind must be tool or inference when set.
    - expression: >-
        variables.volumes.all(v, !has(v.secret) || v.secret.secretName in variables.allowed)
          && variables.volumes.all(v,
               !has(v.projected) || v.projected.?sources.orValue([]).all(s,
                 !has(s.secret) || s.secret.name in variables.allowed))
          && variables.allContainers.all(c,
               c.?env.orValue([]).all(e,
                 !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef)
                   || e.valueFrom.secretKeyRef.name in variables.allowed))
          && variables.allContainers.all(c,
               c.?envFrom.orValue([]).all(f,
                 !has(f.secretRef) || f.secretRef.name in variables.allowed))
          && variables.pod.?imagePullSecrets.orValue([]).all(s, s.name in variables.allowed)
      message: >-
        capability-job references a Secret name that is not in the agent's
        capability-grants allowlist or, for an inference Job, its model's
        ConfigMap.
{{- end }}
