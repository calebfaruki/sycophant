# Workspace Pod validator. Targets Pods labeled
# app.kubernetes.io/part-of=sycophant + app.kubernetes.io/component=workspace
# materialized by mainframe-controller. The per-tenant
# ValidatingAdmissionPolicyBinding is generated by Kyverno
# (see `tenant-rolebinding-generator.yaml`) when each tenant namespace appears.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cluster-workspace-pod-policy
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: only-workspace-pods
      expression: >-
        has(object.metadata.labels) &&
        'app.kubernetes.io/part-of' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/part-of'] == 'sycophant' &&
        'app.kubernetes.io/component' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/component'] == 'workspace'
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        has(object.spec.runtimeClassName) &&
        object.spec.runtimeClassName == 'gvisor'
      message: "Workspace pods must use runtimeClassName: gvisor"
    - expression: >-
        !has(object.spec.hostNetwork) ||
        object.spec.hostNetwork == false
      message: "hostNetwork is prohibited"
    - expression: >-
        variables.allContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.privileged) ||
          c.securityContext.privileged == false
        )
      message: "Privileged containers are prohibited"
    - expression: >-
        variables.allContainers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.capabilities) &&
          has(c.securityContext.capabilities.drop) &&
          'ALL' in c.securityContext.capabilities.drop
        )
      message: "All containers must drop ALL capabilities"
    # PSS-restricted permits Undefined/nil for seccompProfile.type, so it
    # is NOT a backstop here. The materializer sets pod-level
    # seccompProfile.type=RuntimeDefault. This rule blocks manually crafted
    # workspace pods that omit seccompProfile or set it to Unconfined.
    - expression: >-
        variables.allContainers.all(c,
          (has(c.securityContext) &&
           has(c.securityContext.seccompProfile) &&
           has(c.securityContext.seccompProfile.type) &&
           (c.securityContext.seccompProfile.type == 'RuntimeDefault' ||
            c.securityContext.seccompProfile.type == 'Localhost')) ||
          ((!has(c.securityContext) ||
            !has(c.securityContext.seccompProfile) ||
            !has(c.securityContext.seccompProfile.type)) &&
           has(object.spec.securityContext) &&
           has(object.spec.securityContext.seccompProfile) &&
           has(object.spec.securityContext.seccompProfile.type) &&
           (object.spec.securityContext.seccompProfile.type == 'RuntimeDefault' ||
            object.spec.securityContext.seccompProfile.type == 'Localhost'))
        )
      message: "seccompProfile.type must be RuntimeDefault or Localhost at pod or container level"
    # readOnlyRootFilesystem has no admission backstop in PSS-restricted —
    # only this VAP rule enforces it. ROFS prevents in-sandbox malicious
    # code (the workspace-adversarial threat) from writing trojaned
    # binaries, persistence files, or mutating the agent runtime's image.
    # gVisor bounds the blast radius to the sandbox; this rule keeps the
    # in-sandbox runtime immutable from within.
    - expression: >-
        variables.allContainers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.readOnlyRootFilesystem) &&
          c.securityContext.readOnlyRootFilesystem == true
        )
      message: "All containers must set readOnlyRootFilesystem: true"
    # Backstop for PSS-restricted. The pod-security label on the tenant ns
    # is mutable (anyone with `update namespaces` could strip it); the VAP
    # binding is regenerated by Kyverno with failurePolicy=Fail and is the
    # load-bearing structural defense.
    - expression: >-
        variables.allContainers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.allowPrivilegeEscalation) &&
          c.securityContext.allowPrivilegeEscalation == false
        )
      message: "All containers must set allowPrivilegeEscalation: false"
    - expression: >-
        variables.allContainers.all(c,
          has(c.resources) &&
          has(c.resources.limits) &&
          has(c.resources.limits.memory) &&
          has(c.resources.limits.cpu)
        )
      message: "All containers must define resource limits (cpu and memory)"
    - expression: >-
        variables.allContainers.all(c,
          (has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot == true) ||
          ((!has(c.securityContext) || !has(c.securityContext.runAsNonRoot)) &&
           has(object.spec.securityContext) &&
           has(object.spec.securityContext.runAsNonRoot) &&
           object.spec.securityContext.runAsNonRoot == true)
        )
      message: "runAsNonRoot must be true at pod or container level"
    # Every projected source must be a non-kube-apiserver-audience SA
    # token. Any other source type (secret, configMap, clusterTrustBundle,
    # downwardAPI) is structurally prohibited. Allow-list shape: future
    # ProjectedVolumeSource variants don't auto-admit. Audience list of
    # forbidden tokens mirrors stock k3s/kubeadm `--api-audiences`; extend
    # if the cluster's `--api-audiences` is customized.
    - expression: >-
        !has(object.spec.volumes) ||
        object.spec.volumes.all(v,
          !has(v.projected) ||
          !has(v.projected.sources) ||
          v.projected.sources.all(s,
            has(s.serviceAccountToken) &&
            has(s.serviceAccountToken.audience) &&
            s.serviceAccountToken.audience != '' &&
            s.serviceAccountToken.audience != 'kubernetes.default.svc' &&
            s.serviceAccountToken.audience != 'https://kubernetes.default.svc.cluster.local'
          )
        )
      message: "Projected volume sources must be serviceAccountToken with a non-kube-apiserver audience"
    - expression: >-
        !has(object.spec.volumes) ||
        object.spec.volumes.all(v,
          !has(v.hostPath) ||
          (v.name == 'mainframe' && has(v.hostPath.path) && v.hostPath.path != '')
        )
      message: "hostPath volumes are prohibited except for a volume named 'mainframe'"
    # Workspace pod volumes must be one of the four types the materializer
    # uses. Default-deny: future K8s volume types don't auto-admit, and
    # existing leak vectors (csi, secret, configMap, nfs/iscsi/rbd,
    # downwardAPI, ephemeral, image) are structurally banned. The
    # workspace runtime is adversarial; any volume that could expose
    # Secret bytes is an exfil vector regardless of who would legitimately
    # mount it.
    - expression: >-
        !has(object.spec.volumes) ||
        object.spec.volumes.all(v,
          has(v.emptyDir) ||
          has(v.persistentVolumeClaim) ||
          has(v.hostPath) ||
          has(v.projected)
        )
      message: "Workspace pod volumes must be emptyDir, persistentVolumeClaim, hostPath, or projected"
    - expression: >-
        !has(object.spec.volumes) ||
        !object.spec.volumes.exists(v, v.name == 'mainframe' && has(v.hostPath)) ||
        variables.allContainers.all(c,
          !has(c.volumeMounts) ||
          c.volumeMounts.all(m,
            m.name != 'mainframe' ||
            (m.mountPath == '/etc/mainframe' && has(m.readOnly) && m.readOnly == true)
          )
        )
      message: "the 'mainframe' hostPath volume must be mounted at /etc/mainframe with readOnly: true"
    - expression: >-
        variables.allContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.capabilities) ||
          !has(c.securityContext.capabilities.add) ||
          size(c.securityContext.capabilities.add) == 0
        )
      message: "Adding capabilities is prohibited"
    - expression: >-
        (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
        (!has(object.spec.hostIPC) || object.spec.hostIPC == false)
      message: "hostPID and hostIPC are prohibited"
    - expression: >-
        variables.allContainers.all(c,
          !has(c.ports) ||
          c.ports.all(p, !has(p.hostPort))
        )
      message: "hostPort is prohibited"
    - expression: >-
        !has(object.spec.securityContext) ||
        !has(object.spec.securityContext.sysctls) ||
        size(object.spec.securityContext.sysctls) == 0
      message: "Custom sysctls are prohibited"
    - expression: >-
        variables.allContainers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.procMount) ||
          c.securityContext.procMount == 'Default'
        )
      message: "procMount must be Default"
    # Require explicit opt-out of kubelet's default SA-token mount.
    # Kubelet defaults to mounting a kube-apiserver-audience token when
    # the field is omitted; the workspace pod must declare its absence.
    # `has()` is required so omission is rejected, not just `== true`.
    - expression: >-
        has(object.spec.automountServiceAccountToken) &&
        object.spec.automountServiceAccountToken == false
      message: "automountServiceAccountToken must be set to false; workspace pods must not auto-mount the default kube-apiserver SA token"
