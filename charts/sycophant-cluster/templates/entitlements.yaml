{{- if include "sycophant.selfService" . }}
# One entitlement record per tenant: a ConfigMap named after the tenant whose
# `owner` key names the user allowed to create it. Only the writer below may
# create records.
apiVersion: v1
kind: Namespace
metadata:
  name: sycophant-entitlements
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: entitlement-writer
  namespace: sycophant-entitlements
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: entitlement-writer
  namespace: sycophant-entitlements
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: entitlement-writer
  namespace: sycophant-entitlements
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: entitlement-writer
    namespace: sycophant-entitlements
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: entitlement-writer
{{- end }}
