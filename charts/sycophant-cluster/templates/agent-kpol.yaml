{{- /*
The agent lifecycle: the provision-agent installer and its grant, the
uninstall-agent reactor on a reap command, and the reap of both identities'
ServiceAccounts and RoleBindings.
*/}}
{{- if include "sycophant.renderKyverno" . }}
---
{{ include "sycophant.provisionInstaller" (dict "ctx" $ "kind" "agent") }}
---
{{- /*
An agent's sub-agents go first: each sub-agent's release is named after its
ServiceAccount, which carries sycophant.md/parent.
*/}}
{{- $subAgents := `SUBS="$(kubectl get serviceaccounts -n "$TENANT" -l "sycophant.md/parent=$NAME" -o name)"
for SA in $SUBS; do
  helm uninstall "${SA#serviceaccount/}" -n "$TENANT" --timeout 10m
done` }}
{{ include "sycophant.provisionUninstaller" (dict "ctx" $ "kind" "agent" "script" (include "sycophant.provisionUninstallScript" (dict "kind" "agent" "beforeUninstall" $subAgents))) }}
---
{{ include "sycophant.provisionReap" (dict "ctx" $ "kind" "agent") }}
{{- end }}
