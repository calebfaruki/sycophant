<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 0 1160 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b3644"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/>
    </marker>
  </defs>

  <rect x="-140" y="0" width="1160" height="560" fill="#ffffff"/>

  <!-- tailnet (under the namespace wall so both borders stay visible) -->
  <rect x="4" y="148" width="330" height="140" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="16" y="168" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#626f7d">tailnet</text>

  <!-- tenant namespace (cluster boundary) -->
  <rect x="136" y="40" width="740" height="490" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="152" y="62" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#626f7d">tenant namespace</text>

  <!-- user (stacked card) -->
  <rect x="-112" y="185" width="100" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="-120" y="193" width="100" height="50" rx="8" fill="#ffffff" stroke="#2b3644" stroke-width="1.5"/>
  <g transform="translate(-102, 206) scale(0.85)"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="#2b3644"/></g>
  <text x="-74" y="224" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#2b3644">user</text>

  <line x1="-20" y1="218" x2="14" y2="218" stroke="#2b3644" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- client (stacked card, tailnet) -->
  <rect x="24" y="185" width="100" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="16" y="193" width="100" height="50" rx="8" fill="#ffffff" stroke="#2b3644" stroke-width="1.5"/>
  <text x="66" y="224" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#2b3644" text-anchor="middle">client</text>

  <line x1="116" y1="218" x2="150" y2="218" stroke="#2b3644" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- relay pod -->
  <rect x="152" y="165" width="170" height="105" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="162" y="181" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#94a3b8">pod</text>
  <rect x="167" y="198" width="140" height="40" rx="6" fill="#ffffff" stroke="#2b3644" stroke-width="1.5"/>
  <text x="237" y="223" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#2b3644" text-anchor="middle">relay-controller</text>

  <line x1="322" y1="218" x2="356" y2="218" stroke="#2b3644" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- harness pod -->
  <rect x="358" y="165" width="130" height="105" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="368" y="181" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#94a3b8">pod</text>
  <rect x="373" y="198" width="100" height="40" rx="6" fill="#ffffff" stroke="#2b3644" stroke-width="1.5"/>
  <text x="423" y="223" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#2b3644" text-anchor="middle">harness</text>

  <!-- harness -> conversation (stacked card, below) -->
  <rect x="358" y="332" width="140" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="350" y="340" width="140" height="50" rx="8" fill="#ffffff" stroke="#2b3644" stroke-width="1.5"/>
  <g transform="translate(361, 358)"><path d="M 0 3 Q 0 1 2 1 L 7 1 L 9 3 L 16 3 Q 18 3 18 5 L 18 12 Q 18 14 16 14 L 2 14 Q 0 14 0 12 Z" fill="none" stroke="#2b3644" stroke-width="1.5" stroke-linejoin="round"/></g>
  <text x="387" y="370" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#2b3644">conversation</text>
  <line x1="423" y1="270" x2="423" y2="338" stroke="#2b3644" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- three lines from harness to the capability column. -->
  <!-- local inference: direct dial, no Secret. -->
  <path d="M 488 190 L 508 190 L 508 102 L 636 102" fill="none" stroke="#2b3644" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- remote inference: straight line, own Secret. -->
  <path d="M 488 217 L 636 217" fill="none" stroke="#2b3644" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- toolset: own line, own Secret. -->
  <path d="M 488 240 L 508 240 L 508 355 L 636 355" fill="none" stroke="#2b3644" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Secret riding the remote-inference line -->
  <rect x="528" y="200" width="78" height="34" rx="8" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/>
  <circle cx="541" cy="217" r="3.5" fill="none" stroke="#b8860b" stroke-width="1.5"/>
  <line x1="544" y1="217" x2="554" y2="217" stroke="#b8860b" stroke-width="1.5"/>
  <line x1="550" y1="217" x2="550" y2="221" stroke="#b8860b" stroke-width="1.5"/>
  <line x1="554" y1="217" x2="554" y2="221" stroke="#b8860b" stroke-width="1.5"/>
  <text x="560" y="221" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8a6a00">Secret</text>

  <!-- Secret riding the toolset line -->
  <rect x="528" y="338" width="78" height="34" rx="8" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/>
  <circle cx="541" cy="355" r="3.5" fill="none" stroke="#b8860b" stroke-width="1.5"/>
  <line x1="544" y1="355" x2="554" y2="355" stroke="#b8860b" stroke-width="1.5"/>
  <line x1="550" y1="355" x2="550" y2="359" stroke="#b8860b" stroke-width="1.5"/>
  <line x1="554" y1="355" x2="554" y2="359" stroke="#b8860b" stroke-width="1.5"/>
  <text x="560" y="359" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8a6a00">Secret</text>

  <!-- local inference (top): warm ClusterIP Service, single card -->
  <rect x="640" y="78" width="176" height="48" rx="8" fill="#ffffff" stroke="#2b3644" stroke-width="1.5"/>
  <text x="648" y="94" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#94a3b8">svc</text>
  <text x="728" y="109" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#2b3644" text-anchor="middle">inference-&lt;key&gt;</text>

  <!-- remote inference job (stacked): pod > gVisor > inference-runtime -->
  <rect x="652" y="159" width="176" height="88" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="640" y="169" width="176" height="88" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="648" y="185" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#94a3b8">pod</text>
  <rect x="652" y="193" width="152" height="56" rx="6" fill="none" stroke="#626f7d" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="660" y="207" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#626f7d">gVisor</text>
  <rect x="660" y="201" width="136" height="32" rx="6" fill="#ffffff" stroke="#2b3644" stroke-width="1.5"/>
  <text x="728" y="222" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="bold" fill="#2b3644" text-anchor="middle">inference-runtime</text>

  <!-- toolset job (stacked): pod > gVisor > toolset-runtime -->
  <rect x="652" y="297" width="176" height="88" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="640" y="307" width="176" height="88" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="648" y="323" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#94a3b8">pod</text>
  <rect x="652" y="331" width="152" height="56" rx="6" fill="none" stroke="#626f7d" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="660" y="345" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#626f7d">gVisor</text>
  <rect x="660" y="339" width="136" height="32" rx="6" fill="#ffffff" stroke="#2b3644" stroke-width="1.5"/>
  <text x="728" y="360" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="bold" fill="#2b3644" text-anchor="middle">toolset-runtime</text>

  <!-- both credentialed jobs egress out of the cluster boundary -->
  <line x1="820" y1="217" x2="903" y2="217" stroke="#2b3644" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="355" x2="903" y2="355" stroke="#2b3644" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="905" y="195" width="90" height="182" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <g stroke="#2b3644" stroke-width="1.4" fill="none">
    <circle cx="950" cy="272" r="9"/>
    <ellipse cx="950" cy="272" rx="4" ry="9"/>
    <line x1="941" y1="272" x2="959" y2="272"/>
  </g>
  <text x="950" y="302" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#2b3644" text-anchor="middle">egress</text>

  <!-- toolset -> workspace (stacked card, below) -->
  <rect x="666" y="430" width="140" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="658" y="438" width="140" height="50" rx="8" fill="#ffffff" stroke="#2b3644" stroke-width="1.5"/>
  <g transform="translate(669, 456)"><path d="M 0 3 Q 0 1 2 1 L 7 1 L 9 3 L 16 3 Q 18 3 18 5 L 18 12 Q 18 14 16 14 L 2 14 Q 0 14 0 12 Z" fill="none" stroke="#2b3644" stroke-width="1.5" stroke-linejoin="round"/></g>
  <text x="695" y="468" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#2b3644">workspace</text>
  <line x1="728" y1="395" x2="728" y2="436" stroke="#2b3644" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
