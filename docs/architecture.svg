<svg xmlns="http://www.w3.org/2000/svg" viewBox="-140 0 1120 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b3644"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b8860b"/>
    </marker>
  </defs>

  <rect x="-140" y="0" width="1120" height="400" fill="#ffffff"/>

  <!-- tailnet (under the namespace wall so both borders stay visible) -->
  <rect x="4" y="108" width="330" height="140" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="16" y="128" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#626f7d">tailnet</text>

  <!-- tenant namespace -->
  <rect x="136" y="30" width="812" height="340" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="152" y="52" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#626f7d">tenant namespace</text>

  <!-- user (stacked card) -->
  <rect x="-112" y="145" width="100" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="-120" y="153" width="100" height="50" rx="8" fill="#ffffff" stroke="#2b3644" stroke-width="1.5"/>
  <g transform="translate(-102, 166) scale(0.85)"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="#2b3644"/></g>
  <text x="-74" y="184" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#2b3644">user</text>

  <line x1="-20" y1="178" x2="14" y2="178" stroke="#2b3644" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- client (stacked card, tailnet) -->
  <rect x="24" y="145" width="100" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="16" y="153" width="100" height="50" rx="8" fill="#ffffff" stroke="#2b3644" stroke-width="1.5"/>
  <text x="66" y="184" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#2b3644" text-anchor="middle">client</text>

  <line x1="116" y1="178" x2="150" y2="178" stroke="#2b3644" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- relay pod -->
  <rect x="152" y="125" width="170" height="105" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="162" y="141" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#94a3b8">pod</text>
  <rect x="167" y="158" width="140" height="40" rx="6" fill="#ffffff" stroke="#2b3644" stroke-width="1.5"/>
  <text x="237" y="183" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#2b3644" text-anchor="middle">relay-controller</text>

  <line x1="322" y1="178" x2="356" y2="178" stroke="#2b3644" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- harness pod -->
  <rect x="358" y="125" width="130" height="105" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="368" y="141" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#94a3b8">pod</text>
  <rect x="373" y="158" width="100" height="40" rx="6" fill="#ffffff" stroke="#2b3644" stroke-width="1.5"/>
  <text x="423" y="183" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#2b3644" text-anchor="middle">harness</text>

  <line x1="488" y1="178" x2="522" y2="178" stroke="#2b3644" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- harness -> conversation (stacked card, below) -->
  <rect x="358" y="292" width="140" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="350" y="300" width="140" height="50" rx="8" fill="#ffffff" stroke="#2b3644" stroke-width="1.5"/>
  <g transform="translate(361, 318)"><path d="M 0 3 Q 0 1 2 1 L 7 1 L 9 3 L 16 3 Q 18 3 18 5 L 18 12 Q 18 14 16 14 L 2 14 Q 0 14 0 12 Z" fill="none" stroke="#2b3644" stroke-width="1.5" stroke-linejoin="round"/></g>
  <text x="387" y="330" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#2b3644">conversation</text>
  <line x1="423" y1="230" x2="423" y2="298" stroke="#2b3644" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- toolset-controller pod -->
  <rect x="524" y="125" width="180" height="105" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="534" y="141" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#94a3b8">pod</text>
  <rect x="539" y="158" width="150" height="40" rx="6" fill="#ffffff" stroke="#2b3644" stroke-width="1.5"/>
  <text x="614" y="183" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#2b3644" text-anchor="middle">toolset-controller</text>

  <line x1="704" y1="178" x2="738" y2="178" stroke="#2b3644" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- tool pod (stacked): pod > gVisor > container -->
  <rect x="752" y="113" width="180" height="105" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="740" y="125" width="180" height="105" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="748" y="141" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#94a3b8">pod</text>
  <rect x="752" y="150" width="156" height="70" rx="6" fill="none" stroke="#626f7d" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="760" y="164" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#626f7d">gVisor</text>
  <rect x="760" y="177" width="140" height="36" rx="6" fill="#ffffff" stroke="#2b3644" stroke-width="1.5"/>
  <text x="830" y="200" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#2b3644" text-anchor="middle">toolset-runtime</text>

  <!-- credential path (Secret > runtime) -->
  <rect x="790" y="44" width="80" height="36" rx="8" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/>
  <circle cx="802" cy="62" r="3.5" fill="none" stroke="#b8860b" stroke-width="1.5"/>
  <line x1="805" y1="62" x2="815" y2="62" stroke="#b8860b" stroke-width="1.5"/>
  <line x1="811" y1="62" x2="811" y2="66" stroke="#b8860b" stroke-width="1.5"/>
  <line x1="815" y1="62" x2="815" y2="66" stroke="#b8860b" stroke-width="1.5"/>
  <text x="821" y="66" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8a6a00">Secret</text>

  <!-- toolset-controller binds the Secret to the runtime -->
  <path d="M 660 123 L 660 70 Q 660 62 668 62 L 784 62" fill="none" stroke="#2b3644" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="830" y1="80" x2="830" y2="173" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-gold)"/>

  <!-- tool pod -> workspace (stacked card, below) -->
  <rect x="768" y="292" width="140" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="760" y="300" width="140" height="50" rx="8" fill="#ffffff" stroke="#2b3644" stroke-width="1.5"/>
  <g transform="translate(771, 318)"><path d="M 0 3 Q 0 1 2 1 L 7 1 L 9 3 L 16 3 Q 18 3 18 5 L 18 12 Q 18 14 16 14 L 2 14 Q 0 14 0 12 Z" fill="none" stroke="#2b3644" stroke-width="1.5" stroke-linejoin="round"/></g>
  <text x="797" y="330" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#2b3644">workspace</text>
  <line x1="830" y1="230" x2="830" y2="298" stroke="#2b3644" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
