controller:
  image: tightbeam-controller
  tag: local
  pullPolicy: Never
  llmJobImage: tightbeam-llm-job:local

airlock:
  image: airlock-controller
  tag: local
  pullPolicy: Never

transponder:
  image: sycophant-transponder
  tag: local
  pullPolicy: Never

mainframe:
  image: mainframe-controller
  tag: local
  pullPolicy: Never
  refreshIntervalSeconds: 30

workspaces:
  # Both workspaces mount their mainframe content at /etc/mainframe.
  # Layer 1-3 e2e uses HostPath. SaaS Layer 4 uses S3 (Versitygw).
  # cpu/memory sized for a local Docker Desktop budget; the runtime is a
  # thin Rust transponder fronting a remote LLM, not a heavyweight process.
  hello-world:
    image: sycophant-mainframe-runtime
    tag: local
    pullPolicy: Never
    cpu: "0.5"
    memory: "512Mi"
    mainframe:
      kind: HostPath
      hostPath:
        path: /Users/calebfaruki/sycophant/tmp/hello-world-data
    chambers:
      - workspace-ro
      - ssh-credentials
  multi-agent:
    image: sycophant-mainframe-runtime
    tag: local
    pullPolicy: Never
    cpu: "0.5"
    memory: "512Mi"
    mainframe:
      kind: HostPath
      hostPath:
        path: /Users/calebfaruki/sycophant/tmp/multi-agent-data
    chambers:
      - workspace-ro

# Layer 2 (tailnet bridge) is opt-in. Default e2e runs Layer 1 only.
# To enable, uncomment the blocks below AND pass them via --set or by
# adding them at runtime (so the default e2e flow stays unchanged).
#
# headscale:
#   enabled: true
#   serverUrl: https://hs.example.com   # operator-owned domain, port-forwarded
#
# tsnetBridge:
#   enabled: true
#   loginServer: https://hs.example.com
#   # authKeySecret defaults to tightbeam-tsnet-authkey — operator
#   # pre-creates this per Step 2.
