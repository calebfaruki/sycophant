# The e2e pre-creates + labels $NAMESPACE itself (step_2/step_3), so the chart
# installs into the existing ns rather than creating it (the SaaS deployer path).
namespace:
  create: false

# Images use the chart defaults (local builds, pullPolicy: Never) — no override
# needed here. Only the genuinely-different e2e settings remain below.

# workspaceInit: toolset-git is pushed to the in-cluster registry
# (sycophant-registry:5000) by e2e.sh (~line 279-281), NOT imported into
# the nodes -- so the kubelet must pull it. pullPolicy IfNotPresent (Never
# would fail because the image is not present on the node).
workspaceInit:
  image: sycophant-registry:5000/toolset-git
  tag: latest
  pullPolicy: IfNotPresent

# Toolsets are chart values now, not CRs. e2e.sh overrides each `image` with the
# local-registry digest via --set-string, so only the shape lives here.
toolsets:
  stdlib:
    keepalive: true
  workspace-ro: {}
  # keepalive so the grant-bearing pod lingers for the e2e credential
  # assertions (exec into the live pod).
  ssh-credentials:
    keepalive: true

# The turn server. Its profile key is the turn's `model` value -- here the model
# the hello-world agent requests. It is not a `toolsets` entry and no
# workspace binds it.
#
# Two profiles run side by side. `deepseek-v4-flash` is the external vendor and
# carries a `secret`; keeping it in the run is the check that tightening the
# egress derivation to a single host did not break a real provider. `local`
# points at the in-cluster inference Service below, carries no secret (the engine
# needs no API key), and its baseUrl host is the bare `inference-local` form the
# destination helper accepts.
prompt:
  profiles:
    deepseek-v4-flash:
      image: prompt-toolset:local
      format: openai
      model: deepseek/deepseek-v4-flash
      baseUrl: https://openrouter.ai/api/v1
      secret: sycophant-llm-openrouter
    local:
      image: prompt-toolset:local
      format: openai
      model: local
      baseUrl: http://inference-local:8080/v1

# The in-cluster inference server for the `local` profile above. Its presence is
# what makes that profile's baseUrl resolve to a Service instead of an external
# name, and it renders the llama.cpp Deployment, its ClusterIP Service, the pod's
# ingress fence, and the prompt job's in-cluster egress hole. Both images are
# local builds (scripts/e2e.sh Step 1) imported into k3d.
#
# weightsDelivery: copy is the default and the only path this cluster clears: the
# k3d k3s image is not pinned, so the kubelet image-volume floor cannot be
# assumed. singleNodeException: true drops the workload node selector and
# toleration because this run has one unlabeled node, so inference and toolset
# pods must share it.
inference:
  local:
    image: llama-server:local
    weights: weights:local
    weightsPath: /weights/model.gguf
    weightsDelivery: copy
    singleNodeException: true
    # Qwen3-1.7B (Q4_K_M, ~1.2 GB) fits the footprint; llama.cpp parses its
    # tool template natively, so no override.
    memory: 1024Mi
    cpu: 2
    threads: 2
    contextBudget: 8192
    slots: 1
    outputCap: 512
    # Greedy decoding so the model reproduces the scrubbed tool output verbatim
    # instead of rewording it — the demo's redaction proof rides the reply text.
    temp: 0

# The hello-world kernel content is authored out-of-band on the read-only
# volume (see scripts/e2e.sh), delivered by the per-workspace hostPath PV the
# harness mounts. Its node-side location is driven by chart values
# (harness.kernels.hostPathBase + this workspaces block), not a Kernel CR.
workspaces:
  hello-world:
    toolsets:
      - stdlib
      - workspace-ro
      # Two grants under one (workspace, toolset) pair. `demo-key` is
      # secret-only: it delivers the key where ssh expects it and opens no
      # network hole, so no per-grant policy renders and a job holding it stays
      # on the fail-closed baseline floor. `github` declares a destination and
      # no path, so it renders a per-grant policy and lands at the convention
      # target. A policy selects only a pod carrying its grant label, so neither
      # opens anything until a call selects it. `github` exists to exercise the
      # policy render path; the rendered policy opens port 443 only, so it is
      # not a working git-over-ssh credential.
      - name: ssh-credentials
        grants:
          demo-key:
            secret: demo-ssh-key
            path: /home/agent/.ssh/id_ed25519
          github:
            secret: demo-ssh-key
            egress: github.com

# In-cluster headscale, ACME off, so it serves plain HTTP on :8080. The
# operator reaches it by port-forward; the app adapter reaches it at the
# Service DNS name.
headscale:
  enabled: true
  serverUrl: http://localhost:8080
  acme:
    enabled: false

# The app channel. Presence in this map is the enable signal; the entry
# renders the adapter Deployment, its ServiceAccount, its egress policy, and
# the relay's app-port ingress rule. scripts/e2e.sh mints the pre-auth key
# into `relay-tsnet-authkey` after headscale is Available.
#
# loginServer is set explicitly: the chart has no in-cluster default.
channels:
  app:
    kind: app
    loginServer: http://headscale:8080
