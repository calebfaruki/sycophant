# The e2e pre-creates + labels $NAMESPACE itself (step_2/step_3), so the chart
# installs into the existing ns rather than creating it (the SaaS deployer path).
namespace:
  create: false

# Images use the chart defaults (local builds, pullPolicy: Never) — no override
# needed here. Only the genuinely-different e2e settings remain below.

# workspaceInit: toolset-git is pushed to the in-cluster registry
# (sycophant-registry:5000) by e2e.sh (~line 279-281), NOT imported into
# the nodes -- so the kubelet must pull it. pullPolicy IfNotPresent (Never
# would fail because the image is not present on the node).
workspaceInit:
  image: sycophant-registry:5000/toolset-git
  tag: latest
  pullPolicy: IfNotPresent

# Toolsets are chart values now, not CRs. e2e.sh overrides each `image` with the
# local-registry digest via --set-string, so only the shape lives here.
#
# `prompt` is the one parameterized toolset: its profile key is the turn's
# `model` value. `default` matches the model the hello-world persona requests.
toolsets:
  stdlib:
    keepalive: true
    profiles:
      stdlib: {}
  workspace-ro:
    profiles:
      workspace-ro: {}
  ssh-credentials:
    profiles:
      ssh-credentials:
        secrets:
          - secret: demo-ssh-key
            file: /home/agent/.ssh/id_ed25519
  prompt:
    image: prompt-toolset:local
    profiles:
      deepseek-v4-flash:
        secrets:
          - secret: sycophant-llm-openrouter
            file: /run/secrets/toolset/api-key
        egress:
          - { domain: openrouter.ai, port: 443 }
        TOOLSET_FORMAT: openai
        TOOLSET_MODEL: deepseek/deepseek-v4-flash
        TOOLSET_BASE_URL: https://openrouter.ai/api/v1

# The hello-world kernel content is authored out-of-band on the read-only
# volume (see scripts/e2e.sh), delivered by the per-workspace hostPath PV the
# harness mounts. Its node-side location is driven by chart values
# (harness.kernels.hostPathBase + this workspaces block), not a Kernel CR.
workspaces:
  hello-world:
    toolsets:
      - stdlib
      - workspace-ro
      - ssh-credentials

# Layer 2 (tailnet bridge) is opt-in. Default e2e runs Layer 1 only.
# To enable, uncomment the blocks below AND pass them via --set or by
# adding them at runtime (so the default e2e flow stays unchanged).
#
# headscale:
#   enabled: true
#   serverUrl: https://hs.example.com   # operator-owned domain, port-forwarded
#
# tsnetBridge:
#   enabled: true
#   loginServer: https://hs.example.com
#   # authKeySecret defaults to relay-tsnet-authkey — operator
#   # pre-creates this per Step 2.
