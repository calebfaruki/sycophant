controller:
  image: tightbeam-controller
  tag: local
  pullPolicy: Never
  llmJobImage: tightbeam-llm-job:local

airlock:
  image: airlock-controller
  tag: local
  pullPolicy: Never

transponder:
  image: sycophant-transponder
  tag: local
  pullPolicy: Never

mainframe:
  image: mainframe-controller
  tag: local
  pullPolicy: Never
  refreshIntervalSeconds: 30

workspaces:
  # Both workspaces mount their `instructions:` host directory directly at
  # /etc/mainframe via a Kubernetes hostPath volume (per ADR 010). v0
  # source kind is HostPath only.
  hello-world:
    image: sycophant-mainframe-runtime
    tag: local
    pullPolicy: Never
    instructions: /Users/calebfaruki/sycophant/tmp/hello-world-data
    chambers:
      - workspace-ro
      - ssh-secret
  multi-agent:
    image: sycophant-mainframe-runtime
    tag: local
    pullPolicy: Never
    instructions: /Users/calebfaruki/sycophant/tmp/multi-agent-data
    chambers:
      - workspace-ro

chambers:
  workspace-ro:
    image: sycophant-registry:5000/airlock-git:latest
  ssh-secret:
    image: sycophant-registry:5000/airlock-ssh:latest

providers:
  anthropic:
    format: anthropic
    baseUrl: https://api.anthropic.com/v1
    secret:
      name: sycophant-llm-anthropic
  mistral:
    format: openai
    baseUrl: https://api.mistral.ai/v1
    secret:
      name: sycophant-llm-mistral

models:
  # default aliased to Haiku for the e2e (Mistral hit a tier-capacity limit
  # during testing). When Mistral capacity returns, swap default back to
  # Mistral or expose both via a separate alias.
  default:
    providerRef: { name: anthropic }
    model: claude-haiku-4-5-20251001
  mistral.small:
    providerRef: { name: mistral }
    model: mistral-small-latest
  anthropic.claude-haiku-4-5-20251001:
    providerRef: { name: anthropic }
    model: claude-haiku-4-5-20251001
  anthropic.claude-sonnet-4-20250514:
    providerRef: { name: anthropic }
    model: claude-sonnet-4-20250514

# Layer 2 (tailnet bridge) is opt-in. Default e2e runs Layer 1 only.
# To enable, uncomment the blocks below AND pass them via --set or by
# adding them at runtime (so the default e2e flow stays unchanged).
#
# headscale:
#   enabled: true
#   serverUrl: https://hs.example.com   # operator-owned domain, port-forwarded
#
# tsnetBridge:
#   enabled: true
#   loginServer: https://hs.example.com
#   # authKeySecret + bearerTokenSecret default to tightbeam-tsnet-authkey
#   # and tightbeam-bearer-auth — operator pre-creates these per Step 2.
