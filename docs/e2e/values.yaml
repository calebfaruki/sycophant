controller:
  image: tightbeam-controller
  tag: local
  pullPolicy: Never
  llmJobImage: tightbeam-llm-job:local

airlock:
  image: airlock-controller
  tag: local
  pullPolicy: Never

transponder:
  image: sycophant-transponder
  tag: local
  pullPolicy: Never

mainframe:
  image: mainframe-controller
  tag: local
  pullPolicy: Never
  refreshIntervalSeconds: 30

workspaces:
  hello-world:
    kernel:
      kind: HostPath
      hostPath:
        path: /Users/calebfaruki/sycophant/tmp/hello-world-data
    chambers:
      - stdlib
      - workspace-ro
      - ssh-credentials
  multi-agent:
    kernel:
      kind: HostPath
      hostPath:
        path: /Users/calebfaruki/sycophant/tmp/multi-agent-data
    chambers:
      - stdlib
      - workspace-ro

# Layer 2 (tailnet bridge) is opt-in. Default e2e runs Layer 1 only.
# To enable, uncomment the blocks below AND pass them via --set or by
# adding them at runtime (so the default e2e flow stays unchanged).
#
# headscale:
#   enabled: true
#   serverUrl: https://hs.example.com   # operator-owned domain, port-forwarded
#
# tsnetBridge:
#   enabled: true
#   loginServer: https://hs.example.com
#   # authKeySecret defaults to tightbeam-tsnet-authkey — operator
#   # pre-creates this per Step 2.
