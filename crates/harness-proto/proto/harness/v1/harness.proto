syntax = "proto3";
package harness.v1;

import "sycophant/common/v1/common.proto";

// --- Harness control service ---
//
// The harness (per-agent loop) exposes an in-cluster gRPC surface
// that relay-controller forwards client calls to: the tool catalog,
// client tool calls, and the agent's one conversation (history, turn
// cancel, take-back, clear, compact).
//
// Authentication is structural: NetworkPolicy admits relay-controller
// alone to this port.

service HarnessControl {
  // Sends the current catalog once; the stream then stays open. Call again
  // to see a later change.
  rpc WatchTools (sycophant.common.v1.WatchToolsRequest) returns (stream sycophant.common.v1.ToolListUpdate);

  // --- Client-driven tool-call lifecycle (dispatch / await / cancel) ---

  // Dispatch a tool and return its server-minted call_id immediately, before
  // the result resolves, so the caller has a name to await and cancel by.
  rpc DispatchTool (sycophant.common.v1.CallToolRequest) returns (sycophant.common.v1.DispatchToolResponse);

  // Subscribe to a dispatched call's typed output frames by call_id. Streams
  // stdout / stderr / image frames terminating in one ToolComplete, re-servable
  // from the persisted record after a dropped stream.
  rpc AwaitToolResult (sycophant.common.v1.AwaitToolResultRequest) returns (stream sycophant.common.v1.ToolResultFrame);

  // Cancel an in-flight call by call_id. Reports whether a call was canceled;
  // an unknown or already-finished id cancels nothing.
  rpc CancelTool (sycophant.common.v1.CancelToolRequest) returns (sycophant.common.v1.CancelToolResponse);

  // --- The agent's one conversation ---
  //
  // The harness is the only author of the agent's conversation log. The
  // relay gateway forwards these person-initiated calls into the harness.

  // Read the tail of the agent's current conversation window. Backs the
  // read-side history view in clients.
  rpc GetConversationHistory (sycophant.common.v1.GetConversationHistoryRequest) returns (sycophant.common.v1.GetConversationHistoryResponse);

  // Local stop of the agent's running turn: fire its cancellation token,
  // which abandons the LLM stream and cancels the turn's running toolset
  // call; the turn ends CANCELLED. The queue is untouched.
  rpc CancelTurn (sycophant.common.v1.CancelTurnRequest) returns (sycophant.common.v1.CancelTurnResponse);

  // Remove the newest queued message whose sender is the request's sender
  // and return its content. Never removes another sender's message or the
  // running turn's message.
  rpc TakeBackMessage (sycophant.common.v1.TakeBackMessageRequest) returns (sycophant.common.v1.TakeBackMessageResponse);

  // Empty the conversation log in place; a clear makes no archive.
  rpc ClearContext (sycophant.common.v1.ClearContextRequest) returns (sycophant.common.v1.ClearContextResponse);

  // Summarize the current window with the agent's model, rotate the
  // conversation log, and start the new window with the summary.
  rpc CompactContext (sycophant.common.v1.CompactContextRequest) returns (sycophant.common.v1.CompactContextResponse);
}

// --- Dispatch link ---
//
// A dispatch (a sub-agent pod) serves this on 9092. Its parent agent's harness
// attaches to carry the dispatch's approval requests to people and to take its
// final answer.
service DispatchLink {
  rpc Attach (stream ParentFrame) returns (stream DispatchFrame);
}

message DispatchFrame {
  oneof frame {
    sycophant.common.v1.SendServerRequestAndAwaitRequest request = 1;
    string final_answer = 2;
  }
}

message ParentFrame {
  oneof frame {
    sycophant.common.v1.SendServerRequestAndAwaitResponse response = 1;
    bool answer_taken = 2;
    // A message for the sub-agent's running turn.
    string message = 3;
    // End the sub-agent's harness.
    bool stop = 4;
  }
}
