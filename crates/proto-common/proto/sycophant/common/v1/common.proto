syntax = "proto3";
package sycophant.common.v1;

option go_package = "github.com/sycophant-md/sycophant/cmd/syco/internal/proto/sycophant/common/v1";

// --- Core types ---

message ContentBlock {
  oneof block {
    TextBlock text = 1;
    ImageBlock image = 2;
    ThinkingBlock thinking = 3;
    FileBlock file = 4;
  }
}

message FileBlock {
  string filename = 1;
  string mime_type = 2;
  uint64 size = 3;
}

message TextBlock {
  string text = 1;
}

message ImageBlock {
  string media_type = 1;
  bytes data = 2;
}

message ThinkingBlock {
  string text = 1;
}

message ToolDefinition {
  string name = 1;
  string description = 2;
  string parameters_json = 3;
}

message ToolCall {
  string id = 1;
  string name = 2;
  string input_json = 3;
}

message Message {
  string role = 1;
  repeated ContentBlock content = 2;
  repeated ToolCall tool_calls = 3;
  optional string tool_call_id = 4;
  optional bool is_error = 5;
}

enum StopReason {
  STOP_REASON_UNSPECIFIED = 0;
  END_TURN = 1;
  TOOL_USE = 2;
  MAX_TOKENS = 3;
}

// --- Conversation lifecycle ---

message MintConversationRequest {
  // Opaque owner key stamped on the conversation at mint. The harness
  // never parses it, never derives authorization from it, and never learns
  // what it names; it is an equality key. Authorization stays at the relay.
  string owner = 1;
  // The agent this conversation is minted in. The relay authorizes it
  // against the caller's live reach before forwarding.
  string agent = 2;
}

message MintConversationResponse {
  string conversation_id = 1;
}

message ListConversationsRequest {
  // Agent whose conversations should be listed. Authentication's
  // agent claim is what's actually checked by the verifier, so this
  // field is for clarity / future cross-agent patterns.
  string agent = 1;
  // Opaque owner key. Only conversations stamped with this owner are
  // returned.
  string owner = 2;
}

message ListConversationsResponse {
  reserved 1;
  reserved "conversation_ids";
  // Unordered. Clients render their own ordering (alpha, locally tracked
  // MRU, etc.); server does not impose one.
  repeated ConversationSummary conversations = 2;
}

message ConversationSummary {
  string conversation_id = 1;
  // Unix epoch milliseconds. 0 = never touched (newly minted, no
  // messages yet). Not persisted across controller restart.
  int64 last_touched_ms_epoch = 2;
  // User-facing name. Defaults to a short id-derived stub at mint; user
  // may rename via SetConversationName. Persisted on the controller PVC.
  string name = 3;
  // Opaque owner key stamped at mint.
  string owner = 4;
}

message DeleteConversationRequest {
  string conversation_id = 1;
  // The agent the conversation lives in.
  string agent = 2;
}

message DeleteConversationResponse {}

message SetConversationNameRequest {
  string conversation_id = 1;
  string name = 2;
  // The agent the conversation lives in.
  string agent = 3;
}

message SetConversationNameResponse {}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated string agents = 1;
}

// The grants the caller's agent may select from, grouped by
// toolset. Names only — the relay never reads a Secret.
message ListGrantsRequest {
  // Required; empty is InvalidArgument. Authorized by a review of the
  // caller's subject against this agent.
  string agent = 1;
}

message ToolsetGrants {
  string toolset = 1;
  repeated string grants = 2;
}

message ListGrantsResponse {
  repeated ToolsetGrants toolsets = 1;
}

// --- Channel stream I/O ---

message ChannelStreamAck {
  // Server-minted opaque UUID. Echo on every ChannelStreamIngest; valid only
  // within the lifetime of the originating ChannelStreamReceive
  // response stream.
  string channel_stream_id = 1;
}

message ChannelStreamOutbound {
  oneof command {
    ChannelStreamAck ack = 1;
    ChannelStreamSend send_message = 2;
    TurnStateEvent turn_state = 3;
    ServerRequest server_request = 4;
    StreamItem stream_item = 5;
    Heartbeat heartbeat = 7;
  }
  reserved 6, 8, 9;
  reserved "catch_up_complete", "replay_impossible";
}

// Periodic liveness signal, sent on every channel stream at the relay's heartbeat interval.
message Heartbeat {
  reserved 1;
}

// --- Streamed activity items (client-harness protocol, first slice) ---
//
// Carries one class of live turn activity — streamed text and tool calls —
// from the harness to the client as it is produced, instead of a single
// terminal reply. A top-level ChannelStreamOutbound variant (not nested in the
// reply). Each item's start/delta/stop frames share `item_id`; every frame
// carries an `event_id`. Streaming-only: not persisted as individual log
// events.
message StreamItem {
  reserved 1;
  // Stable per frame.
  string event_id = 2;
  // Shared across an item's start / delta / stop frames.
  string item_id = 3;
  // Conversation this item belongs to; lets the client filter against the
  // conversation it is currently viewing.
  string conversation_id = 4;
  oneof phase {
    ItemStart start = 5;
    ItemDelta delta = 6;
    ItemStop stop = 7;
  }
  // Present only on frames from a dispatched sub-agent turn; carries the
  // PARENT conversation id so the client groups this item under its parent.
  // Empty/absent on top-level turns.
  string parent_conversation_id = 8;
  // Operator-authored sub-agent name (e.g. "poet"), stamped on every frame
  // from a dispatched sub-agent turn so the client labels the tile with it.
  // Empty/absent on top-level turns.
  string agent_name = 9;
}

message ItemStart {
  oneof kind {
    TextItem text = 1;
    ToolUseItem tool_use = 2;
  }
}

message TextItem {}

message ToolUseItem {
  string name = 1;
}

message ItemDelta {
  oneof kind {
    string text_delta = 1;
    string tool_input_json = 2;
  }
}

message ItemStop {}

message ChannelStreamSend {
  repeated ContentBlock content = 1;
  // Conversation this reply belongs to. Lets the client filter outbound
  // frames against whichever conversation it is currently viewing.
  string conversation_id = 2;
}

// Streaming turn-lifecycle phase. The controller pushes this to every
// ChannelStreamReceive subscriber so clients can render a "working" indicator
// without polling or per-tool detail. Sending (between user submit and
// the controller's ChannelStreamIngest ack) stays purely client-side; only
// WORKING and IDLE are server-pushed today.
message TurnStateEvent {
  TurnState state = 1;
  // Conversation this state transition belongs to. Empty string is
  // reserved for stream-wide replay frames emitted on (re)connect —
  // clients should treat empty as "no conversation context" and skip
  // the per-conversation indicator update.
  string conversation_id = 2;
  // Human-readable failure reason; set only when state == FAILED.
  string reason = 3;
  // Machine-readable failure code (e.g. gRPC status code as a string);
  // set only when state == FAILED.
  string code = 4;
  // Agent identity for this turn. Set on the harness-emitted turn-start
  // frame; absent on gateway-set WORKING and on replay frames.
  string agent_name = 5;
  string system_prompt_sha256 = 6;
}

enum TurnState {
  TURN_STATE_UNSPECIFIED = 0;
  // No active turn. Default for fresh channel streams; emitted after the
  // assistant message persists.
  TURN_STATE_IDLE = 1;
  // Turn is in flight on the cluster: controller enqueued the user
  // message, harness loop is running.
  TURN_STATE_WORKING = 2;
  // Reserved (comment-only, not proto `reserved` since these slots are
  // free):
  //   3 — THINKING; derived from content-delta forwarding.
  //   4 — STOPPING; paired with cancel/interrupt RPC.
  // Turn ended in failure (inference job reaped/crashed, idle-timeout, or a
  // TurnError). Carries a reason/code on TurnStateEvent. Distinct from
  // IDLE so the client can show an actionable error and re-enable input.
  TURN_STATE_FAILED = 5;
  // Turn was cancelled by the client (local stop). Terminal, like FAILED,
  // but not an error — client re-enables input without an error banner.
  TURN_STATE_CANCELLED = 6;
}

// UserMessage is the canonical "user said something" event. Flows from
// the relay gateway to the harness. `reply_channel_stream` is the
// server-minted channel_stream_id (UUID) stamped by the gateway after
// ChannelStreamIngest message ingress. Opaque to clients;
// only valid within the lifetime of the originating ChannelStreamReceive
// stream.
message UserMessage {
  repeated ContentBlock content = 1;
  string sender = 2;
  optional string reply_channel_stream = 3;
  // Conversation this message belongs to. Stamped by the relay gateway
  // at ingest time (caller may supply via ChannelStreamIngestRequest, or the
  // gateway mints a fresh id). The harness reads this verbatim
  // when constructing the TurnRequest — it never mints conversation
  // ids on its own anymore.
  string conversation_id = 4;
  // Credential grants the human selected for this message's turn. The
  // harness injects the matching grant into each tool call it dispatches
  // to that toolset; the model never authors the selection. Selections
  // are per-toolset because grant names are unique only within one.
  repeated GrantSelection grants = 5;
}

// One human-selected credential grant, scoped to one toolset.
message GrantSelection {
  string toolset = 1;
  string grant = 2;
}

// --- Conversation history ---

message GetConversationHistoryRequest {
  // Conversation to read; must belong to the agent the request names.
  string conversation_id = 1;
  // Max number of recent entries to return. Server clamps to a sane
  // ceiling; 0 / unset → server default (~50).
  optional uint32 limit = 2;
  // Opaque owner key. The conversation must carry this owner.
  string owner = 3;
  // The agent the conversation lives in.
  string agent = 4;
}

message GetConversationHistoryResponse {
  // Recent entries in oldest-to-newest order (tail of the log).
  repeated HistoryEntry entries = 1;
  // Total log length at snapshot time. Lets the caller see if it
  // received a truncated view.
  uint64 total_seq = 2;
  // True when `limit` clipped the head of the log.
  bool truncated = 3;
}

message HistoryEntry {
  // 1-indexed sequence in the conversation log.
  uint64 seq = 1;
  // RFC 3339 timestamp from when the entry was appended.
  string ts = 2;
  // The persisted message — role, content blocks, tool calls, etc.
  Message message = 3;
  // Scope tag if present (e.g., "delegate:<correlation_id>").
  optional string tag = 4;
}

message GetTurnStateRequest {
  string conversation_id = 1;
  // The agent the conversation lives in.
  string agent = 2;
}

// Client-initiated local stop of the in-flight turn for this conversation.
// Keyed by conversation_id (one turn in flight per conversation).
message CancelTurnRequest {
  string conversation_id = 1;
  // The agent the conversation lives in.
  string agent = 2;
}

message CancelTurnResponse {
  // False if no turn was in flight.
  bool cancelled = 1;
}

// --- Tool dispatch ---

message WatchToolsRequest {
  // The agent whose tool catalog this stream watches.
  string agent = 1;
}

message ToolListUpdate {
  repeated ToolInfo tools = 1;
}

message ToolInfo {
  string name = 1;
  string description = 2;
  string parameters_json = 3;
  // Toolset this tool belongs to. The harness needs it to match a
  // message's grant selections to the calls they cover.
  string toolset = 4;
}

message CallToolRequest {
  string name = 1;
  string input_json = 2;
  // Conversation this tool call attaches to. The caller (a client for an
  // app-run dispatch, the harness for a model-run call) supplies
  // its active conversation; the harness records the call's frames in
  // that conversation's execution log. Empty is accepted: a
  // conversation-less app call streams live but persists no per-conversation
  // record. A non-empty id must have been minted by the caller's subject.
  string conversation_id = 3;
  // The agent the call runs in. The relay authorizes it against the
  // caller's live reach before forwarding.
  string agent = 4;
}

message CallToolResponse {
  repeated ContentBlock content = 1;
  bool is_error = 2;
}

// How a tool call ended. The runtime is the only party that can tell a
// user cancel from a timeout from a genuine non-zero exit, so it stamps one
// of these on the terminal frame. Every downstream error state is derived as
// `outcome != DONE`, so error and outcome can never contradict. Mirrors
// TurnState's terminal split (FAILED / CANCELLED), with one L on CANCELED.
enum ToolOutcome {
  TOOL_OUTCOME_UNSPECIFIED = 0;
  // Clean exit (exit code 0). The only non-error outcome.
  TOOL_OUTCOME_DONE = 1;
  // A genuine non-zero exit, an image-reference failure, or a timeout —
  // every non-cancel failure folds here.
  TOOL_OUTCOME_FAILED = 2;
  // A user cancel killed the child. Terminal but not an error: the killed
  // child still reports the -1 sentinel exit, only the outcome distinguishes it.
  TOOL_OUTCOME_CANCELED = 3;
}

// One typed frame of a tool call's streamed output. The runtime emits an
// ordered sequence of these — stdout / stderr / image — terminating in exactly
// one ToolComplete. stdout and image form the model-facing result; stderr is
// excluded from it (kept for the execution log, and surfaced only on a
// survived non-zero exit).
message ToolResultFrame {
  oneof frame {
    string stdout = 1;      // scrubbed, image-markers removed
    string stderr = 2;      // scrubbed
    ImageBlock image = 3;   // assembled toolset-side
    ToolComplete complete = 4;  // terminal
  }
}

message ToolComplete {
  ToolOutcome outcome = 1;
  int32 exit_code = 2;
}

// Dispatch response: the server-minted call_id the client cancels by and
// awaits the result on, returned before the call resolves.
message DispatchToolResponse {
  string call_id = 1;
}

message AwaitToolResultRequest {
  string call_id = 1;
  // The owning conversation, so a persisted re-subscribe opens one
  // execution.json instead of scanning. Empty for a conversation-less
  // call, which persists nothing.
  string conversation_id = 2;
  // The agent the call runs in.
  string agent = 3;
}

message CancelToolRequest {
  string call_id = 1;
}

message CancelToolResponse {
  // False if no in-flight call matched the call_id.
  bool cancelled = 1;
}

// --- External channel-stream RPCs ---

message ChannelStreamIngestRequest {
  // The channel_stream_id received as the first frame on the ChannelStreamReceive
  // response stream. Server-minted; opaque to clients.
  string channel_stream_id = 1;
  // The user's message payload. The agent comes from the
  // channel_stream_id's server-side binding (NOT from this field) so external
  // callers cannot inject into other agents.
  //
  // Exactly one of `user_message` / `client_response` MUST be set per
  // call. Both-set or neither-set → InvalidArgument at the handler.
  UserMessage user_message = 2;
  // Reply to a prior ServerRequest the client received over its
  // ChannelStreamReceive stream. Correlation key is request_id.
  ClientResponse client_response = 3;
  // Methods the sending device is willing to render when the agent
  // dispatches a ServerRequest. Last-sender-wins per channel stream; sent on
  // every ingest. Names match ServerRequest.method values.
  repeated string supported_methods = 4;
  // Conversation this message belongs to. Empty string → controller
  // mints a fresh id and returns it in the ack. Non-empty → controller
  // validates the id was minted by the caller's subject and continues
  // the existing conversation; mismatch returns PermissionDenied.
  string conversation_id = 5;
}

message ChannelStreamIngestAck {
  // Echoed for caller correlation.
  string channel_stream_id = 1;
  // Conversation under which this message was filed. Pair with
  // GetConversationHistory for replay across reconnects.
  string conversation_id = 2;
}

message ChannelStreamReceiveRequest {
  // Free-form, untrusted, log-only label for operator debugging.
  optional string channel_hint = 1;
  // The agent this receive stream serves. Every agent-scoped
  // request names its agent; the relay authorizes it per credential
  // class.
  string agent = 2;
  // The channel path's sender: the platform user ID the channel reports
  // verbatim. The relay resolves it to a subject through the operator's
  // handle binding; the channel vouches for no one.
  string sender = 3;
  reserved 4;
  reserved "resume_after_seq";
}

// --- Subscribe RPCs ---

message SubscribeRequest {}

// --- Server-initiated tool dispatch (cluster → client) ---
//
// JSON-RPC-shaped envelope over the existing channel stream. The agent emits a
// tool call for a client-implemented tool (e.g., RevealPath); the
// controller forwards it as a ChannelStreamOutbound::ServerRequest; the
// client either acts on it (notification — empty request_id) or
// responds with a matching ClientResponse on ChannelStreamIngest.

message ServerRequest {
  // Empty string → notification (fire-and-forget). The client MUST NOT
  // emit a ClientResponse. Non-empty → the client MUST eventually
  // respond with a ClientResponse echoing this request_id.
  string request_id = 1;
  // Tool name. Must be in the client's last-advertised supported_methods
  // set or the controller refuses to dispatch.
  string method = 2;
  // Opaque JSON object — same convention as ToolCall.input_json.
  string params_json = 3;
}

message ClientResponse {
  // Echoes the originating ServerRequest.request_id.
  string request_id = 1;
  // Exactly one of result_json / error MUST be set. Both-set or
  // neither-set → InvalidArgument at the handler.
  string result_json = 2;
  ClientResponseError error = 3;
}

message ClientResponseError {
  int32 code = 1;
  string message = 2;
}

// --- Internal: harness → relay server-request emit ---

message SendServerNotificationRequest {
  reserved 1;
  string method = 2;
  string params_json = 3;
  // The agent to fan out to. All channel streams for this agent that
  // support the method receive the notification.
  string agent = 4;
  reserved 5;
}

message SendServerNotificationResponse {
  // Best-effort: true if any channel stream for the agent that advertises
  // the method enqueued it.
  bool delivered = 1;
}

message SendServerRequestAndAwaitRequest {
  reserved 1;
  // Caller-supplied correlation id. Harness uses the LLM's
  // tool_call_id so the agent loop carries one identifier.
  string request_id = 2;
  string method = 3;
  string params_json = 4;
  // Server-side wait cap in seconds. The controller clamps to a sane
  // range. Zero falls back to a server default.
  uint32 timeout_seconds = 5;
  // The agent to fan out to. The first ClientResponse from any
  // channel stream wins; subsequent responses are dropped by request_id.
  string agent = 6;
  reserved 7;
}

message SendServerRequestAndAwaitResponse {
  // Exactly one of result_json / error / timed_out / unknown_channel_stream /
  // unsupported_method MUST be set on success-shaped outcomes.
  string result_json = 1;
  ClientResponseError error = 2;
  bool timed_out = 3;
  bool unknown_channel_stream = 4;
  bool unsupported_method = 5;
}
