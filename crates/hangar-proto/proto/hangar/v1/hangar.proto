syntax = "proto3";
package hangar.v1;

import "sycophant/common/v1/common.proto";

// --- Controller service ---
//
// Single gRPC service. The controller is the only server.
// LLM Jobs, Channel Jobs, and Transponder connect as clients.

service HangarController {
  // LLM Job pulls work. Long-poll: controller holds the response open
  // until a turn is ready. The Job sets a gRPC deadline as its idle
  // timeout. No work before deadline = Job exits, kubelet cleans up.
  rpc GetTurn (GetTurnRequest) returns (TurnAssignment);

  // LLM Job streams response chunks back to the controller.
  rpc StreamTurnResult (stream TurnResultChunk) returns (TurnAck);

  // Transponder sends turns, receives streaming LLM response. The
  // transponder assembles and persists conversation history; hangar is a
  // stateless LLM-dispatch controller and opens no conversation store.
  rpc Turn (TurnRequest) returns (stream TurnEvent);

  // Transponder calls: request cancellation of an in-flight turn by
  // conversation_id. Best-effort: an unknown or already-finished id is a safe
  // no-op. The workspace scoping the key comes from the authenticated caller,
  // never the payload.
  rpc CancelTurn (sycophant.common.v1.CancelTurnRequest) returns (sycophant.common.v1.CancelTurnResponse);

  // LLM Job calls: long-poll for a cancel of the in-flight turn by
  // conversation_id. Returns once a cancel fires (or immediately when the id is
  // unknown/finished).
  rpc AwaitTurnCancel (AwaitTurnCancelRequest) returns (TurnCancelSignal);
}

// --- LLM Job RPCs ---

message GetTurnRequest {
  string model_name = 1;
}

message TurnAssignment {
  optional string system = 1;
  repeated sycophant.common.v1.ToolDefinition tools = 2;
  repeated sycophant.common.v1.Message messages = 3;
  // RFC 7396-merged params blob (Model.params with frontmatter
  // override applied). Opaque to sycophant; merged into provider request body.
  optional string params_json = 4;
  // The turn's conversation_id, echoed from the transponder's TurnRequest so
  // the llm-job can open the cancel long-poll keyed by it.
  string conversation_id = 5;
}

message TurnResultChunk {
  oneof chunk {
    ContentDelta content_delta = 1;
    ToolUseStart tool_use_start = 2;
    ToolUseInput tool_use_input = 3;
    TurnComplete complete = 4;
    TurnError error = 5;
    TurnWarning warning = 6;
  }
}

message ContentDelta {
  string text = 1;
}

message ToolUseStart {
  string id = 1;
  string name = 2;
}

message ToolUseInput {
  string partial_json = 1;
}

message TurnComplete {
  sycophant.common.v1.StopReason stop_reason = 1;
  repeated sycophant.common.v1.ContentBlock content = 2;
  repeated sycophant.common.v1.ToolCall tool_calls = 3;
}

message TurnError {
  int32 code = 1;
  string message = 2;
}

// Reports a principal-supplied params field that was overwritten by sycophant
// because it is operator-bound (the managed-fields list per format).
message TurnWarning {
  string field = 1;
  string reason = 2;
}

message TurnAck {}

// --- Turn-cancel RPCs ---
//
// Keyed by conversation_id; the workspace scoping the key comes from the
// authenticated caller (verify_workspace), never these payloads. The
// transponder-facing CancelTurn reuses sycophant.common.v1.CancelTurnRequest /
// CancelTurnResponse (same shape as the client-facing cancel).

message AwaitTurnCancelRequest {
  string conversation_id = 1;
}

message TurnCancelSignal {}

// --- Transponder RPCs ---

message TurnRequest {
  optional string system = 1;
  repeated sycophant.common.v1.ToolDefinition tools = 2;
  repeated sycophant.common.v1.Message messages = 3;
  optional string model = 5;
  optional string reply_channel = 6;
  // role tags conversation log entries. DELEGATE entries are scoped per
  // delegate call via correlation_id; orchestrator turns leave role unset.
  optional TurnRole role = 7;
  // Per-call correlation id for delegate turns. Set to the orchestrator's
  // tool_use_id so each delegate's entries can be tagged "delegate:<id>"
  // and scoped independently in history_for_provider. None for orchestrator
  // turns.
  optional string correlation_id = 9;
  // Required. Obtain via MintConversation. Empty → InvalidArgument.
  string conversation_id = 10;
}

enum TurnRole {
  TURN_ROLE_UNSPECIFIED = 0;
  DELEGATE = 3;
}

message TurnEvent {
  oneof event {
    ContentDelta content_delta = 1;
    ToolUseStart tool_use_start = 2;
    ToolUseInput tool_use_input = 3;
    TurnComplete complete = 4;
    TurnError error = 5;
    TurnWarning warning = 6;
  }
}

