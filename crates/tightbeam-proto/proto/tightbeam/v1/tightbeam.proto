syntax = "proto3";
package tightbeam.v1;

// --- Core types ---

message ContentBlock {
  oneof block {
    TextBlock text = 1;
    ImageBlock image = 2;
    ThinkingBlock thinking = 3;
  }
}

message TextBlock {
  string text = 1;
}

message ImageBlock {
  string media_type = 1;
  bytes data = 2;
}

message ThinkingBlock {
  string text = 1;
}

message ToolDefinition {
  string name = 1;
  string description = 2;
  string parameters_json = 3;
}

message ToolCall {
  string id = 1;
  string name = 2;
  string input_json = 3;
}

message Message {
  string role = 1;
  repeated ContentBlock content = 2;
  repeated ToolCall tool_calls = 3;
  optional string tool_call_id = 4;
  optional bool is_error = 5;
}

enum StopReason {
  STOP_REASON_UNSPECIFIED = 0;
  END_TURN = 1;
  TOOL_USE = 2;
  MAX_TOKENS = 3;
}

// --- Controller service ---
//
// Single gRPC service. The controller is the only server.
// LLM Jobs, Channel Jobs, and Transponder connect as clients.

service TightbeamController {
  // LLM Job pulls work. Long-poll: controller holds the response open
  // until a turn is ready. The Job sets a gRPC deadline as its idle
  // timeout. No work before deadline = Job exits, kubelet cleans up.
  rpc GetTurn (GetTurnRequest) returns (TurnAssignment);

  // LLM Job streams response chunks back to the controller.
  rpc StreamTurnResult (stream TurnResultChunk) returns (TurnAck);

  // Transponder sends turns, receives streaming LLM response.
  rpc Turn (TurnRequest) returns (stream TurnEvent);

  // Mint a fresh conversation id. The controller is the only party that
  // mints ids; callers thread the returned id through follow-up messages.
  rpc MintConversation (MintConversationRequest) returns (MintConversationResponse);

  // List conversation ids known to a workspace. Returns ids that have any
  // persisted events. Used by dashboards rendering a chat-thread sidebar.
  rpc ListConversations (ListConversationsRequest) returns (ListConversationsResponse);

  // Permanently delete a conversation: removes it from the workspace's
  // registry AND deletes every persisted event. No grace window; no
  // recovery. The caller's workspace must own the conversation_id.
  rpc DeleteConversation (DeleteConversationRequest) returns (DeleteConversationResponse);

  // Update the user-facing name of a conversation. Persists to the
  // controller's meta.json sidecar; survives restart. Server caps name
  // length; the caller's workspace must own the conversation_id.
  rpc SetConversationName (SetConversationNameRequest) returns (SetConversationNameResponse);

  // List the workspaces the calling client is authorized to act on.
  // The only external RPC that carries no workspace claim: the call IS
  // the authorization query. Verifier resolves the kid and returns the
  // Client CR's spec.workspaces.
  rpc ListWorkspaces (ListWorkspacesRequest) returns (ListWorkspacesResponse);

  // Channel Job bidirectional stream. Inbound user messages flow in,
  // agent responses flow out.
  rpc ChannelStream (stream ChannelInbound) returns (stream ChannelOutbound);

  // Transponder subscribes to receive inbound human messages.
  // Server-streaming: controller pushes messages as they arrive from channels.
  rpc Subscribe (SubscribeRequest) returns (stream UserMessage);

  // Client enrollment redemption. External client presents a one-time
  // enrollment code minted by the controller (status.enrollmentCode on
  // the matching Client CR) and its freshly-generated P-256 public key.
  // Controller validates the code's signature + expiry + claims,
  // persists the public key on the Client CR's status.publicKey, and
  // clears the enrollmentCode. Subsequent requests sign each call with
  // the client's private key (verified by ClientSignatureVerifier on
  // the external listener). RedeemEnrollment itself is unauthenticated
  // by design — the enrollment code is the authentication artifact.
  rpc RedeemEnrollment (RedeemEnrollmentRequest) returns (RedeemEnrollmentResponse);

  // Read the tail of a conversation's history. Backs the transponder's
  // built-in `recent_turns` tool, replacing the workspace pod's prior
  // filesystem mount of the conversation log. Workspace is derived
  // from the calling SA token; the conversation_id must belong to that
  // workspace.
  rpc GetConversationHistory (GetConversationHistoryRequest) returns (GetConversationHistoryResponse);

  // External user-message ingress. The caller (Flutter app, future SPA)
  // acts as a channel adapter for a single end-user; this is the unary
  // equivalent of one ChannelInbound::UserMessage frame on ChannelStream.
  // The controller routes the message to the workspace transponder's
  // Subscribe stream, where the agent loop builds the actual TurnRequest
  // from AGENTS.md + the workspace's tool catalog. This is the ONLY
  // external user-input path to the agent — Turn is internal-only
  // because the transponder is the sole authority for what gets
  // dispatched to the LLM for a workspace.
  //
  // Contract: the caller MUST have a ChannelReceive stream open with
  // the matching (channel_type, channel_name) before invoking
  // ChannelIngest, or the agent's reply has no destination.
  rpc ChannelIngest (ChannelIngestRequest) returns (ChannelIngestAck);

  // External outbound-message reception. The Flutter app opens this
  // server-stream once per chat session keyed by (channel_type,
  // channel_name) and receives the agent's responses as ChannelOutbound
  // events. Workspace is derived from the calling client's signature.
  // Server-streaming is compatible with the signature middleware: only
  // streaming REQUESTS deadlock the body-collect path; streaming
  // RESPONSES are fine because the request body is bounded and hashed
  // pre-dispatch.
  rpc ChannelReceive (ChannelReceiveRequest) returns (stream ChannelOutbound);

  // External tool-catalog subscription. The controller forwards the
  // calling workspace's transponder catalog as snapshots. Use it to
  // render skill buttons, browser affordances, or any client-side UI
  // driven by what the workspace exposes.
  rpc WatchTools (WatchToolsRequest) returns (stream ToolListUpdate);

  // External tool invocation. The controller forwards to the calling
  // workspace's transponder, which dispatches via its existing
  // tool_router (no LLM involvement). Trust is structural: enrollment
  // authenticates; transponder + chambers + gVisor + RBAC define what
  // the tool actually does.
  rpc CallTool (CallToolRequest) returns (CallToolResponse);

  // Internal: transponder dispatches a fire-and-forget client tool
  // invocation. NOT in ALLOWED_METHODS — only the transponder pod's SA
  // token (audience transponder.tightbeam) reaches this.
  rpc SendServerNotification (SendServerNotificationRequest)
      returns (SendServerNotificationResponse);

  // Internal: transponder dispatches a client tool and awaits a matching
  // ClientResponse, blocking up to a server-side timeout. NOT in
  // ALLOWED_METHODS.
  rpc SendServerRequestAndAwait (SendServerRequestAndAwaitRequest)
      returns (SendServerRequestAndAwaitResponse);
}

// --- Transponder control service ---
//
// The transponder (per-workspace agent loop) exposes a small in-cluster
// gRPC surface for tightbeam-controller to forward client-initiated
// tool calls to. The transponder is the per-workspace authority for the
// unified tool catalog (airlock + mainframe + runtime), so all client
// tool dispatch routes through here.
//
// Authentication: SA-token, audience `tightbeam.transponder.sycophant.md`.
// Only tightbeam-controller holds a token with that audience.

service TransponderControl {
  // Streams the unified tool catalog as snapshots. Push semantics — every
  // catalog change emits a fresh snapshot, no diffing on the wire.
  rpc WatchTools (WatchToolsRequest) returns (stream ToolListUpdate);

  // Dispatches a tool call through the transponder's tool_router.
  // No LLM involvement. The router routes by Source (Airlock, Mainframe,
  // Runtime, or Channel — the last is reserved for client-implemented
  // tools like RevealPath and would be a programmer error on this path).
  rpc CallTool (CallToolRequest) returns (CallToolResponse);
}

// --- LLM Job RPCs ---

message GetTurnRequest {
  string model_name = 1;
}

message TurnAssignment {
  optional string system = 1;
  repeated ToolDefinition tools = 2;
  repeated Message messages = 3;
  // RFC 7396-merged params blob (Model.params with frontmatter
  // override applied). Opaque to sycophant; merged into provider request body.
  optional string params_json = 4;
}

message TurnResultChunk {
  oneof chunk {
    ContentDelta content_delta = 1;
    ToolUseStart tool_use_start = 2;
    ToolUseInput tool_use_input = 3;
    TurnComplete complete = 4;
    TurnError error = 5;
    TurnWarning warning = 6;
  }
}

message ContentDelta {
  string text = 1;
}

message ToolUseStart {
  string id = 1;
  string name = 2;
}

message ToolUseInput {
  string partial_json = 1;
}

message TurnComplete {
  StopReason stop_reason = 1;
  repeated ContentBlock content = 2;
  repeated ToolCall tool_calls = 3;
}

message TurnError {
  int32 code = 1;
  string message = 2;
}

// Reports a principal-supplied params field that was overwritten by sycophant
// because it is operator-bound (the managed-fields list per format).
message TurnWarning {
  string field = 1;
  string reason = 2;
}

message TurnAck {}

// --- Transponder RPCs ---

message TurnRequest {
  optional string system = 1;
  repeated ToolDefinition tools = 2;
  repeated Message messages = 3;
  optional string model = 5;
  optional string reply_channel = 6;
  // role tags conversation log entries. DELEGATE entries are scoped per
  // delegate call via correlation_id; orchestrator turns leave role unset.
  optional TurnRole role = 7;
  // Per-call correlation id for delegate turns. Set to the orchestrator's
  // tool_use_id so each delegate's entries can be tagged "delegate:<id>"
  // and scoped independently in history_for_provider. None for orchestrator
  // turns.
  optional string correlation_id = 9;
  // Required. Obtain via MintConversation. Empty → InvalidArgument.
  string conversation_id = 10;
}

enum TurnRole {
  TURN_ROLE_UNSPECIFIED = 0;
  DELEGATE = 3;
}

message TurnEvent {
  oneof event {
    ContentDelta content_delta = 1;
    ToolUseStart tool_use_start = 2;
    ToolUseInput tool_use_input = 3;
    TurnComplete complete = 4;
    TurnError error = 5;
    TurnWarning warning = 6;
  }
}

// --- Conversation lifecycle ---

message MintConversationRequest {}

message MintConversationResponse {
  string conversation_id = 1;
}

message ListConversationsRequest {
  // Workspace whose conversations should be listed. Authentication's
  // workspace claim is what's actually checked by the verifier, so this
  // field is for clarity / future cross-workspace patterns.
  string workspace = 1;
}

message ListConversationsResponse {
  reserved 1;
  reserved "conversation_ids";
  // Unordered. Clients render their own ordering (alpha, locally tracked
  // MRU, etc.); server does not impose one.
  repeated ConversationSummary conversations = 2;
}

message ConversationSummary {
  string conversation_id = 1;
  // Unix epoch milliseconds. 0 = never touched (newly minted, no
  // messages yet). Not persisted across controller restart.
  int64 last_touched_ms_epoch = 2;
  // User-facing name. Defaults to a short id-derived stub at mint; user
  // may rename via SetConversationName. Persisted on the controller PVC.
  string name = 3;
}

message DeleteConversationRequest {
  string conversation_id = 1;
}

message DeleteConversationResponse {}

message SetConversationNameRequest {
  string conversation_id = 1;
  string name = 2;
}

message SetConversationNameResponse {}

message ListWorkspacesRequest {}

message ListWorkspacesResponse {
  repeated string workspaces = 1;
}

// --- Channel Job RPCs ---

message ChannelInbound {
  oneof event {
    ChannelRegister register = 1;
    UserMessage user_message = 2;
  }
}

// Tightbeam mints an opaque UUID `channel_id` when an adapter registers
// (via ChannelStream's first ChannelRegister frame, or ChannelReceive).
// The id is returned to the adapter as the first frame on the outbound
// stream (ChannelOutbound.ack). The adapter MUST echo it on every
// ChannelIngest call. The transponder receives it verbatim as
// UserMessage.reply_channel and routes the agent's reply by it.
//
// The id is server-minted and bound to the minter's workspace; an
// external caller cannot reuse another workspace's channel_id (the
// controller's binding-table lookup fails with PermissionDenied).
message ChannelRegister {
  // Workspace claim (in-cluster callers); ignored if it conflicts with
  // the bearer-token workspace from TokenReview.
  optional string workspace = 1;
  // Free-form, untrusted, log-only label for operator debugging.
  // Examples: "slack:engineering", "cli:hello-world".
  optional string adapter_hint = 2;
}

message ChannelAck {
  // Server-minted opaque UUID. Echo on every ChannelIngest; valid only
  // within the lifetime of the originating ChannelReceive /
  // ChannelStream response stream.
  string channel_id = 1;
}

message ChannelOutbound {
  oneof command {
    ChannelAck ack = 1;
    ChannelSend send_message = 2;
    TurnStateEvent turn_state = 3;
    ServerRequest server_request = 4;
  }
}

message ChannelSend {
  repeated ContentBlock content = 1;
  // Conversation this reply belongs to. Lets the client filter outbound
  // frames against whichever conversation it is currently viewing.
  string conversation_id = 2;
}

// Streaming turn-lifecycle phase. The controller pushes this to every
// ChannelReceive subscriber so clients can render a "working" indicator
// without polling or per-tool detail. Sending (between user submit and
// the controller's ChannelIngest ack) stays purely client-side; only
// WORKING and IDLE are server-pushed today.
message TurnStateEvent {
  TurnState state = 1;
  // Conversation this state transition belongs to. Empty string is
  // reserved for channel-wide replay frames emitted on (re)connect —
  // clients should treat empty as "no conversation context" and skip
  // the per-conversation indicator update.
  string conversation_id = 2;
}

enum TurnState {
  TURN_STATE_UNSPECIFIED = 0;
  // No active turn. Default for fresh channels; emitted after the
  // assistant message persists.
  IDLE = 1;
  // Turn is in flight on the cluster: controller enqueued the user
  // message, transponder loop is running.
  WORKING = 2;
  // Reserved (comment-only, not proto `reserved` since these slots are
  // free):
  //   3 — THINKING; derived from content-delta forwarding.
  //   4 — STOPPING; paired with cancel/interrupt RPC.
}

// --- External channel-adapter RPCs (Flutter, future SPA) ---

message ChannelIngestRequest {
  // The channel_id received as the first frame on the ChannelReceive
  // response stream. Server-minted; opaque to clients.
  string channel_id = 1;
  // The user's message payload. The workspace is derived from the
  // caller's signature (NOT from this field) so external callers
  // cannot inject into other workspaces.
  //
  // Exactly one of `user_message` / `client_response` MUST be set per
  // call. Both-set or neither-set → InvalidArgument at the handler.
  UserMessage user_message = 2;
  // Reply to a prior ServerRequest the client received over its
  // ChannelReceive stream. Correlation key is request_id.
  ClientResponse client_response = 3;
  // Methods the sending device is willing to render when the agent
  // dispatches a ServerRequest. Last-sender-wins per channel; sent on
  // every ingest. Names match ServerRequest.method values.
  repeated string supported_methods = 4;
  // Conversation this message belongs to. Empty string → controller
  // mints a fresh id and returns it in the ack. Non-empty → controller
  // validates the id belongs to the caller's workspace and continues
  // the existing conversation; mismatch returns PermissionDenied.
  string conversation_id = 5;
}

message ChannelIngestAck {
  // Echoed for caller correlation.
  string channel_id = 1;
  // Conversation under which this message was filed. Pair with
  // GetConversationHistory for replay across reconnects.
  string conversation_id = 2;
}

message ChannelReceiveRequest {
  // Free-form, untrusted, log-only label for operator debugging.
  optional string adapter_hint = 1;
}

// --- Subscribe RPCs ---

message SubscribeRequest {}

// UserMessage is the canonical "user said something" event. Flows from
// Channel Job → Tightbeam → Transponder. `reply_channel` is the
// server-minted channel_id (UUID) stamped by Tightbeam after
// ChannelIngest / ChannelStream message ingress, so the transponder's
// reply routes back to the originating adapter. Opaque to clients;
// only valid within the lifetime of the originating ChannelReceive /
// ChannelStream stream.
message UserMessage {
  repeated ContentBlock content = 1;
  string sender = 2;
  optional string reply_channel = 3;
  // Conversation this message belongs to. Stamped by tightbeam at
  // ingest time (caller may supply via ChannelIngestRequest, or the
  // controller mints a fresh id). The transponder reads this verbatim
  // when constructing the TurnRequest — it never mints conversation
  // ids on its own anymore.
  string conversation_id = 4;
}

// --- RedeemEnrollment RPCs ---

message RedeemEnrollmentRequest {
  // One-time enrollment code minted by the controller. Encoded as a
  // signed JWT carrying {workspace, device_name (Client CR name),
  // code_id, exp}. Single-use: redemption clears the code from the
  // Client CR's status.
  string enrollment_code = 1;
  // Client-generated P-256 ECDSA public key, SEC1 uncompressed bytes
  // (or DER-encoded SubjectPublicKeyInfo — verifier accepts both).
  // The controller persists this on the Client CR's status.publicKey;
  // subsequent requests sign each call with the matching private key.
  bytes public_key = 2;
}

message RedeemEnrollmentResponse {
  // Client CR name the enrollment was applied to. Echoed back so the
  // client can confirm + display its registered identity.
  string client_name = 1;
  // Unix-seconds timestamp when the public key was registered.
  int64 enrolled_at = 2;
}

// --- Conversation history (transponder built-in tool) ---

message GetConversationHistoryRequest {
  // Conversation to read; must belong to the workspace the calling SA
  // token authorizes for.
  string conversation_id = 1;
  // Max number of recent entries to return. Server clamps to a sane
  // ceiling; 0 / unset → server default (~50).
  optional uint32 limit = 2;
}

message GetConversationHistoryResponse {
  // Recent entries in oldest-to-newest order (tail of the log).
  repeated HistoryEntry entries = 1;
  // Total log length at snapshot time. Lets the caller see if it
  // received a truncated view.
  uint64 total_seq = 2;
  // True when `limit` clipped the head of the log.
  bool truncated = 3;
}

message HistoryEntry {
  // 1-indexed sequence in the conversation log.
  uint64 seq = 1;
  // RFC 3339 timestamp from when the entry was appended.
  string ts = 2;
  // The persisted message — role, content blocks, tool calls, etc.
  Message message = 3;
  // Scope tag if present (e.g., "delegate:<correlation_id>").
  optional string tag = 4;
}

// --- External tool dispatch (client → cluster) ---
//
// Mirrors the in-cluster airlock/mainframe shapes by name. Tightbeam
// thin-forwards to the calling workspace's transponder, which dispatches
// via its existing tool_router. No LLM involvement on this path.

message WatchToolsRequest {}

message ToolListUpdate {
  repeated ToolInfo tools = 1;
}

message ToolInfo {
  string name = 1;
  string description = 2;
  string parameters_json = 3;
}

message CallToolRequest {
  string name = 1;
  string input_json = 2;
}

message CallToolResponse {
  string output = 1;
  bool is_error = 2;
}

// --- Server-initiated tool dispatch (cluster → client) ---
//
// JSON-RPC-shaped envelope over the existing channel. The agent emits a
// tool call for a client-implemented tool (e.g., RevealPath); the
// controller forwards it as a ChannelOutbound::ServerRequest; the
// client either acts on it (notification — empty request_id) or
// responds with a matching ClientResponse on ChannelIngest.

message ServerRequest {
  // Empty string → notification (fire-and-forget). The client MUST NOT
  // emit a ClientResponse. Non-empty → the client MUST eventually
  // respond with a ClientResponse echoing this request_id.
  string request_id = 1;
  // Tool name. Must be in the client's last-advertised supported_methods
  // set or the controller refuses to dispatch.
  string method = 2;
  // Opaque JSON object — same convention as ToolCall.input_json.
  string params_json = 3;
}

message ClientResponse {
  // Echoes the originating ServerRequest.request_id.
  string request_id = 1;
  // Exactly one of result_json / error MUST be set. Both-set or
  // neither-set → InvalidArgument at the handler.
  string result_json = 2;
  ClientResponseError error = 3;
}

message ClientResponseError {
  int32 code = 1;
  string message = 2;
}

// --- Internal: transponder → tightbeam server-request emit ---

message SendServerNotificationRequest {
  string channel_id = 1;
  string method = 2;
  string params_json = 3;
}

message SendServerNotificationResponse {
  // Best-effort: true if the frame was enqueued for delivery on the
  // channel's mpsc. False on unknown channel or unsupported method (the
  // client did not advertise the method in supported_methods).
  bool delivered = 1;
}

message SendServerRequestAndAwaitRequest {
  string channel_id = 1;
  // Caller-supplied correlation id. Transponder uses the LLM's
  // tool_call_id so the agent loop carries one identifier.
  string request_id = 2;
  string method = 3;
  string params_json = 4;
  // Server-side wait cap in seconds. The controller clamps to a sane
  // range. Zero falls back to a server default.
  uint32 timeout_seconds = 5;
}

message SendServerRequestAndAwaitResponse {
  // Exactly one of result_json / error / timed_out / unknown_channel /
  // unsupported_method MUST be set on success-shaped outcomes.
  string result_json = 1;
  ClientResponseError error = 2;
  bool timed_out = 3;
  bool unknown_channel = 4;
  bool unsupported_method = 5;
}
