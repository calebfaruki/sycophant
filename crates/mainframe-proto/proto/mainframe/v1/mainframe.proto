syntax = "proto3";
package mainframe.v1;

// MainframeRuntime is the in-pod stdlib tool service. Tools are static
// (compile-time fixed: bash, read_file, write_file, list_directory) so the
// contract is unary-only — no streaming subscription needed.
//
// Distinct from airlock.v1.AirlockController, which serves dynamic chamber
// tools and exposes a streaming WatchTools RPC for runtime updates.
service MainframeRuntime {
  // Transponder calls at startup to discover stdlib tools.
  rpc ListTools (ListToolsRequest) returns (ListToolsResponse);

  // Transponder calls to execute a stdlib tool against the workspace.
  rpc CallTool (CallToolRequest) returns (CallToolResponse);
}

message ListToolsRequest {}

message ListToolsResponse {
  repeated ToolInfo tools = 1;
}

message ToolInfo {
  string name = 1;
  string description = 2;
  string parameters_json = 3;
}

message CallToolRequest {
  string name = 1;
  string input_json = 2;
}

message CallToolResponse {
  string output = 1;
  bool is_error = 2;
}
