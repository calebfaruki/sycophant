syntax = "proto3";
package relay.v1;

option go_package = "github.com/sycophant-md/sycophant/cmd/syco/internal/proto/relay/v1";

import "sycophant/common/v1/common.proto";

// --- External client-facing gateway ---
//
// The external ingress surface for person tokens (app and terminal-client
// paths) and channel ServiceAccount tokens. Every RPC here is reachable only
// through the listeners that demand the matching credential class.

service RelayGateway {
  rpc Discover (DiscoverRequest) returns (DiscoverResponse);
  rpc ListAgents (sycophant.common.v1.ListAgentsRequest) returns (sycophant.common.v1.ListAgentsResponse);
  rpc ListGrants (sycophant.common.v1.ListGrantsRequest) returns (sycophant.common.v1.ListGrantsResponse);
  rpc MintConversation (sycophant.common.v1.MintConversationRequest) returns (sycophant.common.v1.MintConversationResponse);
  rpc ListConversations (sycophant.common.v1.ListConversationsRequest) returns (sycophant.common.v1.ListConversationsResponse);
  rpc DeleteConversation (sycophant.common.v1.DeleteConversationRequest) returns (sycophant.common.v1.DeleteConversationResponse);
  rpc SetConversationName (sycophant.common.v1.SetConversationNameRequest) returns (sycophant.common.v1.SetConversationNameResponse);
  rpc GetConversationHistory (sycophant.common.v1.GetConversationHistoryRequest) returns (sycophant.common.v1.GetConversationHistoryResponse);
  rpc GetTurnState (sycophant.common.v1.GetTurnStateRequest) returns (sycophant.common.v1.TurnStateEvent);
  rpc CancelTurn (sycophant.common.v1.CancelTurnRequest) returns (sycophant.common.v1.CancelTurnResponse);
  rpc ChannelStreamIngest (sycophant.common.v1.ChannelStreamIngestRequest) returns (sycophant.common.v1.ChannelStreamIngestAck);
  rpc ChannelStreamReceive (sycophant.common.v1.ChannelStreamReceiveRequest) returns (stream sycophant.common.v1.ChannelStreamOutbound);
  rpc WatchTools (sycophant.common.v1.WatchToolsRequest) returns (stream sycophant.common.v1.ToolListUpdate);

  // --- Client-driven tool-call lifecycle (dispatch / await / cancel) ---
  //
  // Verify-then-forward the harness's cancelable tool-call surface to the
  // request's named agent, after a reach review for the caller's
  // subject. CancelTool names no agent; the relay resolves it from the
  // call_id. Same request/response types as the harness.
  rpc DispatchTool (sycophant.common.v1.CallToolRequest) returns (sycophant.common.v1.DispatchToolResponse);
  rpc AwaitToolResult (sycophant.common.v1.AwaitToolResultRequest) returns (stream sycophant.common.v1.ToolResultFrame);
  rpc CancelTool (sycophant.common.v1.CancelToolRequest) returns (sycophant.common.v1.CancelToolResponse);
}

// --- In-cluster internal surface ---
//
// Reachable only by in-cluster SA-token holders: the harness dials
// this. Not exposed on the external listener.

service RelayInternal {
  rpc Subscribe (sycophant.common.v1.SubscribeRequest) returns (stream sycophant.common.v1.UserMessage);
  rpc SendServerNotification (sycophant.common.v1.SendServerNotificationRequest) returns (sycophant.common.v1.SendServerNotificationResponse);
  rpc SendServerRequestAndAwait (sycophant.common.v1.SendServerRequestAndAwaitRequest) returns (sycophant.common.v1.SendServerRequestAndAwaitResponse);
  // The harness pushes the assistant reply as a separate RPC from turn-state.
  rpc DeliverReply (DeliverReplyRequest) returns (DeliverReplyResponse);
  // The harness pushes a terminal turn-state event as a separate RPC.
  rpc DeliverTurnState (DeliverTurnStateRequest) returns (DeliverTurnStateResponse);
  // Harness pushes one streamed activity frame produced during a turn.
  // Unary-per-frame; the gateway wraps the StreamItem verbatim into a
  // ChannelStreamOutbound and relays it unchanged (no payload inspection).
  rpc DeliverStreamItem (DeliverStreamItemRequest) returns (DeliverStreamItemResponse);
}

message DeliverStreamItemRequest {
  string channel_stream_id = 1;
  sycophant.common.v1.StreamItem item = 2;
  reserved 3;
}

message DeliverStreamItemResponse {
  bool delivered = 1;
}

// The harness pushes the assistant reply (ChannelStreamSend) as a separate
// frame from the terminal turn-state.
message DeliverReplyRequest {
  string conversation_id = 1;
  repeated sycophant.common.v1.ContentBlock content = 2;
  reserved 3;
}

message DeliverReplyResponse {
  bool delivered = 1;
}

// The harness pushes a turn-state event. Carries the subject directly
// so the relay can record turn state without a per-channel-stream lookup.
message DeliverTurnStateRequest {
  string channel_stream_id = 1;
  sycophant.common.v1.TurnStateEvent turn_state = 2;
  reserved 3;
  // The subject that owns this turn state. The relay uses this to
  // record the turn state keyed by subject, not channel stream.
  string subject = 4;
}

message DeliverTurnStateResponse {
  bool delivered = 1;
}

// Kept for backward compatibility — no longer used by the harness.
message DeliverOutboundRequest {
  string channel_stream_id = 1;
  string conversation_id = 2;
  // present => enqueue reply BEFORE turn_state
  optional ChannelStreamReply reply = 3;
  sycophant.common.v1.TurnStateEvent turn_state = 4;
}

message ChannelStreamReply {
  repeated sycophant.common.v1.ContentBlock content = 1;
}

message DeliverOutboundResponse {
  bool delivered = 1;
}

message DiscoverRequest {}

message DiscoverResponse {
  string issuer = 1;
  string client_id = 2;
  string certificate_authority = 3;
}
