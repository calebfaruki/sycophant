# Kyverno values consumed by `sycoadm setup`.
# DevOps users running their own Kyverno install can ignore this file —
# the requirement is "Kyverno 3.9.x in the `kyverno` namespace, with
# `config.excludeKyvernoNamespace: true` to avoid policy self-application,
# and CRDs installed via the sibling sycophant-quickstart kyverno-crds
# chart (NOT via this chart's `crds.install` flag) so they survive
# Kyverno helm uninstall".

# Sibling kyverno-crds chart owns CRDs so they survive helm uninstall.
crds:
  install: false

# The tenant reap DeletingPolicy is served by the cleanup controller and by
# nothing else, so it must run. Reports stay off: no sycophant policy evaluates
# in background and nothing consumes PolicyReports, so that controller is idle
# dead weight.
cleanupController:
  enabled: true
reportsController:
  enabled: false

# PolicyException is the operator's override path for the capability job gate.
# Enabled, but honored ONLY in the operator-owned sycophant-system namespace so
# tenant workloads can never author a self-exemption that escapes the gate.
features:
  policyExceptions:
    enabled: true
    namespace: sycophant-system
