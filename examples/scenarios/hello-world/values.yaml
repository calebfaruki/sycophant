# Tenant values for the hello-world scenario.
#
# Copy this to the tenant config path, set the kernel hostPath to an ABSOLUTE
# path on your machine, then `syco tenant up --ns hello-world`:
#
#   mkdir -p ~/.config/sycophant/tenants/hello-world
#   cp examples/scenarios/hello-world/values.yaml \
#     ~/.config/sycophant/tenants/hello-world/values.yaml
#
# The kernel (persona content source) is authored separately too — point it at
# an ABSOLUTE path on your machine, then re-run `up`:
#   syco tenant kernel set hello-world \
#     --path /REPLACE/WITH/ABSOLUTE/PATH/sycophant/tmp/hello-world-data \
#     --ns hello-world
toolsets:
  stdlib:
    image: sycophant-registry:5000/toolset:latest
    keepalive: true
  ssh-credentials:
    image: sycophant-registry:5000/toolset-ssh-credentials:latest

# The turn server: read directly by the controller, not a `toolsets` entry, and
# bound by no workspace.
prompt:
  profiles:
    deepseek-v4-flash:
      image: prompt-toolset:local
      format: openai
      model: deepseek/deepseek-v4-flash
      baseUrl: https://openrouter.ai/api/v1
      secret: openrouter
      egress:
        - { domain: openrouter.ai, port: 443 }

workspaces:
  hello-world:
    toolsets:
      - stdlib
      # A secret-only grant: the credential lands where ssh expects it and no
      # network hole opens, so the tool job stays on the baseline floor.
      - name: ssh-credentials
        grants:
          demo-key:
            secret: demo-ssh-key
            path: /home/agent/.ssh/id_ed25519
