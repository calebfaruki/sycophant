# Every value is a quoted string, including "true", "false" and numbers.
tool.Shell.description: "Run a shell command and return stdout, stderr, exit code."
tool.Shell.arg.command.type: "string"
tool.Shell.arg.command.required: "true"
tool.Shell.arg.command.env: "command"
tool.Shell.arg.command.description: "Shell command to execute under sh -c."
tool.Shell.arg.timeout.type: "integer"
tool.Shell.arg.timeout.required: "false"
tool.Shell.arg.timeout.env: "timeout"
tool.Shell.arg.timeout.description: "Foreground timeout in seconds (default 60, hard cap 600)."
tool.Shell.arg.workdir.type: "string"
tool.Shell.arg.workdir.required: "false"
tool.Shell.arg.workdir.env: "workdir"
tool.Shell.arg.workdir.description: "Working directory override (default workspace cwd)."
tool.Read.description: "Read a text file, line-numbered LINE|CONTENT per row. 1 MiB hard cap."
tool.Read.arg.file_path.type: "string"
tool.Read.arg.file_path.required: "true"
tool.Read.arg.file_path.env: "path"
tool.Read.arg.file_path.description: "File path."
tool.Read.arg.offset.type: "integer"
tool.Read.arg.offset.required: "false"
tool.Read.arg.offset.env: "offset"
tool.Read.arg.offset.description: "1-indexed starting line (default 1)."
tool.Read.arg.limit.type: "integer"
tool.Read.arg.limit.required: "false"
tool.Read.arg.limit.env: "limit"
tool.Read.arg.limit.description: "Max lines to return (default unlimited)."
tool.Write.description: "Write content to a file, full overwrite. Parent directories auto-created."
tool.Write.arg.file_path.type: "string"
tool.Write.arg.file_path.required: "true"
tool.Write.arg.file_path.env: "path"
tool.Write.arg.file_path.description: "File path."
tool.Write.arg.content.type: "string"
tool.Write.arg.content.required: "true"
tool.Write.arg.content.env: "content"
tool.Write.arg.content.description: "Content to write."
tool.Edit.description: "Replace exact unique substring in a file. Errors on 0 or >1 matches."
tool.Edit.arg.file_path.type: "string"
tool.Edit.arg.file_path.required: "true"
tool.Edit.arg.file_path.env: "path"
tool.Edit.arg.file_path.description: "File path."
tool.Edit.arg.old_string.type: "string"
tool.Edit.arg.old_string.required: "true"
tool.Edit.arg.old_string.env: "old_string"
tool.Edit.arg.old_string.description: "Substring to find (must appear exactly once)."
tool.Edit.arg.new_string.type: "string"
tool.Edit.arg.new_string.required: "true"
tool.Edit.arg.new_string.env: "new_string"
tool.Edit.arg.new_string.description: "Replacement substring."
tool.Search.description: "Search files (target=files lists; target=content greps). Ripgrep-backed."
tool.Search.arg.target.type: "string"
tool.Search.arg.target.required: "true"
tool.Search.arg.target.env: "target"
tool.Search.arg.target.description: "\"content\" greps inside files; \"files\" lists files by basename substring."
tool.Search.arg.pattern.type: "string"
tool.Search.arg.pattern.required: "true"
tool.Search.arg.pattern.env: "pattern"
tool.Search.arg.pattern.description: "Regex (content) or case-insensitive basename substring (files; empty lists all)."
tool.Search.arg.root.type: "string"
tool.Search.arg.root.required: "false"
tool.Search.arg.root.env: "path"
tool.Search.arg.root.description: "Root path (default workspace cwd)."
tool.Search.arg.glob.type: "string"
tool.Search.arg.glob.required: "false"
tool.Search.arg.glob.env: "glob"
tool.Search.arg.glob.description: "Optional path glob filter."
tool.Search.arg.limit.type: "integer"
tool.Search.arg.limit.required: "false"
tool.Search.arg.limit.env: "limit"
tool.Search.arg.limit.description: "Max results (default 50; offset+limit <= 1000)."
tool.Search.arg.offset.type: "integer"
tool.Search.arg.offset.required: "false"
tool.Search.arg.offset.env: "offset"
tool.Search.arg.offset.description: "Skip first N results (default 0)."
tool.GetSecret.description: "Return the value of a Secret given to this toolset, by name. The platform redacts it before you see it."
tool.GetSecret.arg.name.type: "string"
tool.GetSecret.arg.name.required: "true"
tool.GetSecret.arg.name.env: "SECRET_NAME"
tool.GetSecret.arg.name.description: "Name of the Secret given to this toolset."
tool.WebFetch.description: "Fetch a URL over HTTP(S) and return the response body."
tool.WebFetch.arg.url.type: "string"
tool.WebFetch.arg.url.required: "true"
tool.WebFetch.arg.url.env: "URL"
tool.WebFetch.arg.url.description: "The URL to fetch."
tool.ShowKernel.description: "Show the kernel log of the sandbox the tool runs in."
